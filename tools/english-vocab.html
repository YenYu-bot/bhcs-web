<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文單字練習卷產生器｜國中英文｜百宏文教機構</title>
<meta name="description" content="國中英文單字練習卷產生器：依康軒、南一、翰林各冊課次或英文單字 2000 出題，中翻英、英翻中、缺字母、詞性、字母重組，附教用版答案，可直接列印 A4。台中北屯百宏文教機構。">
<link rel="canonical" href="https://www.bhcs.com.tw/tools/english-vocab.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eaeef3; --panel:#fff; --ink:#1d2733; --muted:#5a6777; --rule:#d5dee8; --soft:#f3f6f9;
  --accent:#2c66ad; --accent-ink:#fff; --red:#c8352b;
  --en:"Andika","Times New Roman",serif; --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:15px;line-height:1.55}
.wrap{max-width:1280px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header.top h1{margin:0;font-size:1.45rem}
header.top p{margin:0;color:var(--muted);font-size:.9rem}
.back{margin-left:auto;color:var(--accent);text-decoration:none;font-size:.9rem}
.main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px;display:grid;gap:16px;position:sticky;top:12px}
@media (max-width:900px){.panel{position:static}}
.grp{display:grid;gap:7px}
.grp>.t{font-size:.78rem;letter-spacing:.1em;color:var(--muted)}
select,input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--rule);border-radius:7px;padding:7px 9px;width:100%}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg label{flex:1;text-align:center;cursor:pointer;padding:7px 0;font-size:.92rem;position:relative}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.checks label,.opt{display:flex;align-items:center;gap:7px;font-size:.92rem;cursor:pointer}
.checks input,.opt input{width:17px;height:17px;accent-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;border-radius:8px;padding:10px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border:0}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.codebox{display:grid;grid-template-columns:1fr auto;gap:8px}
.codebox button{padding:7px 12px;font-weight:500}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.status{font-size:.85rem;min-height:1.2em;margin:0}
.status.err{color:var(--red)}
.preview{min-width:0;overflow-x:auto}

/* ---------- worksheet ---------- */
.sheet{width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:#1b1f24;padding:14mm 15mm 16mm;box-shadow:0 1px 3px rgba(20,30,45,.12),0 8px 24px rgba(20,30,45,.1)}
.sh-head{display:grid;gap:2.5mm;border-bottom:.5mm solid #1b1f24;padding-bottom:2.5mm}
.sh-head .titles{display:flex;justify-content:space-between;align-items:baseline;gap:6mm;flex-wrap:wrap}
.sh-head h2{margin:0;font-size:17pt;font-weight:700}
.sh-head .sub{font-size:9pt;color:#5d6773}
.fields{display:flex;gap:6mm;font-size:10.5pt;white-space:nowrap;justify-content:flex-end}
.fields span{display:inline-block;border-bottom:.3mm solid #8a95a3;min-width:22mm;margin-left:1.5mm}
.fields span.wide{min-width:30mm}
.gbox{margin:4mm 0 1mm;border:.3mm solid #b9c4d1;border-radius:1.5mm;padding:2.5mm 4mm;font-size:10pt;display:flex;gap:6mm;align-items:center;flex-wrap:wrap}
.gbox table{border-collapse:collapse;font-family:var(--en),var(--zh)}
.gbox th,.gbox td{border:.25mm solid #c9d2de;padding:.8mm 3mm;text-align:left}
.gbox th{background:#f1f4f8;font-weight:500}
.gbox p{margin:0;flex:1;min-width:50mm}
.sec h3{font-size:11.5pt;margin:5mm 0 2mm;font-weight:700;break-after:avoid;page-break-after:avoid}
.sec ol li:first-child{break-before:avoid}
.sec ol{margin:0;padding-left:8mm;display:grid;gap:3.2mm}
.sec li{font-family:var(--en),var(--zh);font-size:12.5pt;line-height:1.7;break-inside:avoid;padding-left:1mm}
.sec li::marker{font-size:11pt;color:#3c4652}
.ln{display:block}
.ln+.ln{margin-top:.6mm}
.blank{display:inline-block;min-width:20mm;border-bottom:.3mm solid #1b1f24;text-align:center;line-height:1.2;vertical-align:baseline;padding:0 1mm}
.blank.wide{min-width:34mm}
.blank .a{visibility:hidden;color:var(--red);font-weight:700}
.sheet.teacher .blank .a{visibility:visible}
.zh{display:block;font-family:var(--zh);font-size:9.5pt;color:#6b7480;line-height:1.4;margin-top:.5mm}
.zh-q{display:block;font-family:var(--zh);font-size:12pt}
.wline{display:block;border-bottom:.3mm solid #1b1f24;min-height:9mm;padding-top:2mm;line-height:1.3}
.wline .a{visibility:hidden;color:var(--red);font-weight:700}
.sheet.teacher .wline .a{visibility:visible}
.tr-note{font-weight:400;font-size:10pt;color:var(--red);margin-left:2mm}
.teacher-tag{color:var(--red);font-weight:700;font-size:10pt;margin-left:3mm}

@media print{
  @page{size:A4;margin:12mm 13mm 14mm}
  html,body{background:#fff}
  .wrap>header,.panel{display:none!important}
  .wrap{padding:0;display:block;max-width:none}
  .main{display:block}
  .preview{overflow:visible}
  .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  .blank .a,.wline .a{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.units{display:flex;flex-wrap:wrap;gap:6px 12px}
.units label{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}
.units input{width:17px;height:17px;accent-color:var(--accent)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{padding:4px 10px;font-weight:500;font-size:.85rem}
.src{font-size:.78rem;color:var(--muted);margin:0}
.vq{display:flex;flex-wrap:wrap;align-items:baseline;gap:2mm 5mm}
.vq .w{font-family:var(--en);font-size:13pt;letter-spacing:.02em}
.vq .h{font-family:var(--zh);font-size:10.5pt;color:#4a5562}
.vq .ans{flex:1;min-width:45mm;border-bottom:.3mm solid #1b1f24;min-height:7mm;line-height:1.3}
.vq .ans .a{visibility:hidden;color:var(--red);font-weight:700}
.sheet.teacher .vq .ans .a{visibility:visible}
.sec ol.cols{display:block;columns:2;column-gap:10mm}
.sec ol.cols li{break-inside:avoid;margin-bottom:3.2mm}
.sh-foot{margin-top:6mm;border-top:.3mm solid #c9d2de;padding-top:2mm;font-size:8.5pt;color:#6b7480}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>英文單字練習卷</h1>
    <p>依課本課次或英文單字 2000 出題，每按一次產生一份新題目；學用版與教用版題目相同。</p>
    <a class="back" href="../ziyuan.html#res-english">← 回學習資源</a>
  </header>
  <div class="main">
    <form class="panel" id="form" autocomplete="off">
      <div class="grp"><span class="t">範圍</span><select id="book" aria-label="範圍"></select><p class="src" id="src"></p></div>
      <div class="grp"><span class="t">課次（可複選）</span><div class="units" id="units"></div><div class="quick" id="quick"></div></div>
      <div class="grp"><span class="t">題型（可複選）</span><div class="checks" id="modes"></div></div>
      <div class="row2">
        <div class="grp"><span class="t">題數（10–50）</span><input type="number" id="count" min="10" max="50" step="1" value="20"></div>
        <div class="grp"><span class="t">排版</span><label class="opt"><input type="checkbox" id="cols" checked>兩欄</label></div>
      </div>
      <div class="grp"><span class="t">標題與機構</span><input type="text" id="title" aria-label="標題"><input type="text" id="org" value="百宏文教機構" aria-label="機構名稱"></div>
      <div class="seg" role="radiogroup" aria-label="版本">
        <label><input type="radio" name="ver" id="verS" value="s" checked>學用版</label>
        <label><input type="radio" name="ver" id="verT" value="t">教用版</label>
      </div>
      <div class="btns"><button type="button" class="ghost" id="new">換一份題目</button><button type="button" class="primary" id="print">列印 A4</button></div>
      <div class="grp"><span class="t">卷號（輸入卷號可還原同一份題目）</span>
        <div class="codebox"><input type="text" id="codeIn" aria-label="卷號" spellcheck="false"><button type="button" class="ghost" id="restore">還原</button></div>
      </div>
      <p class="status" id="status" role="status"></p>
    </form>
    <section class="preview" aria-label="練習卷預覽"><div class="sheet" id="sheet"></div></section>
  </div>
</div>
<script type="module">
import { allBooks, findBook, bookLabel, buildSheet, decodeCode, MODES, COUNT_MIN, COUNT_MAX, COUNT_DEFAULT } from '../assets/english-vocab/core.js';
import { CURRENT } from '../assets/english-vocab/terms.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const NUM = ['一', '二', '三', '四', '五', '六'];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const newSeed = () => 10000 + Math.floor(Math.random() * 90000);
const BOOKS = allBooks();
const keyOf = (b) => `${b.term}|${b.id}`;
let book = BOOKS[0], seed = newSeed();

// ---------- controls ----------
for (const term of [...new Set(BOOKS.map((b) => b.termName))]) {
  const og = document.createElement('optgroup'); og.label = term;
  for (const b of BOOKS.filter((x) => x.termName === term)) og.append(new Option(b.id === 'W2000' ? '英文單字 2000（百宏）' : `${b.grade}・${b.pub} ${b.book}`, keyOf(b)));
  $('book').append(og);
}
$('modes').replaceChildren(...MODES.map((m) => { const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" id="m-${m.id}" value="${m.id}" checked>${esc(m.name)}`; return l; }));

function selectBook(b, keepTitle) {
  book = b; $('book').value = keyOf(b);
  $('src').textContent = `${bookLabel(b)}。來源：${b.source}；只收錄單字、詞性與中文意思，不含例句。`;
  $('units').replaceChildren(...b.units.map(([id, name]) => { const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" value="${id}" checked>${esc(name)}`; return l; }));
  const quick = [['全選', b.units.map((u) => u[0])], ['全不選', []], ...(b.exams ?? []).map((ex, i) => [`第${NUM[i]}次段考`, ex])];
  $('quick').replaceChildren(...quick.map(([label, ids]) => { const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'ghost'; bt.textContent = label;
    bt.addEventListener('click', () => { for (const c of $('units').querySelectorAll('input')) c.checked = ids.includes(c.value); seed = newSeed(); render(); }); return bt; }));
  if (!keepTitle) $('title').value = b.id === 'W2000' ? '英文單字練習' : `英文單字練習：${b.pub} ${b.grade}`;
}
function readOpts() {
  let count = Math.round(Number($('count').value) || COUNT_DEFAULT);
  count = Math.min(COUNT_MAX, Math.max(COUNT_MIN, count));
  return { units: [...$('units').querySelectorAll('input:checked')].map((c) => c.value), modes: MODES.map((m) => m.id).filter((id) => $('m-' + id).checked), count, seed };
}
function applyOpts(o) {
  for (const c of $('units').querySelectorAll('input')) c.checked = o.units.includes(c.value);
  for (const m of MODES) $('m-' + m.id).checked = o.modes.includes(m.id);
  $('count').value = o.count; seed = o.seed;
}

// ---------- worksheet ----------
function item(mode, it) {
  const ans = `<span class="ans"><span class="a">${esc(it.a)}</span></span>`;
  if (mode === 'zh2en') return `<div class="vq"><span class="h">${esc(it.q)}</span><span class="w">${esc(it.hint)}</span>${ans}</div>`;
  if (mode === 'en2zh' || mode === 'pos') return `<div class="vq"><span class="w">${esc(it.q)}</span>${ans}</div>`;
  return `<div class="vq"><span class="w">${esc(it.q)}</span><span class="h">${esc(it.hint)}</span>${ans}</div>`;
}
function render() {
  const o = readOpts(), status = $('status');
  status.classList.remove('err');
  if (!o.units.length) { status.textContent = '請至少勾選一課。'; status.classList.add('err'); return; }
  if (!o.modes.length) { status.textContent = '請至少勾選一種題型。'; status.classList.add('err'); return; }
  const sh = buildSheet(book, o);
  status.textContent = sh.short > 0 ? `這個範圍可出的單字不夠，共出 ${sh.total} 題（少 ${sh.short} 題）；可多勾幾課。` : '';
  const teacher = $('verT').checked;
  let html = `<div class="sh-head"><div class="titles"><h2>${esc($('title').value || '英文單字練習')}${teacher ? '<span class="teacher-tag">教用版</span>' : ''}</h2>
    <div class="sub">${esc($('org').value)}　${esc(bookLabel(book))}　卷號 ${esc(sh.code)}</div></div>
    <div class="fields">班級<span></span>姓名<span class="wide"></span>日期<span></span></div></div>`;
  let n = 1;
  sh.sections.forEach((sec, i) => {
    html += `<section class="sec"><h3>${NUM[i]}、${esc(sec.name)}：${esc(sec.title)}</h3><ol start="${n}" class="${$('cols').checked ? 'cols' : ''}">`;
    for (const it of sec.items) { html += `<li>${item(sec.mode, it)}</li>`; n++; }
    html += '</ol></section>';
  });
  html += `<div class="sh-foot">範圍：${esc(book.units.filter((u) => o.units.includes(u[0])).map((u) => u[1]).join('、'))}。字表：${esc(book.source)}（${esc(book.id === 'W2000' ? '常用字表' : book.termName)}，更新於 ${esc(book.updated)}）。</div>`;
  const el = $('sheet'); el.className = 'sheet' + (teacher ? ' teacher' : ''); el.innerHTML = html;
  $('codeIn').value = sh.code;
}

// ---------- events ----------
$('book').addEventListener('change', () => { const [t, id] = $('book').value.split('|'); selectBook(findBook(t, id)); seed = newSeed(); render(); });
$('form').addEventListener('change', (e) => { if (!['book', 'codeIn'].includes(e.target.id)) render(); });
$('title').addEventListener('input', render); $('org').addEventListener('input', render);
$('new').addEventListener('click', () => { seed = newSeed(); render(); });
$('print').addEventListener('click', () => window.print());
$('restore').addEventListener('click', () => {
  const r = decodeCode($('codeIn').value);
  if (!r) { $('status').textContent = '卷號格式不對，或這個學期的字表已不在網站上。'; $('status').classList.add('err'); return; }
  selectBook(r.book); applyOpts(r.opts); render();
});
$('form').addEventListener('submit', (e) => e.preventDefault());

// ---------- start ----------
const fromCode = params.get('code') && decodeCode(params.get('code'));
if (fromCode) { selectBook(fromCode.book); applyOpts(fromCode.opts); }
else { selectBook(BOOKS.find((b) => b.id === params.get('book') && b.term === CURRENT.id) ?? BOOKS[0]); $('count').value = COUNT_DEFAULT; }
render();
</script>
<script src="../assets/site.js?v=20261005-site-analytics-1" defer></script>
</body>
</html>
