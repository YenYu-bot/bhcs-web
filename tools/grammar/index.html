<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文文法練習卷產生器｜時態與句型轉換｜百宏文教機構</title>
<meta name="description" content="免費的英文文法練習卷產生器，涵蓋 Be 動詞、現在簡單式、現在進行式、現在完成式、問句、動詞填空、句型轉換與改錯。可自訂大題、難度與題數，教用版與學用版同卷號對得上。台中北屯百宏文教機構製作。">
<link rel="canonical" href="https://www.bhcs.com.tw/tools/grammar/">
<meta property="og:title" content="英文文法練習卷產生器｜百宏文教機構">
<meta property="og:description" content="免費的英文文法練習卷產生器，含時態、問句、句型轉換與改錯，可列印或存成 PDF。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.bhcs.com.tw/tools/grammar/">
<style>
  :root{ --ink:#1a1a1a; --line:#d0d0d0; --band:#D9D9D9; --red:#EE0000; --accent:#1f5c8b; }
  *{ box-sizing:border-box; }
  body{ margin:0; color:var(--ink); background:#f4f4f2;
        font-family:"Times New Roman","王漢宗中仿宋繁",serif; }

  /* ---------- 控制面板（不列印） ---------- */
  .panel{ background:#fff; border-bottom:1px solid var(--line); padding:16px 20px; }
  .panel h1{ font-size:20px; margin:0 0 12px; }
  .panel .row{ display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-bottom:10px; }
  .fld{ display:flex; flex-direction:column; gap:3px; }
  .fld label{ font-size:12px; color:#555; }
  .fld input,.fld select{ font:inherit; font-size:14px; padding:5px 7px;
        border:1px solid var(--line); border-radius:4px; background:#fff; }
  .fld input[type=number]{ width:120px; }
  .fld input[type=text]{ width:230px; }
  button{ font:inherit; font-size:14px; padding:7px 16px; border:1px solid var(--accent);
        background:var(--accent); color:#fff; border-radius:4px; cursor:pointer; }
  button.ghost{ background:#fff; color:var(--accent); }
  button:disabled{ opacity:.5; cursor:default; }
  table.secs{ border-collapse:collapse; font-size:13px; margin:8px 0; background:#fff; }
  table.secs th,table.secs td{ border:1px solid var(--line); padding:4px 7px; }
  table.secs select,table.secs input{ font:inherit; font-size:13px; border:1px solid var(--line);
        padding:3px 5px; border-radius:3px; }
  table.secs input[type=text]{ width:180px; }
  table.secs input[type=number]{ width:58px; }
  .del{ background:#fff; color:#a33; border-color:#e0b4b4; padding:3px 9px; }
  .hint{ font-size:12px; color:#666; line-height:1.6; }

  /* ---------- 考卷 ---------- */
  #paper{ background:#fff; margin:20px auto; padding:1cm;
          width:8.5in; min-height:11in; box-shadow:0 1px 6px rgba(0,0,0,.12);
          font-size:14pt; line-height:1.45; }
  #paper h2{ font-size:20pt; text-align:center; font-weight:bold; margin:0 0 4px; }
  .ver{ font-size:12pt; text-align:center; font-weight:bold; margin:0 0 10px; }
  .meta{ font-size:14pt; margin:0 0 14px; }
  .band{ background:var(--band); font-size:17pt; font-weight:bold;
         padding:3px 8px; margin:16px 0 10px; page-break-after:avoid; break-after:avoid; }
  .q{ display:grid; grid-template-columns:0.45in 0.18in 0.85in 0.18in 1fr;
      align-items:start; margin-bottom:11px; page-break-inside:avoid; break-inside:avoid; }
  .q .ans{ text-align:center; font-weight:bold; }
  .q .opts,.q .key{ margin-top:3px; }
  .teacher .ans,.teacher .key b{ color:var(--red); }
  .student .ans,.student .key b{ color:#fff; }
  @media print{
    @page{ size:8.5in 11in; margin:1cm; }
    .panel,.noprint{ display:none !important; }
    body{ background:#fff; }
    #paper{ width:auto; margin:0; padding:0; box-shadow:none; min-height:0; }
  }
</style>
</head>
<body>

<div class="panel noprint">
  <h1>英文文法練習卷產生器</h1>

  <div class="row">
    <div class="fld"><label>卷子標題</label>
      <input type="text" id="title" value="現在三式與問句綜合練習"></div>
    <div class="fld"><label>卷號（同號碼＝同一張卷）</label>
      <input type="number" id="seed" value="20260828"></div>
    <div class="fld"><label>版本</label>
      <select id="edition"><option value="teacher">教用版（紅色答案）</option>
        <option value="student">學用版（答案留白）</option></select></div>
    <div class="fld"><button id="go">產生</button></div>
    <div class="fld"><button class="ghost" id="print">列印 / 存成 PDF</button></div>
    <div class="fld"><button class="ghost" id="reroll">換一張</button></div>
  </div>

  <table class="secs"><thead><tr>
    <th>大題名稱</th><th>文法點</th><th>題型</th><th>難度</th><th>題數</th><th></th>
  </tr></thead><tbody id="secs"></tbody></table>
  <button class="ghost" id="add">＋ 新增大題</button>

  <p class="hint">
    卷號決定題目內容，同一個卷號永遠產生同一張卷。教用版與學用版請用<b>同一個卷號</b>，答案才會對得上。<br>
    產生後按「列印 / 存成 PDF」，在瀏覽器列印對話框把邊界設為「無」或「預設」，勾掉頁首頁尾。
  </p>
</div>

<div id="paper" class="teacher"><p style="text-align:center;color:#888">讀取詞庫中…</p></div>

<script src="engine.js"></script>
<script>
const GRAMMARS = [
  ["be-agreement","Be 動詞 am/is/are"],
  ["present-simple","現在簡單式"],
  ["present-prog","現在進行式"],
  ["present-perfect","現在完成式"],
  ["yesno-be","Be 動詞開頭問句"],
  ["yesno-aux","助動詞開頭問句"],
];
const TYPES = [
  ["multiple-choice","四選一"],
  ["fill-verb","動詞填空"],
  ["transform","句型轉換"],
  ["error-correction","改錯"],
];
// 題型 × 文法點 相容對照
const OK = {
  "multiple-choice": new Set(GRAMMARS.map(g=>g[0])),
  "fill-verb":       new Set(["present-simple","present-prog","present-perfect"]),
  "transform":       new Set(["present-simple","yesno-be"]),
  "error-correction":new Set(["be-agreement","present-simple","present-prog","present-perfect"]),
};
const DEFAULT = [
  ["一、Be 動詞 am / is / are","be-agreement","multiple-choice",1,6],
  ["二、現在簡單式","present-simple","multiple-choice",1,6],
  ["三、現在進行式","present-prog","multiple-choice",1,6],
  ["四、現在完成式","present-perfect","multiple-choice",2,6],
  ["五、Be 動詞開頭的問句","yesno-be","multiple-choice",1,5],
  ["六、助動詞開頭的問句","yesno-aux","multiple-choice",1,5],
  ["七、動詞填空（現在完成式）","present-perfect","fill-verb",2,5],
  ["八、句型轉換","present-simple","transform",2,5],
  ["九、改錯（現在進行式）","present-prog","error-correction",3,5],
];

const $ = s => document.querySelector(s);
const tbody = $("#secs");

function sel(opts, val){
  return `<select>${opts.map(o=>`<option value="${o[0]}"${o[0]===val?" selected":""}>${o[1]}</option>`).join("")}</select>`;
}
function addRow(r){
  const tr = document.createElement("tr");
  tr.innerHTML = `<td><input type="text" value="${r[0]}"></td>
    <td>${sel(GRAMMARS,r[1])}</td><td>${sel(TYPES,r[2])}</td>
    <td>${sel([[1,"1 基礎"],[2,"2 中階"],[3,"3 進階"]],r[3])}</td>
    <td><input type="number" min="1" max="40" value="${r[4]}"></td>
    <td><button class="del">刪</button></td>`;
  tr.querySelector(".del").onclick = ()=>tr.remove();
  tbody.appendChild(tr);
}
DEFAULT.forEach(addRow);
$("#add").onclick = ()=>addRow(["新大題","present-simple","multiple-choice",1,5]);

function readSpec(){
  const sections = [];
  for (const tr of tbody.rows){
    const [tIn,gS,tS,lS,cIn] = [tr.cells[0].firstElementChild, tr.cells[1].firstElementChild,
      tr.cells[2].firstElementChild, tr.cells[3].firstElementChild, tr.cells[4].firstElementChild];
    if (!OK[tS.value].has(gS.value)){
      alert(`「${tIn.value}」的題型與文法點不相容，已跳過這一大題。`);
      continue;
    }
    sections.push({title:tIn.value, grammar:gS.value, type:tS.value,
                   level:+lS.value, count:+cIn.value});
  }
  return {title:$("#title").value, sections};
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function render(paper, spec, seed, edition){
  const p = $("#paper");
  p.className = edition;
  let h = `<h2>${esc(spec.title)}</h2>
    <p class="ver">【${edition==="teacher"?"教用版":"學用版"}】　卷號 ${seed}</p>
    <p class="meta">班級：____________　姓名：____________　分數：__________</p>`;
  let n = 0;
  for (const sec of paper){
    if (!sec.items.length) continue;
    h += `<div class="band">${esc(sec.title)}（${sec.items.length} 題）</div>`;
    for (const q of sec.items){
      n++;
      const mcq = q.type === "multiple-choice";
      const ans = mcq ? String.fromCharCode(65+q.answer) : "✓";
      let body = `<div>${esc(q.stem)}`;
      if (mcq){
        body += `<div class="opts">` + q.options.map((o,j)=>
          `(${String.fromCharCode(65+j)}) ${esc(o)}`).join("　") + `</div>`;
      } else {
        body += `<div class="key">答：<b>${esc(q.answer)}</b></div>`;
      }
      body += `</div>`;
      h += `<div class="q"><div>${n}.</div><div>(</div><div class="ans">${ans}</div><div>)</div>${body}</div>`;
    }
  }
  p.innerHTML = h;
}

let LAST = null;
function build(){
  const spec = readSpec(), seed = +$("#seed").value || 1;
  LAST = {spec, seed};
  render(GrammarEngine.generate(spec, seed), spec, seed, $("#edition").value);
}

$("#go").onclick = build;
$("#print").onclick = ()=>window.print();
$("#reroll").onclick = ()=>{
  $("#seed").value = Math.floor(Math.random()*89999999)+10000000;
  build();
};
$("#edition").onchange = ()=>{ if (LAST) build(); };

GrammarEngine.load("data/").then(info=>{
  console.log("詞庫載入：動詞 "+info.verbs+" 名詞 "+info.nouns);
  build();
}).catch(e=>{
  $("#paper").innerHTML = '<p style="color:#a33;text-align:center">'+
    '詞庫讀取失敗。請確認 data/verbs.json 與 data/nouns.json 存在，'+
    '且是透過網址開啟（不能用 file:// 直接雙擊開啟）。</p>';
  console.error(e);
});
</script>

#bhcs-home{position:fixed;right:16px;bottom:16px;z-index:9999;
  background:#16233A;color:#fff;text-decoration:none;

#bhcs-home:hover{background:#C8352B}

</style>
</body>
