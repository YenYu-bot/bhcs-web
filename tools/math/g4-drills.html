<script>
(()=>{"use strict";
const TOPICS=[["bignum","大數與位值"],["addsub","多位數的加減"],["muldiv","多位數的乘除"],["mixed","四則混合計算與併式"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"bignum",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}
const numHTML=(a,mode,opt={})=>mode==="decimal"?decHTML(a):mode==="fraction"?fracHTML(a,opt):String(a.n).replace("-","−");
function numberFor(mode,level,max=30){if(mode==="integer"){const k=level==="basic"?2:level==="advanced"?10:25;return R(rand(level==="basic"?2:Math.max(2,Math.floor(max*k/5)),max*k))}if(mode==="fraction"){const ds=level==="basic"?[2,3,4,5,6]:[2,3,4,5,6,8,9,10,12,15,20],d=pick(ds);let n=rand(1,(level==="challenge"?3:2)*d-1);while(n%d===0)n=rand(1,3*d-1);return R(n,d)}const p=level==="basic"?1:pick(level==="advanced"?[1,2]:[1,2,3]),s=10**p;let n=rand(1,max*s);while(n%10===0)n=rand(1,max*s);return R(n,s)}

function mixedConfig(){
 // 四位以上的數在題目上加千分位逗號；計算與 verify 都用原始數字
 const unit=(id,name,tip,gen,lead)=>({id,name,tip,modes:["integer"],lead,gen:ctx=>{const q=gen(ctx);if(q)q.expr=q.expr.replace(/\d{4,}/g,m=>fmt(Number(m)));return q}});
 const S=(...p)=>p.join(" ");
 const ev=s=>{const t=s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/＋/g,"+").replace(/[（(]/g,"(").replace(/[）)]/g,")");if(!/^[0-9+\-*/() ]+$/.test(t))throw Error("bad");return Function("return "+t)()};
 const order=unit("order","先乘除，後加減","沒有括號時，先算乘、除，再算加、減；同一級的運算由左往右算。",ctx=>{
  const L=lv(ctx),k=pick(L===0?["a+bc","a-b/c","ab-c"]:L===1?["a+bc","ab-c/d","a-b/c+d"]:["ab+cd","a-b/c*d","ab-c/d"]);

  else if(k==="a-b/c+d"){const c=sm(),q=rand(2,40),b=c*q,a=rand(q+1,q+400);s=S(a,"−",b,"÷",c,"＋",big())}
  else if(k==="ab+cd"){s=S(sm(),"×",rand(10,60),"＋",sm(),"×",rand(10,60))}
  else if(k==="a-b/c*d"){const c=sm(),q=rand(2,20),d=sm(),b=c*q,a=rand(q*d+1,q*d+500);s=S(a,"−",b,"÷",c,"×",d)}

 const paren=unit("paren","有括號的計算","先算括號裡面，再算括號外面；括號外面也要先乘除、後加減。",ctx=>{

  else if(k==="(a-b)/c+d"){const c=sm(),q=rand(2,30),b=rand(10,90),a=b+c*q;s=S("(",a,"−",b,")","÷",c,"＋",rand(10,99))}
  else if(k==="a-(b+c)d"){const b=rand(5,30),c=rand(5,30),d=sm(),a=rand((b+c)*d,(b+c)*d+400);s=S(a,"−","(",b,"＋",c,")","×",d)}
  else if(k==="(a+b)/(c-d)"){const e=sm(),d=rand(5,40),c=d+e,t=e*rand(5,50),a=rand(1,t-1),b=t-a;s=S("(",a,"＋",b,")","÷","(",c,"−",d,")")}

  const v=ev(s);if(!Number.isInteger(v)||v<0)return null;return{expr:s.replace(/\( /g,"(").replace(/ \)/g,")"),answer:fmt(v),sig:"p:"+s,verify:()=>v===stepEval(s)}});
 const easy=unit("easy","簡便計算","湊整十、整百：25×4＝100、125×8＝1000；a−b−c＝a−(b＋c)；a÷b÷c＝a÷(b×c)；加 99 就是加 100 再減 1。",ctx=>{
  const L=lv(ctx),k=pick(L===0?["x4","near","subsub"]:L===1?["x4","x8","subsub","divdiv"]:["x8","divdiv","near","dist"]);let s,way;
  if(k==="x4"){const m=rand(11,99);s=pick([S(25,"×",m,"×",4),S(4,"×",m,"×",25),S(25,"×",4*m)]);way=m*100}

  else if(k==="subsub"){const t=pick([100,200,300,500,1000]),b=rand(1,t-1),c=t-b,a=rand(t+1,t+5000);s=S(a,"−",b,"−",c);way=a-t}
  else if(k==="divdiv"){const [b,c]=pick([[25,4],[4,25],[125,8],[5,2],[2,50],[25,8]]),q=rand(2,60),a=q*b*c;s=S(a,"÷",b,"÷",c);way=q}
  else{const [p,q]=pick([[99,1],[98,2],[97,3],[101,-1]]),m=rand(12,99);s=S(m,"×",p,q>0?"＋":"−",m,"×",Math.abs(q));way=m*100}
  const v=ev(s);return{expr:s,answer:fmt(v),sig:"e:"+s,verify:()=>v===way&&v===stepEval(s)}});
 const T=[["一枝筆 A 元，買 B 枝，付 C 元，應找回多少元？",(a,b)=>[a*b+rand(1,99),`C−A×B`],(a,b,c)=>c-a*b,"元"],["每盒蛋糕 A 個，買了 B 盒，平分給 C 個班級，每班分到幾個？",null,(a,b,c)=>a*b/c,"個"],["小明每天存 A 元，存了 B 天後，又得到 C 元紅包，他共有多少元？",null,(a,b,c)=>a*b+c,"元"],["一本故事書 A 元，一本字典比故事書貴 B 元，買 C 本字典要多少元？",null,(a,b,c)=>(a+b)*c,"元"],["A 個橘子，每 B 個裝一袋，裝好的袋子平均分給 C 個人，每人分到幾袋？",null,(a,b,c)=>a/b/c,"袋"]];
 const combine=unit("combine","列併式解應用題","把兩個步驟寫成一個算式（併式），要先算的部分記得加括號或放在乘除的位置。",ctx=>{

 const box=unit("box","兩步驟的 □","先把 □ 和它旁邊的數看成一個整體，倒回去一步一步算。",ctx=>{

 return{title:"四則混合計算與併式",symbol:"＋×",subtitle:"先乘除後加減・括號・簡便計算・列併式・兩步驟的 □",instruction:"先決定計算的順序再算；應用題要列成一個併式。",modes:["integer"],mixed:false,

/* verify 用：自己寫的四則運算（先乘除後加減、括號），不用 Function，和出題的 ev 不同路線 */
function stepEval(src){const t=src.replace(/[，,]/g,"").match(/\d+|[＋−×÷()（）]/g);let i=0;
 const num=()=>{const x=t[i++];if(x==="("||x==="（"){const v=expr();i++;return v}return Number(x)};

 const expr=()=>{let v=term();while(t[i]==="＋"||t[i]==="−"){const o=t[i++],w=term();v=o==="＋"?v+w:v-w}return v};
 return expr()}
