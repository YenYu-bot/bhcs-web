<script>
// ================= 有理數 =================
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function lcm(a,b){return a/gcd(a,b)*b}
class F{
  constructor(n,d=1){ if(d<0){n=-n;d=-d} const g=gcd(n,d)||1; this.n=n/g; this.d=d/g }
  static of(x){return x instanceof F?x:new F(x)}
  add(o){o=F.of(o);return new F(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){o=F.of(o);return new F(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){o=F.of(o);return new F(this.n*o.n,this.d*o.d)}
  div(o){o=F.of(o);return new F(this.n*o.d,this.d*o.n)}
  neg(){return new F(-this.n,this.d)}
  abs(){return new F(Math.abs(this.n),this.d)}
  cmp(o){o=F.of(o);return Math.sign(this.n*o.d-o.n*this.d)}
  eq(o){return this.cmp(o)===0}
  get sign(){return Math.sign(this.n)}
  isInt(){return this.d===1}
  isZero(){return this.n===0}
}
const ONE=new F(1);
class L{
  constructor(p,q){this.p=F.of(p);this.q=F.of(q)}
  add(o){return new L(this.p.add(o.p),this.q.add(o.q))}
  sub(o){return new L(this.p.sub(o.p),this.q.sub(o.q))}
  scale(k){return new L(this.p.mul(k),this.q.mul(k))}
  at(x){return this.p.mul(x).add(this.q)}
}
// ================= 亂數 =================
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const nz=(a,b)=>{let v;do{v=ri(a,b)}while(v===0);return v};
const sgn=()=>chance(.5)?1:-1;
function coprime(a,b){return gcd(a,b)===1}
function retry(fn){for(let i=0;i<80;i++){const r=fn();if(r)return r}return fn(true)}

// ================= 顯示 =================
const MINUS='−';
function isDecDen(d){return 1000%d===0}
function decStr(f){let k=0;while(Math.pow(10,k)%f.d!==0)k++;const n=Math.abs(f.n)*Math.pow(10,k)/f.d;let s=String(n);while(s.length<=k)s='0'+s;s=k?s.slice(0,s.length-k)+'.'+s.slice(s.length-k):s;return (f.n<0?MINUS:'')+s}
function frHTML(n,d,big){return `<span class="fr${big?' big':''}"><span class="n">${n}</span><span class="d">${d}</span></span>`}
// o.dec 允許小數；o.mixed 帶分數；o.paren 負數加括號；o.abs 不顯示負號
function num(f,o={}){
  f=F.of(f);
  const neg=f.n<0&&!o.abs, a=Math.abs(f.n);
  let s;
  if(f.d===1) s=String(a);
  else if(o.dec&&isDecDen(f.d)) s=decStr(f.abs());
  else if(o.mixed&&a>f.d){const w=Math.floor(a/f.d);s=`<span class="mx">${w}${frHTML(a-w*f.d,f.d)}</span>`}
  else s=frHTML(a,f.d);
  s=(neg?MINUS:'')+s;
  return (neg&&o.paren)?'('+s+')':s;
}
const V=n=>`<var>${n}</var>`;
const X=V('x'),Y=V('y'),Zv=V('z');
const CL='<span class="cl">:</span>', EQ='<span class="eq">=</span>';
const ratio=(...p)=>p.join(CL);
const join=s=>s.join('，');
const SUP2='<sup>2</sup>';

// 式子（一次式）顯示：{c:F,dec,body:null|'x'|{br:Expr}|{fr:Expr,den}}
const T=(c,body=null,dec=false)=>({c:F.of(c),body,dec});
const brT=(c,inner,dec=false)=>T(c,{br:inner},dec);
const lin=(a,b,dec=false)=>{const t=[];if(!F.of(a).isZero())t.push(T(a,'x',dec));if(!F.of(b).isZero())t.push(T(b,null,dec));return t.length?t:[T(0)]};
function val(e){let r=new L(0,0);for(const t of e){let v;if(t.body===null)v=new L(0,1);else if(t.body==='x')v=new L(1,0);else if(t.body.br)v=val(t.body.br);else v=val(t.body.fr).scale(ONE.div(t.body.den));r=r.add(v.scale(t.c))}return r}
function renderTerm(t,first){
  const neg=t.c.sign<0,m=t.c.abs(),one=m.eq(1),coef=num(m,{dec:t.dec});
  const sign=first?(neg?MINUS:''):(`<span class="op">${neg?MINUS:'+'}</span>`);
  let body;
  if(t.body===null)body=coef;
  else if(t.body==='x')body=(one?'':coef)+X;
  else if(t.body.br)body=(one?'':coef)+'('+render(t.body.br)+')';
  else{const fr=frHTML(render(t.body.fr),num(t.body.den));body=one?fr:coef+'('+fr+')'}
  return sign+body;
}
function render(e){const ts=e.filter(t=>!t.c.isZero());if(!ts.length)return'0';return ts.map((t,i)=>renderTerm(t,i===0)).join('')}
function renderL(l,dec=false){return render(lin(l.p,l.q,dec))}
// 兩變數一次式 p x + q y
function renderXY(p,q,vx=X,vy=Y){const t=[];if(!F.of(p).isZero())t.push(T(p,'x'));if(!F.of(q).isZero())t.push(T(q,'y'));const h=t.map((tt,i)=>{const neg=tt.c.sign<0,m=tt.c.abs(),one=m.eq(1);return (i?`<span class="op">${neg?MINUS:'+'}</span>`:(neg?MINUS:''))+(one?'':num(m))+(tt.body==='x'?vx:vy)}).join('');return h||'0'}
function denLcm(...fs){return fs.reduce((m,f)=>lcm(m,F.of(f).d),1)}

// ================= 係數形式 =================
let CFG={lvl:2,types:['int','frac','dec']};
function style(pOther=.5){const t=CFG.types;if(t.length===1)return t[0];if(t.includes('int')&&!chance(pOther))return'int';const o=t.filter(x=>x!=='int');return pick(o.length?o:t)}
// 產生一個正的數值（依形式）
function posNum(st,{max=9,mixed=true,dec2=false}={}){
  if(st==='frac'){const d=pick([2,3,4,5,6,7,8]);let n;do{n=ri(1,mixed&&CFG.lvl>=2?d*3:d-1)}while(!coprime(n,d)||n===d);return new F(n,d)}
  if(st==='dec'){const k=dec2?100:10;let n;do{n=ri(1,Math.min(max*k,k*4))}while(n%k===0);return new F(n,k)}
  return new F(ri(1,max));
}
const pickRatioInt=(max=9)=>{let a,b;do{a=ri(1,max);b=ri(1,max)}while(a===b||!coprime(a,b));return[a,b]};

// 化為最簡整數比：輸入 F 陣列 → 整數陣列（保留符號）
function simpRatio(fs){
  const M=denLcm(...fs);let ns=fs.map(f=>f.n*M/f.d);
  const g=ns.reduce((a,b)=>gcd(a,b),0)||1;
  ns=ns.map(n=>n/g);
  return ns;
}
// 比值步驟：a÷b
function ratioValueSteps(a,b,o={}){ // 回傳 {steps:[], v:F}
  const s=[];
  const v=a.div(b);
  const isI=a.isInt()&&b.isInt();

      }

      const fixTarget=D.some(t=>t.body===null)?D:B.some(t=>t.body===null)?B:null;

        const at=e=>val(e).at(x0);

        else{ if(at(C).isZero())return null; k=at(A).mul(at(D)).sub(at(C).mul(at(noC))).div(at(C)); }
        if(!k.isInt()||Math.abs(k.n)>60)return null;

      }

      A=[brT(1,mk())];B=[brT(1,mk())];

    const q2=la.p.mul(ld.p).sub(lb.p.mul(lc.p));

      return w(e1)+w(e2);
    };
    const dec=[A,B,C,D].some(e=>e.some(t=>t.dec));
    s.push('外項乘積＝內項乘積：'+side(A,D)+EQ+side(B,C));
    const lhs=new L(la.p.mul(ld.q).add(la.q.mul(ld.p)),la.q.mul(ld.q)), rhs=new L(lb.p.mul(lc.q).add(lb.q.mul(lc.p)),lb.q.mul(lc.q));
    s.push(renderL(lhs,dec)+EQ+renderL(rhs,dec));
    const M=denLcm(lhs.p,lhs.q,rhs.p,rhs.q);
    let l2=lhs,r2=rhs; if(M>1){l2=lhs.scale(M);r2=rhs.scale(M);s.push('同乘以 '+M+'：'+renderL(l2)+EQ+renderL(r2))}

    s.push('<b>'+X+EQ+num(x0)+'</b>');
    return{html,ans:join(s),v:x0,_chk:x=>la.at(x).mul(ld.at(x)).eq(lb.at(x).mul(lc.at(x)))};
  });
}

      if(a<b)return null;
      const p=a+b,q=a-b,g=gcd(p,q);
      if(q===0)return null;
      cond=`${ratio('('+renderXY(1,1)+')','('+renderXY(1,-1)+')')}${EQ}${ratio(num(p/g),num(q/g))}`;
      s.push(`${num(p/g)}(${renderXY(1,-1)})${EQ}${num(q/g)}(${renderXY(1,1)})，${renderXY(p/g,-p/g)}${EQ}${renderXY(q/g,q/g)}，${renderXY(p/g-q/g,0)}${EQ}${renderXY(0,p/g+q/g)}，${ratio(X,Y)}${EQ}${ratio(a,b)}`);
    }
    // 方程式 cx+dy=e
    let c,d;do{c=nz(-6,9);d=nz(-6,9)}while(c*a+d*b===0);
    const e=(c*a+d*b)*r;
    const eq=renderXY(c,d)+EQ+num(e);
    s.push(`令 ${X}${EQ}${a===1?'':a}${V('r')}、${Y}${EQ}${b===1?'':b}${V('r')}，代入 ${eq}：${num(c*a)}${V('r')}<span class="op">${d*b<0?MINUS:'+'}</span>${Math.abs(d*b)}${V('r')}${EQ}${num(e)}，${num(c*a+d*b)}${V('r')}${EQ}${num(e)}，${V('r')}${EQ}${r}`);
    const askAll=lvl===1||chance(.3);
    if(!askAll)s.push(`${X}${EQ}${x}，${Y}${EQ}${y}`);
    let ask;
    if(askAll){ask=`求 ${X}${EQ}？，${Y}${EQ}？`;s.push(`<b>${X}${EQ}${x}，${Y}${EQ}${y}</b>`)}
    else{
      const p=nz(-9,9),q=nz(-9,9); const m=x+p,n=y+q; if(n===0)return null;
      const e1=`(${X}<span class="op">${p<0?MINUS:'+'}</span>${Math.abs(p)})`,e2=`(${Y}<span class="op">${q<0?MINUS:'+'}</span>${Math.abs(q)})`;
      ask=`則 ${ratio(e1,e2)} 的比值是多少？`;
      s.push(`${ratio(e1,e2)}${EQ}${ratio(num(m,{paren:true}),num(n,{paren:true}))}，比值為 <b>${num(new F(m,n))}</b>`);
    }
    const html=`設 ${cond}，且 ${eq}，${ask}`;
    return{html,ans:join(s)};
  });
}

// ================= 連比工具 =================
function ratioNum(f,o={}){return num(f,{dec:true,mixed:true,...o})}
function ratioTerms(st,n=2,{max=9}={}){ // 產生 n 個正數，且最簡整數比不全相同
  const fs=[];for(let i=0;i<n;i++)fs.push(posNum(st,{max,mixed:CFG.lvl>=2}));return fs;
}
function alignTable(v1,v2,v3,A,B,C,D,L1,mid){ // 對齊表：mid 為共用文字
  const [m1,m2]=mid;
  return `<table class="al"><tr><td>${v1}</td><td>:</td><td>${v2}</td><td>:</td><td>${v3}</td></tr><tr><td>${A}</td><td></td><td>${B}</td><td></td><td></td></tr><tr><td></td><td></td><td>${C}</td><td></td><td>${D}</td></tr><tr class="tot"><td>${L1[0]}</td><td>:</td><td>${L1[1]}</td><td>:</td><td>${L1[2]}</td></tr></table>`;
}
// 兩個比合併：x:y=a:b, y:z=c:d（整數） → x:y:z
function mergeShared(a,b,c,d){const Lm=lcm(b,c);let r=[a*Lm/b,Lm,d*Lm/c];const g=r.reduce((p,q)=>gcd(p,q),0);return r.map(v=>v/g)}

// ================= 單元 7：連比 =================
function genChain(){
  const lvl=CFG.lvl;
  return retry(()=>{
    const vars=chance(.5)?[X,Y,Zv]:[V('a'),V('b'),V('c')];
    const [v1,v2,v3]=vars;
    const st=style(lvl===1?.3:.6);
    if(lvl===3&&chance(.5)||lvl===2&&chance(.3)){ // ax:by:cz=p:q:r
      const [ka,kb,kc]=[ri(2,5),ri(2,5),ri(2,5)];
      let p,q,rr;do{p=ri(2,20);q=ri(2,20);rr=ri(2,20)}while(gcd(gcd(p,q),rr)>1);
      const fx=new F(p,ka),fy=new F(q,kb),fz=new F(rr,kc);
      const res=simpRatio([fx,fy,fz]);
      const html=`已知 ${ratio(ka+v1,kb+v2,kc+v3)}${EQ}${ratio(p,q,rr)}，求 ${ratio(v1,v2,v3)}${EQ}？`;
      const s=[`${ka}${v1}${EQ}${p}${V('r')}，${v1}${EQ}${num(fx)}${V('r')}；${kb}${v2}${EQ}${q}${V('r')}，${v2}${EQ}${num(fy)}${V('r')}；${kc}${v3}${EQ}${rr}${V('r')}，${v3}${EQ}${num(fz)}${V('r')}`,
        `${ratio(v1,v2,v3)}${EQ}${ratio(num(fx),num(fy),num(fz))}${EQ}<b>${ratio(...res)}</b>`];
      return{html,ans:join(s)};
    }
    // 兩個比合併
    const pairKind=pick(['12-23','12-13','13-23']); // 哪兩個比已知
    const mk=()=>{let f;do{f=ratioTerms(st,2,{max:lvl===1?9:12})}while(f[0].eq(f[1]));return f};
    const r1=mk(),r2=mk();
    const s1=simpRatio(r1),s2=simpRatio(r2);
    if(s1[0]>30||s1[1]>30||s2[0]>30||s2[1]>30)return null;
    let names,res,tbl;
    const nums=(f)=>ratioNum(f[0])+CL+ratioNum(f[1]);
    if(pairKind==='12-23'){names=[[v1,v2],[v2,v3]];res=mergeShared(s1[0],s1[1],s2[0],s2[1]);const Lm=lcm(s1[1],s2[0]);tbl=alignTable(v1,v2,v3,s1[0],s1[1],s2[0],s2[1],[s1[0]*Lm/s1[1],Lm,s2[1]*Lm/s2[0]],[v2])}
    else if(pairKind==='12-13'){names=[[v1,v2],[v1,v3]];const Lm=lcm(s1[0],s2[0]);let r=[Lm,s1[1]*Lm/s1[0],s2[1]*Lm/s2[0]];const g=r.reduce((p,q)=>gcd(p,q),0);res=r.map(v=>v/g);tbl=`<table class="al"><tr><td>${v1}</td><td>:</td><td>${v2}</td><td>:</td><td>${v3}</td></tr><tr><td>${s1[0]}</td><td></td><td>${s1[1]}</td><td></td><td></td></tr><tr><td>${s2[0]}</td><td></td><td></td><td></td><td>${s2[1]}</td></tr><tr class="tot"><td>${r[0]}</td><td>:</td><td>${r[1]}</td><td>:</td><td>${r[2]}</td></tr></table>`}
    else{names=[[v1,v3],[v2,v3]];const Lm=lcm(s1[1],s2[1]);let r=[s1[0]*Lm/s1[1],s2[0]*Lm/s2[1],Lm];const g=r.reduce((p,q)=>gcd(p,q),0);res=r.map(v=>v/g);tbl=`<table class="al"><tr><td>${v1}</td><td>:</td><td>${v2}</td><td>:</td><td>${v3}</td></tr><tr><td>${s1[0]}</td><td></td><td></td><td></td><td>${s1[1]}</td></tr><tr><td></td><td></td><td>${s2[0]}</td><td></td><td>${s2[1]}</td></tr><tr class="tot"><td>${r[0]}</td><td>:</td><td>${r[1]}</td><td>:</td><td>${r[2]}</td></tr></table>`}
    const html=`${ratio(...names[0])}${EQ}${nums(r1)}，${ratio(...names[1])}${EQ}${nums(r2)}，則 ${ratio(v1,v2,v3)}${EQ}？`;
    const s=[];
    const conv=(nm,f,sr)=>{const same=f[0].isInt()&&f[1].isInt()&&f[0].n===sr[0]&&f[1].n===sr[1];return `${ratio(...nm)}${EQ}${nums(f)}`+(same?'':EQ+ratio(...sr))};
    s.push(conv(names[0],r1,s1));s.push(conv(names[1],r2,s2));
    s.push(tbl+`∴ ${ratio(v1,v2,v3)}${EQ}<b>${ratio(...res)}</b>`);
    return{html,ans:join(s)};
  });
}

// ================= 單元 8：連比例式 =================
function genChainProp(){
  const lvl=CFG.lvl;
  return retry(()=>{
    const st=style(lvl===1?.2:.6);
    // 已知比 a:b:c，另一邊 p:x:y（p 對應 a）
    let base=ratioTerms(st,3,{max:lvl===1?9:15});
    if(base[0].eq(base[1])||base[1].eq(base[2]))return null;
    const k=chance(.5)?new F(ri(2,6)):new F(ri(1,9),pick([2,3,4,5]));
    const other=base.map(f=>f.mul(k));
    const idxKnown=ri(0,2); // other 中哪一個已知
    const unk=[0,1,2].filter(i=>i!==idxKnown);
    const shown=other.map((f,i)=>i===idxKnown?ratioNum(f):(i===unk[0]?X:Y));
    if(!other[idxKnown].isInt()&&lvl===1)return null;
    const flipSide=chance(.4);
    const L1=ratio(...base.map(f=>ratioNum(f))),L2=ratio(...shown);
    const html=`若 ${flipSide?L2+EQ+L1:L1+EQ+L2}，求 ${X}${EQ}？，${Y}${EQ}？`;
    const s=[];
    const sb=simpRatio(base);
    if(!base.every((f,i)=>f.isInt()&&f.n===sb[i]))s.push(`${L1}${EQ}${ratio(...sb)}`);
    const kn=other[idxKnown];
    for(const [j,name] of [[unk[0],X],[unk[1],Y]]){
      // sb[idxKnown]:sb[j] = kn:name → sb[idxKnown]·name = sb[j]·kn
      const val_=other[j];
      s.push(`${ratio(sb[idxKnown],sb[j])}${EQ}${ratio(ratioNum(kn),name)}，${sb[idxKnown]}${name}${EQ}${sb[j]}×${ratioNum(kn,{paren:true})}${EQ}${num(new F(sb[j]).mul(kn))}，${name}${EQ}<b>${num(val_)}</b>`);
    }
    return{html,ans:join(s)};
  });
}

// ================= 單元 9：連比活用 =================
function genChainApp(){
  const lvl=CFG.lvl;
  return retry(()=>{
    const useXYZ=chance(.5);const [v1,v2,v3]=useXYZ?[X,Y,Zv]:[V('a'),V('b'),V('c')];
    const kind=lvl===1?pick(['frac','eq3']):lvl===2?pick(['eq3','coefPair','twoEq']):pick(['prod','pairProd','twoEq','coefPair']);
    const abc=()=>{let a,b,c;do{a=ri(2,9);b=ri(2,9);c=ri(2,9)}while(a===b||b===c||a===c);return[a,b,c]};
    if(kind==='frac'){ // x/a=y/b=z/c
      const [a,b,c]=abc();
      const html=`已知 ${v1}、${v2}、${v3} 均不為 0，若 ${frHTML(v1,a)}${EQ}${frHTML(v2,b)}${EQ}${frHTML(v3,c)}，求 ${ratio(v1,v2,v3)}${EQ}？`;
      const g=gcd(gcd(a,b),c);
      const s=[`令 ${frHTML(v1,a)}${EQ}${frHTML(v2,b)}${EQ}${frHTML(v3,c)}${EQ}${V('r')}，則 ${v1}${EQ}${a}${V('r')}、${v2}${EQ}${b}${V('r')}、${v3}${EQ}${c}${V('r')}`,`${ratio(v1,v2,v3)}${EQ}<b>${ratio(a/g,b/g,c/g)}</b>`];
      return{html,ans:join(s)};
    }
    if(kind==='eq3'){ // ax=by=cz → x:y:z = bc:ac:ab
      const [a,b,c]=abc();
      const html=`設 ${v1}、${v2}、${v3} 均不為 0，且 ${a}${v1}${EQ}${b}${v2}${EQ}${c}${v3}，求 ${ratio(v1,v2,v3)}${EQ}？`;
      const r=simpRatio([new F(1,a),new F(1,b),new F(1,c)]);
      const s=[`令 ${a}${v1}${EQ}${b}${v2}${EQ}${c}${v3}${EQ}${V('r')}，則 ${v1}${EQ}${frHTML(V('r'),a)}、${v2}${EQ}${frHTML(V('r'),b)}、${v3}${EQ}${frHTML(V('r'),c)}`,`${ratio(v1,v2,v3)}${EQ}${ratio(frHTML(1,a),frHTML(1,b),frHTML(1,c))}${EQ}${ratio(b*c,a*c,a*b)}${EQ}<b>${ratio(...r)}</b>`];
      return{html,ans:join(s)};
    }
    if(kind==='twoEq'){ // 5x=4z, 3y=2z → x:y:z
      const [a,b,c,d]=[ri(2,9),ri(2,9),ri(2,9),ri(2,9)];
      if(a===b||c===d)return null;
      // ax=bz → x:z=b:a ; cy=dz → y:z=d:c
      const Lm=lcm(a,c);let r=[b*Lm/a,d*Lm/c,Lm];const g=r.reduce((p,q)=>gcd(p,q),0);r=r.map(v=>v/g);
      const html=`設 ${v1}${v2}${v3}≠0，且 ${a}${v1}${EQ}${b}${v3}，${c}${v2}${EQ}${d}${v3}，求 ${ratio(v1,v2,v3)}${EQ}？`;
      const s=[`由 ${a}${v1}${EQ}${b}${v3} 得 ${ratio(v1,v3)}${EQ}${ratio(b,a)}；由 ${c}${v2}${EQ}${d}${v3} 得 ${ratio(v2,v3)}${EQ}${ratio(d,c)}`,`${v3} 對應的數取 ${a}、${c} 的最小公倍數 ${Lm}：${ratio(v1,v2,v3)}${EQ}${ratio(b*Lm/a,d*Lm/c,Lm)}`+(g>1?EQ+'<b>'+ratio(...r)+'</b>':'')];
      if(g===1)s[1]=s[1].replace(ratio(b*Lm/a,d*Lm/c,Lm),'<b>'+ratio(...r)+'</b>');
      return{html,ans:join(s)};
    }
    if(kind==='coefPair'){ // 2a:3b=4:9, 5b:c=3:1
      const [k1,k2,k3,k4]=[ri(1,5),ri(1,5),ri(1,5),ri(1,5)];
      let [p,q]=pickRatioInt(12),[u,w]=pickRatioInt(12);
      const fa=new F(p,k1),fb=new F(q,k2),fb2=new F(u,k3),fc=new F(w,k4);
      const s1=simpRatio([fa,fb]),s2=simpRatio([fb2,fc]);
      if(s1.some(v=>v>40)||s2.some(v=>v>40))return null;
      const res=mergeShared(s1[0],s1[1],s2[0],s2[1]);
      const Lm=lcm(s1[1],s2[0]);
      const html=`設 ${ratio((k1===1?'':k1)+v1,(k2===1?'':k2)+v2)}${EQ}${ratio(p,q)}，${ratio((k3===1?'':k3)+v2,(k4===1?'':k4)+v3)}${EQ}${ratio(u,w)}，求 ${ratio(v1,v2,v3)}${EQ}？`;
      const s=[`${ratio(v1,v2)}${EQ}${ratio(num(fa),num(fb))}${EQ}${ratio(...s1)}`,`${ratio(v2,v3)}${EQ}${ratio(num(fb2),num(fc))}${EQ}${ratio(...s2)}`,alignTable(v1,v2,v3,s1[0],s1[1],s2[0],s2[1],[s1[0]*Lm/s1[1],Lm,s2[1]*Lm/s2[0]],[v2])+`∴ ${ratio(v1,v2,v3)}${EQ}<b>${ratio(...res)}</b>`];
      return{html,ans:join(s)};
    }
    if(kind==='prod'){ // 5ab=3bc=8ac → a:b:c=3:8:5（x:y:z = 係數 yz:zx:xy）
      const [a,b,c]=abc(); // a·v1v2 = b·v2v3 = c·v1v3
      const r=simpRatio([new F(b),new F(c),new F(a)]);
      const html=`設 ${v1}${v2}${v3}≠0，且 ${a}${v1}${v2}${EQ}${b}${v2}${v3}${EQ}${c}${v1}${v3}，求 ${ratio(v1,v2,v3)}${EQ}？`;
      const g1=gcd(a,b),g2=gcd(b,c);
      const s=[`由 ${a}${v1}${v2}${EQ}${b}${v2}${v3} 得 ${a}${v1}${EQ}${b}${v3}，${ratio(v1,v3)}${EQ}${ratio(b/g1,a/g1)}`,`由 ${b}${v2}${v3}${EQ}${c}${v1}${v3} 得 ${b}${v2}${EQ}${c}${v1}，${ratio(v1,v2)}${EQ}${ratio(b/g2,c/g2)}`,`∴ ${ratio(v1,v2,v3)}${EQ}<b>${ratio(...r)}</b>`];
      return{html,ans:join(s)};
    }
    // pairProd: xy:yz:zx=p:q:r → x:y:z = 1/q : 1/r : 1/p
    let p,q,rr;do{p=ri(2,12);q=ri(2,12);rr=ri(2,12)}while(p===q||q===rr||p===rr);
    const r=simpRatio([new F(1,q),new F(1,rr),new F(1,p)]);
    const html=`設 ${v1}${v2}${v3}≠0，且 ${ratio(v1+v2,v2+v3,v3+v1)}${EQ}${ratio(p,q,rr)}，求 ${ratio(v1,v2,v3)}${EQ}？`;
    const g1=gcd(p,q),g2=gcd(q,rr);
    const s=[`由 ${ratio(v1+v2,v2+v3)}${EQ}${ratio(p,q)} 得 ${ratio(v1,v3)}${EQ}${ratio(p/g1,q/g1)}；由 ${ratio(v2+v3,v3+v1)}${EQ}${ratio(q,rr)} 得 ${ratio(v2,v1)}${EQ}${ratio(q/g2,rr/g2)}`,`∴ ${ratio(v1,v2,v3)}${EQ}<b>${ratio(...r)}</b>`];
    return{html,ans:join(s)};
  });
}

// ================= 單元 10：連比與求值 =================
function genChainValue(){
  const lvl=CFG.lvl;
  return retry(()=>{
    const useXYZ=chance(.5);const [v1,v2,v3]=useXYZ?[X,Y,Zv]:[V('a'),V('b'),V('c')];
    let a,b,c;do{a=ri(1,9);b=ri(1,9);c=ri(1,9)}while(gcd(gcd(a,b),c)>1||(a===b&&b===c));
    const r=ri(2,lvl===1?9:20);
    const s=[];
    let cond;
    if(lvl===1){cond=`${ratio(v1,v2,v3)}${EQ}${ratio(a,b,c)}`}
    else{
      const st=style(.6);
      const k=chance(.5)?new F(ri(2,5)):posNum(st,{mixed:false});
      const f1=new F(a).mul(k),f2=new F(b).mul(k),f3=new F(c).mul(k);
      if(chance(.5)){ // 兩個比
        const kk=posNum(st,{mixed:false});
        const g1=[f1,f2], g2=[new F(b).mul(kk),new F(c).mul(kk)];
        cond=`${ratio(v1,v2)}${EQ}${ratio(ratioNum(g1[0]),ratioNum(g1[1]))}，${ratio(v2,v3)}${EQ}${ratio(ratioNum(g2[0]),ratioNum(g2[1]))}`;
        const s1=simpRatio(g1),s2=simpRatio(g2);const Lm=lcm(s1[1],s2[0]);
        s.push(`${ratio(v1,v2)}${EQ}${ratio(...s1)}，${ratio(v2,v3)}${EQ}${ratio(...s2)}`+alignTable(v1,v2,v3,s1[0],s1[1],s2[0],s2[1],[s1[0]*Lm/s1[1],Lm,s2[1]*Lm/s2[0]],[v2])+`${ratio(v1,v2,v3)}${EQ}${ratio(a,b,c)}`);
      }else{ // 3a=2b，b:c=...
        const g=gcd(a,b);
        if(a===b)return null;
        const m=b/g,n=a/g; // m·v1 = n·v2 ⇔ v1:v2 = n:m = a:b
        const g2=[new F(b).mul(k),new F(c).mul(k)];const s2=simpRatio(g2);
        cond=`${m===1?'':m}${v1}${EQ}${n===1?'':n}${v2}，${ratio(v2,v3)}${EQ}${ratio(ratioNum(g2[0]),ratioNum(g2[1]))}`;
        const Lm=lcm(m,s2[0]);
        s.push(`${ratio(v1,v2)}${EQ}${ratio(n,m)}，${ratio(v2,v3)}${EQ}${ratio(...s2)}`+alignTable(v1,v2,v3,n,m,s2[0],s2[1],[n*Lm/m,Lm,s2[1]*Lm/s2[0]],[v2])+`${ratio(v1,v2,v3)}${EQ}${ratio(a,b,c)}`);
      }
    }
    // 條件式 p v1 + q v2 + t v3 = K
    let p,q,t,K;do{p=nz(-3,4);q=nz(-3,4);t=nz(-3,4);if(lvl===1){p=pick([1,1,2]);q=pick([1,1,2,3]);t=pick([1,1,2])}K=(p*a+q*b+t*c)*r}while(p*a+q*b+t*c<=0);
    const lhs3=[[p,v1],[q,v2],[t,v3]].map(([co,v],i)=>(i?`<span class="op">${co<0?MINUS:'+'}</span>`:(co<0?MINUS:''))+(Math.abs(co)===1?'':Math.abs(co))+v).join('');
    const eq=`${lhs3}${EQ}${K}`;
    s.push(`令 ${v1}${EQ}${a===1?'':a}${V('r')}、${v2}${EQ}${b===1?'':b}${V('r')}、${v3}${EQ}${c===1?'':c}${V('r')}，代入 ${eq}：${num(p*a)}${V('r')}<span class="op">${q*b<0?MINUS:'+'}</span>${Math.abs(q*b)}${V('r')}<span class="op">${t*c<0?MINUS:'+'}</span>${Math.abs(t*c)}${V('r')}${EQ}${K}，${p*a+q*b+t*c}${V('r')}${EQ}${K}，${V('r')}${EQ}${r}`);
    const vals=[a*r,b*r,c*r];
    let ask;
    const askKind=lvl===1?pick(['all','one']):lvl===2?pick(['all','one','sum']):pick(['sum','exprRatio','one']);
    if(askKind==='all'){ask=`則 ${v1}${EQ}？，${v2}${EQ}？，${v3}${EQ}？`;s.push(`<b>${v1}${EQ}${vals[0]}，${v2}${EQ}${vals[1]}，${v3}${EQ}${vals[2]}</b>`)}
    else if(askKind==='one'){const i=ri(0,2);ask=`則 ${[v1,v2,v3][i]}${EQ}？`;s.push(`<b>${[v1,v2,v3][i]}${EQ}${[a,b,c][i]}${V('r')}${EQ}${vals[i]}</b>`)}
    else if(askKind==='sum'){const [u,w,z]=[pick([1,1,2]),pick([1,2,3]),pick([1,1,2])];const e=[[u,v1],[w,v2],[z,v3]].map(([co,v],i)=>(i?'<span class="op">+</span>':'')+(co===1?'':co)+v).join('');ask=`則 ${e}${EQ}？`;s.push(`${e}${EQ}${u*vals[0]}+${w*vals[1]}+${z*vals[2]}${EQ}<b>${u*vals[0]+w*vals[1]+z*vals[2]}</b>`)}
    else{ // (a+2):(b−2):(c+3)
      const [d1,d2,d3]=[nz(-9,9),nz(-9,9),nz(-9,9)];const m=[vals[0]+d1,vals[1]+d2,vals[2]+d3];if(m.some(v=>v<=0))return null;
      const e=(v,d)=>`(${v}<span class="op">${d<0?MINUS:'+'}</span>${Math.abs(d)})`;
      const g=m.reduce((x,y)=>gcd(x,y),0);
      ask=`則 ${ratio(e(v1,d1),e(v2,d2),e(v3,d3))}${EQ}？`;
      s.push(`${ratio(e(v1,d1),e(v2,d2),e(v3,d3))}${EQ}${ratio(...m)}`+(g>1?EQ+'<b>'+ratio(...m.map(v=>v/g))+'</b>':'').replace(ratio(...m),g>1?ratio(...m):'<b>'+ratio(...m)+'</b>'));
    }
    const html=`設 ${cond}，且 ${eq}，${ask}`;
    return{html,ans:join(s)};
  });
}

// ================= 單元 11：綜合（含教材綜合區題型） =================
function genExprValue(){ // a=2b，b=3c，求 3b²/(2a²+bc)
  return retry(()=>{
    const [v1,v2,v3]=chance(.5)?[X,Y,Zv]:[V('a'),V('b'),V('c')];
    const m=ri(2,4),n=ri(2,4); // v1=m v2, v2=n v3 → v3=r, v2=nr, v1=mnr
    const a=m*n,b=n,c=1;
    const k1=ri(1,5),k2=ri(1,5),k3=ri(1,5);
    const numV=k1*b*b, denV=k2*a*a+k3*b*c;
    const sq=(k,v)=>(k===1?'':k)+v+SUP2;
    const html=`設 ${v1}、${v2}、${v3} 均不為 0，且 ${v1}${EQ}${m}${v2}，${v2}${EQ}${n}${v3}，求 ${frHTML(sq(k1,v2),sq(k2,v1)+'<span class="op">+</span>'+(k3===1?'':k3)+v2+v3,true)}${EQ}？`;
    const s=[`令 ${v3}${EQ}${V('r')}，則 ${v2}${EQ}${b}${V('r')}、${v1}${EQ}${a}${V('r')}`,`原式${EQ}${frHTML(`${k1}×(${b}${V('r')})${SUP2}`,`${k2}×(${a}${V('r')})${SUP2}+${k3}×${b}${V('r')}×${V('r')}`,true)}${EQ}${frHTML(numV+V('r')+SUP2,(k2*a*a)+V('r')+SUP2+'+'+(k3*b)+V('r')+SUP2,true)}${EQ}${frHTML(numV+V('r')+SUP2,denV+V('r')+SUP2,true)}${EQ}<b>${num(new F(numV,denV))}</b>`];
    return{html,ans:join(s)};
  });
}
function genChainRatioValue(){ // x:y:z=2:5:7 → (x+3y−z):(3x−y+z) 比值
  return retry(()=>{
    let a,b,c;do{a=ri(1,9);b=ri(1,9);c=ri(1,9)}while(gcd(gcd(a,b),c)>1||a===b||b===c);
    let p,q,t,u,w,z,m,n;do{p=nz(-3,3);q=nz(-3,3);t=nz(-3,3);u=nz(-3,3);w=nz(-3,3);z=nz(-3,3);m=p*a+q*b+t*c;n=u*a+w*b+z*c}while(m===0||n===0);
    const e=(cs)=>'('+cs.map(([co,v],i)=>(i?`<span class="op">${co<0?MINUS:'+'}</span>`:(co<0?MINUS:''))+(Math.abs(co)===1?'':Math.abs(co))+v).join('')+')';
    const E1=e([[p,X],[q,Y],[t,Zv]]),E2=e([[u,X],[w,Y],[z,Zv]]);
    const html=`若 ${ratio(X,Y,Zv)}${EQ}${ratio(a,b,c)}，則 ${ratio(E1,E2)} 的比值${EQ}？`;
    const s=[`令 ${X}${EQ}${a}${V('r')}、${Y}${EQ}${b}${V('r')}、${Zv}${EQ}${c}${V('r')}`,`${ratio(E1,E2)}${EQ}${ratio(num(m)+V('r'),num(n)+V('r'))}${EQ}${ratio(num(m),num(n))}，比值為 <b>${num(new F(m,n))}</b>`];
    return{html,ans:join(s)};
  });
}
function genMixed(){
  const g=pick([genRatioValue,genComplex,genPropX,genPropValue,genEqValue,genRatioEq,genChain,genChainProp,genChainApp,genChainValue,genExprValue,genChainRatioValue]);
  return g();
}

const UNITS=[

  {id:'pv',name:'比例式求比值',n:4,cols:2,inst:'求下列各比的比值：',gen:genPropValue},
  {id:'ev',name:'方程式求比值',n:2,cols:1,inst:'求下列各比的比值：',gen:genEqValue},
  {id:'re',name:'比例式與方程式求值',n:4,cols:2,inst:'依題意求值：',gen:genRatioEq},
  {id:'ch',name:'連比',n:4,cols:2,inst:'求下列各連比：',gen:genChain},
  {id:'cp',name:'連比例式求 x、y',n:4,cols:2,inst:'求下列各連比例式中 x、y 的值：',gen:genChainProp},

  {id:'mx',name:'綜合練習',n:0,cols:2,inst:'綜合練習：',gen:genMixed},
];

function build(counts,opt){
  CFG={lvl:opt.lvl,types:opt.types.length?opt.types:['int']};
  const parts=[];let no=0;const zh='一二三四五六七八九十十一';let si=0;
  for(const u of UNITS){
    const n=counts[u.id]||0;if(!n)continue;
    const cols=opt.perRow==='auto'?u.cols:+opt.perRow;
    const qs=[];for(let i=0;i<n;i++){const q=u.gen();q.no=++no;qs.push(q);if(typeof globalThis!=='undefined'&&globalThis.__qs)globalThis.__qs.push(q)}
    parts.push(`<div class="sec">${zh[si++]}、${u.inst}</div><div class="grid" style="grid-template-columns:repeat(${cols},1fr)">`+
      qs.map(q=>`<div class="q"><div class="qt"><span class="no">(${q.no})</span><span class="ex">${q.html}</span></div><div class="work" style="height:${opt.work}mm"></div><div class="ans">${q.ans}</div></div>`).join('')+'</div>');
  }
  return parts;
}
