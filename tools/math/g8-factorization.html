  <header class="top"><div class="brand"><div class="logo">ab</div><div><h1>因式分解考卷產生器</h1><p>百宏文教・數學計算力練習</p></div></div><div class="total" id="total">共 25 題</div></header>
  <section class="control-area"><div class="controls"><div class="upper">
    <section class="panel"><h2>版面設定</h2><div class="fields"><div class="field" style="flex:1 1 250px"><label for="title">考卷標題</label><input class="title-input" id="title" value="因式分解 計算力練習" maxlength="32"></div><div class="field"><label for="version">版本</label><select id="version"><option value="student">學用版</option><option value="teacher">教用版（含解答）</option></select></div><div class="field"><label for="columns">每列</label><select id="columns"><option value="2">2 題</option><option value="3" selected>3 題</option><option value="4">4 題</option></select></div><div class="field"><label for="space">作答空間</label><select id="space"><option value="compact">精簡</option><option value="standard" selected>標準</option><option value="wide">寬裕</option></select></div></div></section>
    <section class="panel"><h2>難度與數字類型</h2><div class="fields" style="align-items:flex-start"><div class="levels" role="group" aria-label="難度"><button class="level" data-level="foundation" aria-pressed="false">基礎</button><button class="level" data-level="standard" aria-pressed="true">進階</button><button class="level" data-level="challenge" aria-pressed="false">挑戰</button><button class="level" data-level="mixed" aria-pressed="false">綜合</button></div><div class="number-types" aria-label="數字類型"><label class="number-choice"><input type="checkbox" data-number="integer" checked>整數</label><label class="number-choice"><input type="checkbox" data-number="fraction">分數</label><label class="number-choice"><input type="checkbox" data-number="decimal">小數</label></div></div><p class="note" id="levelNote"></p></section>
  </div><section class="panel types"><div class="types-head"><h2>題型與題數</h2><span>難度會套用建議組合，也可自行勾選並修改各類題數</span></div><div class="type-grid" id="typeGrid"></div><div class="actions"><span class="status" id="status">設定完成後按「重新出題」。</span><button class="action generate" id="generate">重新出題</button><button class="action print" id="print">列印／存 PDF</button></div></section></div></section>

  <script>
