  <script>
  (()=>{"use strict";
    const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    const pow=(b,e)=>`${b}<sup>${e}</sup>`,ppow=(b,e)=>`(${b})<sup>${e}</sup>`,frac=(n,d)=>`<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`,bp=(b,e)=>BigInt(b)**BigInt(e),fmt=v=>BigInt(v).toLocaleString("en-US");
    const defs=[
      ["power","指數記法與求值",3],["sameBase","同底數乘除",4],["sameExp","同指數乘除",3],["powerPower","乘方的乘方",2],["zero","零次方",2],["mixedOps","混合運算",3],
      ["convert","底數轉換",3],["unknown","未知指數",2],["compare","指數大小比較",2],["negative","負數與分數比較",2],["smart","巧算與綜合應用",2],["sum","乘方的加減",2]
    ];
    const presets={
      foundation:{power:4,sameBase:4,sameExp:3,powerPower:2,zero:3},
      standard:{power:2,sameBase:3,sameExp:2,powerPower:2,zero:1,mixedOps:3,convert:3,unknown:2,sum:2},
      challenge:{mixedOps:4,convert:3,unknown:3,compare:3,negative:3,smart:3,sum:1},
      mixed:{power:2,sameBase:2,sameExp:2,powerPower:2,zero:1,mixedOps:3,convert:2,unknown:2,compare:2,negative:2,smart:2,sum:2}
    };
    const levelName={foundation:"基礎",standard:"進階",challenge:"挑戰",mixed:"綜合"};
    const notes={foundation:"基礎：指數記法、五條基本規則與零次方；數字較小、步驟單純。",standard:"進階：加入底數轉換、兩步驟運算與簡單未知指數。",challenge:"挑戰：提高指數，加入三步驟運算、大小比較、負分數與巧算。",mixed:"綜合：基本規則到應用題平均取題，適合單元複習或測驗。"};
    const state={level:"standard",questions:[]};
    function q(type,html,answer,long=false){return{type,html,answer:String(answer),long}}
    const gen={
      power(l){const hard=l==="challenge"||l==="mixed";if(Math.random()<.28){let b=rand(2,hard?6:4),e=rand(2,hard?6:4),v=(e%2?-1n:1n)*bp(b,e);return q("指數求值",ppow(`−${b}`,e),v)}let b=rand(2,hard?12:8),e=rand(2,hard?5:4);return q("指數求值",pow(b,e),bp(b,e))},
      sameBase(l){let b=rand(2,l==="foundation"?5:8),m=rand(3,l==="challenge"?12:7),n=rand(2,Math.min(m-1,l==="challenge"?8:5));return Math.random()<.5?q("同底數相乘",`${pow(b,m)} × ${pow(b,n)}`,bp(b,m+n)):q("同底數相除",`${pow(b,m)} ÷ ${pow(b,n)}`,bp(b,m-n))},
      sameExp(l){let e=rand(2,l==="challenge"?6:4);if(Math.random()<.52){let[a,b]=pick([[2,5],[2,3],[3,4],[4,5]]);return q("同指數相乘",`${pow(a,e)} × ${pow(b,e)}`,bp(a*b,e))}let[a,b]=pick([[12,4],[18,6],[15,5],[21,7]]);return q("同指數相除",`${pow(a,e)} ÷ ${pow(b,e)}`,bp(a/b,e))},
      powerPower(l){let b=rand(2,5),m=rand(2,l==="challenge"?5:3),n=rand(2,4);return q("乘方的乘方",`(${pow(b,m)})<sup>${n}</sup>`,bp(b,m*n))},
      zero(){if(Math.random()<.5){let a=rand(2,9),b=rand(10,20),c=rand(21,40);return q("零次方",`${pow(a,0)} + ${pow(b,0)} + ${pow(c,0)}`,3)}let b=rand(2,30);return q("零次方",pow(b,0),1)},
      mixedOps(l){if(l==="challenge"||(l==="mixed"&&Math.random()<.5)){let a=rand(5,8),b=rand(2,4),c=rand(1,2),e=a+2*b-3*c;return q("混合運算",`${pow(3,a)} × ${pow(9,b)} ÷ ${pow(27,c)}`,bp(3,e))}let n=rand(3,5),k=rand(1,2);return q("混合運算",`${pow(2,n)} × ${pow(5,n)} ÷ ${pow(10,k)}`,bp(10,n-k))},
      convert(l){let m=rand(2,l==="challenge"?6:4),n=rand(2,4);return q("底數轉換",`${pow(4,m)} × ${pow(8,n)} = ${pow(2,"□")}，求 □`,2*m+3*n,true)},
      unknown(l){if(l==="challenge"||l==="mixed"){let a=pick([2,4]),b=rand(2,4),c=rand(2,4),sq=a+2*b+3*c;if(sq%2===0)return q("未知指數",`${pow(10,a)} × ${pow(100,b)} × ${pow(1000,c)} = ${pow(10,"□")} = ${pow(100,"△")}，求 □＋△`,sq+sq/2,true)}return q("未知指數",`${pow(3,27)} ÷ ${pow(3,15)} = ${pow(9,"□")} = ${pow(27,"△")}，求 □＋△`,10,true)},
      compare(l){if(l==="challenge"||l==="mixed"){let set=pick([0,1]);if(set===0)return q("大小比較",`由大到小排列：${pow(3,50)}、${pow(9,24)}、${pow(27,16)}`,`${pow(3,50)} ＞ ${pow(9,24)} = ${pow(27,16)}`,true);return q("大小比較",`由大到小排列：${pow(2,22)}、${pow(4,10)}、${pow(8,7)}`,`${pow(2,22)} ＞ ${pow(8,7)} ＞ ${pow(4,10)}`,true)}return q("大小比較",`由大到小排列：${pow(10,8)}、${pow(4,8)}、${pow(2,24)}`,`${pow(10,8)} ＞ ${pow(2,24)} ＞ ${pow(4,8)}`,true)},
      negative(l){let n=rand(3,7),d=n+rand(1,3);while(((a,b)=>{while(b){[a,b]=[b,a%b]}return a})(n,d)>1){n=rand(3,7);d=n+rand(1,3)}let es=l==="challenge"?[2,3,4,5]:[2,3,4],items=es.map(e=>({h:ppow(`−${frac(n,d)}`,e),e})),ev=items.filter(x=>x.e%2===0).sort((a,b)=>a.e-b.e),od=items.filter(x=>x.e%2).sort((a,b)=>b.e-a.e);return q("負分數比較",`由大到小排列：${items.map(x=>x.h).join("、")}`,[...ev,...od].map(x=>x.h).join(" ＞ "),true)},
      smart(l){if(l==="challenge"&&Math.random()<.5)return q("提公因數巧算","12345<sup>2</sup> − 12345 × 2345",fmt(12345n*10000n));let x=pick([101,123,205,314]),y=x-100;return q("提公因數巧算",`${x}<sup>2</sup> − ${x} × ${y}`,fmt(BigInt(x)*100n))},
      sum(l){if(l==="challenge"||l==="mixed"){let s=rand(3,5),v=bp(2,s)+bp(2,s+1)+bp(2,s+2)+bp(2,s+3);return q("乘方的加法",[0,1,2,3].map(i=>pow(2,s+i)).join(" + "),v,true)}let b=rand(2,4),e=rand(2,4),c=rand(2,4);return q("乘方的加法",Array(c).fill(pow(b,e)).join(" + "),BigInt(c)*bp(b,e))}
    };
    function buildControls(){const g=$("typeGrid");defs.forEach(([id,label,count])=>{let el=document.createElement("label");el.className="type";el.innerHTML=`<input class="type-check" type="checkbox" data-check="${id}"><span class="type-name">${label}</span><input class="count" type="number" min="1" max="20" value="${count}" data-count="${id}" aria-label="${label}題數">`;g.appendChild(el)});g.querySelectorAll("[data-check]").forEach(c=>c.addEventListener("change",()=>{g.querySelector(`[data-count='${c.dataset.check}']`).disabled=!c.checked;updateTotal()}));g.querySelectorAll("[data-count]").forEach(i=>i.addEventListener("input",updateTotal))}
    function selected(){return defs.flatMap(([id,label])=>{let c=document.querySelector(`[data-check='${id}']`),n=document.querySelector(`[data-count='${id}']`);if(!c.checked)return[];let count=Math.max(1,Math.min(20,Number(n.value)||1));n.value=count;return[{id,label,count}]})}
    function updateTotal(){let n=selected().reduce((s,x)=>s+x.count,0);$("total").textContent=`共 ${n} 題`}
    function preset(l){state.level=l;let p=presets[l];defs.forEach(([id,,d])=>{let c=document.querySelector(`[data-check='${id}']`),n=document.querySelector(`[data-count='${id}']`),v=p[id];c.checked=!!v;n.disabled=!v;n.value=v||d});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===l)));$("levelNote").textContent=notes[l];updateTotal();generate()}
    function generate(){let s=selected();if(!s.length){state.questions=[];render();$("status").textContent="請至少勾選一種題型。";return}state.questions=[];s.forEach(t=>{for(let i=0;i<t.count;i++)state.questions.push(gen[t.id](state.level))});render();$("status").textContent=`已產生 ${state.questions.length} 題，共 ${document.querySelectorAll(".paper").length} 頁 A4。`}
    function perPage(){let cols=Number($("columns").value),space=$("space").value;return{1:{compact:9,standard:6,wide:4},2:{compact:18,standard:12,wide:8}}[cols][space]}
    function esc(v){return v.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
    function render(){let stack=$("stack");stack.innerHTML="";if(!state.questions.length){stack.innerHTML='<div class="empty"><b>尚未選擇題型</b>勾選至少一種題型後，再按「重新出題」。</div>';return}let size=perPage(),pages=[];for(let i=0;i<state.questions.length;i+=size)pages.push(state.questions.slice(i,i+size));pages.forEach((qs,pi)=>{let paper=document.createElement("section"),space=$("space").value,cols=$("columns").value,teacher=$("version").value==="teacher",start=pi*size;paper.className=`paper ${space}`;paper.style.setProperty("--cols",cols);paper.innerHTML=`<header class="paper-header"><div class="kicker">百宏文教・數學計算力</div><div class="title-row"><h2 class="paper-title">${esc($("title").value.trim()||"指數律 計算力練習")}</h2><span class="badge">${levelName[state.level]}・${teacher?"含答案版":"學生版"}</span></div><div class="student"><div class="blank">班級：<i></i></div><div class="blank">姓名：<i></i></div><div class="blank">日期：<i></i></div><div class="blank">作答時間：<i></i></div></div></header><div class="instruction"><span><b>計算下列各題：</b>請寫出必要的運算過程。</span><span>本頁 ${qs.length} 題</span></div><div class="questions"></div><footer class="footer"><span>指數律・${levelName[state.level]}練習</span><span>第 ${pi+1}／${pages.length} 頁</span></footer>`;let grid=paper.querySelector(".questions");qs.forEach((x,i)=>{let item=document.createElement("article");item.className=`question${x.long?" long":""}`;item.innerHTML=`<div class="qtop"><span class="qno">(${start+i+1})</span><span class="math">${x.html}</span></div><div class="work">原式＝</div>${teacher?`<div class="answer">答案：${x.answer}</div>`:""}`;grid.appendChild(item)});stack.appendChild(paper)});fit()}
    function fit(){if(matchMedia("print").matches)return;let scale=Math.min(1,Math.max(.4,(innerWidth-24)/794));document.querySelectorAll(".paper").forEach(p=>p.style.zoom=scale)}
    function rerender(){render();$("status").textContent="版面已更新，題目內容未重新抽換。"}
    buildControls();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>preset(b.dataset.level)));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.questions.length&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",rerender));$("title").addEventListener("input",rerender);addEventListener("resize",fit);addEventListener("beforeprint",()=>document.querySelectorAll(".paper").forEach(p=>p.style.zoom=1));addEventListener("afterprint",fit);preset("standard");
  })();
  </script>
