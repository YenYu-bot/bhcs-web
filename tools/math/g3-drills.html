(()=>{"use strict";
const TOPICS=[["timestables","九九乘法與乘除心算"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"timestables",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}

function timestablesConfig(){
 /* M8 九九乘法與乘除心算（2026-09-26，Claude）。速度練習：預設每列 5 題、作答空間小、一頁 50～100 題，卷首用「用時／答對」。
    控制面板多一組「指定乘數」（2～9）讓老師只練不熟的段；ctx.tables 是勾選的段（預設全部）。只有整數。
    sig 規則放寬：同一份卷相同算式最多出現 2 次（CFG.sigRepeat＝2），因為老師只勾一、兩段時 81 種組合不夠一頁 50 題；
    本機與 CI 健檢仍用 Set（不重複）計算，所以各單元在全段勾選時仍保證 40 題不重複。 */
 const unit=(id,name,tip,gen)=>({id,name,tip,modes:["integer"],gen});
 const lv=ctx=>ctx.level==="challenge"?2:ctx.level==="advanced"?1:0;
 const tables=ctx=>{const sel=(ctx.tables&&ctx.tables.length?ctx.tables:[2,3,4,5,6,7,8,9]).filter(t=>t>=2&&t<=9);if(lv(ctx)===0){const small=sel.filter(t=>t<=5);return small.length?small:sel}return sel};
 const addUp=(a,n)=>{let s=0;for(let i=0;i<n;i++)s+=a;return s}; // verify 用連加，不用乘法
 const blank="□";
 // ① 九九乘法
 const mult=unit("tables","九九乘法","背熟九九乘法表；兩個數也可能交換位置出現。",ctx=>{
  const a=pick(tables(ctx)),b=rand(1,9),swap=Math.random()<(lv(ctx)===2?.5:.3),[x,y]=swap?[b,a]:[a,b],p=x*y;
  return{expr:`${x} × ${y}＝`,answer:String(p),sig:`m:${x}:${y}`,verify:()=>addUp(x,y)===p&&addUp(y,x)===p};
 });
 mult.maxCount=40; // 基礎級只有 2～5 段；嚴格去重的單卷以 40 題為上限。
 // ② 乘法填空
 const fill=unit("fill","乘法填空","想「幾乘以幾會等於這個數」；空格也可能出現在前面。",ctx=>{
  const a=pick(tables(ctx)),b=rand(1,9),p=a*b,front=Math.random()<(lv(ctx)>=1?.5:.3);
  if(lv(ctx)===2&&Math.random()<.3){return{expr:`${p}＝${front?blank:a} × ${front?a:blank}`,answer:String(b),sig:`fe:${a}:${b}:${front}`,verify:()=>addUp(a,b)===p}}
  return{expr:front?`${blank} × ${a}＝${p}`:`${a} × ${blank}＝${p}`,answer:String(b),sig:`f:${a}:${b}:${front}`,verify:()=>addUp(a,b)===p&&p%a===0&&p/a===b};
 });
 // ③ 除法（整除）
 const divide=unit("div","除法（九九範圍）","除法是乘法的反向：想「幾乘以除數等於被除數」。",ctx=>{
  const a=pick(tables(ctx)),b=rand(1,9),p=a*b;
  if(lv(ctx)===2&&Math.random()<.4){const byA=Math.random()<.5;return{expr:byA?`${p} ÷ ${blank}＝${b}`:`${blank} ÷ ${a}＝${b}`,answer:String(byA?a:p),sig:`dm:${a}:${b}:${byA}`,verify:()=>addUp(a,b)===p}}
  const byB=Math.random()<(lv(ctx)>=1?.5:.3),d=byB?b:a,q=byB?a:b;if(d===1)return null;
  return{expr:`${p} ÷ ${d}＝`,answer:String(q),sig:`d:${p}:${d}`,verify:()=>addUp(d,q)===p&&p%d===0};
 });
 divide.maxCount=40; // 基礎級嚴格去重時 60 題會耗盡。
 // ④ 有餘數的除法
 const remainder=unit("rem","有餘數的除法","商是「不超過被除數的最大倍數」，餘數一定比除數小。",ctx=>{
  const d=pick(tables(ctx)),qMax=lv(ctx)===2?Math.floor(99/d):9,q=rand(1,qMax),r=rand(1,d-1),a=d*q+r;if(a>99)return null;
  return{expr:`${a} ÷ ${d}＝`,answer:`${q} … ${r}`,sig:`r:${a}:${d}`,verify:()=>addUp(d,q)+r===a&&r<d&&r>0&&addUp(d,q+1)>a};
 });
 // ⑤ 乘除混合連算
 const mixed=unit("mixed","乘除混合連算","由左往右依序算，先算出前面的結果再算後面。",ctx=>{
  const T=tables(ctx),L=lv(ctx);
  if(L===0||Math.random()<.5){const a=pick(T),b=rand(2,9),c=L===0?pick([a,b].filter(v=>v>1)):pick(T),p=a*b;if(p%c)return null;const v=p/c;if(L===2&&v>99)return null;
   return{expr:`${a} × ${b} ÷ ${c}＝`,answer:String(v),sig:`x:${a}:${b}:${c}`,verify:()=>addUp(c,v)===addUp(a,b)}}
  const d=pick(T),q=rand(2,9),a=d*q,c=L===2?rand(2,12):pick(T),v=q*c;if(v>99&&L<2)return null;
  return{expr:`${a} ÷ ${d} × ${c}＝`,answer:String(v),sig:`y:${a}:${d}:${c}`,verify:()=>addUp(d,q)===a&&addUp(c,q)===v};
 });
 // ⑥ 二位數×一位數心算
 const twoDigit=unit("twodigit","二位數 × 一位數心算","把二位數拆成「幾十」和「幾」分別乘，再相加。",ctx=>{
  const L=lv(ctx),b=pick(tables(ctx));let a;for(let t=0;t<40;t++){a=rand(11,99);const ones=a%10,tens=Math.floor(a/10);if(L===0&&(ones*b>=10||tens*b>=10||ones===0))continue;if(L===1&&(ones*b<10||ones===0))continue;if(L===2&&(ones*b<10||tens*b<10))continue;break}
  const p=a*b;return{expr:`${a} × ${b}＝`,answer:String(p),sig:`t:${a}:${b}`,verify:()=>Math.floor(a/10)*10*b+(a%10)*b===p&&addUp(a,b)===p};
 });
 return{title:"九九乘法與乘除心算",symbol:"×",subtitle:"九九乘法・乘法填空・整除與有餘數的除法・乘除連算・二位數×一位數",instruction:"計時作答，直接把答案寫在等號後面；做完記下用時和答對題數。",modes:["integer"],mixed:false,answerLabel:"",header:"用時：___分___秒　答對：___題",sigRepeat:2,
  extraControl:{id:"tables",label:"指定乘數",options:[2,3,4,5,6,7,8,9]},
  levels:{basic:"基礎：2～5 段（未指定乘數時）、整除、無進位的二位數乘法。",advanced:"進階：2～9 段、空格在前的填空、有餘數除法、有進位的二位數乘法。",challenge:"挑戰：交換順序、反求除數或被除數、商為二位數的有餘數除法、連算與大數心算。"},
  units:[mult,fill,divide,remainder,mixed,twoDigit],
  presets:{basic:{tables:30,fill:10,div:10,rem:5,twodigit:5},advanced:{tables:20,fill:10,div:10,rem:10,mixed:5,twodigit:10},challenge:{tables:15,fill:10,div:10,rem:10,mixed:10,twodigit:15}}};
}

const CONFIGS={timestables:timestablesConfig},CFG=CONFIGS[TOPIC_KEY]();
let state={level:"advanced",groups:[],paper:null,mixed:true};
/* sig 規則放寬：seen 傳入 Map 時，同一 sig 最多可出現 CFG.sigRepeat 次（速度練習頁題量大、組合有限）；傳入 Set 時維持嚴格不重複（健檢工具用）。 */
function safeQuestion(unit,ctx,seen){const limit=seen instanceof Map?(CFG.sigRepeat||1):1;for(let i=0;i<50;i++){try{const q=unit.gen(ctx);if(!okResult(q))continue;const key=norm(q.sig||q.expr);const c=seen instanceof Map?(seen.get(key)||0):(seen.has(key)?1:0);if(c>=limit)continue;if(seen instanceof Map)seen.set(key,c+1);else seen.add(key);return q}catch(e){if(i===49)console.warn("出題失敗",unit.id,e)}}console.warn("超過50次仍無法產生不重複且可驗證的題目",unit.id);return null}
globalThis.__BHCS_TEST__={CFG,R,add,sub,mul,div,eq,safeQuestion,okResult};
if(typeof document==="undefined")return;
function build(){const sel=$("topicSel");TOPICS.forEach(([k,n])=>{const o=document.createElement("option");o.value=k;o.textContent=n;if(k===TOPIC_KEY)o.selected=true;sel.appendChild(o)});sel.addEventListener("change",()=>{location.search="?topic="+sel.value});$("topicTitle").textContent=CFG.title;$("topicLogo").textContent=CFG.symbol||"∑";document.title="百宏文教｜"+CFG.title+" 出題器";const can=document.querySelector('link[rel="canonical"]');if(can)can.href="https://www.bhcs.com.tw/tools/math/g3-drills.html?topic="+TOPIC_KEY;$("subtitle").textContent=CFG.subtitle;$("difficultyNote").textContent=CFG.levels.advanced;const mb=$("modeBoxes");CFG.modes.forEach(m=>{const label=document.createElement("label");label.className="choice";label.innerHTML=`<input type="checkbox" data-mode="${m}" checked>${(CFG.modeLabels||MODE_LABEL)[m]}`;mb.appendChild(label)});if(CFG.extraControl){const eb=$("extraBoxes"),t=document.createElement("span");t.className="field";t.textContent=CFG.extraControl.label;eb.appendChild(t);CFG.extraControl.options.forEach(v=>{const label=document.createElement("label");label.className="choice";label.innerHTML=`<input type="checkbox" data-${CFG.extraControl.id.replace(/s$/,"")}="${v}" checked>${v}`;eb.appendChild(label)})}if(CFG.mixed){const label=document.createElement("label");label.className="choice";label.innerHTML='<input id="mixedNumber" type="checkbox" checked>可用帶分數';mb.appendChild(label)}const grid=$("unitGrid");CFG.units.forEach(u=>{const box=document.createElement("div");box.className="unit";box.innerHTML=`<input class="unit-check" id="unit-${u.id}" type="checkbox" data-unit="${u.id}"><label for="unit-${u.id}">${u.name}</label><input class="count" type="number" min="1" max="${u.maxCount||60}" value="1" data-count="${u.id}" aria-label="${u.name}題數">`;grid.appendChild(box)});grid.addEventListener("change",e=>{if(e.target.matches(".unit-check"))grid.querySelector(`[data-count='${e.target.dataset.unit}']`).disabled=!e.target.checked;markChanged();updateTotal()});grid.addEventListener("input",e=>{if(e.target.matches(".count")){e.target.value=Math.max(1,Math.min(Number(e.target.max),Number(e.target.value)||1));markChanged();updateTotal()}});applyPreset("advanced")}
const selectedModes=()=>[...document.querySelectorAll("[data-mode]:checked")].map(x=>x.dataset.mode),selectedUnits=()=>CFG.units.flatMap(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);return c.checked?[{...u,count:Math.max(1,Math.min(Number(n.max),Number(n.value)||1))}]:[]});
function applyPreset(level){state.level=level;const p=CFG.presets[level];CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`),v=p[u.id]||0;c.checked=v>0;n.disabled=!c.checked;n.value=v||1});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("difficultyNote").textContent=CFG.levels[level];updateTotal();markChanged()}
function setEach(v){CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);c.checked=v>0;n.disabled=!c.checked;if(v)n.value=Math.min(v,Number(n.max))});updateTotal();markChanged()}
function updateTotal(){$("total").textContent=`共 ${selectedUnits().reduce((s,u)=>s+u.count,0)} 題`}function markChanged(){$("status").textContent="設定已變更，按「重新出題」套用。"}
function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Map,skipped=[],tables=[...document.querySelectorAll("[data-table]:checked")].map(x=>Number(x.dataset.table));state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed,tables},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}。`}
function render(){const out=$("output");out.innerHTML="";if(!state.paper||!state.groups.length){out.innerHTML='<div class="empty"><b>尚未產生練習卷</b>請選擇數型與單元後按「重新出題」。</div>';return}const teacher=$("version").value==="teacher",cols=$("columns").value,work={small:"10mm",medium:"16mm",large:"26mm"}[$("space").value],sheet=document.createElement("div");sheet.className=`sheet ${teacher?"teacher":"student"}`;sheet.style.setProperty("--work",work);sheet.innerHTML=`<div class="head"><div class="bhcs-brand"><b>百宏文教機構</b><span>數學計算力練習 · 徹底反覆計算系列</span><i>www.bhcs.com.tw</i></div><h2>${CFG.title} 計算力練習（${{basic:"基礎",advanced:"進階",challenge:"挑戰"}[state.paper.level]}）</h2><span>班級：______　姓名：__________　日期：___／___　${CFG.header||"作答時間：___分___秒"}</span></div><p class="tip">${CFG.instruction}</p>`;let no=1;state.groups.forEach(g=>{const sec=document.createElement("section");sec.innerHTML=`<div class="sec">${g.unit.name}</div><p class="tip">${g.unit.tip}</p><div class="grid c${cols}"></div>`;const grid=sec.querySelector(".grid");g.questions.forEach(q=>{const item=document.createElement("div");item.className="prob";item.innerHTML=`<div class="q"><span class="no">(${no++})</span><span class="expr">${q.expr}</span></div><div class="work">${CFG.answerLabel??"原式＝"}<span class="ans">${q.answer}</span></div>`;grid.appendChild(item)});sheet.appendChild(sec)});out.appendChild(sheet);fit()}
function fit(){if(matchMedia("print").matches)return;const sheet=document.querySelector(".sheet");if(sheet)sheet.style.zoom=Math.min(1,Math.max(.42,(innerWidth-16)/794))}
build();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>applyPreset(b.dataset.level)));document.querySelectorAll("[data-mode],[data-table],#mixedNumber").forEach(c=>c.addEventListener("change",markChanged));document.querySelectorAll("[data-each]").forEach(b=>b.addEventListener("click",()=>setEach(Number(b.dataset.each))));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.paper&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",render));addEventListener("resize",fit);addEventListener("beforeprint",()=>{const s=document.querySelector(".sheet");if(s)s.style.zoom=1});addEventListener("afterprint",fit);generate();
})();
