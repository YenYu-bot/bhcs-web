<script>
(()=>{"use strict";
const TOPICS=[["arithmetic","分數與小數四則運算"],["simplify","四則簡化計算"],["unknown","解未知數"],["time","時間的計算與化聚"],["gcd","最大公因數與最小公倍數"],["ratio","比、比例式與百分率"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"arithmetic",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

function numberFor(mode,level,max=30){if(mode==="integer"){const k=level==="basic"?2:level==="advanced"?10:25;return R(rand(level==="basic"?2:Math.max(2,Math.floor(max*k/5)),max*k))}if(mode==="fraction"){const ds=level==="basic"?[2,3,4,5,6]:[2,3,4,5,6,8,9,10,12,15,20],d=pick(ds);let n=rand(1,(level==="challenge"?3:2)*d-1);while(n%d===0)n=rand(1,3*d-1);return R(n,d)}const p=level==="basic"?1:pick(level==="advanced"?[1,2]:[1,2,3]),s=10**p;let n=rand(1,max*s);while(n%10===0)n=rand(1,max*s);return R(n,s)}

const MODE_LABEL={integer:"整數",fraction:"分數",decimal:"小數"};

function arithmeticConfig(){
 const mk=(id,op)=>({id,name:{add:"加法",sub:"減法",mul:"乘法",div:"除法"}[id],tip:{add:"分數先通分；小數相加時小數點要對齊。",sub:"分數先通分；小數相減時小數點要對齊。",mul:"分數可先約分；小數積的小數位數要相加。",div:"分數除法改乘倒數；小數除數先化為整數。"}[id],modes:["integer","fraction","decimal"],gen(ctx){const mode=pick(ctx.modes),count=ctx.level==="challenge"?3:2;let vals=Array.from({length:count},()=>numberFor(mode,ctx.level,10)),value;if(op==="−"){const target=numberFor(mode,ctx.level,8),rest=vals.slice(1);vals[0]=rest.reduce(add,target);value=vals.reduce(sub)}else if(op==="÷"){const target=numberFor(mode,ctx.level,6),rest=vals.slice(1);vals[0]=rest.reduce(mul,target);value=vals.reduce(div)}else value=vals.slice(1).reduce((a,b)=>op==="+"?add(a,b):mul(a,b),vals[0]);if(mode==="integer"&&value.d!==1)return null;if(mode==="decimal"&&(places(value)<0||places(value)>5))return null;const expr=vals.map(v=>numHTML(v,mode,{mixed:ctx.mixed})).join(` ${op} `)+"＝？";return{expr,answer:numHTML(value,mode,{mixed:ctx.mixed,answer:true}),sig:`${id}:${mode}:${vals.map(plain).join(op)}`,verify:()=>op==="+"?eq(vals.slice(1).reduce(add,vals[0]),value):op==="−"?eq(vals.slice(1).reduce(sub,vals[0]),value):op==="×"?eq(vals.slice(1).reduce(mul,vals[0]),value):eq(vals.slice(1).reduce(div,vals[0]),value)}}});
 const chain=(id,name,tip,ops)=>({id,name,tip,modes:["integer","fraction","decimal"],gen(ctx){const mode=pick(ctx.modes);let vals;if(id==="muldiv"&&mode==="integer"){const divisor=rand(2,15),k=rand(1,30),middle=rand(2,20);vals=[R(divisor*k),R(middle),R(divisor)]}else if(id==="muldiv"&&mode==="decimal"){const a=numberFor("decimal",ctx.level,20),factor=pick([R(1,2),R(1,4),R(1,5)]),divisor=pick([R(1,2),R(1,4),R(1,5)]);vals=[a,factor,divisor]}else vals=Array.from({length:ops.length+1},()=>numberFor(mode,ctx.level,8));let value=vals[0];for(let i=0;i<ops.length;i++){if(ops[i]==="÷"&&!vals[i+1].n)return null;value=ops[i]==="+"?add(value,vals[i+1]):ops[i]==="−"?sub(value,vals[i+1]):ops[i]==="×"?mul(value,vals[i+1]):div(value,vals[i+1])}if(value.n<0||(mode==="integer"&&value.d!==1)||(mode==="decimal"&&(places(value)<0||places(value)>5)))return null;return{expr:vals.map((v,i)=>(i?` ${ops[i-1]} `:"")+numHTML(v,mode,{mixed:ctx.mixed})).join("")+"＝？",answer:numHTML(value,mode,{mixed:ctx.mixed,answer:true}),sig:`${id}:${mode}:${vals.map(plain).join("|")}`,verify:()=>{let z=vals[0];for(let i=0;i<ops.length;i++)z=ops[i]==="+"?add(z,vals[i+1]):ops[i]==="−"?sub(z,vals[i+1]):ops[i]==="×"?mul(z,vals[i+1]):div(z,vals[i+1]);return eq(z,value)}}}});
 return{title:"分數與小數四則運算",symbol:"½",subtitle:"分數加減乘除・小數四則・混合運算・互換",instruction:"計算下列各題，把過程寫在「原式＝」後面。",modes:["integer","fraction","decimal"],mixed:true,levels:{basic:"基礎：正數兩項、數值較小，著重單一運算規則。",advanced:"進階：二至三項，加入異分母與不同小數位。",challenge:"挑戰：三至四項，含括號與跨數型四則。"},units:[mk("add","+"),mk("sub","−"),mk("mul","×"),mk("div","÷"),chain("muldiv","乘除連算","乘除同級，依照由左到右的順序計算。",["×","÷"]),chain("addsub","加減混合","加減同級，依照由左到右的順序計算。",["+","−"]),{id:"four",name:"四則混合",tip:"先括號，再乘除，最後加減。",modes:["integer","fraction","decimal"],gen(ctx){const mode=pick(ctx.modes),a=numberFor(mode,ctx.level,6),b=numberFor(mode,ctx.level,6),c=numberFor(mode,ctx.level,5),inside=add(a,b),value=mul(inside,c);if(mode==="integer"&&value.d!==1)return null;if(mode==="decimal"&&(places(value)<0||places(value)>5))return null;return{expr:`（${numHTML(a,mode)} ＋ ${numHTML(b,mode)}） × ${numHTML(c,mode)}＝？`,answer:numHTML(value,mode,{mixed:ctx.mixed,answer:true}),sig:`four:${mode}:${plain(a)}:${plain(b)}:${plain(c)}`,verify:()=>eq(mul(add(a,b),c),value)}}},{id:"convert",name:"分數小數互換",tip:"小數寫成分母10的倍數後約分；分數用除法。",modes:["fraction","decimal"],gen(ctx){const avail=ctx.modes.filter(x=>x!=="integer");if(!avail.length)return null;const d=pick([2,4,5,8,10,20,25,40,50,100]);let numerator=rand(1,2*d-1);while(numerator%d===0)numerator=rand(1,2*d-1);const v=R(numerator,d),toDecimal=avail.includes("decimal")&&(!avail.includes("fraction")||Math.random()<.5);return{expr:toDecimal?`將 ${fracHTML(v,{mixed:ctx.mixed})} 化成小數。`:`將 ${decHTML(v)} 化成最簡分數。`,answer:toDecimal?decHTML(v):fracHTML(v,{mixed:ctx.mixed,answer:true}),sig:`convert:${toDecimal?"d":"f"}:${plain(v)}`,verify:()=>places(v)>=0}}}],presets:{basic:{add:2,sub:2,mul:2,div:2,convert:1},advanced:{muldiv:3,addsub:3,four:3,convert:2},challenge:{muldiv:3,addsub:3,four:3,convert:2}}}

 const unit=(id,name,tip,kind)=>({id,name,tip,modes:["integer","fraction","decimal"],gen(ctx){const mode=pick(ctx.modes),a=numberFor(mode,ctx.level,9),b=numberFor(mode,ctx.level,9),c=numberFor(mode,ctx.level,8),d=numberFor(mode,ctx.level,6);let expr,v,verify;if(kind==="order"){v=add(a,mul(b,c));expr=`${numHTML(a,mode)} ＋ ${numHTML(b,mode)} × ${numHTML(c,mode)}＝？`;verify=()=>eq(add(a,mul(b,c)),v)}else if(kind==="add"){const base=mode==="integer"?R(10):R(1),first=mode==="integer"?R(rand(1,9)):mode==="fraction"?(()=>{const den=pick([2,3,4,5,6,8,10]);return R(rand(1,den-1),den)})():R(rand(1,9),10),pair=sub(base,first),v2=add(add(first,b),pair);v=v2;expr=`${numHTML(first,mode)} ＋ ${numHTML(b,mode)} ＋ ${numHTML(pair,mode)}＝？`;verify=()=>eq(add(add(first,b),pair),v)}else if(kind==="sub"){const total=add(add(a,b),c);v=sub(sub(total,a),b);expr=`${numHTML(total,mode)} − ${numHTML(a,mode)} − ${numHTML(b,mode)}＝？`;verify=()=>eq(sub(sub(total,a),b),v)}else if(kind==="bracket"){if(b.n*c.d<=c.n*b.d)return null;const first=add(a,b);v=sub(first,sub(b,c));expr=`${numHTML(first,mode)} −（${numHTML(b,mode)} − ${numHTML(c,mode)}）＝？`;verify=()=>eq(sub(first,sub(b,c)),v)}else if(kind==="muldiv"){const k=numberFor(mode,ctx.level,5),total=mul(mul(a,b),k);v=div(div(total,a),b);expr=`${numHTML(total,mode)} ÷ ${numHTML(a,mode)} ÷ ${numHTML(b,mode)}＝？`;verify=()=>eq(div(div(total,a),b),v)}else{v=add(mul(a,c),mul(b,c));expr=`${numHTML(a,mode)} × ${numHTML(c,mode)} ＋ ${numHTML(b,mode)} × ${numHTML(c,mode)}＝？`;verify=()=>eq(mul(add(a,b),c),v)}if(mode==="integer"&&v.d!==1)return null;if(mode==="decimal"&&(places(v)<0||places(v)>5))return null;return{expr,answer:numHTML(v,mode,{mixed:ctx.mixed,answer:true}),sig:`${id}:${mode}:${plain(a)}:${plain(b)}:${plain(c)}:${plain(d)}`,verify}}});

const primeFactors=n=>{const out={};for(let p=2;p*p<=n;p++)while(n%p===0){out[p]=(out[p]||0)+1;n/=p}if(n>1)out[n]=(out[n]||0)+1;return out},factorHTML=m=>Object.entries(m).map(([p,e])=>e===1?p:`${p}<sup>${e}</sup>`).join(" × "),factorValue=m=>Object.entries(m).reduce((v,[p,e])=>v*Number(p)**e,1),gcdMany=a=>a.reduce((x,y)=>gcd(x,y)),lcm2=(a,b)=>a/gcd(a,b)*b,lcmMany=a=>a.reduce(lcm2,1),bruteGcd=a=>{for(let d=Math.min(...a);d>=1;d--)if(a.every(x=>x%d===0))return d;return 1},bruteLcm=a=>{let n=Math.max(...a);while(!a.every(x=>n%x===0))n++;return n};
function gcdConfig(){
 const nums=(count,level)=>Array.from({length:count},()=>rand(level==="basic"?12:40,level==="challenge"?500:220));
 const unit=(id,name,tip,kind,count)=>({id,name,tip,modes:["integer"],gen(ctx){if(kind==="factor"){const n=rand(ctx.level==="basic"?12:60,ctx.level==="challenge"?900:350),m=primeFactors(n);if(Object.values(m).reduce((x,y)=>x+y,0)<2)return null;return{expr:`將 ${n} 做質因數分解。`,answer:`${n}＝${factorHTML(m)}`,sig:`pf:${n}`,verify:()=>factorValue(m)===n&&Object.keys(m).every(p=>Object.keys(primeFactors(+p)).length===1)}}const a=kind==="lcm"?Array.from({length:count},(_,i)=>rand(2,12)*(i+2)*rand(1,3)):(()=>{const g=ctx.level==="basic"?rand(2,12):ctx.level==="challenge"?rand(6,48):rand(3,24),cmax=ctx.level==="basic"?9:ctx.level==="challenge"?30:15;return Array.from({length:count},()=>g*rand(2,cmax))})();if(kind==="gcd"&&gcdMany(a)===1)return null;if(new Set(a).size<count)return null;if(kind==="gcd"){const v=gcdMany(a);return{expr:`求（${a.join("，")}）。`,answer:String(v),sig:`gcd:${[...a].sort((x,y)=>x-y).join(":")}`,verify:()=>bruteGcd(a)===v}}if(kind==="lcm"){const v=lcmMany(a);if(v>200000)return null;return{expr:`求［${a.join("，")}］。`,answer:String(v),sig:`lcm:${[...a].sort((x,y)=>x-y).join(":")}`,verify:()=>bruteLcm(a)===v}}const A=rand(20,120),B=rand(20,120),fa=primeFactors(A),fb=primeFactors(B),g=gcd(A,B),l=lcm2(A,B);return{expr:`A＝${factorHTML(fa)}，B＝${factorHTML(fb)}，求（A，B）與［A，B］。`,answer:`（A，B）＝${g}；［A，B］＝${l}`,sig:`fg:${Math.min(A,B)}:${Math.max(A,B)}`,verify:()=>factorValue(fa)===A&&factorValue(fb)===B&&g*l===A*B}}});

const CONFIGS={arithmetic:arithmeticConfig,estimation:estimationConfig,ratio:ratioConfig,time:timeConfig,unknown:unknownConfig,simplify:simplifyConfig,gcd:gcdConfig},CFG=CONFIGS[TOPIC_KEY]();
let state={level:"advanced",groups:[],paper:null,mixed:true};
function safeQuestion(unit,ctx,seen){for(let i=0;i<50;i++){try{const q=unit.gen(ctx);if(!okResult(q))continue;const key=norm(q.sig||q.expr);if(seen.has(key))continue;seen.add(key);return q}catch(e){if(i===49)console.warn("出題失敗",unit.id,e)}}console.warn("超過50次仍無法產生不重複且可驗證的題目",unit.id);return null}

const selectedModes=()=>[...document.querySelectorAll("[data-mode]:checked")].map(x=>x.dataset.mode),selectedUnits=()=>CFG.units.flatMap(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);return c.checked?[{...u,count:Math.max(1,Math.min(40,Number(n.value)||1))}]:[]});

function updateTotal(){$("total").textContent=`共 ${selectedUnits().reduce((s,u)=>s+u.count,0)} 題`}function markChanged(){$("status").textContent="設定已變更，按「重新出題」套用。"}
function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Set,skipped=[];state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}。`}
