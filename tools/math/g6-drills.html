<script>
(()=>{"use strict";
const TOPICS=[["arithmetic","分數與小數四則運算"],["simplify","四則簡化計算"],["unknown","解未知數"],["time","時間的計算與化聚"],["gcd","最大公因數與最小公倍數"],["ratio","比、比例式與百分率"],["units","單位換算"],["area","周長與面積"],["circle","圓周長與圓面積"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"arithmetic",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}
const numHTML=(a,mode,opt={})=>mode==="decimal"?decHTML(a):mode==="fraction"?fracHTML(a,opt):String(a.n).replace("-","−");
function numberFor(mode,level,max=30){if(mode==="integer"){const k=level==="basic"?2:level==="advanced"?10:25;return R(rand(level==="basic"?2:Math.max(2,Math.floor(max*k/5)),max*k))}if(mode==="fraction"){const ds=level==="basic"?[2,3,4,5,6]:[2,3,4,5,6,8,9,10,12,15,20],d=pick(ds);let n=rand(1,(level==="challenge"?3:2)*d-1);while(n%d===0)n=rand(1,3*d-1);return R(n,d)}const p=level==="basic"?1:pick(level==="advanced"?[1,2]:[1,2,3]),s=10**p;let n=rand(1,max*s);while(n%10===0)n=rand(1,max*s);return R(n,s)}
const norm=s=>String(s).replace(/<[^>]*>/g,"").replace(/\s+/g,"").normalize("NFKC");
const okResult=q=>q&&typeof q.expr==="string"&&typeof q.answer==="string"&&q.expr&&!/\b(?:NaN|undefined|Infinity)\b/.test(q.expr+q.answer)&&typeof q.verify==="function"&&q.verify()===true;

 return{title:"解未知數",symbol:"x",subtitle:"一步驟逆算・兩步驟算式・括號・代數式求值",instruction:"解出未知數或求代數式的值，將過程寫在「原式＝」後面。",modes:["integer","fraction","decimal"],mixed:true,levels:{basic:"基礎：一步驟、整數與較小數值。",advanced:"進階：兩步驟並加入分數、小數。",challenge:"挑戰：括號、混合運算與較複雜係數。"},units:[equation("add","一步驟加減運算","利用加減互為逆運算，把已知數移到另一邊。","add"),equation("mul","一步驟乘除運算","利用乘除互為逆運算，求出未知數。","mul"),equation("same","同級兩步驟運算","加減同級，依相反順序逐步逆算。","same"),equation("mixed","兩步驟四則逆算","先逆算加減，再逆算乘除。","mixed"),equation("bracket","含括號的未知數算式","先把括號看成一個數，逆算後再解括號內。","bracket"),equation("eval","代數式求值","把未知數的值代入，再依運算順序計算。","eval")],presets:{basic:{add:3,mul:3,same:2,eval:2},advanced:{add:2,mul:2,same:2,mixed:2,bracket:2,eval:2},challenge:{same:2,mixed:3,bracket:3,eval:3}}}

const primeFactors=n=>{const out={};for(let p=2;p*p<=n;p++)while(n%p===0){out[p]=(out[p]||0)+1;n/=p}if(n>1)out[n]=(out[n]||0)+1;return out},factorHTML=m=>Object.entries(m).map(([p,e])=>e===1?p:`${p}<sup>${e}</sup>`).join(" × "),factorValue=m=>Object.entries(m).reduce((v,[p,e])=>v*Number(p)**e,1),gcdMany=a=>a.reduce((x,y)=>gcd(x,y)),lcm2=(a,b)=>a/gcd(a,b)*b,lcmMany=a=>a.reduce(lcm2,1),bruteGcd=a=>{for(let d=Math.min(...a);d>=1;d--)if(a.every(x=>x%d===0))return d;return 1},bruteLcm=a=>{let n=Math.max(...a);while(!a.every(x=>n%x===0))n++;return n};
function gcdConfig(){
 const nums=(count,level)=>Array.from({length:count},()=>rand(level==="basic"?12:40,level==="challenge"?500:220));
 const unit=(id,name,tip,kind,count)=>({id,name,tip,modes:["integer"],gen(ctx){if(kind==="factor"){const n=rand(ctx.level==="basic"?12:60,ctx.level==="challenge"?900:350),m=primeFactors(n);if(Object.values(m).reduce((x,y)=>x+y,0)<2)return null;return{expr:`將 ${n} 做質因數分解。`,answer:`${n}＝${factorHTML(m)}`,sig:`pf:${n}`,verify:()=>factorValue(m)===n&&Object.keys(m).every(p=>Object.keys(primeFactors(+p)).length===1)}}const a=kind==="lcm"?Array.from({length:count},(_,i)=>rand(2,12)*(i+2)*rand(1,3)):(()=>{const g=ctx.level==="basic"?rand(2,12):ctx.level==="challenge"?rand(6,48):rand(3,24),cmax=ctx.level==="basic"?9:ctx.level==="challenge"?30:15;return Array.from({length:count},()=>g*rand(2,cmax))})();if(kind==="gcd"&&gcdMany(a)===1)return null;if(new Set(a).size<count)return null;if(kind==="gcd"){const v=gcdMany(a);return{expr:`求（${a.join("，")}）。`,answer:String(v),sig:`gcd:${[...a].sort((x,y)=>x-y).join(":")}`,verify:()=>bruteGcd(a)===v}}if(kind==="lcm"){const v=lcmMany(a);if(v>200000)return null;return{expr:`求［${a.join("，")}］。`,answer:String(v),sig:`lcm:${[...a].sort((x,y)=>x-y).join(":")}`,verify:()=>bruteLcm(a)===v}}const A=rand(20,120),B=rand(20,120),fa=primeFactors(A),fb=primeFactors(B),g=gcd(A,B),l=lcm2(A,B);return{expr:`A＝${factorHTML(fa)}，B＝${factorHTML(fb)}，求（A，B）與［A，B］。`,answer:`（A，B）＝${g}；［A，B］＝${l}`,sig:`fg:${Math.min(A,B)}:${Math.max(A,B)}`,verify:()=>factorValue(fa)===A&&factorValue(fb)===B&&g*l===A*B}}});

let state={level:"advanced",groups:[],paper:null,mixed:true};

function applyPreset(level){state.level=level;const p=CFG.presets[level];CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`),v=p[u.id]||0;c.checked=v>0;n.disabled=!c.checked;n.value=v||1});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("difficultyNote").textContent=CFG.levels[level];updateTotal();markChanged()}

function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Set,skipped=[];state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}。`}
