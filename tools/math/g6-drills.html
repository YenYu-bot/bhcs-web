<script>
(()=>{"use strict";
const TOPICS=[["arithmetic","分數與小數四則運算"],["simplify","四則簡化計算"],["unknown","解未知數"],["time","時間的計算與化聚"],["gcd","最大公因數與最小公倍數"],["ratio","比、比例式與百分率"],["units","單位換算"],["area","周長與面積"],["circle","圓周長與圓面積"],["volume","體積與表面積"],["speed","速率"],["basecompare","基準量與比較量"],["scale","放大、縮小與比例尺"],["pattern","規律與怎樣解題"],["charts","統計圖與可能性"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"arithmetic",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}
// integer mode only prints whole numbers as integers: a half (10.5) or a third is shown as a decimal or fraction, never as its numerator

 const identify=unit("identify","基準量、比較量與比值","「是」後面的量是基準量，「是」前面的量是比較量；比值＝比較量÷基準量。",["integer","fraction","decimal"],ctx=>{
  // round 3：挑戰不再出進階的「甲數是 a，乙數是 b」，改成「乙數比甲數多（少）d」要先求出乙數再比（兩步）
  const L=lv(ctx),mode=pick(ctx.modes),kind=L===0?pick(["sentence","unit1","ratio"]):L===1?pick(["sentence","unit1","twoway"]):pick(["more","reverse","chain"]);
  // round 2：挑戰不再出基礎的「幾元當作 1」，改成連續兩個倍數關係（甲是乙的幾倍、乙是丙的幾倍 → 甲是丙的幾倍）

  if(kind==="sentence"){const [A,B]=pick(PAIRS),k=K(mode,L,Math.random()<.7);if(sub(k,R(4)).n>0)return null;return{expr:`${A}是${B}的 ${kS(k,mode,ctx)} 倍。指出基準量、比較量與比值。`,answer:`基準量：${B}；比較量：${A}；比值：${kS(k,mode,ctx)}`,sig:`is:${A}:${plain(k)}`,verify:()=>eq(div(mul(k,R(7)),R(7)),k)}}
  if(kind==="ratio"){let p=rand(1,9),q=rand(2,9);if(p===q||gcd(p,q)!==1)return null;const k=R(p,q);return pick([0,1])?{expr:`甲：乙＝${p}：${q}，以乙為基準量，比值是多少？`,answer:`比值 ${numHTML(k,"fraction",{mixed:true})}（甲是比較量）`,sig:`ir:${p}:${q}`,verify:()=>eq(mul(k,R(q)),R(p))}:{expr:`甲÷乙＝${numHTML(k,"fraction",{})}，指出基準量、比較量與比值。`,answer:`基準量：乙；比較量：甲；比值：${numHTML(k,"fraction",{mixed:true})}`,sig:`id:${p}:${q}`,verify:()=>eq(mul(k,R(q)),R(p))}}
  if(kind==="unit1"){const [u,base,max]=pick([["小時",R(rand(2,6)),30],["公尺",R(rand(2,12)),60],["公斤",R(rand(2,9)),50],["元",R(rand(2,20)*5),400]]),k=K(mode,L,Math.random()<.6),c=mul(base,k);if(!finiteDec(c)&&mode!=="fraction")return null;return{expr:`${sh(base,ctx)} ${u}當作 1，${sh(c,ctx)} ${u}相當於多少？`,answer:`${kS(k,mode,ctx)}（基準量 ${sh(base,ctx)} ${u}、比較量 ${sh(c,ctx)} ${u}）`,sig:`iu:${u}:${plain(base)}:${plain(k)}`,verify:()=>eq(div(c,base),k)}}
  if(kind==="twoway"||kind==="more"){// 小數、分數模式：甲、乙兩數本身就是小數或分數（舊版這兩個模式的兩數都是整數）
   const k=mode==="integer"?R(1,rand(2,9)):K(mode,L,false),b=mode==="decimal"?R(10*rand(1,9)+rand(1,9),10):mode==="fraction"?R(2*rand(1,6)+1,pick([2,4])):R(rand(2,12)*k.d),a=mul(b,k),r=div(b,a);if(a.n<=0||mode==="fraction"&&(a.d>12||a.d===1)||mode==="decimal"&&(places(a)<1||places(a)>2))return null;
   const ans=`甲是乙的 ${numHTML(k,"fraction",{mixed:true})}；乙是甲的 ${numHTML(r,"fraction",{mixed:true})} 倍`;
   if(kind==="more"){const dd=sub(b,a);return{expr:`甲數是 ${sh(a,ctx)}，乙數比甲數多 ${sh(dd,ctx)}，則甲數是乙數的幾分之幾？乙數是甲數的幾倍？`,answer:ans+`（乙數是 ${sh(b,ctx)}）`,sig:`im:${plain(a)}:${plain(b)}`,verify:()=>eq(mul(k,r),R(1))&&eq(div(add(a,dd),a),r)}}

  const [A,B]=pick(PAIRS),k=mode==="decimal"?pick([R(6,5),R(5,4),R(3,2),R(8,5),R(12,5),R(5,2),R(7,2),R(9,2),R(11,4)]):K(mode,L,true),r=div(R(1),k);if(r.d>12)return null;return{expr:`${A}是${B}的 ${kS(k,mode,ctx)} 倍，那麼${B}是${A}的幾倍？`,answer:`${numHTML(r,"fraction",{mixed:true})} 倍（基準量換成${A}）`,sig:`iv:${A}:${plain(k)}`,verify:()=>eq(mul(r,k),R(1))}});
 // ② 雙數線填空
 const numline=unit("numline","雙數線填空","上方的量÷下方的倍數＝1 倍的量；知道下方要求上方用乘，知道上方要求下方用除。",["integer","fraction","decimal"],ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes);
  // 1 倍的量 r 與三個刻度的倍數 b
  const r=mode==="integer"?R(rand(2,L===0?12:25)):mode==="decimal"?R(rand(12,L===0?60:95),10):(Math.random()<.6?R(rand(2,12)):K("fraction",0,true)),pickB=()=>mode==="integer"?R(rand(2,L===0?9:15)):mode==="decimal"?R(rand(2,40),pick([1,10])):K("fraction",0,Math.random()<.7);
  const zero=L===2||(L===1&&Math.random()<.5);let bs=null;
  for(let t=0;t<40&&!bs;t++){let c=L<2?[R(1),pickB(),pickB()]:[pickB(),pickB(),pickB()];c=c.sort((x,y)=>sub(x,y).n);const f=x=>x.n/x.d,span=f(c[2]);if(eq(c[0],c[1])||eq(c[1],c[2]))continue;if((f(c[1])-f(c[0]))/span<.2||(f(c[2])-f(c[1]))/span<.2)continue;if(zero&&f(c[0])/span<.18)continue;bs=c}
  if(!bs)return null;
  const tops=bs.map(b=>mul(b,r));if(tops.some(t=>!finiteDec(t)&&mode!=="fraction"))return null;
  // 已知格：必須有一個刻度上下都已知
  const known=L<2?bs.findIndex(b=>eq(b,R(1))):rand(0,2),others=[0,1,2].filter(i=>i!==known),blanks=others.map(i=>({i,pos:pick(["top","bot"])}));
  const cells=bs.map((b,i)=>{const bl=blanks.findIndex(x=>x.i===i);return{b,top:bl>=0&&blanks[bl].pos==="top"?`（${"①②"[bl]}）`:tops[i],bot:bl>=0&&blanks[bl].pos==="bot"?`（${"①②"[bl]}）`:b}});
  // round 2：題目與答案的量都帶單位、數字和單位之間空一格；面積單位寫 m<sup>2</sup>（和其他頁一致，圖上仍寫 m²）
  const unitT=zero?pick(["公斤","元","公升","公尺","m²","cm"]):"",uS=unitT?" "+(unitT==="m²"?"m<sup>2</sup>":unitT):"";
  const ans=blanks.map((x,j)=>`${"①②"[j]} ${x.pos==="top"?shA(tops[x.i],ctx,mode)+uS:shA(bs[x.i],ctx,mode)}`);
  const desc=blanks.map((x,j)=>x.pos==="top"?`${"①②"[j]}求倍數 ${shA(bs[x.i],ctx,mode)} 對應的量`:`${"①②"[j]}求量 ${shA(tops[x.i],ctx,mode)}${uS} 對應的倍數`).join("、");
  return{expr:`${numLine(cells,unitT,zero)}雙數線上方是量、下方是倍數，已知倍數 ${shA(bs[known],ctx,mode)} 對應的量是 ${shA(tops[known],ctx,mode)}${uS}；${desc}。`,answer:ans.join("；"),sig:`nl:${plain(r)}:${bs.map(plain).join(",")}:${known}:${blanks.map(b=>b.i+b.pos).join(",")}`,
   verify:()=>blanks.every(x=>x.pos==="top"?eq(div(tops[x.i],bs[x.i]),div(tops[known],bs[known])):eq(mul(bs[x.i],div(tops[known],bs[known])),tops[x.i]))}});
 // ③ 線段弧線圖
 const arcs=unit("arcline","線段圖求全部或部分","把標 1 的那一段當基準量：全部＝基準量×（各段倍數的和）；已知全部時，基準量＝全部÷（各段倍數的和）。",["integer","fraction","decimal"],ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),kind=L===0?pick(["whole2","part2","seg2"]):L===1?pick(["whole2","part2","whole3","seg2"]):pick(["whole3","part2","part3","seg3"]);
  const piece=()=>{const k=mode==="integer"?R(rand(2,4)):mode==="decimal"?R(rand(4,19)*5,100):K("fraction",L,false);if(mode==="fraction"&&k.n*3<k.d)return piece();if(mode==="decimal"&&Math.random()<.5)k.pc=pct(k);return k};
  if(kind==="whole2"){const k=piece(),v=mode==="fraction"?R(rand(2,15)*k.d):R(rand(2,30)*10),W=mul(v,add(R(1),k));if(!finiteDec(W)&&mode!=="fraction")return null;return{expr:`${arcLine([R(1),k],[[0,v]],null,"（　）")}求整條線段上方括號的量。`,answer:shA(W,ctx,mode),sig:`aw:${plain(k)}:${plain(v)}`,verify:()=>eq(sub(W,v),mul(k,v))}}

  if(kind==="whole3")return{expr:`${arcLine([k1,k2,R(1)],[[2,v]],null,"（　）")}求整條線段上方括號的量。`,answer:shA(W,ctx,mode),sig:`a3:${plain(k1)}:${plain(k2)}:${plain(v)}`,verify:()=>eq(add(add(mul(v,k1),mul(v,k2)),v),W)};
  if(kind==="seg3"){const x=mul(v,k1);return{expr:`${arcLine([k1,k2,R(1)],[[0,"（　）"]],null,W)}已知全部，求第一段上方括號的量。`,answer:shA(x,ctx,mode),sig:`a5:${plain(k1)}:${plain(k2)}:${plain(v)}`,verify:()=>eq(mul(div(x,k1),sum),W)}}
  return{expr:`${arcLine([k1,k2,R(1)],[[2,"（　）"]],null,W)}已知全部，求標 1 那一段上方括號的量。`,answer:shA(v,ctx,mode),sig:`a4:${plain(k1)}:${plain(k2)}:${plain(v)}`,verify:()=>eq(div(W,sum),v)}});
 // ④ 已知比較量求基準量（文字題）
 const findbase=unit("findbase","已知比較量求基準量","先找「是」後面的基準量：基準量＝比較量÷比值。「還剩幾分之幾」要先算用掉的是幾分之幾。",["fraction","decimal"],ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),kind=L===0?pick(["big","small","milk"]):L===1?pick(["cloth","school","pole","milk"]):pick(["minus","plus","age","age2"]);
  const part=()=>K(mode,L,false),big=()=>K(mode,L,true);

  if(kind==="school"){const k=part(),T=R(rand(3,30)*k.d*(mode==="decimal"?1:1)),boys=mul(T,k),girls=sub(T,boys);if(boys.d!==1||girls.n<=0)return null;const g=pick([0,1]);return g?{expr:`某國小的男生占全校的 ${kS(k,mode,ctx)}，已知男生的人數是 ${boys.n} 人，求全校的人數？女生有多少人？`,answer:`全校 ${T.n} 人；女生 ${girls.n} 人`,sig:`fsb:${plain(k)}:${T.n}`,verify:()=>eq(div(boys,k),T)}:{expr:`某國小的男生占全校的 ${kS(k,mode,ctx)}，已知女生的人數是 ${girls.n} 人，問全校的人數？男生有多少人？`,answer:`全校 ${T.n} 人；男生 ${boys.n} 人`,sig:`fsg:${plain(k)}:${T.n}`,verify:()=>eq(div(girls,sub(R(1),k)),T)}}

  if(kind==="minus"||kind==="plus"){const k=kind==="minus"?part():big(),x=R(rand(2,20)*k.d*pick([1,2])),d=kind==="minus"?sub(x,mul(x,k)):sub(mul(x,k),x);if(d.d!==1||d.n<=0)return null;return{expr:kind==="minus"?`某數減去 ${d.n}，剩餘的數恰好是某數的 ${kS(k,mode,ctx)}，求某數是多少？`:`某數加上 ${d.n}，和恰好是某數的 ${kS(k,mode,ctx)}，求某數是多少？`,answer:`${x.n}`,sig:`f${kind}:${plain(k)}:${x.n}`,verify:()=>kind==="minus"?eq(sub(x,d),mul(x,k)):eq(add(x,d),mul(x,k))}}
  if(kind==="age"){const k=big(),g=R(rand(3,12)*k.d),f=mul(g,k),y=rand(2,6);if(f.d!==1||f.n<25||f.n>60)return null;return{expr:`父親今年的年齡是女兒的 ${kS(k,mode,ctx)} 倍，父親今年 ${f.n} 歲，${y} 年後女兒幾歲？`,answer:`${g.n+y} 歲（女兒今年 ${g.n} 歲）`,sig:`fa:${plain(k)}:${g.n}:${y}`,verify:()=>eq(div(f,k),g)}}
  const k=big(),g=R(rand(5,16)),f=mul(g,k),y=rand(2,6);if(f.d!==1||f.n<25||f.n>60)return null;return{expr:`父親今年的年齡是女兒的 ${kS(k,mode,ctx)} 倍，女兒今年 ${g.n} 歲，問父親 ${y} 年前幾歲？`,answer:`${f.n-y} 歲（父親今年 ${f.n} 歲）`,sig:`fa2:${plain(k)}:${g.n}:${y}`,verify:()=>eq(div(f,g),k)}});
 // ⑤ 和倍與差倍
 const sumdiff=unit("sumdiff","和倍、差倍與應用","把小數（基準量）看成 1 份：大數是 k 份；相差是（k－1）份、和是（k＋1）份，先求 1 份。各加（減）同一個數時，要先調整總和。",["integer","fraction","decimal"],ctx=>{

  const k=K(mode,L,true),base=()=>R(rand(2,L===2?40:25)*k.d*(mode==="decimal"?1:1));
  if(kind==="diff"||kind==="sum"||kind==="sumdiff"){const s=base(),b=mul(s,k);if(b.d!==1)return null;const S=add(b,s),D=sub(b,s);
   if(kind==="diff")return{expr:`大、小二數的差是 ${D.n}，大數是小數的 ${kS(k,mode,ctx)} 倍，求大、小二數各是多少？`,answer:`大數 ${b.n}；小數 ${s.n}`,sig:`sd:${plain(k)}:${s.n}`,verify:()=>eq(div(D,sub(k,R(1))),s)};
   if(kind==="sum")return{expr:`大、小二數的和是 ${S.n}，大數是小數的 ${kS(k,mode,ctx)} 倍，求大、小二數各是多少？`,answer:`大數 ${b.n}；小數 ${s.n}`,sig:`ss:${plain(k)}:${s.n}`,verify:()=>eq(div(S,add(k,R(1))),s)};
   return{expr:`大、小二數的和是 ${S.n}，大數是小數的 ${kS(k,mode,ctx)} 倍，求大、小二數的差是多少？`,answer:`${D.n}（大數 ${b.n}、小數 ${s.n}）`,sig:`sx:${plain(k)}:${s.n}`,verify:()=>eq(mul(div(S,add(k,R(1))),sub(k,R(1))),D)}}
  if(kind==="compare"){const c=R(rand(10,60)*k.d*5),sheep=mul(c,k);if(sheep.d!==1)return null;return{expr:`牧場有牛 ${c.n} 頭，羊的頭數是牛的 ${kS(k,mode,ctx)} 倍，問牛和羊相差多少頭？`,answer:`${sub(sheep,c).n} 頭（羊 ${sheep.n} 頭）`,sig:`sc:${plain(k)}:${c.n}`,verify:()=>eq(mul(c,sub(k,R(1))),sub(sheep,c))}}

 const factoredU=unitG("factored","乘積式的最大公因數與最小公倍數","最大公因數：取兩數共有的質因數相乘；最小公倍數：共有的質因數取一次，再乘上各自剩下的質因數。",{basic:["g","l","lf"],advanced:["gl","lmul","gcnt"],challenge:["three","rev","threeL"]},(k,L)=>{
