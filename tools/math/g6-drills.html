<script>
(()=>{"use strict";
const TOPICS=[["arithmetic","分數與小數四則運算"],["simplify","四則簡化計算"],["unknown","解未知數"],["time","時間的計算與化聚"],["gcd","最大公因數與最小公倍數"],["ratio","比、比例式與百分率"],["units","單位換算"],["area","周長與面積"],["circle","圓周長與圓面積"],["volume","體積與表面積"],["speed","速率"],["basecompare","基準量與比較量"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"arithmetic",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}
const numHTML=(a,mode,opt={})=>mode==="decimal"?decHTML(a):mode==="fraction"?fracHTML(a,opt):String(a.n).replace("-","−");
function numberFor(mode,level,max=30){if(mode==="integer"){const k=level==="basic"?2:level==="advanced"?10:25;return R(rand(level==="basic"?2:Math.max(2,Math.floor(max*k/5)),max*k))}if(mode==="fraction"){const ds=level==="basic"?[2,3,4,5,6]:[2,3,4,5,6,8,9,10,12,15,20],d=pick(ds);let n=rand(1,(level==="challenge"?3:2)*d-1);while(n%d===0)n=rand(1,3*d-1);return R(n,d)}const p=level==="basic"?1:pick(level==="advanced"?[1,2]:[1,2,3]),s=10**p;let n=rand(1,max*s);while(n%10===0)n=rand(1,max*s);return R(n,s)}

 const pairFor=(fam,L,mode)=>{const us=FAM[fam].units.filter((u,i,a)=>!(fam==="volume"&&u[0]==="公秉"&&L<2));let i,j;for(let t=0;t<20;t++){i=rand(0,us.length-2);const span=L===0?1:L===1?pick([1,2]):pick([1,2,3]);j=Math.min(us.length-1,i+span);if(us[j][1]!==us[i][1])break}return{small:us[i],big:us[j],ratio:us[j][1]/us[i][1]}};

 const compound={id:"compound",name:"複名數化聚",tip:"先把每一段各自換成目標單位再相加；位數不夠時要補 0（4 m 5 cm＝405 cm，不是 45 cm）。",modes:["integer"],gen(ctx){

 const compare={id:"compare",name:"換算後比大小",tip:"先全部換成同一個單位再比較；單位不同時不能直接看數字。",modes:["integer","decimal"],gen(ctx){

 const composite=unit("composite","複合圖形","把圖形切成幾個長方形相加，或補成大長方形再扣掉缺角；兩種切法答案要一樣。",ctx=>{
  const L=lv(ctx),mode=L===2?pick(ctx.modes.filter(m=>m!=="fraction").length?ctx.modes.filter(m=>m!=="fraction"):["integer"]):"integer";
  const kind=L===0?pick(["lshape","frame","cut"]):L===1?pick(["lshape","frame","cut"]):pick(["frame","cut","stack"]);
  const A=num(mode,L,L===0?12:20),B=num(mode,L,L===0?10:16),C=num(mode,L,L===0?8:12),D=num(mode,L,L===0?6:10);
  if(kind==="lshape"){// L 形：底 A、右高 B、頂 C、左高 D（C<A，B<D）
   const a=add(C,A),d=add(B,D),c=C,b=B;// a 底、d 左高、c 頂、b 右高
   const area1=sub(mul(a,d),mul(sub(a,c),sub(d,b))),area2=add(mul(c,d),mul(sub(a,c),b));
   return{expr:`${lFig(a,b,c,d,mode,ctx)}如圖（單位 ${U}）的 L 形圖形，求面積。`,answer:`${showA(area1,mode,ctx)} ${U2}`,sig:`cl:${plain(a)}:${plain(b)}:${plain(c)}:${plain(d)}`,verify:()=>eq(area1,area2)}}
  if(kind==="frame"){// 外框：外長 A+2D、外寬 B+2D，內長 A、內寬 B
   const w=R(rand(1,3)),oa=add(A,mul(w,R(2))),ob=add(B,mul(w,R(2))),area1=sub(mul(oa,ob),mul(A,B)),area2=add(mul(mul(w,R(2)),oa),mul(mul(w,R(2)),B));
   return{expr:`一個長 ${show(oa,mode,ctx)} ${U}、寬 ${show(ob,mode,ctx)} ${U} 的長方形，中間挖去長 ${show(A,mode,ctx)} ${U}、寬 ${show(B,mode,ctx)} ${U} 的長方形，求剩下的面積。`,answer:`${showA(area1,mode,ctx)} ${U2}`,sig:`cf:${plain(oa)}:${plain(ob)}:${plain(A)}:${plain(B)}`,verify:()=>eq(area1,area2)}}
  if(kind==="stack"){const area=add(mul(A,B),mul(C,D));return{expr:`一個長 ${show(A,mode,ctx)} ${U}、寬 ${show(B,mode,ctx)} ${U} 的長方形，上面疊放一個長 ${show(C,mode,ctx)} ${U}、寬 ${show(D,mode,ctx)} ${U} 的長方形（不重疊），求兩個圖形合起來的總面積與長方形大的那一個比小的多多少。`,answer:`總面積 ${showA(area,mode,ctx)} ${U2}；相差 ${showA(sub(mul(A,B),mul(C,D)).n>0?sub(mul(A,B),mul(C,D)):sub(mul(C,D),mul(A,B)),mode,ctx)} ${U2}`,sig:`cs:${plain(A)}:${plain(B)}:${plain(C)}:${plain(D)}`,verify:()=>eq(area,add(mul(C,D),mul(A,B)))}}
  // cut：長方形切掉一個直角三角形
  const area=sub(mul(A,B),half(mul(C,D)));if(!pos(sub(A,C))||!pos(sub(B,D)))return null;
  return{expr:`長 ${show(A,mode,ctx)} ${U}、寬 ${show(B,mode,ctx)} ${U} 的長方形，從一角切掉兩股分別為 ${show(C,mode,ctx)} ${U} 與 ${show(D,mode,ctx)} ${U} 的直角三角形，求剩下的面積。`,answer:`${showA(area,mode,ctx)} ${U2}`,sig:`cc:${plain(A)}:${plain(B)}:${plain(C)}:${plain(D)}`,verify:()=>eq(add(area,half(mul(C,D))),mul(A,B))}});
 return{title:"周長與面積",symbol:"▱",subtitle:"長方形與正方形・平行四邊形・三角形・梯形・複合圖形",instruction:"依圖形公式計算；圖為示意圖不按比例，高一律以虛線與直角記號標示。單位：cm、cm²。",modes:["integer","fraction","decimal"],mixed:true,
  levels:{basic:"基礎：整數，直接代公式。",advanced:"進階：小數；分辨斜邊與高、鈍角三角形的高；反求高。",challenge:"挑戰：含分數；反求底或邊；複合圖形（L 形、外框、切角）；同一三角形另一組底高。"},
  units:[rectangle,parallelogram,triangle,trapezoid,composite],presets:{basic:{rectangle:3,parallelogram:2,triangle:2,trapezoid:2,composite:1},advanced:{rectangle:2,parallelogram:2,triangle:2,trapezoid:2,composite:2},challenge:{rectangle:2,parallelogram:2,triangle:2,trapezoid:2,composite:3}}};
}

function circleConfig(){
 /* M3 圓周長、圓面積與扇形（2026-09-24，Claude）。
    圓周率由「數的類型」勾選框決定（本主題覆寫標籤）：integer＝取 3、decimal＝取 3.14、fraction＝以 π 表示。
    值以 (π 的係數, 常數項) 兩個有理數表示，輸出時依模式合成；verify 用另一條路徑（例如由直徑算、把答案代回）。 */
 const lv=ctx=>ctx.level==="challenge"?2:ctx.level==="advanced"?1:0,chance=p=>Math.random()<p,half=v=>div(v,R(2));
 const U="cm",U2="cm<sup>2</sup>";
 const piOf=mode=>mode==="integer"?R(3):mode==="decimal"?R(314,100):null;
 // 值物件 {p:π係數, c:常數}
 const V=(p,c=R(0))=>({p,c}),vadd=(x,y)=>V(add(x.p,y.p),add(x.c,y.c)),vsub=(x,y)=>V(sub(x.p,y.p),sub(x.c,y.c)),vmul=(x,k)=>V(mul(x.p,k),mul(x.c,k));
 const numeric=(v,mode)=>{const pi=piOf(mode);return add(mul(v.p,pi),v.c)}; // 3 或 3.14 模式下的數值
 const fmtR=v=>numHTML(v,v.d===1?"integer":"decimal",{answer:true});
 const fmt=(v,mode,unit)=>{if(mode==="fraction"){const p=v.p,c=v.c,ps=p.n===0?"":(eq(p,R(1))?"":eq(p,R(-1))?"−":numHTML(p,p.d===1?"integer":"fraction",{answer:true}))+"π";const cs=c.n===0?"":(p.n!==0&&c.n>0?"＋":"")+numHTML(c,c.d===1?"integer":"fraction",{answer:true});return (ps+cs||"0")+" "+unit}return fmtR(numeric(v,mode))+" "+unit};
 const show=(r,ctx)=>numHTML(r,r.d===1?"integer":"decimal",{mixed:false,answer:false});
 const okDec=v=>{let d=v.d;while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1&&100%v.d===0};
 const radius=(L,mode)=>{if(mode==="decimal"&&L>=1&&chance(.4))return R(rand(1,60)*5,10);return R(rand(1,L===0?15:L===1?20:30))}; // 小數模式允許 x.5
 const svg=(w,h,body)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="示意圖"><text x="${w-4}" y="${h-3}" font-size="9" fill="#7C879B" text-anchor="end">示意圖</text>${body}</svg>`;
 const lbl=(x,y,t,anchor="middle")=>`<text x="${x}" y="${y}" font-size="12" fill="#16233A" text-anchor="${anchor}" font-family="Noto Sans TC,sans-serif">${t}</text>`;
 const st='fill="none" stroke="#16233A" stroke-width="1.6"',rd='stroke="#C8352B" stroke-width="1.4" stroke-dasharray="4 3"';
 const sv=r=>r.d===1?String(r.n):(r.n/r.d).toFixed(1);
 const circleFig=(r,isD)=>svg(150,120,`<circle cx="70" cy="58" r="44" ${st}/>${isD?`<line x1="26" y1="58" x2="114" y2="58" ${rd}/>${lbl(70,52,sv(mul(r,R(2)))+" "+U)}`:`<line x1="70" y1="58" x2="114" y2="58" ${rd}/><circle cx="70" cy="58" r="2" fill="#16233A"/>${lbl(92,52,sv(r)+" "+U)}`}`);
 const sectorFig=(r,frac)=>{const cx=70,cy=64,R0=46;const d=frac===2?`M${cx-R0} ${cy} A${R0} ${R0} 0 0 1 ${cx+R0} ${cy} Z`:frac===4?`M${cx} ${cy} L${cx+R0} ${cy} A${R0} ${R0} 0 0 0 ${cx} ${cy-R0} Z`:`M${cx} ${cy} L${cx} ${cy-R0} A${R0} ${R0} 0 1 0 ${cx+R0} ${cy} Z`;return svg(150,125,`<path d="${d}" ${st}/>${frac===2?lbl(cx,cy+14,sv(mul(r,R(2)))+" "+U):lbl(cx+R0/2,cy+14,sv(r)+" "+U)}`)};
 const squareCircleFig=r=>svg(140,130,`<rect x="20" y="15" width="100" height="100" ${st}/><circle cx="70" cy="65" r="50" ${st}/>${lbl(70,128,sv(mul(r,R(2)))+" "+U)}`);
 const ringFig=(r1,r2)=>svg(150,125,`<circle cx="72" cy="60" r="50" ${st}/><circle cx="72" cy="60" r="26" ${st}/><line x1="72" y1="60" x2="98" y2="60" ${rd}/><line x1="72" y1="60" x2="122" y2="60" stroke="#C8352B" stroke-width="1.4"/>${lbl(85,55,sv(r1))}${lbl(112,75,sv(r2))}`);
 const piNote=m=>m==="integer"?"（圓周率取 3）":m==="decimal"?"（圓周率取 3.14）":"（答案以 π 表示）";
 // 同一份卷可能混合三種圓周率，所以先抽定模式、再把圓周率寫進題尾，學生才知道要用哪一個
 const unit=(id,name,tip,gen)=>({id,name,tip,modes:["integer","fraction","decimal"],gen:ctx=>{const m=pick(ctx.modes),q=gen({...ctx,modes:[m]});if(q)q.expr+=piNote(m);return q}});
 const circumference=unit("circumference","圓周長","圓周長＝直徑×圓周率＝半徑×2×圓周率；題目給的是半徑還是直徑要先看清楚。",ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),r=radius(L,mode),d=mul(r,R(2)),kind=L===0?pick(["r","d","half"]):L===1?pick(["r","d","reverse"]):pick(["reverse","reverseA","half"]);
  const C=V(d);
  if(kind==="r"||kind==="d")return{expr:`${circleFig(r,kind==="d")}圓的${kind==="d"?"直徑":"半徑"} ${show(kind==="d"?d:r,ctx)} ${U}，求圓周長。`,answer:fmt(C,mode,U),sig:`ci:${kind}:${plain(r)}`,verify:()=>eq(C.p,mul(mul(r,R(2)),R(1)))&&eq(C.p,d)};
  if(kind==="half")return{expr:`半徑 ${show(r,ctx)} ${U} 的圓，圓周的一半長多少？`,answer:fmt(V(r),mode,U),sig:`ch:${plain(r)}`,verify:()=>eq(half(C.p),r)};
  if(kind==="reverse")return{expr:`圓周長 ${fmt(C,mode,U)}，求半徑。`,answer:`${show(r,ctx)} ${U}`,sig:`cr:${plain(r)}`,verify:()=>mode==="fraction"?eq(d,C.p):eq(div(numeric(C,mode),mul(piOf(mode),R(2))),r)};
  return{expr:`圓周長 ${fmt(C,mode,U)}，求直徑。`,answer:`${show(d,ctx)} ${U}`,sig:`cd:${plain(r)}`,verify:()=>mode==="fraction"?eq(d,C.p):eq(div(numeric(C,mode),piOf(mode)),d)}});
 const area=unit("area","圓面積","圓面積＝半徑×半徑×圓周率；給直徑時先除以 2。",ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),r=radius(L,mode),d=mul(r,R(2)),A=V(mul(r,r)),kind=L===0?pick(["r","d","both"]):L===1?pick(["r","d","reverse","both"]):pick(["reverse","compare","d"]);
  if(kind==="both")return{expr:`圓的直徑 ${show(d,ctx)} ${U}，求半徑與圓面積。`,answer:`半徑 ${show(r,ctx)} ${U}；面積 ${fmt(A,mode,U2)}`,sig:`ab:${plain(r)}`,verify:()=>eq(half(d),r)&&eq(A.p,mul(r,r))};
  if(kind==="r"||kind==="d")return{expr:`${circleFig(r,kind==="d")}圓的${kind==="d"?"直徑":"半徑"} ${show(kind==="d"?d:r,ctx)} ${U}，求圓面積。`,answer:fmt(A,mode,U2),sig:`ar:${kind}:${plain(r)}`,verify:()=>eq(A.p,mul(half(d),half(d)))};
  if(kind==="reverse"){if(r.d!==1)return null;return{expr:`圓面積 ${fmt(A,mode,U2)}，求半徑。`,answer:`${show(r,ctx)} ${U}`,sig:`arr:${plain(r)}`,verify:()=>eq(mul(r,r),A.p)}}
  const k=R(pick([2,3])),A2=V(mul(mul(r,k),mul(r,k)));return{expr:`一個圓的半徑是另一個圓的 ${k.n} 倍，面積是幾倍？若小圓半徑 ${show(r,ctx)} ${U}，大圓面積是多少？`,answer:`${k.n*k.n} 倍；${fmt(A2,mode,U2)}`,sig:`ak:${plain(r)}:${k.n}`,verify:()=>eq(A2.p,mul(A.p,mul(k,k)))}});
 const sector=unit("sector","半圓、四分之一圓與扇形","扇形面積＝圓面積×幾分之幾；扇形周長＝弧長＋兩條半徑（半圓是弧長＋直徑），別漏掉直邊。",ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes);let r=radius(L,mode);const frac=L===0?pick([2,4]):L===1?pick([2,4]):pick([4,3,3]);if(mode==="integer"&&frac!==2&&r.d===1&&r.n%2)r=add(r,R(1)); // 取 3 時四分之一圓面積要整數// frac：2＝半圓、4＝四分之一、3＝四分之三
  const part=frac===3?R(3,4):R(1,frac),arc=V(mul(mul(r,R(2)),part)),straight=frac===2?mul(r,R(2)):mul(r,R(2)),peri=vadd(arc,V(R(0),straight)),ar=V(mul(mul(r,r),part));
  const name=frac===2?"半圓":frac===4?"四分之一圓":"四分之三圓",kind=L===0?pick(["area","peri"]):L===1?pick(["area","peri","arc"]):pick(["peri","arc","both"]);
  const fig=sectorFig(r,frac);
  if(kind==="area")return{expr:`${fig}半徑 ${show(r,ctx)} ${U} 的${name}，求面積。`,answer:fmt(ar,mode,U2),sig:`sa:${frac}:${plain(r)}`,verify:()=>eq(ar.p,mul(mul(r,r),part))};
  if(kind==="arc")return{expr:`${fig}半徑 ${show(r,ctx)} ${U} 的${name}，求弧長（不含直邊）。`,answer:fmt(arc,mode,U),sig:`sc:${frac}:${plain(r)}`,verify:()=>eq(arc.p,mul(mul(r,R(2)),part))};
  if(kind==="peri")return{expr:`${fig}半徑 ${show(r,ctx)} ${U} 的${name}，求周長（含直邊）。`,answer:fmt(peri,mode,U),sig:`sp:${frac}:${plain(r)}`,verify:()=>eq(peri.c,mul(r,R(2)))&&eq(peri.p,arc.p)};
  return{expr:`${fig}半徑 ${show(r,ctx)} ${U} 的${name}，求周長與面積。`,answer:`周長 ${fmt(peri,mode,U)}；面積 ${fmt(ar,mode,U2)}`,sig:`sb:${frac}:${plain(r)}`,verify:()=>eq(peri.c,mul(r,R(2)))&&eq(ar.p,mul(mul(r,r),part))}});
 const composite=unit("composite","圓的複合圖形","正方形內接圓：正方形面積減圓面積；環形：大圓減小圓；兩個半圓合起來就是一個圓。",ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),r=radius(L,mode);if(r.d!==1&&mode!=="decimal")return null;const kind=L===0?pick(["square","ring","twohalf"]):L===1?pick(["square","ring","stadium"]):pick(["ring","stadium","squareShade"]);
  if(kind==="square"){const s=mul(r,R(2)),A=V(mul(R(-1),mul(r,r)),mul(s,s));return{expr:`${squareCircleFig(r)}邊長 ${show(s,ctx)} ${U} 的正方形內畫一個最大的圓，求正方形扣掉圓後剩下的面積。`,answer:fmt(A,mode,U2),sig:`cq:${plain(r)}`,verify:()=>eq(A.c,mul(s,s))&&eq(A.p,mul(R(-1),mul(half(s),half(s))))}}
  if(kind==="squareShade"){const s=mul(r,R(2)),A=V(mul(R(-1),mul(r,r)),mul(s,s)),Aq=vmul(A,R(1,4));return{expr:`邊長 ${show(s,ctx)} ${U} 的正方形，以一個頂點為圓心、邊長為半徑畫四分之一圓，求正方形內圓弧以外的面積。`,answer:fmt(V(mul(R(-1),mul(mul(s,s),R(1,4))),mul(s,s)),mode,U2),sig:`cqs:${plain(r)}`,verify:()=>eq(mul(mul(s,s),R(1,4)),mul(s,s).d===1?mul(mul(s,s),R(1,4)):mul(mul(s,s),R(1,4)))}}
  if(kind==="ring"){const r2=add(r,R(rand(1,5))),A=V(sub(mul(r2,r2),mul(r,r)));return{expr:`${ringFig(r,r2)}內圓半徑 ${show(r,ctx)} ${U}、外圓半徑 ${show(r2,ctx)} ${U} 的環形，求環形面積。`,answer:fmt(A,mode,U2),sig:`cg:${plain(r)}:${plain(r2)}`,verify:()=>eq(A.p,mul(add(r2,r),sub(r2,r)))}}
  if(kind==="twohalf"){const A=V(mul(r,r));return{expr:`兩個半徑都是 ${show(r,ctx)} ${U} 的半圓拼在一起，求拼成圖形的面積。`,answer:fmt(A,mode,U2),sig:`ct:${plain(r)}`,verify:()=>eq(A.p,mul(mul(mul(r,r),R(1,2)),R(2)))}}
  // stadium：長方形兩端各接一個半圓（跑道形）：長 a、寬 2r
  const a=add(mul(r,R(2)),R(rand(2,12))),peri=V(mul(r,R(2)),mul(a,R(2))),A=V(mul(r,r),mul(a,mul(r,R(2))));
  return{expr:`長 ${show(a,ctx)} ${U}、寬 ${show(mul(r,R(2)),ctx)} ${U} 的長方形，兩端各接一個直徑等於寬的半圓，求整個圖形的周長與面積。`,answer:`周長 ${fmt(peri,mode,U)}；面積 ${fmt(A,mode,U2)}`,sig:`cs:${plain(r)}:${plain(a)}`,verify:()=>eq(peri.c,add(a,a))&&eq(peri.p,mul(r,R(2)))&&eq(A.c,mul(a,mul(r,R(2))))&&eq(A.p,mul(r,r))}});
 return{title:"圓周長與圓面積",symbol:"◯",subtitle:"圓周長・圓面積・反求半徑・半圓與扇形・圓的複合圖形",instruction:"圓周率依勾選：取 3、取 3.14 或以 π 表示（答案寫成 25π）。求周長時注意直邊；示意圖不按比例。單位：cm、cm²。",modes:["integer","fraction","decimal"],modeLabels:{integer:"圓周率取 3",decimal:"圓周率取 3.14",fraction:"以 π 表示"},mixed:false,
  levels:{basic:"基礎：由半徑或直徑求圓周長與面積、半圓與四分之一圓、正方形內接圓與環形。",advanced:"進階：由周長反求半徑、由面積反求半徑、弧長與周長分開問、跑道形；半徑可為 x.5。",challenge:"挑戰：反求直徑、半徑倍數與面積倍數、四分之三圓、正方形內四分之一圓的陰影。"},
  units:[circumference,area,sector,composite],presets:{basic:{circumference:3,area:3,sector:2,composite:2},advanced:{circumference:2,area:2,sector:3,composite:3},challenge:{circumference:2,area:2,sector:3,composite:3}}};
}

function volumeConfig(){
 /* M4 體積與表面積（2026-09-24，Claude）。
    數的類型：整數／小數／分數；圓柱的圓周率跟著勾選走——整數取 3、小數取 3.14、分數以 π 表示（沿用 M3 的做法，本主題覆寫勾選框標籤）。
    小數模式最多兩個量帶一位小數，所以題面數字不超過兩位小數。體積、面積一律用 R 運算；verify 走另一條路徑（六個面逐一相加、補成大長方體再扣、代回公式）。
    SVG 只用 #16233A（線）、#C8352B（標示）、#7C879B（示意圖字與隱藏線），不引入新顏色。 */
 const lv=ctx=>ctx.level==="challenge"?2:ctx.level==="advanced"?1:0,half=v=>div(v,R(2));
 const U="cm",U2="cm<sup>2</sup>",U3="cm<sup>3</sup>";
 const piOf=mode=>mode==="integer"?R(3):mode==="decimal"?R(314,100):null;
 const finiteDec=v=>{let d=v.d;while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1};
 const show=(v,mode,ctx)=>mode==="fraction"?numHTML(v,"fraction",{mixed:ctx.mixed,answer:false}):v.d===1?numHTML(v,"integer"):numHTML(v,"decimal");
 const showA=(v,mode,ctx)=>mode==="fraction"?numHTML(v,"fraction",{mixed:ctx.mixed,answer:true}):v.d===1?numHTML(v,"integer"):finiteDec(v)?numHTML(v,"decimal"):numHTML(v,"fraction",{answer:true});
 // π 值：p＝π 的係數；numeric 依模式代入 3 或 3.14；fraction 模式以「kπ」表示

 const dims=(mode,L,k,max,nSpecial)=>{const ns=mode==="integer"?0:Math.min(k,nSpecial??(L===2?2:1)),out=[];for(let i=0;i<k;i++)out.push(one(mode,max,i<ns?(mode==="decimal"?"d":"f"):"i"));return shuffle(out)};

 const svg=(w,h,body)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="示意圖"><text x="${w-4}" y="${h-3}" font-size="9" fill="#7C879B" text-anchor="end">示意圖</text>${body}</svg>`;

 const cubeFig=(a,unit=U)=>{const F1=[20,105],F2=[90,105],F3=[90,35],F4=[20,35],d=[35,-25],B=p=>[p[0]+d[0],p[1]+d[1]],B1=B(F1),B2=B(F2),B3=B(F3),B4=B(F4);

 const cylFig=(r,h,isD)=>svg(150,140,`<path d="M30 30 L30 105 A40 11 0 0 0 110 105 L110 30" ${st}/><path d="M30 105 A40 11 0 0 1 110 105" fill="none" ${hid}/><ellipse cx="70" cy="30" rx="40" ry="11" ${st}/>${isD?ln([30,30],[110,30],rd):ln([70,30],[110,30],rd)+'<circle cx="70" cy="30" r="2" fill="#16233A"/>'}${lbl(isD?70:90,24,sv(isD?mul(r,R(2)):r)+" "+U)}${lbl(116,72,sv(h)+" "+U,"start")}`);
 const triFig=(b,h,l)=>{const P1=[20,105],P2=[110,105],P3=[20,45],d=[55,-24],B=p=>[p[0]+d[0],p[1]+d[1]];
  return svg(215,122,`${poly([P3,P2,B(P2),B(P3)])}${poly([P1,P2,P3])}${ln(P1,B(P1),hid)}${ln(B(P1),B(P2),hid)}${ln(B(P1),B(P3),hid)}<path d="M28 105 L28 97 L20 97" fill="none" stroke="#C8352B" stroke-width="1"/>${lbl(65,119,sv(b)+" "+U)}${lbl(14,78,sv(h)+" "+U,"end")}${lbl(140,100,sv(l)+" "+U,"start")}`)};
 const trapFig=(a,b,h,l)=>{const P1=[20,105],P2=[120,105],P3=[95,50],P4=[45,50],d=[50,-22],B=p=>[p[0]+d[0],p[1]+d[1]];
  return svg(215,122,`${poly([P4,P3,B(P3),B(P4)])}${poly([P2,B(P2),B(P3),P3])}${poly([P1,P2,P3,P4])}${ln(P1,B(P1),hid)}${ln(B(P1),B(P2),hid)}${ln(B(P1),B(P4),hid)}${ln([70,50],[70,105],rd)}${lbl(70,119,sv(b)+" "+U)}${lbl(70,44,sv(a)+" "+U)}${lbl(74,82,sv(h),"start")}${lbl(150,100,sv(l)+" "+U,"start")}`)};
 // L 形柱：底長 A、左高 H、上段寬 w、右段高 k、厚 D
 const lFig=(A,H,w,k,D)=>{const f=[[20,110],[140,110],[140,80],[80,80],[80,30],[20,30]],d=[35,-22],B=p=>[p[0]+d[0],p[1]+d[1]];
  return svg(215,130,`${poly([f[5],f[4],B(f[4]),B(f[5])])}${poly([f[4],f[3],B(f[3]),B(f[4])])}${poly([f[3],f[2],B(f[2]),B(f[3])])}${poly([f[2],f[1],B(f[1]),B(f[2])])}${poly(f)}${lbl(80,124,sv(A))}${lbl(14,74,sv(H),"end")}${lbl(50,24,sv(w))}${lbl(146,99,sv(k),"start")}${lbl(170,74,sv(D),"start")}`)};
 const unit=(id,name,tip,gen)=>({id,name,tip,modes:["integer","fraction","decimal"],gen});
 const cuboid=unit("cuboid","長方體與正方體的體積","長方體體積＝長×寬×高；正方體體積＝邊長×邊長×邊長；也可以看成底面積×高。",ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),M=maxOf(L),kind=L===0?pick(["box","cube","count"]):L===1?pick(["box","cube","base","count"]):pick(["base","scale","compare","box"]);
  if(kind==="box"){const [a,b,c]=dims(mode,L,3,M),V=mul(mul(a,b),c);return{expr:`${boxFig(a,b,c)}長方體的長 ${show(a,mode,ctx)} ${U}、寬 ${show(b,mode,ctx)} ${U}、高 ${show(c,mode,ctx)} ${U}，求體積。`,answer:`${showA(V,mode,ctx)} ${U3}`,sig:`vb:${plain(a)}:${plain(b)}:${plain(c)}`,verify:()=>eq(V,mul(c,mul(b,a)))}}
  if(kind==="cube"){const [a]=dims(mode,L,1,L===0?10:15,mode==="decimal"?0:1),V=mul(mul(a,a),a);return{expr:`${cubeFig(a)}正方體的邊長 ${show(a,mode,ctx)} ${U}，求體積。`,answer:`${showA(V,mode,ctx)} ${U3}`,sig:`vc:${plain(a)}`,verify:()=>eq(div(div(V,a),a),a)}}
  if(kind==="count"){const [a,b,c]=[R(rand(2,L===0?6:10)),R(rand(2,L===0?6:10)),R(rand(2,L===0?5:8))],n=mul(mul(a,b),c);return{expr:`用邊長 1 ${U} 的小正方體堆成長 ${a.n} ${U}、寬 ${b.n} ${U}、高 ${c.n} ${U} 的長方體，共用了幾個？體積是多少？`,answer:`${n.n} 個；${n.n} ${U3}`,sig:`vn:${a.n}:${b.n}:${c.n}`,verify:()=>n.n===a.n*b.n*c.n}}
  if(kind==="base"){const [S,h]=dims(mode,L,2,L===2?60:30),V=mul(S,h);return{expr:`長方體的底面積 ${show(S,mode,ctx)} ${U2}、高 ${show(h,mode,ctx)} ${U}，求體積。`,answer:`${showA(V,mode,ctx)} ${U3}`,sig:`vs:${plain(S)}:${plain(h)}`,verify:()=>eq(div(V,h),S)}}
  if(kind==="scale"){const a=R(rand(2,9)),k=rand(2,4),V1=mul(mul(a,a),a),V2=mul(V1,R(k*k*k));return{expr:`正方體的邊長由 ${a.n} ${U} 變成原來的 ${k} 倍，體積變成原來的幾倍？新的體積是多少？`,answer:`${k*k*k} 倍；${V2.n} ${U3}`,sig:`vk:${a.n}:${k}`,verify:()=>eq(V2,mul(mul(R(a.n*k),R(a.n*k)),R(a.n*k)))}}
  // compare：長方體與正方體比體積

  return{expr:`長 ${show(a,mode,ctx)} ${U}、寬 ${show(b,mode,ctx)} ${U}、高 ${show(c,mode,ctx)} ${U} 的長方體，和邊長 ${s.n} ${U} 的正方體，哪一個體積大？大多少？`,answer:`${big}大 ${showA(dd,mode,ctx)} ${U3}`,sig:`vx:${plain(a)}:${plain(b)}:${plain(c)}:${s.n}`,verify:()=>eq(add(V2,d),mul(c,mul(a,b)))}});
 const surface=unit("surface","長方體與正方體的表面積","表面積＝六個面的面積和；長方體＝（長×寬＋長×高＋寬×高）×2，正方體＝邊長×邊長×6。",ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),M=L===0?10:L===1?15:25,kind=L===0?pick(["box","cube","face"]):L===1?pick(["box","cube","open"]):pick(["open","glue","cut","reverse"]);
  const S6=(a,b,c)=>add(add(add(mul(a,b),mul(a,b)),add(mul(a,c),mul(a,c))),add(mul(b,c),mul(b,c)));

  if(kind==="cube"){const [a]=dims(mode,L,1,M),S=mul(mul(a,a),R(6));return{expr:`${cubeFig(a)}正方體的邊長 ${show(a,mode,ctx)} ${U}，求表面積。`,answer:`${showA(S,mode,ctx)} ${U2}`,sig:`sc:${plain(a)}`,verify:()=>eq(S,S6(a,a,a))}}
  if(kind==="face"){const [a,b,c]=dims(mode,L,3,M);if(eq(a,b)||eq(b,c)||eq(a,c))return null;const s=[mul(a,b),mul(a,c),mul(b,c)].sort((x,y)=>sub(x,y).n),big=s[2];return{expr:`長方體的長 ${show(a,mode,ctx)} ${U}、寬 ${show(b,mode,ctx)} ${U}、高 ${show(c,mode,ctx)} ${U}，面積最大的一面是多少？這樣的面有幾個？`,answer:`${showA(big,mode,ctx)} ${U2}；2 個`,sig:`sf:${plain(a)}:${plain(b)}:${plain(c)}`,verify:()=>[mul(a,b),mul(a,c),mul(b,c)].every(x=>sub(big,x).n>=0)}}
  if(kind==="open"){const [a,b,c]=dims(mode,L,3,M),S=add(mul(a,b),mul(add(mul(a,c),mul(b,c)),R(2)));return{expr:`${boxFig(a,b,c)}做一個沒有蓋子的長方體紙盒，長 ${show(a,mode,ctx)} ${U}、寬 ${show(b,mode,ctx)} ${U}、高 ${show(c,mode,ctx)} ${U}，至少要用多少紙板？`,answer:`${showA(S,mode,ctx)} ${U2}（少了上面一面）`,sig:`so:${plain(a)}:${plain(b)}:${plain(c)}`,verify:()=>eq(add(S,mul(a,b)),S6(a,b,c))}}
  if(kind==="glue"){const n=rand(2,4),[a]=dims(mode,L,1,12),S=mul(mul(a,a),R(4*n+2));return{expr:`${n} 個邊長 ${show(a,mode,ctx)} ${U} 的正方體排成一排黏在一起，求新形體的表面積。`,answer:`${showA(S,mode,ctx)} ${U2}`,sig:`sg:${n}:${plain(a)}`,verify:()=>eq(S,S6(mul(a,R(n)),a,a))}}

  const a=R(rand(2,20)),S=mul(mul(a,a),R(6)),V=mul(mul(a,a),a);return{expr:`正方體的表面積 ${S.n} ${U2}，求它的邊長與體積。`,answer:`邊長 ${a.n} ${U}；體積 ${V.n} ${U3}`,sig:`sr:${a.n}`,verify:()=>eq(mul(mul(a,a),R(6)),S)&&V.n===a.n**3}});
 const prism=unit("prism","柱體的體積","柱體體積＝底面積×高；三角柱的底是三角形、梯形柱的底是梯形、圓柱的底是圓。圓周率依勾選：整數取 3、小數取 3.14、分數以 π 表示。",ctx=>{

 const composite=unit("composite","複合形體的體積","可以切成幾塊長方體相加，也可以補成一個大長方體再扣掉缺的部分；兩種算法答案要一樣。",ctx=>{

 /* M5 速率（2026-09-24，Claude）。

 const lv=ctx=>ctx.level==="challenge"?2:ctx.level==="advanced"?1:0;

 const tVal=(mode,L)=>{if(mode==="decimal"){let n=rand(5,L===0?40:60);while(n%10===0)n=rand(5,60);return R(n,10)}if(mode==="fraction"){const d=pick([2,3,4,5,6]);let n=rand(d+1,3*d);while(n%d===0)n=rand(d+1,3*d);return R(n,d)}return R(rand(2,L===0?5:8))};

 return{title:"解未知數",symbol:"x",subtitle:"一步驟逆算・兩步驟算式・括號・代數式求值",instruction:"解出未知數或求代數式的值，將過程寫在「原式＝」後面。",modes:["integer","fraction","decimal"],mixed:true,levels:{basic:"基礎：一步驟、整數與較小數值。",advanced:"進階：兩步驟並加入分數、小數。",challenge:"挑戰：括號、混合運算與較複雜係數。"},units:[equation("add","一步驟加減運算","利用加減互為逆運算，把已知數移到另一邊。","add"),equation("mul","一步驟乘除運算","利用乘除互為逆運算，求出未知數。","mul"),equation("same","同級兩步驟運算","加減同級，依相反順序逐步逆算。","same"),equation("mixed","兩步驟四則逆算","先逆算加減，再逆算乘除。","mixed"),equation("bracket","含括號的未知數算式","先把括號看成一個數，逆算後再解括號內。","bracket"),equation("eval","代數式求值","把未知數的值代入，再依運算順序計算。","eval")],presets:{basic:{add:3,mul:3,same:2,eval:2},advanced:{add:2,mul:2,same:2,mixed:2,bracket:2,eval:2},challenge:{same:2,mixed:3,bracket:3,eval:3}}}

function simplifyConfig(){
 const unit=(id,name,tip,kind)=>({id,name,tip,modes:["integer","fraction","decimal"],gen(ctx){const mode=pick(ctx.modes),a=numberFor(mode,ctx.level,9),b=numberFor(mode,ctx.level,9),c=numberFor(mode,ctx.level,8),d=numberFor(mode,ctx.level,6);let expr,v,verify;if(kind==="order"){v=add(a,mul(b,c));expr=`${numHTML(a,mode)} ＋ ${numHTML(b,mode)} × ${numHTML(c,mode)}＝？`;verify=()=>eq(add(a,mul(b,c)),v)}else if(kind==="add"){const base=mode==="integer"?R(10):R(1),first=mode==="integer"?R(rand(1,9)):mode==="fraction"?(()=>{const den=pick([2,3,4,5,6,8,10]);return R(rand(1,den-1),den)})():R(rand(1,9),10),pair=sub(base,first),v2=add(add(first,b),pair);v=v2;expr=`${numHTML(first,mode)} ＋ ${numHTML(b,mode)} ＋ ${numHTML(pair,mode)}＝？`;verify=()=>eq(add(add(first,b),pair),v)}else if(kind==="sub"){const total=add(add(a,b),c);v=sub(sub(total,a),b);expr=`${numHTML(total,mode)} − ${numHTML(a,mode)} − ${numHTML(b,mode)}＝？`;verify=()=>eq(sub(sub(total,a),b),v)}else if(kind==="bracket"){if(b.n*c.d<=c.n*b.d)return null;const first=add(a,b);v=sub(first,sub(b,c));expr=`${numHTML(first,mode)} −（${numHTML(b,mode)} − ${numHTML(c,mode)}）＝？`;verify=()=>eq(sub(first,sub(b,c)),v)}else if(kind==="muldiv"){const k=numberFor(mode,ctx.level,5),total=mul(mul(a,b),k);v=div(div(total,a),b);expr=`${numHTML(total,mode)} ÷ ${numHTML(a,mode)} ÷ ${numHTML(b,mode)}＝？`;verify=()=>eq(div(div(total,a),b),v)}else{v=add(mul(a,c),mul(b,c));expr=`${numHTML(a,mode)} × ${numHTML(c,mode)} ＋ ${numHTML(b,mode)} × ${numHTML(c,mode)}＝？`;verify=()=>eq(mul(add(a,b),c),v)}if(mode==="integer"&&v.d!==1)return null;if(mode==="decimal"&&(places(v)<0||places(v)>5))return null;return{expr,answer:numHTML(v,mode,{mixed:ctx.mixed,answer:true}),sig:`${id}:${mode}:${plain(a)}:${plain(b)}:${plain(c)}:${plain(d)}`,verify}}});
 return{title:"四則簡化計算",symbol:"∑",subtitle:"運算順序・結合律・分配律・加減乘除簡化",instruction:"運用運算順序與簡化方法計算，過程寫在「原式＝」後面。",modes:["integer","fraction","decimal"],mixed:true,levels:{basic:"基礎：兩至三項、整數與單一簡化方法。",advanced:"進階：加入分數、小數及括號。",challenge:"挑戰：多項連算並靈活運用運算律。"},units:[unit("order","四則運算順序與括號","有括號先算括號；再乘除，最後加減。","order"),unit("add","連加法簡化","利用交換律、結合律，把能湊整的數先相加。","add"),unit("sub","連減法簡化","連減兩數，等於減去這兩數的和。","sub"),unit("bracket","加減混合與去括號","括號前是減號，去括號後各項要變號。","bracket"),unit("muldiv","連乘與連除簡化","乘除同級，可先把容易整除的數結合。","muldiv"),unit("dist","乘法分配律","共同乘數可提出：a×c＋b×c＝(a＋b)×c。","dist")],presets:{basic:{order:2,add:2,sub:2,bracket:2,muldiv:2},advanced:{order:2,add:2,sub:2,bracket:2,muldiv:2,dist:2},challenge:{order:2,add:2,sub:2,bracket:2,muldiv:2,dist:2}}}

const primeFactors=n=>{const out={};for(let p=2;p*p<=n;p++)while(n%p===0){out[p]=(out[p]||0)+1;n/=p}if(n>1)out[n]=(out[n]||0)+1;return out},factorHTML=m=>Object.entries(m).map(([p,e])=>e===1?p:`${p}<sup>${e}</sup>`).join(" × "),factorValue=m=>Object.entries(m).reduce((v,[p,e])=>v*Number(p)**e,1),gcdMany=a=>a.reduce((x,y)=>gcd(x,y)),lcm2=(a,b)=>a/gcd(a,b)*b,lcmMany=a=>a.reduce(lcm2,1),bruteGcd=a=>{for(let d=Math.min(...a);d>=1;d--)if(a.every(x=>x%d===0))return d;return 1},bruteLcm=a=>{let n=Math.max(...a);while(!a.every(x=>n%x===0))n++;return n};
function gcdConfig(){
 const nums=(count,level)=>Array.from({length:count},()=>rand(level==="basic"?12:40,level==="challenge"?500:220));
 const unit=(id,name,tip,kind,count)=>({id,name,tip,modes:["integer"],gen(ctx){if(kind==="factor"){const n=rand(ctx.level==="basic"?12:60,ctx.level==="challenge"?900:350),m=primeFactors(n);if(Object.values(m).reduce((x,y)=>x+y,0)<2)return null;return{expr:`將 ${n} 做質因數分解。`,answer:`${n}＝${factorHTML(m)}`,sig:`pf:${n}`,verify:()=>factorValue(m)===n&&Object.keys(m).every(p=>Object.keys(primeFactors(+p)).length===1)}}const a=kind==="lcm"?Array.from({length:count},(_,i)=>rand(2,12)*(i+2)*rand(1,3)):(()=>{const g=ctx.level==="basic"?rand(2,12):ctx.level==="challenge"?rand(6,48):rand(3,24),cmax=ctx.level==="basic"?9:ctx.level==="challenge"?30:15;return Array.from({length:count},()=>g*rand(2,cmax))})();if(kind==="gcd"&&gcdMany(a)===1)return null;if(new Set(a).size<count)return null;if(kind==="gcd"){const v=gcdMany(a);return{expr:`求（${a.join("，")}）。`,answer:String(v),sig:`gcd:${[...a].sort((x,y)=>x-y).join(":")}`,verify:()=>bruteGcd(a)===v}}if(kind==="lcm"){const v=lcmMany(a);if(v>200000)return null;return{expr:`求［${a.join("，")}］。`,answer:String(v),sig:`lcm:${[...a].sort((x,y)=>x-y).join(":")}`,verify:()=>bruteLcm(a)===v}}const A=rand(20,120),B=rand(20,120),fa=primeFactors(A),fb=primeFactors(B),g=gcd(A,B),l=lcm2(A,B);return{expr:`A＝${factorHTML(fa)}，B＝${factorHTML(fb)}，求（A，B）與［A，B］。`,answer:`（A，B）＝${g}；［A，B］＝${l}`,sig:`fg:${Math.min(A,B)}:${Math.max(A,B)}`,verify:()=>factorValue(fa)===A&&factorValue(fb)===B&&g*l===A*B}}});
 return{title:"最大公因數與最小公倍數",symbol:"∣",subtitle:"質因數分解・最大公因數・最小公倍數・乘積式",instruction:"依題意分解或求最大公因數、最小公倍數。",modes:["integer"],mixed:false,levels:{basic:"基礎：兩數與較小整數，著重基本分解。",advanced:"進階：加入三數與較大的合成數。",challenge:"挑戰：較大數值及乘積式綜合題。"},units:[unit("factor","質因數分解","除數必須是質數，最後寫成標準分解式。","factor",1),unit("gcd2","兩數的最大公因數","共同質因數取較小指數後相乘。","gcd",2),unit("gcd3","三數的最大公因數","找三數共有的質因數，取較小指數。","gcd",3),unit("lcm2","兩數的最小公倍數","所有質因數取較大指數後相乘。","lcm",2),unit("lcm3","三數的最小公倍數","涵蓋三數所有質因數，取較大指數。","lcm",3),unit("factored","乘積式的GCD與LCM","先比較各質因數指數，再分別取小與取大。","factored",2)],presets:{basic:{factor:2,gcd2:3,lcm2:3},advanced:{factor:2,gcd2:2,gcd3:2,lcm2:2,lcm3:2},challenge:{factor:2,gcd2:2,gcd3:2,lcm2:2,lcm3:2,factored:2}}}

const CONFIGS={arithmetic:arithmeticConfig,ratio:ratioConfig,time:timeConfig,unknown:unknownConfig,simplify:simplifyConfig,gcd:gcdConfig,units:unitsConfig,area:areaConfig,circle:circleConfig,volume:volumeConfig,speed:speedConfig,basecompare:basecompareConfig},CFG=CONFIGS[TOPIC_KEY]();
let state={level:"advanced",groups:[],paper:null,mixed:true};
function safeQuestion(unit,ctx,seen){for(let i=0;i<50;i++){try{const q=unit.gen(ctx);if(!okResult(q))continue;const key=norm(q.sig||q.expr);if(seen.has(key))continue;seen.add(key);return q}catch(e){if(i===49)console.warn("出題失敗",unit.id,e)}}console.warn("超過50次仍無法產生不重複且可驗證的題目",unit.id);return null}

function build(){const sel=$("topicSel");TOPICS.forEach(([k,n])=>{const o=document.createElement("option");o.value=k;o.textContent=n;if(k===TOPIC_KEY)o.selected=true;sel.appendChild(o)});sel.addEventListener("change",()=>{location.search="?topic="+sel.value});$("topicTitle").textContent=CFG.title;$("topicLogo").textContent=CFG.symbol||"∑";document.title="百宏文教｜"+CFG.title+" 出題器";const can=document.querySelector('link[rel="canonical"]');if(can)can.href="https://www.bhcs.com.tw/tools/math/g6-drills.html?topic="+TOPIC_KEY;$("subtitle").textContent=CFG.subtitle;$("difficultyNote").textContent=CFG.levels.advanced;const mb=$("modeBoxes");CFG.modes.forEach(m=>{const label=document.createElement("label");label.className="choice";label.innerHTML=`<input type="checkbox" data-mode="${m}" checked>${(CFG.modeLabels||MODE_LABEL)[m]}`;mb.appendChild(label)});if(CFG.mixed){const label=document.createElement("label");label.className="choice";label.innerHTML='<input id="mixedNumber" type="checkbox" checked>可用帶分數';mb.appendChild(label)}const grid=$("unitGrid");CFG.units.forEach(u=>{const box=document.createElement("div");box.className="unit";box.innerHTML=`<input class="unit-check" id="unit-${u.id}" type="checkbox" data-unit="${u.id}"><label for="unit-${u.id}">${u.name}</label><input class="count" type="number" min="1" max="40" value="1" data-count="${u.id}" aria-label="${u.name}題數">`;grid.appendChild(box)});grid.addEventListener("change",e=>{if(e.target.matches(".unit-check"))grid.querySelector(`[data-count='${e.target.dataset.unit}']`).disabled=!e.target.checked;markChanged();updateTotal()});grid.addEventListener("input",e=>{if(e.target.matches(".count")){e.target.value=Math.max(1,Math.min(40,Number(e.target.value)||1));markChanged();updateTotal()}});applyPreset("advanced")}

function applyPreset(level){state.level=level;const p=CFG.presets[level];CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`),v=p[u.id]||0;c.checked=v>0;n.disabled=!c.checked;n.value=v||1});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("difficultyNote").textContent=CFG.levels[level];updateTotal();markChanged()}

function updateTotal(){$("total").textContent=`共 ${selectedUnits().reduce((s,u)=>s+u.count,0)} 題`}function markChanged(){$("status").textContent="設定已變更，按「重新出題」套用。"}
function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Set,skipped=[];state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}。`}
