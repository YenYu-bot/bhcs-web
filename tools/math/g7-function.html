  <script>
  (()=>{"use strict";
    const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
    const R=(n,d=1)=>{if(d===0)throw Error("zero denominator");if(d<0){n=-n;d=-d}let g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>R(a.n*b.d,a.d*b.n),neg=a=>R(-a.n,a.d),sq=a=>mul(a,a);
    const frac=(n,d)=>`<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;
    const show=(a,mode,absolute=false)=>{let n=absolute?Math.abs(a.n):a.n;if(a.d===1)return String(n);if(mode==="decimal"){let v=n/a.d,s=v.toFixed(4).replace(/0+$/,"").replace(/\.$/,"");return s==="-0"?"0":s}return`${n<0?"−":""}${frac(Math.abs(n),a.d)}`};
    const isOne=a=>Math.abs(a.n)===a.d,term=(c,body,mode,first)=>{if(c.n===0)return"";let sign=c.n<0?"−":"+",mag=isOne(c)&&body?"":show(c,mode,true);return`${first?(sign==="−"?"−":""):` ${sign} `}${mag}${body}`};
    const linear=(a,b,mode,v="x")=>{let s=term(a,v,mode,true);return s+term(b,"",mode,!s)};
    const quadratic=(a,b,c,mode,v="x")=>{let s=term(a,`${v}<sup>2</sup>`,mode,true);let t=term(b,v,mode,!s);return s+t+term(c,"",mode,!(s+t))};
    const wrap=(a,mode)=>a.n<0?`(${show(a,mode)})`:show(a,mode),evalLinear=(a,b,x)=>add(mul(a,x),b),evalQuad=(a,b,c,x)=>add(add(mul(a,sq(x)),mul(b,x)),c);
    const randomNonzero=(mode,max=6)=>{if(mode==="integer")return R(pick([-1,1])*rand(1,max));if(mode==="fraction"){let n,d;do{n=pick([-1,1])*rand(1,max);d=pick([2,3,4,5])}while(Math.abs(n)%d===0);return R(n,d)}let n;do n=pick([-1,1])*rand(2,max*10);while(n%10===0);return R(n,10)};
    const randomValue=(mode,max=6,allowZero=true)=>allowZero&&Math.random()<.15?R(0):randomNonzero(mode,max);
    const answerList=(items,mode)=>items.map((v,i)=>`○${i+1} ${show(v,mode)}`).join("　");
    const defs=[["linearValue","一次函數值",3],["quadraticValue","二次函數值",3],["constantValue","常數函數",2],["combinedValue","函數值綜合運算",2],["piecewise","分段函數",2],["solveInput","由函數值反求輸入",2],["linearCoeff","反求一次函數係數",2],["quadraticCoeff","反求二次函數係數",2],["replaceFunction","函數替換",2],["composite","複合函數",2],["sumValues","連續函數值總和",2],["nested","巢狀函數值",2]];
    const presets={foundation:{linearValue:5,quadraticValue:4,constantValue:2,combinedValue:3,solveInput:2},standard:{linearValue:3,quadraticValue:3,combinedValue:3,piecewise:2,solveInput:2,linearCoeff:2,composite:2,nested:1,sumValues:2},challenge:{combinedValue:2,piecewise:3,solveInput:2,linearCoeff:3,quadraticCoeff:3,replaceFunction:3,composite:2,sumValues:2,nested:2},mixed:{linearValue:2,quadraticValue:2,constantValue:1,combinedValue:2,piecewise:2,solveInput:2,linearCoeff:2,quadraticCoeff:2,replaceFunction:2,composite:2,sumValues:2,nested:2}};
    const levelName={foundation:"基礎",standard:"進階",challenge:"挑戰",mixed:"綜合"},notes={foundation:"基礎：直接代入一次、二次與常數函數，搭配簡單函數值運算。",standard:"進階：加入分段函數、反求輸入、一次函數係數與複合函數。",challenge:"挑戰：著重反求係數、函數替換、分段判斷與多步驟綜合題。",mixed:"綜合：各類題型平均取題，適合單元總複習或測驗。"};
    const state={level:"standard",questions:[]};
    const chosenModes=()=>[...document.querySelectorAll("[data-number]:checked")].map(x=>x.dataset.number);
    const q=(type,html,answer,long=false)=>({type,html,answer,long});
    const generators={
      linearValue(mode){let a=randomNonzero(mode),b=randomValue(mode),x=randomValue(mode,5),y=evalLinear(a,b,x);return q("一次函數值",`設 f(x) = ${linear(a,b,mode)}，求 f(${wrap(x,mode)})。`,show(y,mode))},
      quadraticValue(mode){let a=randomNonzero(mode,4),b=randomValue(mode,5),c=randomValue(mode,6),x=randomValue(mode,4),y=evalQuad(a,b,c,x);return q("二次函數值",`設 f(x) = ${quadratic(a,b,c,mode)}，求 f(${wrap(x,mode)})。`,show(y,mode),true)},
      constantValue(mode){let k=randomNonzero(mode,8),xs=[R(-2),R(5),R(100)],ans=k;return q("常數函數",`設 f(x) = ${show(k,mode)}，求 f(−2) + f(5) − f(100)。`,show(ans,mode))},
      combinedValue(mode){let a=randomNonzero(mode),b=randomValue(mode),x1=R(rand(-4,-1)),x2=R(rand(1,5)),y1=evalLinear(a,b,x1),y2=evalLinear(a,b,x2);if(Math.random()<.5)return q("函數值運算",`設 f(x) = ${linear(a,b,mode)}，求 f(${show(x1,mode)}) + f(${show(x2,mode)})。`,show(add(y1,y2),mode),true);return q("函數值運算",`設 f(x) = ${linear(a,b,mode)}，求 f(${show(x1,mode)}) × f(${show(x2,mode)})。`,show(mul(y1,y2),mode),true)},
      piecewise(mode){let a=randomNonzero(mode,4),b=randomValue(mode,5),c=randomNonzero(mode,3),d=randomValue(mode,4),x1=R(rand(-4,-1)),x2=R(rand(1,4)),y1=evalLinear(a,b,x1),y2=evalQuad(c,R(0),d,x2);let cases=`<span class="cases"><span class="brace">{</span><span class="case-row">${linear(a,b,mode)}，x＜0</span><span class="case-row">${quadratic(c,R(0),d,mode)}，x≥0</span></span>`;return q("分段函數",`設 f(x) = ${cases}，求：① f(${show(x1,mode)})　② f(${show(x2,mode)})。`,answerList([y1,y2],mode),true)},
      solveInput(mode){let a=randomNonzero(mode,5),b=randomValue(mode,5),root=randomValue(mode,5),target=evalLinear(a,b,root);return q("反求輸入",`設 f(x) = ${linear(a,b,mode)}。若 f(k) = ${show(target,mode)}，求 k。`,show(root,mode),true)},
      linearCoeff(mode){let a=randomNonzero(mode,5),b=randomValue(mode,5),x1=R(-1),x2=R(2),y1=evalLinear(a,b,x1),y2=evalLinear(a,b,x2);return q("反求一次函數係數",`設 f(x) = ax + b，且 f(−1) = ${show(y1,mode)}、f(2) = ${show(y2,mode)}，求 a、b。`,`a = ${show(a,mode)}，b = ${show(b,mode)}`,true)},
      quadraticCoeff(mode){let p=randomNonzero(mode,3),a=randomNonzero(mode,4),b=randomValue(mode,5),x1=R(1),x2=R(3),y1=evalQuad(p,a,b,x1),y2=evalQuad(p,a,b,x2);return q("反求二次函數係數",`設 f(x) = ${term(p,"x<sup>2</sup>",mode,true)} + ax + b，且 f(1) = ${show(y1,mode)}、f(3) = ${show(y2,mode)}，求 a、b。`,`a = ${show(a,mode)}，b = ${show(b,mode)}`,true)},
      replaceFunction(mode){let a=randomNonzero(mode,4),b=randomValue(mode,5),shift=rand(1,4),m=rand(2,3),off=rand(-4,3),t=rand(-2,4),x=t+shift,arg=m*x+off,ans=evalLinear(a,b,R(arg));let offText=off<0?` − ${Math.abs(off)}`:` + ${off}`;return q("函數替換",`已知 f(x) = ${linear(a,b,mode)}，且 g(x − ${shift}) = f(${m}x${offText})，求 g(${t})。`,show(ans,mode),true)},
      composite(mode){let a=randomNonzero(mode,4),b=randomValue(mode,4),c=randomNonzero(mode,4),d=randomValue(mode,4),x=R(rand(-3,4)),gx=evalLinear(c,d,x),ans=evalLinear(a,b,gx);return q("複合函數",`設 f(x) = ${linear(a,b,mode)}，g(x) = ${linear(c,d,mode)}，求 f(g(${show(x,mode)}))。`,show(ans,mode),true)},
      sumValues(mode){let a=randomNonzero(mode,4),b=randomValue(mode,5),n=rand(4,7),sum=R(0);for(let i=1;i<=n;i++)sum=add(sum,evalLinear(a,b,R(i)));return q("函數值總和",`設 f(x) = ${linear(a,b,mode)}，求 f(1) + f(2) + ⋯ + f(${n})。`,show(sum,mode),true)},
      nested(mode){let a=randomNonzero(mode,3),b=randomValue(mode,4),x=R(rand(-3,3)),fx=evalLinear(a,b,x),ans=evalLinear(a,b,fx);return q("巢狀函數",`設 f(x) = ${linear(a,b,mode)}，求 f(f(${show(x,mode)}))。`,show(ans,mode),true)}
    };
    function buildControls(){let g=$("typeGrid");defs.forEach(([id,label,count])=>{let el=document.createElement("label");el.className="type";el.innerHTML=`<input class="type-check" type="checkbox" data-check="${id}"><span class="type-name">${label}</span><input class="count" type="number" min="1" max="20" value="${count}" data-count="${id}" aria-label="${label}題數">`;g.appendChild(el)});g.querySelectorAll("[data-check]").forEach(c=>c.addEventListener("change",()=>{g.querySelector(`[data-count='${c.dataset.check}']`).disabled=!c.checked;updateTotal()}));g.querySelectorAll("[data-count]").forEach(i=>i.addEventListener("input",updateTotal))}
    function selected(){return defs.flatMap(([id,label])=>{let c=document.querySelector(`[data-check='${id}']`),n=document.querySelector(`[data-count='${id}']`);if(!c.checked)return[];let count=Math.max(1,Math.min(20,Number(n.value)||1));n.value=count;return[{id,label,count}]})}
    function updateTotal(){let n=selected().reduce((s,x)=>s+x.count,0);$("total").textContent=`共 ${n} 題`}
    function preset(level){state.level=level;let p=presets[level];defs.forEach(([id,,d])=>{let c=document.querySelector(`[data-check='${id}']`),n=document.querySelector(`[data-count='${id}']`),v=p[id];c.checked=!!v;n.disabled=!v;n.value=v||d});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("levelNote").textContent=notes[level];updateTotal();generate()}
    function generate(){let types=selected(),modes=chosenModes();if(!modes.length){state.questions=[];render();$("status").textContent="請至少選擇一種數字類型。";return}if(!types.length){state.questions=[];render();$("status").textContent="請至少勾選一種題型。";return}state.questions=[];types.forEach(t=>{for(let i=0;i<t.count;i++)state.questions.push(generators[t.id](pick(modes)))});render();$("status").textContent=`已產生 ${state.questions.length} 題，共 ${document.querySelectorAll(".paper").length} 頁 A4。`}
    function perPage(){let cols=Number($("columns").value),space=$("space").value;return{2:{compact:18,standard:12,wide:8},3:{compact:27,standard:18,wide:12},4:{compact:36,standard:24,wide:16}}[cols][space]}
    function esc(v){return v.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
    function render(){let stack=$("stack");stack.innerHTML="";if(!state.questions.length){stack.innerHTML='<div class="empty"><b>尚未產生考卷</b>請至少選擇一種數字類型與題型。</div>';return}let size=perPage(),pages=[];for(let i=0;i<state.questions.length;i+=size)pages.push(state.questions.slice(i,i+size));let modeLabel=chosenModes().map(x=>({integer:"整數",fraction:"分數",decimal:"小數"}[x])).join("／");pages.forEach((qs,pi)=>{let paper=document.createElement("section"),space=$("space").value,cols=$("columns").value,teacher=$("version").value==="teacher",start=pi*size,lineCount={compact:1,standard:2,wide:3}[space];paper.className=`paper ${space} cols-${cols}`;paper.style.setProperty("--cols",cols);paper.innerHTML=`<header class="paper-header"><div class="kicker">百宏文教・數學計算力</div><div class="title-row"><h2 class="paper-title">${esc($("title").value.trim()||"函數 計算力練習")}</h2><span class="badge">${levelName[state.level]}・${modeLabel}・${teacher?"含答案版":"學生版"}</span></div><div class="student"><div class="blank">班級：<i></i></div><div class="blank">姓名：<i></i></div><div class="blank">日期：<i></i></div><div class="blank">作答時間：<i></i></div></div></header><div class="instruction"><span><b>計算下列各題：</b>代入負數時請先加括號，並寫出必要過程。</span><span>本頁 ${qs.length} 題</span></div><div class="questions"></div><footer class="footer"><span>一次函數・函數值與應用</span><span>第 ${pi+1}／${pages.length} 頁</span></footer>`;let grid=paper.querySelector(".questions");qs.forEach((x,i)=>{let item=document.createElement("article"),lines=Array.from({length:lineCount},(_,j)=>`<div class="work-line">${j===0?'<span class="work-label">計算：</span>':''}<span class="work-rule"></span></div>`).join("");item.className=`question${x.long?" long":""}`;item.innerHTML=`<div class="qtop"><span class="qno">(${start+i+1})</span><span class="math">${x.html}</span></div><div class="work-lines">${lines}</div>${teacher?`<div class="answer">答案：${x.answer}</div>`:""}`;grid.appendChild(item)});stack.appendChild(paper)});fit()}
    function fit(){if(matchMedia("print").matches)return;let scale=Math.min(1,Math.max(.4,(innerWidth-24)/794));document.querySelectorAll(".paper").forEach(p=>p.style.zoom=scale)}
    function rerender(){render();$("status").textContent="版面已更新，題目內容未重新抽換。"}
    buildControls();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>preset(b.dataset.level)));document.querySelectorAll("[data-number]").forEach(c=>c.addEventListener("change",()=>{if(chosenModes().length)generate();else{$("status").textContent="請至少選擇一種數字類型。";state.questions=[];render()}}));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.questions.length&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",rerender));$("title").addEventListener("input",rerender);addEventListener("resize",fit);addEventListener("beforeprint",()=>document.querySelectorAll(".paper").forEach(p=>p.style.zoom=1));addEventListener("afterprint",fit);preset("standard");
