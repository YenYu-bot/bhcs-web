<script>
(()=>{"use strict";
const TOPICS=[["mulformula","乘法公式"],["polyops","多項式四則"],["factor","因式分解"],["sqrt","平方根"],["pythagoras","畢氏定理與兩點距離"],["arithseq","等差數列與等差級數"],["quadsolve","解一元二次方程式"],["quadapps","一元二次方程式應用題"],["geoseq","等比數列"],["angles","三角形與多邊形的角"],["congruence","三角形的全等性質"],["bisectors","等腰三角形、中垂線與角平分線"],["triineq","三角形的邊角關係"],["parallel","平行線與截角性質"],["quadrilateral","平行四邊形與特殊四邊形"],["construction","尺規作圖"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"geoseq",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}

 // 括號前的倍數 k、k1～k3 一律用整數（分數、小數只放在括號內的多項式），避免 2.3[…] − 1.7(…) 乘出三位小數

 const P=(c,e,m)=>c.n===1&&c.d===1&&e===1?"x":`(${MH(c,e,m)})`;   // round 3：單獨的 x 不加括號（不寫 (x)<sup>2</sup>）

 const monoDivide=mkUnit("monoDivide","單項式除法","係數相除、次數相減：axᵐ÷bxⁿ＝(a÷b)xᵐ⁻ⁿ。",[

 const longDivision=mkUnit("longDivision","多項式長除法","用長除法：每次用除式的最高次項去除被除式的最高次項，乘回去相減，直到餘式次數小於除式。",[

   const k=rand(7,15),q=rand(2,7),N=k*k*d;if(gcd(k,q)!==1||N>1500)return null;return ans(`化簡：${rt(fr2(N,q*q))}`,Q(R(k,q),d),m,()=>sr(N/(q*q)))}],"原式＝",

 const likeTerms=(m,count,ds,km=5,cm=7)=>{let items=[],raw="";const fi=rand(0,count-1);/* 分數模式只讓一項的係數是分數（分母 2 或 3），避免通分到 60 */for(let i=0;i<count;i++){const d=pick(ds),c=m==="fraction"?(i===fi?(()=>{const q=pick([2,3]);let n;do n=rand(1,3*q-1);while(n%q===0);return R((Math.random()<.5?-1:1)*n,q)})():sv("integer",cm)):sv(m,cm),k=rand(1,km);items.push({c:mul(c,R(k)),d});raw+=(raw?` ${c.n<0?"−":"＋"} `:(c.n<0?"−":""))+(Math.abs(c.n)===c.d?"":sh(R(Math.abs(c.n),c.d),m))+rt(d*k*k)}return{raw,items,f:()=>items.reduce((s,t)=>s+fv(t.c)*sr(t.d),0)}};

 const binomialDenominator=mkUnit("binomialDenominator","雙根號分母有理化","分母是 √a＋√b 時，分子分母同乘以 √a−√b，分母變成 a−b。",[

  m=>{const a=val(m,12),b=val(m,12);if(eq(a,b))return null;const M=mul(add(a,b),R(1,2));if(m==="decimal"&&!term10(M))return null;return one(`數線上 A(${sh(a,m)})、B(${sh(b,m)})，求 AB 的中點坐標與 AB 的長。`,`中點 ${sh(M,m)}，AB＝${sh(abs(sub(a,b)),m)}`,()=>near((fv(a)+fv(b))/2,fv(M)))},
  m=>{const a=val(m,9),b=add(a,R(rand(3,15))),p=rand(1,4),q=rand(1,4);if(p===q||gcd(p,q)>1)return null;const P=add(a,mul(sub(b,a),R(p,p+q)));if(m==="decimal"&&!term10(P))return null;return one(`數線上 A(${sh(a,m)})、B(${sh(b,m)})，P 在 AB 上且 AP：PB＝${p}：${q}，求 P 的坐標。`,sh(P,m),()=>near((fv(P)-fv(a))*q,(fv(b)-fv(P))*p))},

  m=>{const d=pick([2,3,5,6,7]),p=rand(-4,3),q=rand(1,5);if(p===q||!p)return null;const rr=c=>c===1?rt(d):c===-1?`−${rt(d)}`:`${String(c).replace("-","−")}${rt(d)}`;return one(`數線上 A(${rr(p)})、B(${rr(q)})，求 AB。`,`AB＝${rr(Math.abs(q-p))}`,()=>near(Math.abs(q*sr(d)-p*sr(d)),Math.abs(q-p)*sr(d)))},
  // 作圖判讀：以 A(a) 為圓心、長寬為 p、q 的長方形對角線長為半徑畫弧，交數線於 P、Q

  m=>{const a=m==="integer"?R(rand(-3,3)):val(m,3,false),[p,q]=pick([[1,1],[1,2],[2,3],[1,3],[2,2]]),n=p*p+q*q,r=radH(R(1),n,m),as=sh(a,m);return one(`在數線上，以 A(${as}) 為圓心、長 ${q}、寬 ${p} 的長方形的對角線長為半徑畫弧，交數線於 P、Q 兩點，求 P、Q 的坐標。`,a.n?`${as} ＋ ${r} 與 ${as} − ${r}`:`${r} 與 −${r}`,()=>near(sr(n),hy(p,q))&&near(fv(a)+sr(n)-fv(a),sr(n)))}],"",

 const axisDistance=mkUnit("axisDistance","水平／垂直距離","兩點的 y 坐標相同時距離＝|x₁−x₂|；x 坐標相同時距離＝|y₁−y₂|。",[

 const trOff=(m)=>{const t=tri(m),sx=Math.random()<.5?1:-1,sy=Math.random()<.5?1:-1;return{t,dx:mul(t.a,R(sx)),dy:mul(t.b,R(sy))}};
 const coordinateDistance=mkUnit("coordinateDistance","兩點距離","AB＝√[(x₁−x₂)²＋(y₁−y₂)²]。",[

  m=>{const u=rand(1,4),v=rand(1,4),t=pick([1,1,2]),x=rand(-4,4),y=rand(-4,4),kind=rand(0,2),A=[x,y],B=[x+u,y+v],C=kind===2?[x+v,y+u]:[x-t*v+(kind===1?1:0),y+t*u];if(u===v&&kind===2)return null;const d2=(P,Qp)=>(P[0]-Qp[0])**2+(P[1]-Qp[1])**2,s=[d2(A,B),d2(B,C),d2(A,C)],ss=[...s].sort((p,q)=>p-q),right=ss[0]+ss[1]===ss[2],iso=s[0]===s[1]||s[1]===s[2]||s[0]===s[2];if(ss[0]===0)return null;const lab=right&&iso?"等腰直角三角形":right?"直角三角形（不等腰）":iso?"等腰三角形（不是直角）":"既不是直角也不是等腰三角形",P3=(n,p)=>pt(n,R(p[0]),R(p[1]),"integer");return one(`${P3("A",A)}、${P3("B",B)}、${P3("C",C)}，判斷 △ABC 的形狀（等腰？直角？）。`,`${lab}（AB<sup>2</sup>＝${s[0]}，BC<sup>2</sup>＝${s[1]}，AC<sup>2</sup>＝${s[2]}）`,()=>{const e=(P,Qp)=>hy(P[0]-Qp[0],P[1]-Qp[1]);return near(e(A,B)**2,s[0])&&near(e(B,C)**2,s[1])&&near(e(A,C)**2,s[2])})}],"",

 const coordinateRadical=mkUnit("coordinateRadical","根式座標距離","兩點距離開不盡時，化為最簡根式。",[
