<script>
(()=>{"use strict";
const TOPICS=[["mulformula","乘法公式"],["polyops","多項式四則"],["factor","因式分解"],["sqrt","平方根"],["quadapps","一元二次方程式應用題"],["geoseq","等比數列"],["angles","三角形與多邊形的角"],["congruence","三角形的全等性質"],["bisectors","等腰三角形、中垂線與角平分線"],["triineq","三角形的邊角關係"],["parallel","平行線與截角性質"],["quadrilateral","平行四邊形與特殊四邊形"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"geoseq",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}
const numHTML=(a,mode,opt={})=>mode==="decimal"?decHTML(a):mode==="fraction"?fracHTML(a,opt):String(a.n).replace("-","−");
function numberFor(mode,level,max=30){if(mode==="integer"){const k=level==="basic"?2:level==="advanced"?10:25;return R(rand(level==="basic"?2:Math.max(2,Math.floor(max*k/5)),max*k))}if(mode==="fraction"){const ds=level==="basic"?[2,3,4,5,6]:[2,3,4,5,6,8,9,10,12,15,20],d=pick(ds);let n=rand(1,(level==="challenge"?3:2)*d-1);while(n%d===0)n=rand(1,3*d-1);return R(n,d)}const p=level==="basic"?1:pick(level==="advanced"?[1,2]:[1,2,3]),s=10**p;let n=rand(1,max*s);while(n%10===0)n=rand(1,max*s);return R(n,s)}

  m=>{const{raw,ts,ans}=rawTerms(m,2),x0=R(rand(-3,3)),v=ans.reduce((s,c,i)=>add(s,mul(c,R(Math.pow(x0.n,i)))),Z());return{q:`化簡 ${raw}，再求 x＝${sh(x0,m)} 時的值。`,a:`${H(ans,m)}；值為 ${sh(v,m)}`,chk:()=>near(tsev(ts,x0.n),fv(v))}}],"原式＝");

  m=>{const a=cf(m,6),e=rand(1,4);return polyAns(`計算：${P(a,e,m)}<sup>2</sup>`,mono(mul(a,a),2*e),m,x=>(fv(a)*x**e)**2)},

  m=>{const a=cf(m,4),e=rand(1,3),b=cf(m,5),f=rand(1,3);return polyAns(`計算：${P(a,e,m)}<sup>3</sup> × ${P(b,f,m)}`,mono(mul(mul(mul(a,a),a),b),3*e+f),m,x=>(fv(a)*x**e)**3*fv(b)*x**f)}],"原式＝");

 const monoDivide=mkUnit("monoDivide","單項式除法","係數相除、次數相減：axᵐ÷bxⁿ＝(a÷b)xᵐ⁻ⁿ。",[

  m=>{const d1=cf(m,4),d2=cf(m,4),q=cf(m,5),e1=rand(1,2),e2=rand(1,2),qe=rand(1,3),N=mul(mul(d1,d2),q);return polyAns(`計算：${P(N,e1+e2+qe,m)} ÷ ${P(d1,e1,m)} ÷ ${P(d2,e2,m)}`,mono(q,qe),m,x=>fv(N)*x**(e1+e2+qe)/(fv(d1)*x**e1)/(fv(d2)*x**e2))},
  m=>{const a=cf(m,5),b=cf(m,5),c=cf(m,4),e1=rand(2,4),e2=rand(2,4),e3=rand(1,3),q=div(mul(a,b),c);if(m==="decimal"&&!term10ok(q))return null;return polyAns(`計算：${P(a,e1,m)}${P(b,e2,m)} ÷ ${P(c,e3,m)}`,mono(q,e1+e2-e3),m,x=>fv(a)*x**e1*fv(b)*x**e2/(fv(c)*x**e3))},
  m=>{const a=cf(m,5),b=cf(m,4),e=rand(2,3),f=rand(1,2*e-1),q=div(mul(a,a),b);if(m==="decimal"&&!term10ok(q))return null;return polyAns(`計算：${P(a,e,m)}<sup>2</sup> ÷ ${P(b,f,m)}`,mono(q,2*e-f),m,x=>(fv(a)*x**e)**2/(fv(b)*x**f))}],"原式＝");
 function term10ok(a){let d=a.d;while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1}

 const fv=a=>a.n/a.d,near=(u,v)=>Math.abs(u-v)<1e-7*Math.max(1,Math.abs(v)),Z=()=>R(0),neg=a=>R(-a.n,a.d),sq=a=>mul(a,a),sr=Math.sqrt;
 const term10=a=>{let d=a.d;while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1};
 const sh=(a,mode)=>{const s=numHTML(R(Math.abs(a.n),a.d),a.d===1?"integer":mode==="decimal"?"decimal":"fraction",{mixed:false});return(a.n<0?"−":"")+s};
 const rt=x=>`√<span style="border-top:1px solid currentColor;padding:0 1px">${x}</span>`;
 const SF=[2,3,5,6,7,10,11,13,14,15,17,19,21,22,23,26,29,30];
 const simp=n=>{let o=1,i=n;for(let p=2;p*p<=i;p++)while(i%(p*p)===0){i/=p*p;o*=p}return{o,i}};
 // 根式運算式：[{c:R,d:整數}]，d＝1 為有理數
 const En=e=>{const m=new Map;e.forEach(t=>{const s=simp(t.d),c=mul(t.c,R(s.o));m.set(s.i,add(m.get(s.i)||Z(),c))});return[...m].map(([d,c])=>({c,d})).filter(t=>t.c.n!==0).sort((a,b)=>a.d-b.d)};
 const Ea=(...es)=>En(es.flat()),Es=(e,k)=>En(e.map(t=>({c:mul(t.c,k),d:t.d}))),Em=(a,b)=>En(a.flatMap(s=>b.map(t=>({c:mul(s.c,t.c),d:s.d*t.d})))),Eneg=e=>Es(e,R(-1));
 const Ev=e=>e.reduce((s,t)=>s+fv(t.c)*sr(t.d),0),Q=(c,d=1)=>[{c,d}];
 const Einv=e=>{e=En(e);if(e.length===1){const{c,d}=e[0];return En([{c:div(R(1),mul(c,R(d))),d}])}if(e.length===2){const cj=[e[0],{c:neg(e[1].c),d:e[1].d}],den=Em(e,cj);if(den.length!==1||den[0].d!==1)return null;return Es(cj,div(R(1),den[0].c))}return null};
 const Eh=(e,mode)=>{e=En(e);if(!e.length)return"0";return e.map((t,i)=>{const a=R(Math.abs(t.c.n),t.c.d),mag=t.d===1?sh(a,mode):(a.n===a.d?"":sh(a,mode))+rt(t.d);return(i?` ${t.c.n<0?"−":"＋"} `:(t.c.n<0?"−":""))+mag}).join("")};
 const okE=(e,mode)=>mode!=="decimal"||En(e).every(t=>term10(t.c));
 const val=(mode,max=8,pos=true)=>{const s=pos?1:(Math.random()<.5?-1:1);if(mode==="integer")return R(s*rand(1,max>=12?max+10:max));if(mode==="fraction"){const d=pick([2,3,4,5]);let n;do n=rand(1,Math.min(max*d-1,3*d-1));while(n%d===0);return R(s*n,d)}let n;do n=rand(1,Math.min(max,4)*10-1);while(n%10===0);return R(s*n,10)};
 const sv=(m,x)=>val(m,x,false),pv=(m,x)=>val(m,x,true),sf=k=>pick(SF.slice(0,k));
 const P=(e,mode)=>`(${Eh(e,mode)})`;
 const fr2=(a,b)=>`<span class="fr"><span class="n">${a}</span><span class="d">${b}</span></span>`;
 const ans=(q,e,mode,f)=>okE(e,mode)?{q,a:Eh(e,mode),chk:()=>near(f(),Ev(e))}:null;
 const mkUnit=(id,name,tip,kinds,label)=>({id,name,tip,modes:["integer","fraction","decimal"],answerLabel:label,gen:ctx=>{
  const Lv=lv(ctx),mode=ctx.modes[0],k=kinds[pick([[0,1,2],[1,2,3],[2,3,4]][Lv])];let r;try{r=k(mode,Lv)}catch(e){return null}if(!r)return null;
  return{expr:r.q,answer:r.a,sig:`${id}:`+r.q.replace(/<[^>]+>/g,""),verify:r.chk};
 }});

 const rootMeaning=mkUnit("rootMeaning","平方根的意義","若 x²＝a（a≧0），x 就是 a 的平方根；正數有兩個平方根，互為相反數；負數沒有實數平方根。",[
  m=>{const a=pv(m,12),n=sq(a);return{q:`求 ${sh(n,m)} 的平方根。`,a:`±${sh(a,m)}`,chk:()=>near(fv(a)**2,fv(n))}},
  m=>{const a=pv(m,12),n=sq(a);return{q:`若 x<sup>2</sup>＝${sh(n,m)}，求 x。`,a:`x＝±${sh(a,m)}`,chk:()=>near(fv(a)**2,fv(n))}},
  m=>{const a=pv(m,10),n=neg(sq(a));return{q:`${sh(n,m)} 有沒有平方根？說明理由。`,a:`沒有（任何數的平方都不會是負數）`,chk:()=>fv(n)<0}},
  m=>{const a=pv(m,12),n=sq(a);return{q:`寫出 ${sh(n,m)} 的負平方根。`,a:`−${sh(a,m)}`,chk:()=>near((-fv(a))**2,fv(n))}},
  m=>{const a=pv(m,12),n=sq(a);return{q:`若 p、q 是 ${sh(n,m)} 的兩個平方根，求 p＋q 與 pq。`,a:`p＋q＝0，pq＝${sh(neg(n),m)}`,chk:()=>near(fv(a)*(-fv(a)),-fv(n))}}],"");

  m=>{const a=sv(m,12);return ans(`求值：${rt(`(${sh(a,m)})<sup>2</sup>`)}`,Q(R(Math.abs(a.n),a.d)),m,()=>sr(fv(a)**2))},

 const simplify=mkUnit("simplify","最簡根式","把根號內的平方因數開出來：√(k²d)＝k√d，直到根號內沒有平方因數。",[

  m=>{const x=rand(2,20),y=rand(2,20);if(simp(x*y).o===1)return null;return ans(`化簡：${rt(x)} × ${rt(y)}`,Q(R(1),x*y),m,()=>sr(x)*sr(y))},

  m=>{let n;do n=rand(2,99);while(Number.isInteger(sr(n)));const lo=Math.floor(sr(n));return{q:`設 ${rt(n)} 的整數部分為 a、小數部分為 b，求 a 與 b。`,a:`a＝${lo}，b＝${rt(n)} − ${lo}`,chk:()=>lo<sr(n)&&sr(n)-lo<1}},

 const notation=mkUnit("notation","根式簡記","數字與根式相乘，係數相乘，根號照寫：a×b√d＝ab√d；係數可以移進根號：a√b＝√(a²b)。",[

 const pr=()=>{const a=pick([5,6,7,10,11,13,17]),b=pick([2,3,5,6,7].filter(x=>x<a));return[a,b]};
 const binomialDenominator=mkUnit("binomialDenominator","雙根號分母有理化","分母是 √a＋√b 時，分子分母同乘以 √a−√b，分母變成 a−b。",[
  m=>{const c=sv(m,8),[a,b]=pr(),D=Ea(Q(R(1),a),Q(R(1),b));return ans(`化簡：${fr2(sh(c,m),`${rt(a)} ＋ ${rt(b)}`)}`,Es(Einv(D),c),m,()=>fv(c)/(sr(a)+sr(b)))},
  m=>{const c=sv(m,8),[a,b]=pr(),D=Ea(Q(R(1),a),Q(R(-1),b));return ans(`化簡：${fr2(sh(c,m),`${rt(a)} − ${rt(b)}`)}`,Es(Einv(D),c),m,()=>fv(c)/(sr(a)-sr(b)))},
  m=>{const c=sv(m,8),k=rand(2,6),d=sf(8);if(k*k===d)return null;const D=Ea(Q(R(k)),Q(R(1),d));return ans(`化簡：${fr2(sh(c,m),`${k} ＋ ${rt(d)}`)}`,Es(Einv(D),c),m,()=>fv(c)/(k+sr(d)))},
  m=>{const[a,b]=pr(),D=Ea(Q(R(1),a),Q(R(1),b));return ans(`化簡：${fr2(rt(a),`${rt(a)} ＋ ${rt(b)}`)}`,Em(Q(R(1),a),Einv(D)),m,()=>sr(a)/(sr(a)+sr(b)))},
  m=>{const[a,b]=pr(),N=Ea(Q(R(1),a),Q(R(1),b)),D=Ea(Q(R(1),a),Q(R(-1),b));return ans(`化簡：${fr2(`${rt(a)} ＋ ${rt(b)}`,`${rt(a)} − ${rt(b)}`)}`,Em(N,Einv(D)),m,()=>(sr(a)+sr(b))/(sr(a)-sr(b)))}],"原式＝");

 const mixed=mkUnit("mixed","根式綜合","先用乘法公式或分配律展開，再把根式化簡、合併同類方根。",[
  m=>{const[A,B]=two(m),s=pick([1,-1]),S=Ea(A,s>0?B:Eneg(B));return ans(`化簡：(${Eh(A,m)} ${s>0?"＋":"−"} ${Eh(B,m)})<sup>2</sup>`,Em(S,S),m,()=>(Ev(A)+s*Ev(B))**2)},
  m=>{const x=sf(8),y=sf(8),z=pick(SF.slice(0,8).filter(v=>v!==y)),A=Q(R(1),x),B=Ea(Q(R(1),y),Q(R(1),z));return ans(`化簡：${rt(x)}(${Eh(B,m)})`,Em(A,B),m,()=>sr(x)*(sr(y)+sr(z)))},
  m=>{const[A,B]=two(m),[C,D]=two(m),X=Ea(A,B),Y=Ea(C,Eneg(D));return ans(`化簡：(${Eh(A,m)} ＋ ${Eh(B,m)})(${Eh(C,m)} − ${Eh(D,m)})`,Em(X,Y),m,()=>(Ev(A)+Ev(B))*(Ev(C)-Ev(D)))},
  m=>{const x=sf(8),y=pick(SF.slice(0,8).filter(v=>v!==x)),X=Ea(Q(R(1),x),Q(R(1),y)),Y=Ea(Q(R(1),x),Q(R(-1),y));return{q:`設 a＝${rt(x)} ＋ ${rt(y)}、b＝${rt(x)} − ${rt(y)}，求 a<sup>2</sup>＋b<sup>2</sup> 與 ab。`,a:`a<sup>2</sup>＋b<sup>2</sup>＝${Eh(Ea(Em(X,X),Em(Y,Y)),m)}，ab＝${Eh(Em(X,Y),m)}`,chk:()=>near((sr(x)+sr(y))**2+(sr(x)-sr(y))**2,2*(x+y))&&near((sr(x)+sr(y))*(sr(x)-sr(y)),x-y)}},
  m=>{const x=sf(8),y=pick(SF.slice(0,8).filter(v=>v!==x)),X=Ea(Q(R(1),x),Q(R(1),y)),Y=Ea(Q(R(1),x),Q(R(-1),y)),S=Ea(Em(X,Einv(Y)),Em(Y,Einv(X)));return ans(`化簡：${fr2(`${rt(x)} ＋ ${rt(y)}`,`${rt(x)} − ${rt(y)}`)} ＋ ${fr2(`${rt(x)} − ${rt(y)}`,`${rt(x)} ＋ ${rt(y)}`)}`,S,m,()=>(sr(x)+sr(y))/(sr(x)-sr(y))+(sr(x)-sr(y))/(sr(x)+sr(y)))}],"原式＝");

 const tel=(i,st)=>fr2("1",`${rt(i)} ＋ ${rt(i+st)}`);
 const telescoping=mkUnit("telescoping","連鎖有理化","每一項有理化後是 √(n＋1)−√n，相加時中間的項互相抵消。",[
  m=>{const N=pick([3,4,5,6,7,8,9,10]),parts=[];for(let i=1;i<=N;i++)parts.push(tel(i,1));return ans(`化簡：${parts.length>4?parts.slice(0,2).join(" ＋ ")+" ＋ ⋯ ＋ "+parts[parts.length-1]:parts.join(" ＋ ")}`,Ea(Q(R(1),N+1),Q(R(-1))),m,()=>{let s=0;for(let i=1;i<=N;i++)s+=1/(sr(i)+sr(i+1));return s})},
  m=>{const s0=rand(2,6),N=s0+rand(3,10),parts=[];for(let i=s0;i<=N;i++)parts.push(tel(i,1));return ans(`求 ${parts.slice(0,2).join(" ＋ ")} ＋ ⋯ ＋ ${parts[parts.length-1]} 的值。`,Ea(Q(R(1),N+1),Q(R(-1),s0)),m,()=>{let s=0;for(let i=s0;i<=N;i++)s+=1/(sr(i)+sr(i+1));return s})},
  m=>{const c=pv(m,5),N=pick([3,4,5,6,7,8,9,10]);return ans(`化簡：${sh(c,m)}（${tel(1,1)} ＋ ${tel(2,1)} ＋ ⋯ ＋ ${tel(N,1)}）`,Es(Ea(Q(R(1),N+1),Q(R(-1))),c),m,()=>{let s=0;for(let i=1;i<=N;i++)s+=1/(sr(i)+sr(i+1));return fv(c)*s})},
  m=>{const N=pick([5,7,9,11,13,15,17,19,23]);return ans(`化簡（每項分母兩個根號內的數相差 2）：${tel(1,2)} ＋ ${tel(3,2)} ＋ ⋯ ＋ ${tel(N,2)}`,Es(Ea(Q(R(1),N+2),Q(R(-1))),R(1,2)),m,()=>{let s=0;for(let i=1;i<=N;i+=2)s+=1/(sr(i)+sr(i+2));return s})},
  m=>{const k=rand(2,9),N=(k+1)*(k+1)-1;return{q:`若 ${tel(1,1)} ＋ ${tel(2,1)} ＋ ⋯ ＋ ${fr2("1",`${rt("n")} ＋ ${rt("n＋1")}`)}＝${k}，求 n。`,a:`n＝${N}`,chk:()=>{let s=0;for(let i=1;i<=N;i++)s+=1/(sr(i)+sr(i+1));return near(s,k)}}}],"原式＝");

 return{title:"平方根",symbol:"√",subtitle:"平方根的意義・正平方根・根號與絕對值・最簡根式・估算・根式的乘除・有理化・同類方根・共軛・綜合・連鎖有理化",instruction:"根式化為最簡根式，分母有理化。",modes:["integer","fraction","decimal"],mixed:false,answerLabel:"原式＝",
  levels:{basic:"基礎：平方根的意義、正平方根、√(a²)、最簡根式、估算、簡記、根式乘除與有理化、同類方根、共軛根式、雙根號分母有理化。",advanced:"進階：負平方根、兩根號加減、代入求 √((x−c)²)、係數在外的根式、三個根式相乘、連除、根式平方、有理數＋根號的分母。",challenge:"挑戰：兩平方根的和與積、化簡 √((x−c)²)、根號內分數、整數與小數部分、比大小、括號內的加減、平方差、(a＋b)²−(a−b)²、a²＋b² 與 ab、奇數項連鎖與反求 n。"},
  units:[rootMeaning,principalRoot,absoluteRoot,simplify,estimate,notation,multiplyRadicals,divideRadicals,rationalize,addRadicals,conjugate,binomialDenominator,mixed,telescoping],
  presets:{basic:{rootMeaning:2,principalRoot:2,absoluteRoot:2,simplify:3,estimate:2,notation:2,multiplyRadicals:2,rationalize:2},advanced:{principalRoot:2,absoluteRoot:2,simplify:2,estimate:2,multiplyRadicals:2,divideRadicals:2,rationalize:2,addRadicals:2,conjugate:2,binomialDenominator:2},challenge:{simplify:2,estimate:2,divideRadicals:2,addRadicals:2,conjugate:2,binomialDenominator:2,mixed:3,telescoping:2}}};
}

const CONFIGS={mulformula:mulformulaConfig,polyops:polyopsConfig,factor:factorConfig,sqrt:sqrtConfig,quadapps:quadappsConfig,triineq:triineqConfig,geoseq:geoseqConfig,angles:anglesConfig,congruence:congruenceConfig,bisectors:bisectorsConfig,parallel:parallelConfig,quadrilateral:quadrilateralConfig},CFG=CONFIGS[TOPIC_KEY]();
let state={level:"advanced",groups:[],paper:null,mixed:true};
function safeQuestion(unit,ctx,seen){for(let i=0;i<50;i++){try{const q=unit.gen(ctx);if(!okResult(q))continue;const key=norm(q.sig||q.expr);if(seen.has(key))continue;seen.add(key);return q}catch(e){if(i===49)console.warn("出題失敗",unit.id,e)}}console.warn("超過50次仍無法產生不重複且可驗證的題目",unit.id);return null}
globalThis.__BHCS_TEST__={CFG,R,add,sub,mul,div,eq,safeQuestion,okResult};
if(typeof document==="undefined")return;
function build(){const sel=$("topicSel");TOPICS.forEach(([k,n])=>{const o=document.createElement("option");o.value=k;o.textContent=n;if(k===TOPIC_KEY)o.selected=true;sel.appendChild(o)});sel.addEventListener("change",()=>{location.search="?topic="+sel.value});$("topicTitle").textContent=CFG.title;$("topicLogo").textContent=CFG.symbol||"∑";document.title="百宏文教｜"+CFG.title+" 出題器";const can=document.querySelector('link[rel="canonical"]');if(can)can.href="https://www.bhcs.com.tw/tools/math/g8-drills.html?topic="+TOPIC_KEY;$("subtitle").textContent=CFG.subtitle;$("difficultyNote").textContent=CFG.levels.advanced;const mb=$("modeBoxes");CFG.modes.forEach(m=>{const label=document.createElement("label");label.className="choice";label.innerHTML=`<input type="checkbox" data-mode="${m}" checked>${(CFG.modeLabels||MODE_LABEL)[m]}`;mb.appendChild(label)});if(CFG.mixed){const label=document.createElement("label");label.className="choice";label.innerHTML='<input id="mixedNumber" type="checkbox" checked>可用帶分數';mb.appendChild(label)}const grid=$("unitGrid");CFG.units.forEach(u=>{const box=document.createElement("div");box.className="unit";box.innerHTML=`<input class="unit-check" id="unit-${u.id}" type="checkbox" data-unit="${u.id}"><label for="unit-${u.id}">${u.name}</label><input class="count" type="number" min="1" max="40" value="1" data-count="${u.id}" aria-label="${u.name}題數">`;grid.appendChild(box)});grid.addEventListener("change",e=>{if(e.target.matches(".unit-check"))grid.querySelector(`[data-count='${e.target.dataset.unit}']`).disabled=!e.target.checked;markChanged();updateTotal()});grid.addEventListener("input",e=>{if(e.target.matches(".count")){e.target.value=Math.max(1,Math.min(40,Number(e.target.value)||1));markChanged();updateTotal()}});applyPreset("advanced")}
const selectedModes=()=>[...document.querySelectorAll("[data-mode]:checked")].map(x=>x.dataset.mode),selectedUnits=()=>CFG.units.flatMap(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);return c.checked?[{...u,count:Math.max(1,Math.min(40,Number(n.value)||1))}]:[]});
function applyPreset(level){state.level=level;const p=CFG.presets[level];CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`),v=p[u.id]||0;c.checked=v>0;n.disabled=!c.checked;n.value=v||1});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("difficultyNote").textContent=CFG.levels[level];updateTotal();markChanged()}
function setEach(v){CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);c.checked=v>0;n.disabled=!c.checked;if(v)n.value=v});updateTotal();markChanged()}
function updateTotal(){$("total").textContent=`共 ${selectedUnits().reduce((s,u)=>s+u.count,0)} 題`}function markChanged(){$("status").textContent="設定已變更，按「重新出題」套用。"}
function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Set,skipped=[];state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}。`}
function render(){const out=$("output");out.innerHTML="";if(!state.paper||!state.groups.length){out.innerHTML='<div class="empty"><b>尚未產生練習卷</b>請選擇數型與單元後按「重新出題」。</div>';return}const teacher=$("version").value==="teacher",cols=$("columns").value,work={small:"10mm",medium:"16mm",large:"26mm"}[$("space").value],sheet=document.createElement("div");sheet.className=`sheet ${teacher?"teacher":"student"}`;sheet.style.setProperty("--work",work);sheet.innerHTML=`<div class="head"><div class="bhcs-brand"><b>百宏文教機構</b><span>數學計算力練習 · 徹底反覆計算系列</span><i>www.bhcs.com.tw</i></div><h2>${CFG.title} 計算力練習（${{basic:"基礎",advanced:"進階",challenge:"挑戰"}[state.paper.level]}）</h2><span>班級：______　姓名：__________　日期：___／___　作答時間：___分___秒</span></div><p class="tip">${CFG.instruction}</p>`;let no=1;state.groups.forEach(g=>{const sec=document.createElement("section");sec.innerHTML=`<div class="sec">${g.unit.name}</div><p class="tip">${g.unit.tip}</p><div class="grid c${cols}"></div>`;const grid=sec.querySelector(".grid");g.questions.forEach(q=>{const item=document.createElement("div");item.className="prob";item.innerHTML=`<div class="q"><span class="no">(${no++})</span><span class="expr">${q.expr}</span></div><div class="work">${g.unit.answerLabel??CFG.answerLabel??"原式＝"}<span class="ans">${q.answer}</span></div>`;grid.appendChild(item)});sheet.appendChild(sec)});out.appendChild(sheet);fit()}
function fit(){if(matchMedia("print").matches)return;const sheet=document.querySelector(".sheet");if(sheet)sheet.style.zoom=Math.min(1,Math.max(.42,(innerWidth-16)/794))}
build();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>applyPreset(b.dataset.level)));document.querySelectorAll("[data-mode],#mixedNumber").forEach(c=>c.addEventListener("change",markChanged));document.querySelectorAll("[data-each]").forEach(b=>b.addEventListener("click",()=>setEach(Number(b.dataset.each))));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.paper&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",render));addEventListener("resize",fit);addEventListener("beforeprint",()=>{const s=document.querySelector(".sheet");if(s)s.style.zoom=1});addEventListener("afterprint",fit);generate();
})();
