      hypotenuse(mode){let t=scaledTriple(mode),A=plainR(t.a,mode),B=plainR(t.b,mode);return q("求斜邊",`圖中兩股長如圖，求 x。${triangleSVG(A,B,"x","c")}`,`x＝${showR(t.c,mode)}`)},
      leg(mode){let t=scaledTriple(mode),ask=Math.random()<.5?"a":"b",known=ask==="a"?t.b:t.a,ans=ask==="a"?t.a:t.b;return q("求一股",`圖中斜邊與一股長如圖，求 x。${triangleSVG(plainR(t.a,mode),plainR(t.b,mode),plainR(t.c,mode),ask)}`,`x＝${showR(ans,mode)}`)},
      radicalSide(mode){let k=scaleFor(mode),a=rand(1,state.level==="challenge"?12:8),b=rand(1,state.level==="challenge"?12:8),n=a*a+b*b;while(Number.isInteger(Math.sqrt(n))){b=rand(1,12);n=a*a+b*b}let A=mul(k,R(a)),B=mul(k,R(b)),ans=lengthObj(k,n);return q("根式邊長",`求圖中 x，答案化為最簡根式。${triangleSVG(plainR(A,mode),plainR(B,mode),"x","c")}`,`x＝${lengthHTML(ans,mode)}`)},
      altitude(mode){let t=scaledTriple(mode,mode==="decimal"?[[3,4,5],[7,24,25]]:null),h=div(mul(t.a,t.b),t.c);return q("斜邊上的高",`直角三角形兩股與斜邊如圖，求斜邊上的高 x。${altitudeSVG(plainR(t.a,mode),plainR(t.b,mode),plainR(t.c,mode),"x")}`,`x＝${showR(h,mode)}`,true)},
      rectangle(mode){let t=scaledTriple(mode);return q("矩形對角線",`矩形長、寬如圖，求對角線 x。${rectSVG(plainR(t.a,mode),plainR(t.b,mode))}`,`x＝${showR(t.c,mode)}`)},
      composite(mode){let k=scaleFor(mode),templates=[[5,9,12,13,15],[9,5,12,15,13],[6,15,8,10,17]],z=pick(templates),left=mul(k,R(z[0])),right=mul(k,R(z[1])),known=mul(k,R(z[3])),ans=mul(k,R(z[4]));return q("複合圖形",`兩個直角三角形共用同一高；左斜邊為 ${showR(known,mode)}，兩段底邊如圖，求右斜邊 x。${compositeSVG(plainR(left,mode),plainR(right,mode),plainR(known,mode))}`,`x＝${showR(ans,mode)}`,true)},
      numberLine(mode){let a=value(mode,12,true),b=value(mode,12,true);while(eq(a,b))b=value(mode,12,true);return q("數線距離",`數線上 A(${showR(a,mode)})、B(${showR(b,mode)})，求 AB。`,`AB＝${showR(absR(sub(a,b)),mode)}`)},
      axisDistance(mode){let baseX=value(mode,8,true),baseY=value(mode,8,true),delta=absR(value(mode,10,false)),horizontal=Math.random()<.5,x2=horizontal?add(baseX,delta):baseX,y2=horizontal?baseY:add(baseY,delta);return q("水平／垂直距離",`${pointHTML("A",baseX,baseY,mode)}、${pointHTML("B",x2,y2,mode)}，求 AB。`,`AB＝${showR(delta,mode)}`)},
      coordinateDistance(mode){let t=scaledTriple(mode),x1=value(mode,7,true),y1=value(mode,7,true),x2=add(x1,Math.random()<.5?t.a:neg(t.a)),y2=add(y1,Math.random()<.5?t.b:neg(t.b));return q("兩點距離",`${pointHTML("A",x1,y1,mode)}、${pointHTML("B",x2,y2,mode)}，求 AB。${coordinateSVG()}`,`AB＝${showR(t.c,mode)}`,true)},
      coordinateRadical(mode){let k=scaleFor(mode),dx=rand(1,9),dy=rand(1,9),n=dx*dx+dy*dy;while(Number.isInteger(Math.sqrt(n))){dy=rand(1,10);n=dx*dx+dy*dy}let x1=value(mode,6,true),y1=value(mode,6,true),x2=add(x1,mul(k,R(dx))),y2=add(y1,mul(k,R(dy))),ans=lengthObj(k,n);return q("根式座標距離",`${pointHTML("A",x1,y1,mode)}、${pointHTML("B",x2,y2,mode)}，求 AB，答案化為最簡根式。${coordinateSVG()}`,`AB＝${lengthHTML(ans,mode)}`,true)},
      unknownCoordinate(mode){let t=scaledTriple(mode),x1=value(mode,6,true),y1=value(mode,6,true),solveY=Math.random()<.5;if(solveY){let x2=add(x1,t.a),yPlus=add(y1,t.b),yMinus=sub(y1,t.b);return q("反求未知座標",`${pointHTML("A",x1,y1,mode)}、B(${showR(x2,mode)}，y)，且 AB＝${showR(t.c,mode)}，求 y。`,`y＝${showR(yPlus,mode)} 或 ${showR(yMinus,mode)}`,true)}let y2=add(y1,t.a),xPlus=add(x1,t.b),xMinus=sub(x1,t.b);return q("反求未知座標",`${pointHTML("A",x1,y1,mode)}、B(x，${showR(y2,mode)})，且 AB＝${showR(t.c,mode)}，求 x。`,`x＝${showR(xPlus,mode)} 或 ${showR(xMinus,mode)}`,true)},
      shapeApplication(mode){let t=scaledTriple(mode);if(Math.random()<.5){let perimeter=mul(R(2),add(t.a,t.b));return q("周長應用",`一矩形周長為 ${showR(perimeter,mode)}，其中一邊長 ${showR(t.a,mode)}，求其對角線。`,showR(t.c,mode),true)}let area=mul(t.a,t.b);return q("面積應用",`一矩形面積為 ${showR(area,mode)}，其中一邊長 ${showR(t.a,mode)}，求其對角線。`,showR(t.c,mode),true)}
    };
    function buildControls(){let g=$("typeGrid");defs.forEach(([id,label,count])=>{let el=document.createElement("label");el.className="type";el.innerHTML=`<input class="type-check" type="checkbox" data-check="${id}"><span class="type-name">${label}</span><input class="count" type="number" min="1" max="20" value="${count}" data-count="${id}" aria-label="${label}題數">`;g.appendChild(el)});g.querySelectorAll("[data-check]").forEach(c=>c.addEventListener("change",()=>{g.querySelector(`[data-count='${c.dataset.check}']`).disabled=!c.checked;updateTotal()}));g.querySelectorAll("[data-count]").forEach(i=>i.addEventListener("input",updateTotal))}
    function selected(){return defs.flatMap(([id,label])=>{let c=document.querySelector(`[data-check='${id}']`),n=document.querySelector(`[data-count='${id}']`);if(!c.checked)return[];let count=Math.max(1,Math.min(20,Number(n.value)||1));n.value=count;return[{id,label,count}]})}
    function updateTotal(){let n=selected().reduce((s,x)=>s+x.count,0);$("total").textContent=`共 ${n} 題`}
    function preset(level){state.level=level;let p=presets[level];defs.forEach(([id,,d])=>{let c=document.querySelector(`[data-check='${id}']`),n=document.querySelector(`[data-count='${id}']`),v=p[id];c.checked=!!v;n.disabled=!v;n.value=v||d});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("levelNote").textContent=notes[level];updateTotal();generate()}
    function generate(){let types=selected(),modes=chosenModes();if(!modes.length){state.questions=[];render();$("status").textContent="請至少選擇一種數字類型。";return}if(!types.length){state.questions=[];render();$("status").textContent="請至少勾選一種題型。";return}state.questions=[];types.forEach(t=>{for(let i=0;i<t.count;i++)state.questions.push(generators[t.id](pick(modes)))});if(state.level==="mixed")shuffle(state.questions);render();$("status").textContent=`已產生 ${state.questions.length} 題，共 ${document.querySelectorAll(".paper").length} 頁 A4。`}
    function perPage(){let cols=Number($("columns").value),space=$("space").value;return{2:{compact:18,standard:12,wide:8},3:{compact:27,standard:18,wide:12},4:{compact:36,standard:24,wide:16}}[cols][space]}
    function esc(v){return v.replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
    function render(){let stack=$("stack");stack.innerHTML="";if(!state.questions.length){stack.innerHTML='<div class="empty"><b>尚未產生考卷</b>請至少選擇一種數字類型與題型。</div>';return}let size=perPage(),pages=[];for(let i=0;i<state.questions.length;i+=size)pages.push(state.questions.slice(i,i+size));let modeLabel=chosenModes().map(x=>({integer:"整數",fraction:"分數",decimal:"小數"}[x])).join("／");pages.forEach((qs,pi)=>{let paper=document.createElement("section"),space=$("space").value,cols=$("columns").value,teacher=$("version").value==="teacher",start=pi*size,lineCount={compact:1,standard:2,wide:3}[space];paper.className=`paper ${space} cols-${cols}`;paper.style.setProperty("--cols",cols);paper.innerHTML=`<header class="paper-header"><div class="kicker">百宏文教・數學計算力</div><div class="title-row"><h2 class="paper-title">${esc($("title").value.trim()||"畢氏定理與兩點距離 計算力練習")}</h2><span class="badge">${levelName[state.level]}・${modeLabel}・${teacher?"含答案版":"學生版"}</span></div><div class="student"><div class="blank">班級：<i></i></div><div class="blank">姓名：<i></i></div><div class="blank">日期：<i></i></div><div class="blank">作答時間：<i></i></div></div></header><div class="instruction"><span><b>計算下列各題：</b>根式須化為最簡根式；反求座標時注意兩組可能。</span><span>本頁 ${qs.length} 題</span></div><div class="questions"></div><footer class="footer"><span>畢氏定理・斜邊上的高・座標兩點距離</span><span>第 ${pi+1}／${pages.length} 頁</span></footer>`;let grid=paper.querySelector(".questions");qs.forEach((x,i)=>{let item=document.createElement("article"),lines=Array.from({length:lineCount},(_,j)=>`<div class="work-line">${j===0?'<span class="work-label">計算：</span>':''}<span class="work-rule"></span></div>`).join("");item.className=`question${x.long?" long":""}`;item.innerHTML=`<div class="qtop"><span class="qno">(${start+i+1})</span><span class="math">${x.html}</span></div><div class="work-lines">${lines}</div>${teacher?`<div class="answer">答案：${x.answer}</div>`:""}`;grid.appendChild(item)});stack.appendChild(paper)});fit()}
    function fit(){if(matchMedia("print").matches)return;let scale=Math.min(1,Math.max(.4,(innerWidth-24)/794));document.querySelectorAll(".paper").forEach(p=>p.style.zoom=scale)}
    function rerender(){render();$("status").textContent="版面已更新，題目內容未重新抽換。"}
    buildControls();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>preset(b.dataset.level)));document.querySelectorAll("[data-number]").forEach(c=>c.addEventListener("change",()=>{if(chosenModes().length)generate();else{$("status").textContent="請至少選擇一種數字類型。";state.questions=[];render()}}));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.questions.length&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",rerender));$("title").addEventListener("input",rerender);addEventListener("resize",fit);addEventListener("beforeprint",()=>document.querySelectorAll(".paper").forEach(p=>p.style.zoom=1));addEventListener("afterprint",fit);preset("standard");
  })();
  </script>
