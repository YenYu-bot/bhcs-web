(()=>{"use strict";
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;

function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}

const numHTML=(a,mode,opt={})=>mode==="decimal"?decHTML(a):mode==="fraction"?fracHTML(a,opt):a.d!==1?(places(a)>=0?decHTML(a):fracHTML(a,opt)):String(a.n).replace("-","−");
function numberFor(mode,level,max=30){if(mode==="integer")return R(rand(1,max));if(mode==="fraction"){const ds=level==="basic"?[2,3,4,5,6]:[2,3,4,5,6,8,9,10,12,15,20],d=pick(ds);let n=rand(1,(level==="challenge"?3:2)*d-1);while(n%d===0)n=rand(1,3*d-1);return R(n,d)}const p=level==="basic"?1:pick(level==="advanced"?[1,2]:[1,2,3]),s=10**p;let n=rand(1,max*s);while(n%10===0)n=rand(1,max*s);return R(n,s)}

function lineEquationConfig(){
 /* 直線方程式（2026-10-31，Claude）。108 課綱數A第一冊「直線方程式」的共同內容，三家版本都有：斜率、點斜式與斜截式、兩點式與截距式、

 const A=algHelpers(),unit=(id,name,tip,gen)=>({id,name,tip,modes:["integer"],gen});

 const lineStr=([a,b,c])=>{const t=(v,s,first)=>{if(!v)return"";const sg=v<0?(first?"−":" − "):first?"":" ＋ ",n=Math.abs(v);return sg+(n===1&&s?"":n)+s};return([t(a,"x",true),t(b,"y",!a),t(c,"",!a&&!b)].join("")||"0")+"＝0"};

 const yForm=(m,k)=>{const mx=m.n===0?"":A.term(m,"x","integer",{});const kk=k.n===0?"":(mx?(k.n<0?" − ":" ＋ "):(k.n<0?"−":""))+Q(A.abs(k));return"y＝"+((mx+kk)||"0")};

 const randLine=L=>{const s=span(L);for(;;){const a=rand(-s,s),b=rand(-s,s),c=rand(-3*s,3*s);if(a||b)return std(a,b,c)}};

  const k=nz(-4,4),[dx,dy]=[nz(1,4),rand(-4,4)],x3=x1+k*dx,y3=y1+k*dy,xb=x1+dx,ytrue=y1+dy;if(k===1)return null;return{expr:`A${P(x1,y1)}、B（${I(xb)}，t）、C${P(x3,y3)} 三點共線，求 t。`,answer:`t＝${I(ytrue)}`,sig:`c:${x1}:${y1}:${dx}:${dy}:${k}`,verify:()=>(ytrue-y1)*(x3-x1)===(y3-y1)*(xb-x1)}});
 // ② 點斜式與斜截式
 const pointSlope=unit("pointslope","點斜式與斜截式","點斜式：y−y₀＝m（x−x₀）；斜截式：y＝mx＋k，k 是 y 截距。最後整理成 ax＋by＋c＝0。",ctx=>{
  const L=lv(ctx),kind=L===0?pick(["ps","si","psInt"]):L===1?pick(["ps","si","toSI"]):pick(["yInt","xInt","toSI","ps"]);

function syncTopicMeta(){const sel=$("topicSel");sel.innerHTML=TOPIC_ORDER.map(([k,t])=>`<option value="${k}"${k===TOPIC_KEY?" selected":""}>${t}</option>`).join("");sel.onchange=()=>{location.search="?topic="+encodeURIComponent(sel.value)};document.title=`百宏文教｜${CFG.title} 出題器`;$("pageTitle").textContent=`百宏文教｜${CFG.title} 出題器`;$("topicLogo").textContent=CFG.symbol;const url=`https://www.bhcs.com.tw/tools/math/g10-drills.html?topic=${encodeURIComponent(TOPIC_KEY)}`;document.querySelector('link[rel="canonical"]').href=url;document.querySelector('meta[property="og:title"]').content=document.title;document.querySelector('meta[property="og:url"]').content=url}
let state={level:"advanced",groups:[],paper:null,mixed:false};
function safeQuestion(unit,ctx,seen){for(let i=0;i<50;i++){try{const q=unit.gen(ctx);if(!okResult(q)||!contentGuard(q,ctx.level))continue;const key=norm(q.sig||q.expr);if(seen.has(key))continue;seen.add(key);return q}catch(e){if(i===49)console.warn("出題失敗",unit.id,e)}}console.warn("超過50次仍無法產生不重複且可驗證的題目",unit.id);return null}
globalThis.__BHCS_TEST__={CFG,CONFIGS,TOPIC_ORDER,R,add,sub,mul,div,eq,safeQuestion,okResult,contentGuard,answerWithinLimits};
if(typeof document==="undefined")return;
function build(){syncTopicMeta();$("subtitle").textContent=CFG.subtitle;$("difficultyNote").textContent=CFG.levels.advanced;const mb=$("modeBoxes");CFG.modes.forEach(m=>{const label=document.createElement("label");label.className="choice";label.innerHTML=`<input type="checkbox" data-mode="${m}" checked>${MODE_LABEL[m]}`;mb.appendChild(label)});if(CFG.mixed){const label=document.createElement("label");label.className="choice";label.innerHTML='<input id="mixedNumber" type="checkbox">可用帶分數'/* 高中答案以假分數為主，帶分數預設不勾 */;mb.appendChild(label)}const grid=$("unitGrid");CFG.units.forEach(u=>{const box=document.createElement("div");box.className="unit";box.innerHTML=`<input class="unit-check" id="unit-${u.id}" type="checkbox" data-unit="${u.id}"><label for="unit-${u.id}">${u.name}</label><input class="count" type="number" min="1" max="${u.maxCount||40}" value="1" data-count="${u.id}" aria-label="${u.name}題數" aria-describedby="bank-${u.id}"><small class="bank-note" id="bank-${u.id}" data-bank="${u.id}" style="grid-column:1/-1;color:var(--bhcs-muted,#43516B);font-size:12px"></small>`;grid.appendChild(box)});grid.addEventListener("change",e=>{if(e.target.matches(".unit-check"))grid.querySelector(`[data-count='${e.target.dataset.unit}']`).disabled=!e.target.checked;markChanged();updateTotal()});grid.addEventListener("input",e=>{if(e.target.matches(".count")){e.target.value=Math.max(1,Math.min(Number(e.target.max),Number(e.target.value)||1));markChanged();updateTotal()}});applyPreset("advanced")}
const selectedModes=()=>[...document.querySelectorAll("[data-mode]:checked")].map(x=>x.dataset.mode),selectedUnits=()=>CFG.units.flatMap(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);return c.checked?[{...u,count:Math.max(1,Math.min(Number(n.max),Number(n.value)||1))}]:[]});
function unitMax(u){const cap=u.maxCount||40;if(!Object.hasOwn(u,"bankSize"))return cap;const n=typeof u.bankSize==="function"?u.bankSize({level:state.level,modes:selectedModes(),mixed:CFG.mixed&&!!$("mixedNumber")?.checked}):u.bankSize;return Number.isSafeInteger(n)&&n>0?Math.min(cap,n):cap}
function syncLimits(){CFG.units.forEach(u=>{const n=document.querySelector(`[data-count='${u.id}']`),note=document.querySelector(`[data-bank='${u.id}']`),m=unitMax(u);n.max=String(m);n.value=String(Math.max(1,Math.min(m,Number(n.value)||1)));if(note)note.textContent=m<(u.maxCount||40)?`這個難度題庫共 ${m} 題，最多可出 ${m} 題`:""})}
function applyPreset(level){state.level=level;const p=CFG.presets[level];CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`),v=p[u.id]||0;c.checked=v>0;n.disabled=!c.checked;n.value=v||1});syncLimits();document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("difficultyNote").textContent=CFG.levels[level];updateTotal();markChanged()}
function setEach(v){CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);c.checked=v>0;n.disabled=!c.checked;if(v)n.value=Math.min(v,Number(n.max))});updateTotal();markChanged()}
function updateTotal(){$("total").textContent=`共 ${selectedUnits().reduce((s,u)=>s+u.count,0)} 題`}function markChanged(){$("status").textContent="設定已變更，按「重新出題」套用。"}
function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Set,skipped=[],short=[];state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length<unit.count)short.push(`${unit.name} ${questions.length}／${unit.count}`);if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}${short.length?`；題目不足（已出／要求）：${short.join("、")}`:""}。`}
function render(){const out=$("output");out.innerHTML="";if(!state.paper||!state.groups.length){out.innerHTML='<div class="empty"><b>尚未產生練習卷</b>請選擇數型與單元後按「重新出題」。</div>';return}const teacher=$("version").value==="teacher",cols=$("columns").value,work={small:"10mm",medium:"16mm",large:"26mm"}[$("space").value],sheet=document.createElement("div");sheet.className=`sheet ${teacher?"teacher":"student"}`;sheet.style.setProperty("--work",work);sheet.innerHTML=`<div class="head"><div class="bhcs-brand"><b>百宏文教機構</b><span>數學計算力練習 · 徹底反覆計算系列</span><i>www.bhcs.com.tw</i></div><h2>${CFG.title} 計算力練習（${{basic:"基礎",advanced:"進階",challenge:"挑戰"}[state.paper.level]}）</h2><span>班級：______　姓名：__________　日期：___／___　作答時間：___分___秒</span></div><p class="tip">${CFG.instruction}</p>`;let no=1;state.groups.forEach(g=>{const sec=document.createElement("section");sec.innerHTML=`<div class="sec">${g.unit.name}</div><p class="tip">${g.unit.tip}</p><div class="grid c${cols}"></div>`;const grid=sec.querySelector(".grid");g.questions.forEach(q=>{const item=document.createElement("div");item.className="prob";item.innerHTML=`<div class="q"><span class="no">(${no++})</span><span class="expr">${q.expr}</span></div><div class="work">原式＝<span class="ans">${q.answer}</span></div>`;grid.appendChild(item)});sheet.appendChild(sec)});out.appendChild(sheet);fit()}
function fit(){if(matchMedia("print").matches)return;const sheet=document.querySelector(".sheet");if(sheet)sheet.style.zoom=Math.min(1,Math.max(.42,(innerWidth-16)/794))}
build();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>applyPreset(b.dataset.level)));document.querySelectorAll("[data-mode],#mixedNumber").forEach(c=>c.addEventListener("change",()=>{syncLimits();updateTotal();markChanged()}));document.querySelectorAll("[data-each]").forEach(b=>b.addEventListener("click",()=>setEach(Number(b.dataset.each))));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.paper&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",render));addEventListener("resize",fit);addEventListener("beforeprint",()=>{const s=document.querySelector(".sheet");if(s)s.style.zoom=1});addEventListener("afterprint",fit);generate();
})();
</script>
</body>
</html>
