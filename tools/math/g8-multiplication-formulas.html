  <script>
  (()=>{"use strict";
    const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
    const R=(n,d=1)=>{if(d===0)throw Error("zero denominator");if(d<0){n=-n;d=-d}let g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),sq=a=>mul(a,a);
    const frac=(n,d)=>`<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;
    const decimal=a=>{let v=a.n/a.d,s=v.toFixed(6).replace(/0+$/," ").trim().replace(/\.$/,"");return s==="-0"?"0":s};
    const show=(a,mode,absolute=false,mixed=false)=>{let n=absolute?Math.abs(a.n):a.n;if(a.d===1)return String(n).replace("-","−");if(mode==="decimal")return decimal(R(n,a.d)).replace("-","−");let sign=n<0?"−":"",v=Math.abs(n);if(mixed&&v>a.d){let whole=Math.floor(v/a.d),rem=v%a.d;return `<span class="mixed">${sign}${whole}${rem?frac(rem,a.d):""}</span>`}return`${sign}${frac(v,a.d)}`};
    const M=(html,powers={})=>({html,powers}),one=M("",{}),bodyHtml=b=>b.html;
    const multiplyBody=(a,b)=>{let p={...a.powers};Object.entries(b.powers).forEach(([k,v])=>p[k]=(p[k]||0)+v);let order=["x","y","a","b","z"],keys=[...new Set([...order,...Object.keys(p)])].filter(k=>p[k]);return M(keys.map(k=>`${k}${p[k]===1?"":`<sup>${p[k]}</sup>`}`).join(""),p)};
    const squareBody=a=>multiplyBody(a,a),isOne=a=>Math.abs(a.n)===a.d;
    const mono=(coef,body,mode,absolute=false)=>{let c=absolute?R(Math.abs(coef.n),coef.d):coef;if(c.n===0)return"0";let mag=isOne(c)&&body.html?"":show(c,mode,true);return`${c.n<0?"−":""}${mag}${bodyHtml(body)}`};
    const term=(coef,body,mode,first)=>{if(coef.n===0)return"";let sign=coef.n<0?"−":"+",mag=isOne(coef)&&body.html?"":show(coef,mode,true);return`${first?(sign==="−"?"−":""):` ${sign} `}${mag}${bodyHtml(body)}`};
    const poly=(terms,mode)=>{let s="";terms.forEach(t=>s+=term(t.c,t.b,mode,!s));return s||"0"};
    const factor=(A,B,sign,mode)=>`(${mono(A.c,A.b,mode)} ${sign} ${mono(B.c,B.b,mode,true)})`;
    const pairBodies=level=>level==="foundation"?pick([[M("x",{x:1}),one],[M("a",{a:1}),M("b",{b:1})]]):level==="standard"?pick([[M("x",{x:1}),one],[M("x",{x:1}),M("y",{y:1})],[M("a",{a:1}),M("b",{b:1})]]):pick([[M("x",{x:1}),M("y",{y:1})],[M("x<sup>2</sup>",{x:2}),M("y",{y:1})],[M("xy",{x:1,y:1}),one],[M("x",{x:1}),M("y<sup>2</sup>",{y:2})]]);
    const positive=(mode,max=8)=>{if(mode==="integer")return R(rand(1,max));if(mode==="fraction"){let d=pick([2,3,4,5]),n=rand(1,d*max-1);while(n%d===0)n=rand(1,d*max-1);return R(n,d)}let d=pick([10,10,10,100]),n=rand(1,max*d-1);while(n%d===0)n=rand(1,max*d-1);return R(n,d)};
    const smallPositive=(mode,max=5)=>positive(mode,max),displayNumber=(a,mode)=>show(a,mode,false,mode==="fraction");
    const centered=(mode,large=false)=>{if(mode==="integer"){let c=large?pick([50,100,200,500,1000,2000]):pick([10,20,30,50,100]),d=rand(1,Math.min(large?19:9,c-1));return[R(c),R(d)]}if(mode==="fraction"){let base=rand(3,large?30:12),den=pick([2,3,4,5]),num=rand(1,den-1);return[R(base),R(num,den)]}let c=R(rand(2,large?40:15)),d=R(rand(1,9),10);return[c,d]};
    const baseForSquare=(mode,nearPlus)=>{if(mode==="integer"){let c=pick([10,20,50,100,200,500,1000]),d=rand(1,Math.min(c>50?9:5,c-1));return nearPlus?add(R(c),R(d)):sub(R(c),R(d))}if(mode==="fraction"){let c=R(rand(3,20)),d=R(rand(1,4),pick([2,3,4,5]));return nearPlus?add(c,d):sub(c,d)}let c=R(rand(2,20)),d=R(rand(1,9),10);return nearPlus?add(c,d):sub(c,d)};
    const makeAB=(mode,level)=>{let [ba,bb]=pairBodies(level),max=level==="challenge"?7:5;return[{c:smallPositive(mode,max),b:ba},{c:smallPositive(mode,max),b:bb}]};
    const expandDifference=(A,B,mode)=>poly([{c:sq(A.c),b:squareBody(A.b)},{c:R(-sq(B.c).n,sq(B.c).d),b:squareBody(B.b)}],mode);
    const expandSquare=(A,B,sign,mode)=>poly([{c:sq(A.c),b:squareBody(A.b)},{c:sign==="+"?mul(R(2),mul(A.c,B.c)):mul(R(-2),mul(A.c,B.c)),b:multiplyBody(A.b,B.b)},{c:sq(B.c),b:squareBody(B.b)}],mode);
    const q=(type,html,answer,long=false)=>({type,html,answer,long});
    const defs=[["nearProduct","中心數乘積",3],["differenceValue","平方差求值",3],["sumNumber","和平方速算",2],["differenceNumber","差平方速算",2],["conjugateExpand","平方差展開",2],["sumExpand","和平方展開",2],["differenceExpand","差平方展開",2],["threeTerm","三項式平方",2],["sumRecognize","和平方辨識",2],["differenceRecognize","差平方辨識",2],["formulaChain","公式連鎖化簡",2],["comprehensive","綜合計算",2]];
    const presets={
      foundation:{nearProduct:4,differenceValue:4,sumNumber:4,differenceNumber:4,conjugateExpand:2,sumExpand:2,differenceExpand:2},
      standard:{nearProduct:3,differenceValue:3,sumNumber:2,differenceNumber:2,conjugateExpand:3,sumExpand:3,differenceExpand:3,sumRecognize:2,differenceRecognize:2},
      challenge:{conjugateExpand:3,sumExpand:3,differenceExpand:3,threeTerm:3,sumRecognize:2,differenceRecognize:2,formulaChain:3,comprehensive:3},
      mixed:{nearProduct:2,differenceValue:2,sumNumber:2,differenceNumber:2,conjugateExpand:2,sumExpand:2,differenceExpand:2,threeTerm:2,sumRecognize:2,differenceRecognize:2,formulaChain:2,comprehensive:2}
    };
    const levelName={foundation:"基礎",standard:"進階",challenge:"挑戰",mixed:"綜合"},notes={foundation:"基礎：利用鄰近整數速算，並直接套用平方差、和平方與差平方公式。",standard:"進階：數值與代數並重，加入完全平方形式的辨識與求值。",challenge:"挑戰：提高係數與次方複雜度，加入三項式平方、連鎖公式與多步驟化簡。",mixed:"綜合：三個核心公式與各類應用平均取題，適合單元複習或測驗。"};
    const state={level:"standard",questions:[]};
    const chosenModes=()=>[...document.querySelectorAll("[data-number]:checked")].map(x=>x.dataset.number);
    const generators={
      nearProduct(mode){let[c,d]=centered(mode,state.level==="challenge"),u=add(c,d),v=sub(c,d),ans=sub(sq(c),sq(d));return q("中心數乘積",`${displayNumber(u,mode)} × ${displayNumber(v,mode)}`,show(ans,mode,false,true))},
      differenceValue(mode){let[c,d]=centered(mode,state.level!=="foundation"),u=add(c,d),v=sub(c,d),ans=sub(sq(u),sq(v));return q("平方差求值",`${displayNumber(u,mode)}<sup>2</sup> − ${displayNumber(v,mode)}<sup>2</sup>`,show(ans,mode,false,true))},
      sumNumber(mode){let n=baseForSquare(mode,true);return q("和平方速算",`${displayNumber(n,mode)}<sup>2</sup>`,show(sq(n),mode,false,true))},
      differenceNumber(mode){let n=baseForSquare(mode,false);return q("差平方速算",`${displayNumber(n,mode)}<sup>2</sup>`,show(sq(n),mode,false,true))},
      conjugateExpand(mode){let[A,B]=makeAB(mode,state.level),html=`${factor(A,B,"+",mode)}${factor(A,B,"−",mode)}`;return q("平方差展開",`展開：${html}`,expandDifference(A,B,mode),true)},
      sumExpand(mode){let[A,B]=makeAB(mode,state.level);return q("和平方展開",`展開：${factor(A,B,"+",mode)}<sup>2</sup>`,expandSquare(A,B,"+",mode),true)},
      differenceExpand(mode){let[A,B]=makeAB(mode,state.level);return q("差平方展開",`展開：${factor(A,B,"−",mode)}<sup>2</sup>`,expandSquare(A,B,"−",mode),true)},
      threeTerm(mode){let a=smallPositive(mode,4),b=smallPositive(mode,4),c=smallPositive(mode,4),A={c:a,b:M("x",{x:1})},B={c:b,b:M("y",{y:1})},C={c:c,b:M("z",{z:1})},terms=[{c:sq(a),b:M("x<sup>2</sup>",{x:2})},{c:sq(b),b:M("y<sup>2</sup>",{y:2})},{c:sq(c),b:M("z<sup>2</sup>",{z:2})},{c:mul(R(2),mul(a,b)),b:M("xy",{x:1,y:1})},{c:mul(R(2),mul(b,c)),b:M("yz",{y:1,z:1})},{c:mul(R(2),mul(c,a)),b:M("xz",{x:1,z:1})}];return q("三項式平方",`展開：(${mono(A.c,A.b,mode)} + ${mono(B.c,B.b,mode)} + ${mono(C.c,C.b,mode)})<sup>2</sup>`,poly(terms,mode),true)},
      sumRecognize(mode){let a=positive(mode,40),b=positive(mode,20),ans=sq(add(a,b)),mid=mul(R(2),mul(a,b));return q("和平方辨識",`求值：${displayNumber(a,mode)}<sup>2</sup> + ${show(mid,mode,false,true)} + ${displayNumber(b,mode)}<sup>2</sup>`,show(ans,mode,false,true),true)},
      differenceRecognize(mode){let a=positive(mode,50),b=positive(mode,20);if(a.n*b.d<=b.n*a.d)[a,b]=[add(a,b),a];let ans=sq(sub(a,b)),mid=mul(R(2),mul(a,b));return q("差平方辨識",`求值：${displayNumber(a,mode)}<sup>2</sup> − ${show(mid,mode,false,true)} + ${displayNumber(b,mode)}<sup>2</sup>`,show(ans,mode,false,true),true)},
      formulaChain(mode){let a=smallPositive(mode,4),b=smallPositive(mode,4),A={c:a,b:M("x",{x:1})},B={c:b,b:one},first=`${factor(A,B,"+",mode)}${factor(A,B,"−",mode)}`,sum=`(${mono(sq(a),M("x<sup>2</sup>",{x:2}),mode)} + ${show(sq(b),mode)})`,ans=poly([{c:sq(sq(a)),b:M("x<sup>4</sup>",{x:4})},{c:R(-sq(sq(b)).n,sq(sq(b)).d),b:one}],mode);return q("公式連鎖化簡",`化簡：${first}${sum}`,ans,true)},
      comprehensive(mode){let[c,d]=centered(mode,true),u=sub(c,d),v=add(c,d),ans=sq(c);return q("綜合計算",`求值：${displayNumber(u,mode)} × ${displayNumber(v,mode)} + ${displayNumber(d,mode)}<sup>2</sup>`,show(ans,mode,false,true),true)}
    };
    function buildControls(){let g=$("typeGrid");defs.forEach(([id,label,count])=>{let el=document.createElement("label");el.className="type";el.innerHTML=`<input class="type-check" type="checkbox" data-check="${id}"><span class="type-name">${label}</span><input class="count" type="number" min="1" max="20" value="${count}" data-count="${id}" aria-label="${label}題數">`;g.appendChild(el)});g.querySelectorAll("[data-check]").forEach(c=>c.addEventListener("change",()=>{g.querySelector(`[data-count='${c.dataset.check}']`).disabled=!c.checked;updateTotal()}));g.querySelectorAll("[data-count]").forEach(i=>i.addEventListener("input",updateTotal))}
    function selected(){return defs.flatMap(([id,label])=>{let c=document.querySelector(`[data-check='${id}']`),n=document.querySelector(`[data-count='${id}']`);if(!c.checked)return[];let count=Math.max(1,Math.min(20,Number(n.value)||1));n.value=count;return[{id,label,count}]})}
    function updateTotal(){let n=selected().reduce((s,x)=>s+x.count,0);$("total").textContent=`共 ${n} 題`}
    function preset(level){state.level=level;let p=presets[level];defs.forEach(([id,,d])=>{let c=document.querySelector(`[data-check='${id}']`),n=document.querySelector(`[data-count='${id}']`),v=p[id];c.checked=!!v;n.disabled=!v;n.value=v||d});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("levelNote").textContent=notes[level];updateTotal();generate()}
    function generate(){let types=selected(),modes=chosenModes();if(!modes.length){state.questions=[];render();$("status").textContent="請至少選擇一種數字類型。";return}if(!types.length){state.questions=[];render();$("status").textContent="請至少勾選一種題型。";return}state.questions=[];types.forEach(t=>{for(let i=0;i<t.count;i++)state.questions.push(generators[t.id](pick(modes)))});render();$("status").textContent=`已產生 ${state.questions.length} 題，共 ${document.querySelectorAll(".paper").length} 頁 A4。`}
    function perPage(){let cols=Number($("columns").value),space=$("space").value;return{2:{compact:18,standard:12,wide:8},3:{compact:27,standard:18,wide:12},4:{compact:36,standard:24,wide:16}}[cols][space]}
    function esc(v){return v.replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
    function render(){let stack=$("stack");stack.innerHTML="";if(!state.questions.length){stack.innerHTML='<div class="empty"><b>尚未產生考卷</b>請至少選擇一種數字類型與題型。</div>';return}let size=perPage(),pages=[];for(let i=0;i<state.questions.length;i+=size)pages.push(state.questions.slice(i,i+size));let modeLabel=chosenModes().map(x=>({integer:"整數",fraction:"分數",decimal:"小數"}[x])).join("／");pages.forEach((qs,pi)=>{let paper=document.createElement("section"),space=$("space").value,cols=$("columns").value,teacher=$("version").value==="teacher",start=pi*size,lineCount={compact:1,standard:2,wide:3}[space];paper.className=`paper ${space} cols-${cols}`;paper.style.setProperty("--cols",cols);paper.innerHTML=`<header class="paper-header"><div class="kicker">百宏文教・數學計算力</div><div class="title-row"><h2 class="paper-title">${esc($("title").value.trim()||"乘法公式 計算力練習")}</h2><span class="badge">${levelName[state.level]}・${modeLabel}・${teacher?"含答案版":"學生版"}</span></div><div class="student"><div class="blank">班級：<i></i></div><div class="blank">姓名：<i></i></div><div class="blank">日期：<i></i></div><div class="blank">作答時間：<i></i></div></div></header><div class="instruction"><span><b>計算或化簡下列各題：</b>請運用乘法公式，並寫出必要過程。</span><span>本頁 ${qs.length} 題</span></div><div class="questions"></div><footer class="footer"><span>平方差・和的平方・差的平方</span><span>第 ${pi+1}／${pages.length} 頁</span></footer>`;let grid=paper.querySelector(".questions");qs.forEach((x,i)=>{let item=document.createElement("article"),lines=Array.from({length:lineCount},(_,j)=>`<div class="work-line">${j===0?'<span class="work-label">計算：</span>':''}<span class="work-rule"></span></div>`).join("");item.className=`question${x.long?" long":""}`;item.innerHTML=`<div class="qtop"><span class="qno">(${start+i+1})</span><span class="math">${x.html}</span></div><div class="work-lines">${lines}</div>${teacher?`<div class="answer">答案：${x.answer}</div>`:""}`;grid.appendChild(item)});stack.appendChild(paper)});fit()}
    function fit(){if(matchMedia("print").matches)return;let scale=Math.min(1,Math.max(.4,(innerWidth-24)/794));document.querySelectorAll(".paper").forEach(p=>p.style.zoom=scale)}
    function rerender(){render();$("status").textContent="版面已更新，題目內容未重新抽換。"}
    buildControls();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>preset(b.dataset.level)));document.querySelectorAll("[data-number]").forEach(c=>c.addEventListener("change",()=>{if(chosenModes().length)generate();else{$("status").textContent="請至少選擇一種數字類型。";state.questions=[];render()}}));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.questions.length&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",rerender));$("title").addEventListener("input",rerender);addEventListener("resize",fit);addEventListener("beforeprint",()=>document.querySelectorAll(".paper").forEach(p=>p.style.zoom=1));addEventListener("afterprint",fit);preset("standard");
  })();
  </script>
