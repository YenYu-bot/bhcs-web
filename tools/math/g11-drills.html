function probabilityConfig(){
 /* 教材依據：樣本空間、事件運算、古典機率、排列組合型機率、期望值與公平遊戲。停用小數。 */
 const H=hsHelpers(),MI=["integer"],MF=["fraction"],unit=(id,name,tip,modes,gen)=>({id,name,tip,modes,gen});
 const fact=n=>{let v=1;for(let i=2;i<=n;i++)v*=i;return v},C=(n,r)=>r<0||r>n?0:fact(n)/(fact(r)*fact(n-r)),showI=n=>H.show(R(n),"integer"),showF=z=>H.show(z,"fraction",true,{mixed:false}),ok=z=>z.d<=100&&Math.abs(z.n/z.d)<=10000;

 const samplespace=unit("samplespace","樣本空間個數","把每個等可能結果列入樣本空間；多階段試驗用乘法原理。",MI,ctx=>{
  const kind=pick(["coins","dice","cards"]),n=rand(2,10);let ans,expr,detail;
  if(kind==="coins"){ans=2**n;detail=`${n}`;expr=`同時投擲 ${n} 枚可區分的均勻硬幣，樣本空間共有多少個結果？`}
  else if(kind==="dice"){const s=rand(4,12),d=rand(2,3);ans=s**d;detail=`${s}:${d}`;expr=`投擲 ${d} 顆可區分的 ${s} 面公平骰子，樣本空間共有多少個結果？`}
  else{const cards=rand(5,14),take=rand(2,Math.min(5,cards-1));ans=fact(cards)/fact(cards-take);detail=`${cards}:${take}`;expr=`從 ${cards} 張相異卡片依序抽出 ${take} 張且不放回，樣本空間共有多少個有序結果？`}
  if(ans>10000)return null;return{expr,answer:showI(ans),sig:`ss:${kind}:${detail}`,verify:()=>Number.isInteger(ans)&&ans>0};
 });

 const eventops=unit("eventops","事件的交、聯與補集","用事件個數做容斥，再除以樣本空間大小。",MF,ctx=>{
  const both=rand(1,8),onlyA=rand(1,12),onlyB=rand(1,12),neither=rand(1,10);if(onlyA===onlyB)return null;const N=both+onlyA+onlyB+neither,kind=pick(["union","inter","onlyA","complement"]),fav=kind==="union"?both+onlyA+onlyB:kind==="inter"?both:kind==="onlyA"?onlyA:onlyB+neither,ans=R(fav,N),name={union:"P（A∪B）",inter:"P（A∩B）",onlyA:"P（A∩B′）",complement:"P（A′）"}[kind];if(!ok(ans))return null;
  return{expr:`某等可能試驗共有 ${N} 個結果，其中只屬於 A 的有 ${onlyA} 個，只屬於 B 的有 ${onlyB} 個，同時屬於 A、B 的有 ${both} 個。求 ${name}。`,answer:showF(ans),sig:`eo:${onlyA}:${onlyB}:${both}:${neither}:${kind}`,verify:()=>eq(ans,R(fav,N))};
 });

 const coins=unit("coins","硬幣機率","n 枚公平硬幣共有 2ⁿ 個等可能結果；恰有 r 個正面用組合 Cⁿᵣ。",MF,ctx=>{
  const n=rand(2,6),r=rand(0,n),kind=pick(["exact","atleast","atmost"]);let fav=C(n,r),word=`恰有 ${r} 枚正面`;if(kind==="atleast"){fav=0;for(let k=r;k<=n;k++)fav+=C(n,k);word=`至少有 ${r} 枚正面`}else if(kind==="atmost"){fav=0;for(let k=0;k<=r;k++)fav+=C(n,k);word=`至多有 ${r} 枚正面`}const ans=R(fav,2**n);if(!ok(ans)||fav===2**n)return null;
  return{expr:`同時投擲 ${n} 枚均勻硬幣，求${word}的機率。`,answer:showF(ans),sig:`coin:${n}:${r}:${kind}`,verify:()=>eq(ans,R(fav,2**n))};
 });

 const dice=unit("dice","骰子機率","兩顆可區分骰子的結果用有序對計數，再數出符合條件者。",MF,ctx=>{
  const s=rand(4,ctx.level==="challenge"?10:8),kind=pick(["sum","difference","multiple"]),t=kind==="sum"?rand(3,2*s-1):kind==="difference"?rand(0,s-2):rand(2,Math.min(6,s));let fav=0;for(let a=1;a<=s;a++)for(let b=1;b<=s;b++)if(kind==="sum"?a+b===t:kind==="difference"?Math.abs(a-b)===t:(a+b)%t===0)fav++;if(!fav||fav===s*s)return null;const ans=R(fav,s*s);if(!ok(ans))return null;const cond=kind==="sum"?`點數和為 ${t}`:kind==="difference"?`點數差的絕對值為 ${t}`:`點數和是 ${t} 的倍數`;
  return{expr:`投擲兩顆可區分的 ${s} 面公平骰子，求${cond} 的機率。`,answer:showF(ans),sig:`dice:${s}:${kind}:${t}`,verify:()=>eq(ans,R(fav,s*s))};
 });

 const balls=unit("balls","抽球機率","不放回同時取球時，以組合數計算有利情形與全部情形。",MF,ctx=>{
  const red=rand(2,6),blue=rand(2,6);if(red===blue)return null;const take=2,k=pick([0,1,2]);if(k>red||take-k>blue)return null;const total=C(red+blue,take),fav=C(red,k)*C(blue,take-k),ans=R(fav,total);if(!ok(ans)||fav===0||fav===total)return null;

 });

  const n=rand(6,ctx.level==="challenge"?14:10),kind=pick(["even","sum","product"]),t=kind==="even"?0:kind==="sum"?rand(5,2*n-2):rand(2,5),total=C(n,2);let fav=0;for(let a=1;a<=n;a++)for(let b=a+1;b<=n;b++)if(kind==="even"?(a+b)%2===0:kind==="sum"?a+b===t:(a*b)%t===0)fav++;if(!fav||fav===total)return null;const ans=R(fav,total);if(!ok(ans))return null;const cond=kind==="even"?"兩數和為偶數":kind==="sum"?`兩數和為 ${t}`:`兩數乘積是 ${t} 的倍數`;
  return{expr:`編號 1 到 ${n} 的卡片各一張，任取 2 張，求${cond}的機率。`,answer:showF(ans),sig:`card:${n}:${kind}:${t}`,verify:()=>eq(ans,R(fav,total))};
 });

 const complement=unit("complement","補事件與至少一次","『至少一次』常用 1 減去『一次都沒有』計算。",MF,ctx=>{
  const s=rand(4,10),trials=rand(2,ctx.level==="challenge"?3:2),target=rand(1,s),miss=(s-1)**trials,total=s**trials,ans=R(total-miss,total);if(!ok(ans))return null;
  return{expr:`連續投擲一顆 ${s} 面公平骰子 ${trials} 次，至少一次出現 ${target} 點的機率為何？`,answer:showF(ans),sig:`comp:${s}:${trials}:${target}`,verify:()=>eq(ans,sub(R(1),R(miss,total)))};
 });

 const arrangeprob=unit("arrangeprob","排列組合型機率","以符合限制的排列數除以全部排列數，最後約成最簡分數。",MF,ctx=>{
  const n=rand(4,15),kind=pick(["adjacent","ordered","ends","fixed","triple","notadjacent"]);let fav,total=fact(n),expr,detail=0;
  if(kind==="adjacent"){fav=2*fact(n-1);expr=`${n} 人隨機排成一列，甲、乙相鄰的機率為何？`}
  else if(kind==="ordered"){fav=total/2;expr=`${n} 人隨機排成一列，甲排在乙前面的機率為何？`}
  else if(kind==="ends"){fav=2*fact(n-2);expr=`${n} 人隨機排成一列，甲、乙恰好站在兩端的機率為何？`}
  else if(kind==="fixed"){detail=rand(1,n);fav=fact(n-1);expr=`${n} 人隨機排成一列，甲恰好站在第 ${detail} 位的機率為何？`}
  else if(kind==="triple"){fav=6*fact(n-2);expr=`${n} 人隨機排成一列，甲、乙、丙三人相鄰的機率為何？`}
  else{fav=total-2*fact(n-1);expr=`${n} 人隨機排成一列，甲、乙不相鄰的機率為何？`}
  const ans=R(fav,total);if(!ok(ans))return null;return{expr,answer:showF(ans),sig:`ap:${n}:${kind}:${detail}`,verify:()=>eq(ans,R(fav,total))};
 });

function applyUnitPolicies(configs){for(const [key,cfg] of Object.entries(configs)){const p=UNIT_POLICIES[key]||{};for(const u of cfg.units){u.modes=p[u.id]||["integer"];const raw=u.gen;u.gen=ctx=>{const avail=ctx.modes.filter(m=>u.modes.includes(m));if(!avail.length)return null;const mode=pick(avail),q=raw({...ctx,modes:[mode]});if(q){q.numberMode=mode;q.topicKey=key;q.unitId=u.id}return q}}cfg.modes=[...new Set(cfg.units.flatMap(u=>u.modes))];cfg.mixed=cfg.allowMixed===false?false:cfg.modes.includes("fraction")}}
function answerWithinLimits(s){s=String(s);for(const m of s.matchAll(/<span class="fr"><span class="n">(−?\d+)<\/span><span class="d">(\d+)<\/span><\/span>/g)){const n=Number(m[1].replace("−","-")),d=Number(m[2]);if(d>100||Math.abs(n/d)>10000)return false}for(const m of s.matchAll(/(−?\d+(?:\.\d+)?)\s*×\s*10<sup>(−?\d+)<\/sup>/g)){const v=Number(m[1].replace("−","-"))*10**Number(m[2].replace("−","-"));if(Math.abs(v)>10000)return false}const text=s.replace(/<[^>]*>/g," ").replaceAll("−","-");for(const m of text.matchAll(/-?\d+(?:\.\d+)?/g))if(Math.abs(Number(m[0]))>10000)return false;return true}
function contentGuard(q,level){const all=(q.expr+q.answer).replace(/<svg[\s\S]*?<\/svg>/g,""),hasDecimal=/\d+\.\d+/.test(all),hasFraction=/class="fr"/.test(all);if(hasDecimal&&hasFraction)return false;const max=level==="basic"?1:2;for(const m of all.matchAll(/\d+\.(\d+)/g))if(m[1].length>max)return false;if(q.numberMode==="decimal"&&(hasFraction||/class="mixed"/.test(all)))return false;if(q.numberMode==="fraction"&&hasDecimal)return false;for(const m of q.expr.matchAll(/<span class="fr"><span class="n">\d+<\/span><span class="d">(\d+)<\/span><\/span>/g)){const d=Number(m[1]),pyth=q.unitId==="angle"&&q.topicKey==="vectorcauchy"||q.unitId==="known"&&q.topicKey==="anglesum"||q.topicKey==="righttrig"||q.topicKey==="generalpolar";if(d>12&&!(pyth&&[13,17,25,29].includes(d)))return false}for(const m of q.expr.matchAll(/class="mixed">(?:−)?(\d+)/g))if(Number(m[1])>5)return false;if(q.numberMode==="integer"&&["polynomial","multiplication","cubic","quadratic","remainder"].includes(q.topicKey)){const p=q.expr.replace(/<sup>[\s\S]*?<\/sup>/g,"").replace(/<[^>]*>/g,"");for(const m of p.matchAll(/(\d+)(?=[xy])/g))if(Number(m[1])>12)return false}return answerWithinLimits(q.answer)}

function syncTopicMeta(){const sel=$("topicSel");sel.innerHTML=TOPIC_ORDER.map(([k,t])=>`<option value="${k}"${k===TOPIC_KEY?" selected":""}>${t}</option>`).join("");sel.onchange=()=>{location.search="?topic="+encodeURIComponent(sel.value)};document.title=`百宏文教｜${CFG.title} 出題器`;$("pageTitle").textContent=`百宏文教｜${CFG.title} 出題器`;$("topicLogo").textContent=CFG.symbol;const url=`https://www.bhcs.com.tw/tools/math/g11-drills.html?topic=${encodeURIComponent(TOPIC_KEY)}`;document.querySelector('link[rel="canonical"]').href=url;document.querySelector('meta[property="og:title"]').content=document.title;document.querySelector('meta[property="og:url"]').content=url}

function safeQuestion(unit,ctx,seen){for(let i=0;i<50;i++){try{const q=unit.gen(ctx);if(!okResult(q)||!contentGuard(q,ctx.level))continue;const key=norm(q.sig||q.expr);if(seen.has(key))continue;seen.add(key);return q}catch(e){if(i===49)console.warn("出題失敗",unit.id,e)}}console.warn("超過50次仍無法產生不重複且可驗證的題目",unit.id);return null}

function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Set,skipped=[];state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}。`}
