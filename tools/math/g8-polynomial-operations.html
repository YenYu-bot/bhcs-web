  <script>
  (()=>{"use strict";
    const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{for(let i=a.length-1;i;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

    const trim=p=>{p=p.map(x=>R(x.n,x.d));while(p.length>1&&zero(p[p.length-1]))p.pop();return p.length?p:[R(0)]},degree=p=>trim(p).length-1,isZeroPoly=p=>trim(p).length===1&&zero(trim(p)[0]);
    const addP=(a,b)=>trim(Array.from({length:Math.max(a.length,b.length)},(_,i)=>addR(a[i]||R(0),b[i]||R(0)))),subP=(a,b)=>trim(Array.from({length:Math.max(a.length,b.length)},(_,i)=>subR(a[i]||R(0),b[i]||R(0)))),scaleP=(p,k)=>trim(p.map(c=>mulR(c,k)));

      polyTimesMono(mode){let d=state.level==="foundation"?2:levelDegree(),p=randomPoly(mode,d,6),e=rand(1,state.level==="challenge"?3:2),c=coeff(mode,6),m=Array(e).fill(0).map(()=>R(0)).concat([c]);return q("多項式乘單項式",`展開：(${monoHTML(c,e,mode)})${wrap(p,mode)}`,polyHTML(mulP(m,p),mode),true)},
      binomialMultiply(mode){let a=randomPoly(mode,1,7,1),b=randomPoly(mode,1,7,1);return q("兩多項式相乘",`展開：${wrap(a,mode)}${wrap(b,mode)}`,polyHTML(mulP(a,b),mode),true)},
      polyMultiply(mode){let d1=state.level==="challenge"?pick([1,2]):1,d2=state.level==="challenge"?2:pick([1,2]),a=randomPoly(mode,d1,5,.9),b=randomPoly(mode,d2,5,.9);return q("多項式乘法",`展開：${wrap(a,mode)}${wrap(b,mode)}`,polyHTML(mulP(a,b),mode),true)},
      monoDivide(mode){let de=rand(1,3),qe=rand(1,state.level==="challenge"?5:3),d=coeff(mode,6),qc=coeff(mode,6),num=mulR(d,qc);return q("單項式除法",`計算：(${monoHTML(num,de+qe,mode)}) ÷ (${monoHTML(d,de,mode)})`,monoHTML(qc,qe,mode))},
      polyDivideMono(mode){let de=rand(1,state.level==="challenge"?2:1),d=coeff(mode,5),divisor=Array(de).fill(0).map(()=>R(0)).concat([d]),quot=randomPoly(mode,state.level==="challenge"?3:2,5,.85),rem=state.level==="challenge"&&Math.random()<.55?nonzeroRemainder(mode,de-1):[R(0)],dividend=addP(mulP(divisor,quot),rem);return q("多項式除以單項式",`求商與餘式：${wrap(dividend,mode)} ÷ (${monoHTML(d,de,mode)})`,`商：${polyHTML(quot,mode)}；餘式：${polyHTML(rem,mode)}`,true)},
      longDivision(mode){let dd=state.level==="challenge"?pick([1,2]):1,qd=state.level==="challenge"?pick([1,2,2]):pick([1,2]),divisor=monicPoly(mode,dd,5),quot=randomPoly(mode,qd,5,.85),wantRem=state.level==="challenge"||state.level==="mixed"||Math.random()<.45,rem=wantRem?nonzeroRemainder(mode,dd-1):[R(0)],dividend=addP(mulP(divisor,quot),rem),check=divmodP(dividend,divisor);return q("多項式長除法",`求商與餘式：${wrap(dividend,mode)} ÷ ${wrap(divisor,mode)}`,`商：${polyHTML(check.q,mode)}；餘式：${polyHTML(check.r,mode)}`,true)},
      definedOps(mode){let d=state.level==="challenge"?3:2,A=randomPoly(mode,d,4,.8),B=randomPoly(mode,d,4,.8),C=randomPoly(mode,d,4,.8),u=rand(2,4),v=rand(1,3),w=rand(1,3),ans=addP(subP(scaleP(A,R(u)),scaleP(B,R(v))),scaleP(C,R(w)));return q("代入多項式運算",`<span class="defline">設 A=${polyHTML(A,mode)}，B=${polyHTML(B,mode)}，C=${polyHTML(C,mode)}</span>求 ${u}A − ${v}B + ${w}C。`,polyHTML(ans,mode),true)},
      mixedOps(mode){let a=randomPoly(mode,1,5,1),b=randomPoly(mode,state.level==="challenge"?2:1,5,.9),p=randomPoly(mode,degree(mulP(a,b)),5,.8),ans=subP(mulP(a,b),p);return q("四則混合",`化簡：${wrap(a,mode)}${wrap(b,mode)} − ${wrap(p,mode)}`,polyHTML(ans,mode),true)}
    };
    function buildControls(){let g=$("typeGrid");defs.forEach(([id,label,count])=>{let el=document.createElement("label");el.className="type";el.innerHTML=`<input class="type-check" type="checkbox" data-check="${id}"><span class="type-name">${label}</span><input class="count" type="number" min="1" max="20" value="${count}" data-count="${id}" aria-label="${label}題數">`;g.appendChild(el)});g.querySelectorAll("[data-check]").forEach(c=>c.addEventListener("change",()=>{g.querySelector(`[data-count='${c.dataset.check}']`).disabled=!c.checked;updateTotal()}));g.querySelectorAll("[data-count]").forEach(i=>i.addEventListener("input",updateTotal))}
    function selected(){return defs.flatMap(([id,label])=>{let c=document.querySelector(`[data-check='${id}']`),n=document.querySelector(`[data-count='${id}']`);if(!c.checked)return[];let count=Math.max(1,Math.min(20,Number(n.value)||1));n.value=count;return[{id,label,count}]})}
    function updateTotal(){let n=selected().reduce((s,x)=>s+x.count,0);$("total").textContent=`共 ${n} 題`}
    function preset(level){state.level=level;let p=presets[level];defs.forEach(([id,,d])=>{let c=document.querySelector(`[data-check='${id}']`),n=document.querySelector(`[data-count='${id}']`),v=p[id];c.checked=!!v;n.disabled=!v;n.value=v||d});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("levelNote").textContent=notes[level];updateTotal();generate()}
    function generate(){let types=selected(),modes=chosenModes();if(!modes.length){state.questions=[];render();$("status").textContent="請至少選擇一種係數類型。";return}if(!types.length){state.questions=[];render();$("status").textContent="請至少勾選一種題型。";return}state.questions=[];types.forEach(t=>{for(let i=0;i<t.count;i++)state.questions.push(generators[t.id](pick(modes)))});if(state.level==="mixed")shuffle(state.questions);render();$("status").textContent=`已產生 ${state.questions.length} 題，共 ${document.querySelectorAll(".paper").length} 頁 A4。`}
    function perPage(){let cols=Number($("columns").value),space=$("space").value;return{2:{compact:18,standard:12,wide:8},3:{compact:27,standard:18,wide:12},4:{compact:36,standard:24,wide:16}}[cols][space]}
    function esc(v){return v.replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
    function render(){let stack=$("stack");stack.innerHTML="";if(!state.questions.length){stack.innerHTML='<div class="empty"><b>尚未產生考卷</b>請至少選擇一種係數類型與題型。</div>';return}let size=perPage(),pages=[];for(let i=0;i<state.questions.length;i+=size)pages.push(state.questions.slice(i,i+size));let modeLabel=chosenModes().map(x=>({integer:"整數",fraction:"分數",decimal:"小數"}[x])).join("／");pages.forEach((qs,pi)=>{let paper=document.createElement("section"),space=$("space").value,cols=$("columns").value,teacher=$("version").value==="teacher",start=pi*size,lineCount={compact:1,standard:2,wide:3}[space];paper.className=`paper ${space} cols-${cols}`;paper.style.setProperty("--cols",cols);paper.innerHTML=`<header class="paper-header"><div class="kicker">百宏文教・數學計算力</div><div class="title-row"><h2 class="paper-title">${esc($("title").value.trim()||"多項式四則 計算力練習")}</h2><span class="badge">${levelName[state.level]}・${modeLabel}・${teacher?"含答案版":"學生版"}</span></div><div class="student"><div class="blank">班級：<i></i></div><div class="blank">姓名：<i></i></div><div class="blank">日期：<i></i></div><div class="blank">作答時間：<i></i></div></div></header><div class="instruction"><span><b>計算或化簡下列各題：</b>答案請依 x 的降冪排列；除法題須寫出商與餘式。</span><span>本頁 ${qs.length} 題</span></div><div class="questions"></div><footer class="footer"><span>多項式加減・乘法・除法・混合運算</span><span>第 ${pi+1}／${pages.length} 頁</span></footer>`;let grid=paper.querySelector(".questions");qs.forEach((x,i)=>{let item=document.createElement("article"),lines=Array.from({length:lineCount},(_,j)=>`<div class="work-line">${j===0?'<span class="work-label">計算：</span>':''}<span class="work-rule"></span></div>`).join("");item.className=`question${x.long?" long":""}`;item.innerHTML=`<div class="qtop"><span class="qno">(${start+i+1})</span><span class="math">${x.html}</span></div><div class="work-lines">${lines}</div>${teacher?`<div class="answer">答案：${x.answer}</div>`:""}`;grid.appendChild(item)});stack.appendChild(paper)});fit()}
    function fit(){if(matchMedia("print").matches)return;let scale=Math.min(1,Math.max(.4,(innerWidth-24)/794));document.querySelectorAll(".paper").forEach(p=>p.style.zoom=scale)}
    function rerender(){render();$("status").textContent="版面已更新，題目內容未重新抽換。"}
    buildControls();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>preset(b.dataset.level)));document.querySelectorAll("[data-number]").forEach(c=>c.addEventListener("change",()=>{if(chosenModes().length)generate();else{$("status").textContent="請至少選擇一種係數類型。";state.questions=[];render()}}));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.questions.length&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",rerender));$("title").addEventListener("input",rerender);addEventListener("resize",fit);addEventListener("beforeprint",()=>document.querySelectorAll(".paper").forEach(p=>p.style.zoom=1));addEventListener("afterprint",fit);preset("standard");
  })();
  </script>
