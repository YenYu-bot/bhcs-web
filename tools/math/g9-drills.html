<script>
(()=>{"use strict";
const TOPICS=[["ratio3","連比與比例分配"],["parallelratio","平行線截比例線段"],["similar","相似形"],["righttri","直角三角形"],["circle1","圓：扇形、切線與弦心距"],["circle2","圓心角、圓周角與內接四邊形"],["centers","三角形的外心、內心、重心"],["quadfunc","二次函數的圖形與最大值、最小值"],["quartile","中位數與四分位數"],["boxplot","盒狀圖、全距與四分位距"],["probability","認識機率"],["treediagram","樹狀圖與機率"],["solid","立體圖形"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"ratio3",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}
// integer mode only prints whole numbers as integers: a half (10.5) or a third is shown as a decimal or fraction, never as its numerator
const numHTML=(a,mode,opt={})=>mode==="decimal"?decHTML(a):mode==="fraction"?fracHTML(a,opt):a.d!==1?(places(a)>=0?decHTML(a):fracHTML(a,opt)):String(a.n).replace("-","−");

function probabilityConfig(){
 /* 國三下 2-2 認識機率（2026-09-28，Claude）。依舊工具 g9b-2-2-probability.html 的四個單元重做：袋中取球、整數籤筒與倍數事件、投擲一顆骰子、

 const numbers=unit("numbers","整數籤筒與倍數","1～N 中 m 的倍數有 ⌊N÷m⌋ 個；既是 a 又是 b 的倍數＝最小公倍數的倍數；「a 或 b 的倍數」＝兩者相加再扣掉重複的。",["integer"],ctx=>{
  // 基礎：兩個倍數、既是又是與都不是、質數與完全平方數；進階：任意範圍的倍數、既是又是、質數；挑戰：「或」的倍數與個位數字、數字和為 k 的二位數、含數字 7

  const a=rand(2,16),s=rand(a/2+1|0,20),S=a*a+2*a*s,tetra=pick([false,true]);
  if(tetra){const b=rand(2,20);return{expr:`一個正四面體的表面積為 ${rad(b*b,3)} 平方公分，求它的邊長。`,answer:`${b} 公分`,sig:`q4t:${b}`,verify:()=>near(4*tri(b,Math.sqrt(b*b-b*b/4)),b*b*Math.sqrt(3))}}

 // ⑥ 圓錐的展開圖與表面積
 const cone=unit("cone","圓錐的展開圖與表面積","展開圖的扇形：半徑＝母線長 l，弧長＝底圓周長 2πr，所以圓心角＝360°×r／l；側面積＝πrl，表面積＝πr²＋πrl。",["integer"],ctx=>{
  // 基礎：由圓心角求母線、由母線求圓心角、側面積與表面積；進階：由扇形求底圓半徑、圓心角、表面積；挑戰：由半徑與高求母線、由表面積反求母線、由扇形求底圓半徑
  const f=form(ctx,"cone"),P=Math.PI,L=lv(ctx),range2=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
  const pair=()=>{let r,l;do{r=rand(1,12);l=rand(r+1,30)}while((360*r)%l||(L===0&&l>4*r));return[r,l,360*r/l]};/* 基礎不出母線超過半徑 4 倍的細長圓錐 */
  if(f==="lFromS"){const r=rand(2,10),ls=range2(r+1,r+15).filter(x=>(360*r)%x===0);if(!ls.length)return null;const l=pick(ls),S=r*r+r*l;
   return{expr:`${CON()}的底圓半徑為 ${r} 公分，表面積為 ${pi(S)} 平方公分，求母線長與展開圖中扇形的圓心角。`,answer:`母線 ${l} 公分；圓心角 ${fracHTML(R(360*r,l))}°`,sig:`ls:${r}:${l}`,verify:()=>near((S-r*r)/r,l)&&near(P*r*r+P*r*l,S*P)}}
  const arcOK=(r,l,t)=>near(2*P*l*t/360,2*P*r)&&near(P*l*l*t/360,P*r*l);
  if(f===0){const[r,l,t]=pair();return{expr:`${CON()}的展開圖中，扇形的圓心角為 ${t}°，底圓半徑為 ${r} 公分，求扇形的半徑（母線長）。`,answer:`${l} 公分`,sig:`n0:${r}:${l}`,verify:()=>arcOK(r,l,t)}}
  if(f===1){const[r,l,t]=pair();return{expr:`${CON()}的母線長為 ${l} 公分、底圓半徑為 ${r} 公分，求它的展開圖中扇形的圓心角。`,answer:`${t}°`,sig:`n1:${r}:${l}`,verify:()=>arcOK(r,l,t)}}
  if(f===2){const r=rand(L===0?2:1,12),l=rand(r+1,L===0?Math.min(30,4*r):30);return{expr:`${CON()}的底圓半徑為 ${r} 公分、母線長為 ${l} 公分，求它的側面積與表面積。`,answer:`側面積 ${pi(r*l)} 平方公分，表面積 ${pi(r*r+r*l)} 平方公分`,sig:`n2:${r}:${l}`,verify:()=>{const t=360*r/l;return near(P*l*l*t/360,r*l*P)&&near(P*r*r+P*l*l*t/360,(r*r+r*l)*P)}}}
  if(f===3){const[r,l,t]=pair();return{expr:`${CON()}的展開圖中，扇形的半徑為 ${l} 公分、圓心角為 ${t}°，求底圓半徑與圓錐的表面積。`,answer:`底圓半徑 ${r} 公分，表面積 ${pi(r*r+r*l)} 平方公分`,sig:`n3:${r}:${l}`,verify:()=>arcOK(r,l,t)&&near(P*r*r+P*l*l*t/360,(r*r+r*l)*P)}}
  const[p,q,s]=pick(TRIP),k=rand(1,2),r=p*k,h=q*k,l=s*k,t=R(360*r,l),swap=pick([false,true]),rr=swap?h:r,hh=swap?r:h,tt=R(360*rr,l);if(tt.d!==1)return null;

 });

 return{title:"立體圖形",symbol:"⬡",subtitle:"頂點面邊數・空間對角線・角柱的體積與表面積・圓柱與中空容器・角錐的表面積・圓錐展開圖",instruction:"含 π 的答案保留 π，根式化為最簡；單位：長度公分、面積平方公分、體積立方公分。",modes:["integer"],modeLabels:{integer:"整數邊長"},mixed:false,answerLabel:"答：",
  levels:{basic:"基礎：角柱與角錐的頂點面邊數、由一種個數反求幾角柱（錐）；長方體與正方體的對角線、由對角線與兩邊求第三邊；長方體、直角三角柱、直角梯形柱的體積與表面積；圓柱的體積與表面積、側面積、無蓋容器；正四角錐與正四面體的表面積、由高求斜高；由圓心角求母線、由母線求圓心角、圓錐的側面積與表面積。",advanced:"進階：由總和反求、由兩種個數的差反求、角柱與角錐邊數相同；底面對角線與空間對角線、正方體反求、物品斜放；由體積反求高、直角梯形柱、直角三角柱；中空水管、放入物體後水位上升、側面積；由側稜求斜高、由高求斜高、正四面體；由扇形求底圓半徑、圓心角、表面積。",challenge:"挑戰：頂點（或面）數相同且邊數相差 d、用尤拉公式求面數並判斷形體；由邊長比與對角線求體積、由三個面的面積求對角線、物品斜放；由表面積反求高、由體積反求高、正方體挖穿方孔；無蓋中空容器、長方體水槽中放入圓柱、中空水管；由表面積反求斜高或邊長、由側稜與斜高求底邊、展開圖的周長；由半徑與高求母線、由表面積反求母線、由扇形求底圓半徑。"},

const CONFIGS={ratio3:ratio3Config,parallelratio:parallelratioConfig,similar:similarConfig,righttri:righttriConfig,circle1:circle1Config,circle2:circle2Config,centers:centersConfig,quadfunc:quadfuncConfig,quartile:quartileConfig,boxplot:boxplotConfig,probability:probabilityConfig,treediagram:treediagramConfig,solid:solidConfig},CFG=CONFIGS[TOPIC_KEY]();
let state={level:"advanced",groups:[],paper:null,mixed:true};
function safeQuestion(unit,ctx,seen){for(let i=0;i<50;i++){try{const q=unit.gen(ctx);if(!okResult(q))continue;const key=norm(q.sig||q.expr);if(seen.has(key))continue;seen.add(key);return q}catch(e){if(i===49)console.warn("出題失敗",unit.id,e)}}console.warn("超過50次仍無法產生不重複且可驗證的題目",unit.id);return null}
globalThis.__BHCS_TEST__={CFG,R,add,sub,mul,div,eq,safeQuestion,okResult};
if(typeof document==="undefined")return;
function build(){const sel=$("topicSel");TOPICS.forEach(([k,n])=>{const o=document.createElement("option");o.value=k;o.textContent=n;if(k===TOPIC_KEY)o.selected=true;sel.appendChild(o)});sel.addEventListener("change",()=>{location.search="?topic="+sel.value});$("topicTitle").textContent=CFG.title;$("topicLogo").textContent=CFG.symbol||"∑";document.title="百宏文教｜"+CFG.title+" 出題器";const can=document.querySelector('link[rel="canonical"]');if(can)can.href="https://www.bhcs.com.tw/tools/math/g9-drills.html?topic="+TOPIC_KEY;$("subtitle").textContent=CFG.subtitle;$("difficultyNote").textContent=CFG.levels.advanced;const mb=$("modeBoxes");CFG.modes.forEach(m=>{const label=document.createElement("label");label.className="choice";label.innerHTML=`<input type="checkbox" data-mode="${m}" checked>${(CFG.modeLabels||MODE_LABEL)[m]}`;mb.appendChild(label)});if(CFG.mixed){const label=document.createElement("label");label.className="choice";label.innerHTML='<input id="mixedNumber" type="checkbox" checked>可用帶分數';mb.appendChild(label)}const grid=$("unitGrid");CFG.units.forEach(u=>{const box=document.createElement("div");box.className="unit";box.innerHTML=`<input class="unit-check" id="unit-${u.id}" type="checkbox" data-unit="${u.id}"><label for="unit-${u.id}">${u.name}</label><input class="count" type="number" min="1" max="40" value="1" data-count="${u.id}" aria-label="${u.name}題數">`;grid.appendChild(box)});grid.addEventListener("change",e=>{if(e.target.matches(".unit-check"))grid.querySelector(`[data-count='${e.target.dataset.unit}']`).disabled=!e.target.checked;markChanged();updateTotal()});grid.addEventListener("input",e=>{if(e.target.matches(".count")){e.target.value=Math.max(1,Math.min(40,Number(e.target.value)||1));markChanged();updateTotal()}});applyPreset("advanced")}
const selectedModes=()=>[...document.querySelectorAll("[data-mode]:checked")].map(x=>x.dataset.mode),selectedUnits=()=>CFG.units.flatMap(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);return c.checked?[{...u,count:Math.max(1,Math.min(40,Number(n.value)||1))}]:[]});
function applyPreset(level){state.level=level;const p=CFG.presets[level];CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`),v=p[u.id]||0;c.checked=v>0;n.disabled=!c.checked;n.value=v||1});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("difficultyNote").textContent=CFG.levels[level];updateTotal();markChanged()}
function setEach(v){CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);c.checked=v>0;n.disabled=!c.checked;if(v)n.value=v});updateTotal();markChanged()}
function updateTotal(){$("total").textContent=`共 ${selectedUnits().reduce((s,u)=>s+u.count,0)} 題`}function markChanged(){$("status").textContent="設定已變更，按「重新出題」套用。"}
function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Set,skipped=[];state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}。`}
function render(){const out=$("output");out.innerHTML="";if(!state.paper||!state.groups.length){out.innerHTML='<div class="empty"><b>尚未產生練習卷</b>請選擇數型與單元後按「重新出題」。</div>';return}const teacher=$("version").value==="teacher",cols=$("columns").value,work={small:"10mm",medium:"16mm",large:"26mm"}[$("space").value],sheet=document.createElement("div");sheet.className=`sheet ${teacher?"teacher":"student"}`;sheet.style.setProperty("--work",work);sheet.innerHTML=`<div class="head"><div class="bhcs-brand"><b>百宏文教機構</b><span>數學計算力練習 · 徹底反覆計算系列</span><i>www.bhcs.com.tw</i></div><h2>${CFG.title} 計算力練習（${{basic:"基礎",advanced:"進階",challenge:"挑戰"}[state.paper.level]}）</h2><span>班級：______　姓名：__________　日期：___／___　作答時間：___分___秒</span></div><p class="tip">${CFG.instruction}</p>`;let no=1;state.groups.forEach(g=>{const sec=document.createElement("section");sec.innerHTML=`<div class="sec">${g.unit.name}</div><p class="tip">${g.unit.tip}</p><div class="grid c${cols}"></div>`;const grid=sec.querySelector(".grid");g.questions.forEach(q=>{const item=document.createElement("div");item.className="prob";item.innerHTML=`<div class="q"><span class="no">(${no++})</span><span class="expr">${q.expr}</span></div><div class="work">${CFG.answerLabel??"原式＝"}<span class="ans">${q.answer}</span></div>`;grid.appendChild(item)});sheet.appendChild(sec)});out.appendChild(sheet);fit()}

build();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>applyPreset(b.dataset.level)));document.querySelectorAll("[data-mode],#mixedNumber").forEach(c=>c.addEventListener("change",markChanged));document.querySelectorAll("[data-each]").forEach(b=>b.addEventListener("click",()=>setEach(Number(b.dataset.each))));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.paper&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",render));addEventListener("resize",fit);addEventListener("beforeprint",()=>{const s=document.querySelector(".sheet");if(s)s.style.zoom=1});addEventListener("afterprint",fit);generate();
