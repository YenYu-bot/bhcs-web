<script>
(()=>{"use strict";
const TOPICS=[["ratio3","連比與比例分配"],["parallelratio","平行線截比例線段"],["similar","相似形"],["righttri","直角三角形"],["circle1","圓：扇形、切線與弦心距"],["circle2","圓心角、圓周角與內接四邊形"],["centers","三角形的外心、內心、重心"],["quadfunc","二次函數的圖形與最大值、最小值"],["quartile","中位數與四分位數"],["boxplot","盒狀圖、全距與四分位距"],["probability","認識機率"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"ratio3",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}
const numHTML=(a,mode,opt={})=>mode==="decimal"?decHTML(a):mode==="fraction"?fracHTML(a,opt):String(a.n).replace("-","−");
function numberFor(mode,level,max=30){if(mode==="integer"){const k=level==="basic"?2:level==="advanced"?10:25;return R(rand(level==="basic"?2:Math.max(2,Math.floor(max*k/5)),max*k))}if(mode==="fraction"){const ds=level==="basic"?[2,3,4,5,6]:[2,3,4,5,6,8,9,10,12,15,20],d=pick(ds);let n=rand(1,(level==="challenge"?3:2)*d-1);while(n%d===0)n=rand(1,3*d-1);return R(n,d)}const p=level==="basic"?1:pick(level==="advanced"?[1,2]:[1,2,3]),s=10**p;let n=rand(1,max*s);while(n%10===0)n=rand(1,max*s);return R(n,s)}
const norm=s=>String(s).replace(/<[^>]*>/g,"").replace(/\s+/g,"").normalize("NFKC");

/* 幾何繪圖共用函式庫（2026-09-24，Claude）。g8 各幾何主題共用，之後 P5 國三重做也沿用。
   原則：圖形依真實角度與比例計算頂點（不會出現「標 30° 卻畫成鈍角」），標示用純文字（SVG 內不放 HTML）。
   顏色只用 #16233A（線）、#C8352B（強調）、#7C879B（輔助線與示意圖字）、#fff。 */
const GEO=(()=>{
 const D2R=Math.PI/180;
 const f=v=>Math.round(v*10)/10;
 // 以三個內角（度）建立三角形：B 在左下、C 在右下，底邊長 base；回傳 {A,B,C}
 const triByAngles=(a,b,base=150)=>{const c=180-a-b,B=[0,0],C=[base,0],AB=base*Math.sin(c*D2R)/Math.sin(a*D2R);return{A:[AB*Math.cos(b*D2R),AB*Math.sin(b*D2R)],B,C}};
 // 由多邊形內角（度，依逆時針）與邊長建立頂點（最後一邊自動閉合，僅供示意）
 const polyByAngles=(angles,len=60)=>{const pts=[[0,0]];let dir=0;for(let i=0;i<angles.length-1;i++){const p=pts[pts.length-1];pts.push([p[0]+len*Math.cos(dir*D2R),p[1]+len*Math.sin(dir*D2R)]);dir+=180-angles[(i+1)%angles.length]}return pts};
 // 四邊形 ABCD（逆時針）：給 ∠A、∠B、∠C 與 AB、BC 長，D 由兩射線交點決定，所以 ∠D 自動等於 360°－其餘三角（精確）
 const quadByAngles=(A,B,C,ab=100,bc=75)=>{const P0=[0,0],P1=[ab,0],d1=(180-B)*D2R,P2=[P1[0]+bc*Math.cos(d1),P1[1]+bc*Math.sin(d1)],d2=d1+(180-C)*D2R,dA=A*D2R;
  // 解 P2＋t(cos d2, sin d2)＝s(cos dA, sin dA)
  const a11=Math.cos(d2),a12=-Math.cos(dA),a21=Math.sin(d2),a22=-Math.sin(dA),det=a11*a22-a12*a21;if(Math.abs(det)<1e-9)return null;const t=(-P2[0]*a22+P2[1]*a12)/det,s2=(a11*-P2[1]+a21*P2[0])/det;if(t<=5||s2<=5)return null;return[P0,P1,P2,[P2[0]+t*Math.cos(d2),P2[1]+t*Math.sin(d2)]]};
 const regular=(n,r=60)=>Array.from({length:n},(_,i)=>{const t=(90+360*i/n)*D2R;return[r*Math.cos(t),r*Math.sin(t)]});
 // 把數學坐標（y 向上）的點放進寬 W、高 H 的框，保留邊界 pad；回傳轉換函式
 const fit=(pts,W,H,pad=22)=>{const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),s=Math.min((W-2*pad)/((x1-x0)||1),(H-2*pad)/((y1-y0)||1)),ox=(W-(x1-x0)*s)/2,oy=(H-(y1-y0)*s)/2;return p=>[f(ox+(p[0]-x0)*s),f(H-oy-(p[1]-y0)*s)]};
 const svg=(W,H,body,note=true)=>`<svg class="fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="示意圖">${note?`<text x="${W-3}" y="${H-3}" font-size="9" fill="#7C879B" text-anchor="end">示意圖</text>`:""}${body}</svg>`;
 const line=(p,q,o={})=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${o.c||"#16233A"}" stroke-width="${o.w||1.5}"${o.dash?` stroke-dasharray="${o.dash}"`:""}/>`;
 const poly=(ps,o={})=>`<polygon points="${ps.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${o.c||"#16233A"}" stroke-width="${o.w||1.5}" stroke-linejoin="round"/>`;
 const text=(p,t,o={})=>`<text x="${p[0]}" y="${p[1]}" font-size="${o.s||11}" fill="${o.c||"#16233A"}" text-anchor="${o.a||"middle"}" font-family="Noto Sans TC,sans-serif"${o.i?' font-style="italic"':""}>${t}</text>`;
 const dot=(p,o={})=>`<circle cx="${p[0]}" cy="${p[1]}" r="${o.r||2.2}" fill="${o.c||"#16233A"}"/>`;
 const unitv=(p,q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]};
 // 頂點標籤：放在由形心往外的方向
 const vlabel=(p,center,t,d=11)=>{const u=unitv(center,p);return text([f(p[0]+u[0]*d),f(p[1]+u[1]*d+4)],t,{i:true})};
 // 角弧與角的標示（螢幕坐標）：頂點 v、兩臂方向點 p、q
 const arc=(v,p,q,label,o={})=>{const r=o.r||16,u=unitv(v,p),w=unitv(v,q),a1=[f(v[0]+u[0]*r),f(v[1]+u[1]*r)],a2=[f(v[0]+w[0]*r),f(v[1]+w[1]*r)],cross=u[0]*w[1]-u[1]*w[0],big=0,sweep=cross>0?1:0;
  const mid=unitv([0,0],[u[0]+w[0],u[1]+w[1]]),lr=r+(o.lr||11),lp=[f(v[0]+mid[0]*lr),f(v[1]+mid[1]*lr+4)];
  return `<path d="M${a1[0]} ${a1[1]} A${r} ${r} 0 ${big} ${sweep} ${a2[0]} ${a2[1]}" fill="none" stroke="${o.c||"#16233A"}" stroke-width="1"/>`+(label?text(lp,label,{s:o.s||10,c:o.c||"#16233A"}):"")};
 const right=(v,p,q,s=8)=>{const u=unitv(v,p),w=unitv(v,q),a=[f(v[0]+u[0]*s),f(v[1]+u[1]*s)],b=[f(v[0]+(u[0]+w[0])*s),f(v[1]+(u[1]+w[1])*s)],c=[f(v[0]+w[0]*s),f(v[1]+w[1]*s)];return `<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]} L${c[0]} ${c[1]}" fill="none" stroke="#16233A" stroke-width="1"/>`};
 // 等長記號：在線段中點畫 n 條短線
 const tick=(p,q,n=1)=>{const m=[(p[0]+q[0])/2,(p[1]+q[1])/2],u=unitv(p,q),nrm=[-u[1],u[0]];let s="";for(let i=0;i<n;i++){const o=(i-(n-1)/2)*4,c=[m[0]+u[0]*o,m[1]+u[1]*o];s+=line([f(c[0]-nrm[0]*5),f(c[1]-nrm[1]*5)],[f(c[0]+nrm[0]*5),f(c[1]+nrm[1]*5)],{w:1.2})}return s};

 const arrow=(p,q,n=1)=>{const m=[(p[0]+q[0])/2,(p[1]+q[1])/2],u=unitv(p,q),nrm=[-u[1],u[0]];let s="";for(let i=0;i<n;i++){const c=[m[0]+u[0]*(i*5),m[1]+u[1]*(i*5)];s+=`<path d="M${f(c[0]-u[0]*5+nrm[0]*4)} ${f(c[1]-u[1]*5+nrm[1]*4)} L${f(c[0])} ${f(c[1])} L${f(c[0]-u[0]*5-nrm[0]*4)} ${f(c[1]-u[1]*5-nrm[1]*4)}" fill="none" stroke="#16233A" stroke-width="1.2"/>`}return s};
 const ext=(p,q,len=40)=>{const u=unitv(p,q);return[f(q[0]+u[0]*len),f(q[1]+u[1]*len)]};

})();

    整數模式：連比的項與答案都是整數；分數模式：連比的項可為分數或小數（求連比、連比例式），答案仍化為最簡整數比。

 });

 const unit=(id,name,tip,modes,gen)=>({id,name,tip,modes,gen});

 const form=ctx=>pick([[0,1,2],[1,2,3],[2,3,4]][lv(ctx)]);
 const S=v=>numHTML(v,v.d===1?"integer":"fraction",{mixed:false}),num=v=>v.n/v.d,I=n=>R(n);
 const nz=(a,b)=>{let v=0;while(!v)v=rand(a,b);return v};
 const absS=v=>v.d===1?String(Math.abs(v.n)):fr(Math.abs(v.n),v.d);
 const term=(c,sym,lead)=>{if(!c.n)return"";const one=Math.abs(c.n)===1&&c.d===1&&sym;return(c.n<0?"−":lead?"":"＋")+(one?"":absS(c))+sym};
 const poly=(a,b,c)=>"y＝"+term(a,"x²",true)+term(b,"x",false)+term(c,"",false);
 const xh=h=>h.n?`(x${h.n>0?"−":"＋"}${absS(h)})²`:"x²";
 const aPre=a=>a.d===1&&Math.abs(a.n)===1?(a.n<0?"−":""):(a.n<0?"−":"")+absS(a);
 const vform=(a,h,k)=>"y＝"+aPre(a)+xh(h)+term(k,"",false);
 const pt=(x,y)=>`（${S(x)}，${S(y)}）`;
 const axis=h=>`x＝${S(h)}`;
 const expand=(a,h,k)=>({a,b:mul(R(-2),mul(a,h)),c:add(mul(a,mul(h,h)),k)});
 const F=(p,x)=>num(p.a)*x*x+num(p.b)*x+num(p.c);
 const near=(x,y)=>Math.abs(x-y)<1e-9*(1+Math.abs(x)+Math.abs(y));
 // 頂點 (h,k) 的另一條驗證：f(h)＝k、左右對稱、往外一步的變化與 a 同號
 const vOK=(p,h,k)=>{const x=num(h),y=num(k);return near(F(p,x),y)&&near(F(p,x+1.7),F(p,x-1.7))&&(F(p,x+1)-y)*num(p.a)>0};
 const A=(ctx,big=false)=>{const s=pick([1,-1]);if(pick(ctx.modes)==="fraction"){const[n,d]=pick([[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,2],[5,2],[4,3]]);return R(s*n,d)}return R(s*rand(1,big?6:lv(ctx)?5:3))};
 const rng=ctx=>[5,8,10][lv(ctx)];
 const H=ctx=>I(nz(-rng(ctx),rng(ctx))),K=ctx=>I(rand(-rng(ctx)-2,rng(ctx)+2));
 const dirX=m=>m>0?`向右平移 ${m} 單位`:`向左平移 ${-m} 單位`,dirY=n=>n>0?`向上平移 ${n} 單位`:`向下平移 ${-n} 單位`;

 // ① 頂點坐標
 const vertex=unit("vertex","頂點坐標與對稱軸","y＝a(x−h)²＋k 的頂點是 (h，k)、對稱軸是 x＝h；a＞0 開口向上，a＜0 開口向下。一般式先配方成頂點式。",["integer","fraction"],ctx=>{
  const f=form(ctx),a=A(ctx);let h=H(ctx),k=K(ctx);
  if(f===0){const p=expand(a,h,k);return{expr:`求二次函數 ${vform(a,h,k)} 圖形的頂點坐標。`,answer:`頂點 ${pt(h,k)}`,sig:`v0:${plain(a)}:${h.n}:${k.n}`,verify:()=>vOK(p,h,k)}}
  if(f===1){const sv=pick(["h0","k0"]);if(sv==="h0")h=I(0);else k=I(0);const p=expand(a,h,k);
   return{expr:`求二次函數 ${vform(a,h,k)} 圖形的頂點坐標與對稱軸。`,answer:`頂點 ${pt(h,k)}，對稱軸 ${axis(h)}`,sig:`v1:${sv}:${plain(a)}:${h.n}:${k.n}`,verify:()=>vOK(p,h,k)}}
  if(f===2){const p=expand(a,h,k);return{expr:`二次函數 ${vform(a,h,k)} 的圖形開口向上還是向下？並求其頂點坐標與對稱軸。`,answer:`開口向${a.n>0?"上":"下"}，頂點 ${pt(h,k)}，對稱軸 ${axis(h)}`,sig:`v2:${plain(a)}:${h.n}:${k.n}`,verify:()=>vOK(p,h,k)&&(F(p,num(h)+3)>num(k))===(a.n>0)}}
  if(f===3){const p=expand(a,h,k);return{expr:`利用配方法，求二次函數 ${poly(p.a,p.b,p.c)} 圖形的頂點坐標與對稱軸。`,answer:`頂點 ${pt(h,k)}，對稱軸 ${axis(h)}`,sig:`v3:${plain(a)}:${h.n}:${k.n}`,verify:()=>{const hx=-num(p.b)/(2*num(p.a));return near(hx,num(h))&&near(F(p,hx),num(k))}}}
  const p=expand(a,h,k);
  return{expr:`二次函數 y＝${term(a,"x²",true)}＋bx＋c 的圖形頂點為 ${pt(h,k)}，求 b、c 的值。`,answer:`b＝${S(p.b)}，c＝${S(p.c)}`,sig:`v4:${plain(a)}:${h.n}:${k.n}`,verify:()=>{const hx=-num(p.b)/(2*num(a));return near(hx,num(h))&&near(num(a)*hx*hx+num(p.b)*hx+num(p.c),num(k))}};
 });

 // ② 與 x 軸的交點
 const xaxis=unit("xaxis","與 x 軸的交點","a、k 異號時與 x 軸有兩個交點，k＝0 時恰有一個，a、k 同號時沒有交點；一般式可用判別式 b²−4ac 判斷。",["integer","fraction"],ctx=>{
  const f=form(ctx),a=A(ctx),h=H(ctx),t=pick([0,1,2]);
  const kOf=t=>{if(t===1)return I(0);const m=R(rand(1,rng(ctx)+2));return t===2?(a.n>0?R(-m.n):m):(a.n>0?m:R(-m.n))};
  const cntS=t=>t===2?"2 個":t===1?"1 個":"0 個（沒有交點）";
  const D=p=>num(p.b)**2-4*num(p.a)*num(p.c);
  const cOK=(p,t)=>{const d=D(p);return t===2?d>1e-9:t===1?Math.abs(d)<1e-9:d<-1e-9};
  if(f===0){const k=kOf(t),p=expand(a,h,k);return{expr:`判斷二次函數 ${vform(a,h,k)} 的圖形與 x 軸有幾個交點。`,answer:cntS(t),sig:`x0:${plain(a)}:${h.n}:${plain(k)}`,verify:()=>cOK(p,t)}}
  if(f===1){const k=kOf(t),p=expand(a,h,k);return{expr:`二次函數 ${vform(a,h,k)} 的圖形與 x 軸有幾個交點？與 y 軸的交點坐標為何？`,answer:`與 x 軸 ${cntS(t)}；與 y 軸交於 ${pt(I(0),p.c)}`,sig:`x1:${plain(a)}:${h.n}:${plain(k)}`,verify:()=>cOK(p,t)&&near(F(p,0),num(p.c))}}
  if(f===2){const k=kOf(t),p=expand(a,h,k);return{expr:`判斷二次函數 ${poly(p.a,p.b,p.c)} 的圖形與 x 軸有幾個交點。`,answer:cntS(t),sig:`x2:${plain(a)}:${h.n}:${plain(k)}`,verify:()=>{const yv=F(p,num(h));return t===2?yv*num(a)<0:t===1?Math.abs(yv)<1e-9:yv*num(a)>0}}}
  if(f===3){const m=rand(1,lv(ctx)?6:4),k=R(-a.n*m*m,a.d),p=expand(a,h,k),x1=I(h.n-m),x2=I(h.n+m);const show=pick(["v","g"]);
   return{expr:`求二次函數 ${show==="v"?vform(a,h,k):poly(p.a,p.b,p.c)} 的圖形與 x 軸的交點坐標。`,answer:`${pt(x1,I(0))}、${pt(x2,I(0))}`,sig:`x3:${show}:${plain(a)}:${h.n}:${m}`,verify:()=>near(F(p,h.n-m),0)&&near(F(p,h.n+m),0)&&m>0}}
  // 由交點個數求 k 的值或範圍
  const hh=I(nz(-6,6)),b=mul(R(-2),mul(a,hh)),k0=div(mul(b,b),mul(R(4),a)),want=pick([0,1,2]),rel=want===1?"＝":(want===2)===(a.n>0)?"＜":"＞";
  const word=want===2?"有兩個交點":want===1?"恰有一個交點":"沒有交點";
  return{expr:`若二次函數 y＝${term(a,"x²",true)}${term(b,"x",false)}＋k 的圖形與 x 軸${word}，求 k 的${want===1?"值":"範圍"}。`,answer:`k${rel}${S(k0)}`,sig:`x4:${plain(a)}:${hh.n}:${want}`,verify:()=>{const d=kk=>num(b)**2-4*num(a)*kk,x=num(k0),test=rel==="＝"?[x]:rel==="＜"?[x-0.5,x-3]:[x+0.5,x+3];return Math.abs(d(x))<1e-9&&test.every(kk=>want===2?d(kk)>0:want===1?Math.abs(d(kk))<1e-9:d(kk)<0)}};
 });

 // ③ 最大值與最小值
 const extreme=unit("extreme","最大值與最小值","a＞0 時頂點是最低點，y 有最小值 k；a＜0 時頂點是最高點，y 有最大值 k；限定範圍時還要比較兩端點。",["integer","fraction"],ctx=>{
  const f=form(ctx),a=A(ctx),h=H(ctx),k=K(ctx),p=expand(a,h,k),type=a.n>0?"最小值":"最大值";
  const scan=(lo,hi)=>{let mx=-Infinity,mn=Infinity;for(let i=0;i<=4000;i++){const y=F(p,lo+(hi-lo)*i/4000);mx=Math.max(mx,y);mn=Math.min(mn,y)}return[mx,mn]};
  const exOK=()=>{const[mx,mn]=scan(num(h)-5,num(h)+5);return near(a.n>0?mn:mx,num(k))};
  const ans=`當 x＝${S(h)} 時，y 有${type} ${S(k)}`;
  if(f===0)return{expr:`判斷二次函數 ${vform(a,h,k)} 在 x 為多少時 y 有最大值或最小值，並求其值。`,answer:ans,sig:`e0:${plain(a)}:${h.n}:${k.n}`,verify:exOK};
  if(f===1){const kk=k.n?`${S(k)}${a.n<0?"−":"＋"}${a.d===1&&Math.abs(a.n)===1?"":absS(a)}${xh(h)}`:vform(a,h,k).slice(2);
   return{expr:`二次函數 y＝${kk} 有最大值還是最小值？在 x 為多少時發生？其值為何？`,answer:ans,sig:`e1:${plain(a)}:${h.n}:${k.n}`,verify:exOK}}
  if(f===2)return{expr:`利用配方法，求二次函數 ${poly(p.a,p.b,p.c)} 的最大值或最小值，以及此時 x 的值。`,answer:ans,sig:`e2:${plain(a)}:${h.n}:${k.n}`,verify:exOK};
  if(f===3){return{expr:`若二次函數 y＝${term(a,"x²",true)}${term(p.b,"x",false)}＋c 的${type}為 ${S(k)}，求 c 的值。`,answer:`c＝${S(p.c)}`,sig:`e3:${plain(a)}:${h.n}:${k.n}`,verify:()=>{const hx=-num(p.b)/(2*num(a));return near(num(a)*hx*hx+num(p.b)*hx+num(p.c),num(k))&&exOK()}}}
  let lo,hi;do{lo=h.n+rand(-5,3);hi=lo+rand(2,6)}while(Math.abs(lo-h.n)===Math.abs(hi-h.n));
  const ex=[lo,hi].concat(lo<h.n&&h.n<hi?[h.n]:[]).map(x=>[x,add(mul(a,I((x-h.n)**2)),k)]);
  const mx=ex.reduce((m,e)=>cmp(e[1],m[1])>0?e:m),mn=ex.reduce((m,e)=>cmp(e[1],m[1])<0?e:m);
  return{expr:`當 ${S(I(lo))} ≤ x ≤ ${S(I(hi))} 時，求二次函數 ${vform(a,h,k)} 的最大值與最小值。`,answer:`x＝${S(I(mx[0]))} 時最大值 ${S(mx[1])}；x＝${S(I(mn[0]))} 時最小值 ${S(mn[1])}`,sig:`e4:${plain(a)}:${h.n}:${k.n}:${lo}:${hi}`,verify:()=>{const[M,m]=scan(lo,hi),tol=1e-4*(1+Math.abs(M)+Math.abs(m));return Math.abs(M-num(mx[1]))<tol&&Math.abs(m-num(mn[1]))<tol&&near(F(p,mx[0]),num(mx[1]))&&near(F(p,mn[0]),num(mn[1]))}};
 });

 // ④ 求二次函數
 const findfn=unit("findfn","求二次函數","已知頂點 (h，k) 時設 y＝a(x−h)²＋k，再代入另一點求 a；已知對稱軸時設 y＝a(x−h)²＋k，代入兩點求 a、k。",["integer","fraction"],ctx=>{
  const f=form(ctx),a=A(ctx);let h=H(ctx),k=K(ctx);
  const dx=()=>{const q=a.d;return q===1?nz(-3,3):pick([-1,1])*q*rand(1,2)};
  const at=x=>add(mul(a,I((x-h.n)**2)),k);
  const fnOK=(pts)=>{const p=expand(a,h,k);return pts.every(([x,y])=>near(F(p,num(x)),num(y)))&&vOK(p,h,k)};
  const ans=()=>vform(a,h,k);
  if(f===0){const x1=h.n+dx(),y1=at(x1);return{expr:`二次函數圖形的頂點為 ${pt(h,k)}，且通過點 ${pt(I(x1),y1)}，求此二次函數。`,answer:ans(),sig:`f0:${plain(a)}:${h.n}:${k.n}:${x1}`,verify:()=>fnOK([[I(x1),y1]])}}
  if(f===1){const on=pick(["x","y"]);if(on==="x")k=I(0);else h=I(0);const x1=h.n+dx(),y1=at(x1);
   const cond=on==="x"?`頂點在 x 軸上，對稱軸為 ${axis(h)}`:`頂點在 y 軸上，且頂點為 ${pt(h,k)}`;
   return{expr:`二次函數圖形的${cond}，並通過點 ${pt(I(x1),y1)}，求此二次函數。`,answer:ans(),sig:`f1:${on}:${plain(a)}:${h.n}:${k.n}:${x1}`,verify:()=>fnOK([[I(x1),y1]])}}
  if(f===2){h=I(nz(-4,4));const c=at(0);if(c.d!==1||cmp(c,k)===0)return null;return{expr:`二次函數圖形的頂點為 ${pt(h,k)}，且與 y 軸交於點 ${pt(I(0),c)}，求此二次函數。`,answer:ans(),sig:`f2:${plain(a)}:${h.n}:${k.n}`,verify:()=>fnOK([[I(0),c]])}}
  if(f===3){let d1,d2;do{d1=dx();d2=dx()}while(Math.abs(d1)===Math.abs(d2));const x1=h.n+d1,x2=h.n+d2;
   return{expr:`二次函數圖形的對稱軸為 ${axis(h)}，且通過 ${pt(I(x1),at(x1))}、${pt(I(x2),at(x2))} 兩點，求此二次函數。`,answer:ans(),sig:`f3:${plain(a)}:${h.n}:${k.n}:${d1}:${d2}`,verify:()=>fnOK([[I(x1),at(x1)],[I(x2),at(x2)]])}}
  const m=a.d===1?rand(1,4):a.d*(a.d>3?1:rand(1,2)),x1=h.n-m,x2=h.n+m;k=R(-a.n*m*m,a.d);
  return{expr:`二次函數圖形與 x 軸交於 ${pt(I(x1),I(0))}、${pt(I(x2),I(0))} 兩點，且${a.n<0?"最大值":"最小值"}為 ${S(k)}，求此二次函數。`,answer:ans(),sig:`f4:${plain(a)}:${h.n}:${m}`,verify:()=>fnOK([[I(x1),I(0)],[I(x2),I(0)]])&&(a.n<0?k.n>0:k.n<0)};
 });

 // ⑤ 平移
 const shift=unit("shift","圖形的平移","y＝ax² 向右平移 h、向上平移 k 得 y＝a(x−h)²＋k；平移不改變 a（開口方向與大小），只改變頂點。",["integer","fraction"],ctx=>{
  const f=form(ctx),a=A(ctx),L=lv(ctx);
  const moved=(p,m,n)=>x=>F(p,x-m)+n;
  const shOK=(p0,m,n,p1)=>[-2.5,0,1,3.5].every(x=>near(moved(p0,m,n)(x),F(p1,x)));
  const base="y＝"+term(a,"x²",true);
  if(f===0){const sv=L?"both":pick(["x","y","both"]),m=sv==="y"?0:nz(-6,6),n=sv==="x"?0:nz(-8,8),h=I(m),k=I(n);
   const how=[m?dirX(m):"",n?dirY(n):""].filter(Boolean).join("，再");
   return{expr:`將二次函數 ${base} 的圖形${how}，求所得圖形的二次函數。`,answer:vform(a,h,k),sig:`s0:${plain(a)}:${m}:${n}`,verify:()=>shOK(expand(a,I(0),I(0)),m,n,expand(a,h,k))}}
  if(f===1){const m=nz(-6,6),n=nz(-8,8),h=I(m),k=I(n);return{expr:`二次函數 ${vform(a,h,k)} 的圖形可由 ${base} 的圖形如何平移得到？`,answer:`${dirX(m)}，再${dirY(n)}`,sig:`s1:${plain(a)}:${m}:${n}`,verify:()=>shOK(expand(a,I(0),I(0)),m,n,expand(a,h,k))}}
  if(f===2){const h=nz(-7,7),x1=h+nz(-2,2),y1=rand(-12,12),k=sub(I(y1),mul(a,I((x1-h)**2))),ax=`x${h>0?"−":"＋"}${Math.abs(h)}＝0`;
   return{expr:`已知二次函數 y＝a(x−h)²＋k 的圖形可由 ${base} 的圖形平移後得到，其對稱軸為直線 ${ax}，且圖形通過點 ${pt(I(x1),I(y1))}，求此圖形的頂點坐標。`,answer:`頂點 ${pt(I(h),k)}`,sig:`s2:${plain(a)}:${h}:${x1}:${y1}`,verify:()=>{const p=expand(a,I(h),k);return near(F(p,x1),y1)&&vOK(p,I(h),k)}}}
  if(f===3){const h0=I(nz(-5,5)),k0=I(rand(-6,6)),m=nz(-5,5),n=nz(-6,6),h=add(h0,I(m)),k=add(k0,I(n));
   return{expr:`將二次函數 ${vform(a,h0,k0)} 的圖形${dirX(m)}，再${dirY(n)}，求新圖形的頂點坐標與二次函數。`,answer:`頂點 ${pt(h,k)}，${vform(a,h,k)}`,sig:`s3:${plain(a)}:${h0.n}:${k0.n}:${m}:${n}`,verify:()=>shOK(expand(a,h0,k0),m,n,expand(a,h,k))}}
  const h0=I(nz(-5,5)),k0=I(rand(-6,6)),m=nz(-5,5),n=nz(-6,6),p0=expand(a,h0,k0),h=add(h0,I(m)),k=add(k0,I(n));
  return{expr:`將二次函數 ${poly(p0.a,p0.b,p0.c)} 的圖形${dirX(m)}，再${dirY(n)}，求新圖形的頂點坐標與二次函數（寫成頂點式）。`,answer:`頂點 ${pt(h,k)}，${vform(a,h,k)}`,sig:`s4:${plain(a)}:${h0.n}:${k0.n}:${m}:${n}`,verify:()=>shOK(p0,m,n,expand(a,h,k))};
 });

 return{title:"二次函數的圖形與最大值、最小值",symbol:"∪",subtitle:"頂點坐標與對稱軸・與 x 軸的交點・最大值與最小值・求二次函數・圖形的平移",instruction:"頂點式 y＝a(x−h)²＋k 的頂點為 (h，k)、對稱軸為 x＝h；一般式先配方。答案為分數時化為最簡分數。",modes:["integer","fraction"],mixed:false,answerLabel:"答：",
  levels:{basic:"基礎：頂點式求頂點、y＝ax²＋k 與 y＝a(x−h)² 的頂點與對稱軸、開口方向；頂點式判斷交點個數、加問 y 軸交點、一般式判斷交點個數；頂點式與 y＝k＋a(x−h)² 求最值、一般式配方求最值；由頂點與一點、頂點在坐標軸上、頂點與 y 截距求函數；y＝ax² 的平移與反推、由對稱軸與一點求頂點。",advanced:"進階：y＝ax²＋k 與 y＝a(x−h)² 的頂點與對稱軸、開口方向、一般式配方求頂點；交點個數與 y 軸交點、一般式判斷交點、求 x 軸交點坐標；y＝k＋a(x−h)² 求最值、一般式配方求最值、由最值反求 c；頂點在坐標軸上、頂點與 y 截距、對稱軸與兩點求函數；平移的反推、由對稱軸與一點求頂點、頂點式再平移。",challenge:"挑戰：開口方向、一般式配方求頂點、由頂點反求 b、c；一般式判斷交點、x 軸交點坐標、由交點個數求 k 的值或範圍；一般式配方求最值、由最值反求 c、限定範圍的最大值與最小值；頂點與 y 截距、對稱軸與兩點、兩個 x 截距與最值求函數；由對稱軸與一點求頂點、頂點式再平移、一般式平移後寫成頂點式。"},
  units:[vertex,xaxis,extreme,findfn,shift],presets:{basic:{vertex:2,xaxis:2,extreme:2,findfn:2,shift:2},advanced:{vertex:2,xaxis:2,extreme:2,findfn:2,shift:2},challenge:{vertex:2,xaxis:2,extreme:2,findfn:2,shift:2}}};

function quartileConfig(){

const CONFIGS={ratio3:ratio3Config,parallelratio:parallelratioConfig,similar:similarConfig,righttri:righttriConfig,circle1:circle1Config,circle2:circle2Config,centers:centersConfig,quadfunc:quadfuncConfig,quartile:quartileConfig,boxplot:boxplotConfig,probability:probabilityConfig},CFG=CONFIGS[TOPIC_KEY]();
let state={level:"advanced",groups:[],paper:null,mixed:true};
function safeQuestion(unit,ctx,seen){for(let i=0;i<50;i++){try{const q=unit.gen(ctx);if(!okResult(q))continue;const key=norm(q.sig||q.expr);if(seen.has(key))continue;seen.add(key);return q}catch(e){if(i===49)console.warn("出題失敗",unit.id,e)}}console.warn("超過50次仍無法產生不重複且可驗證的題目",unit.id);return null}

const selectedModes=()=>[...document.querySelectorAll("[data-mode]:checked")].map(x=>x.dataset.mode),selectedUnits=()=>CFG.units.flatMap(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);return c.checked?[{...u,count:Math.max(1,Math.min(40,Number(n.value)||1))}]:[]});
function applyPreset(level){state.level=level;const p=CFG.presets[level];CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`),v=p[u.id]||0;c.checked=v>0;n.disabled=!c.checked;n.value=v||1});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("difficultyNote").textContent=CFG.levels[level];updateTotal();markChanged()}
function setEach(v){CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);c.checked=v>0;n.disabled=!c.checked;if(v)n.value=v});updateTotal();markChanged()}
function updateTotal(){$("total").textContent=`共 ${selectedUnits().reduce((s,u)=>s+u.count,0)} 題`}function markChanged(){$("status").textContent="設定已變更，按「重新出題」套用。"}
function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Set,skipped=[];state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}。`}

function fit(){if(matchMedia("print").matches)return;const sheet=document.querySelector(".sheet");if(sheet)sheet.style.zoom=Math.min(1,Math.max(.42,(innerWidth-16)/794))}
build();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>applyPreset(b.dataset.level)));document.querySelectorAll("[data-mode],#mixedNumber").forEach(c=>c.addEventListener("change",markChanged));document.querySelectorAll("[data-each]").forEach(b=>b.addEventListener("click",()=>setEach(Number(b.dataset.each))));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.paper&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",render));addEventListener("resize",fit);addEventListener("beforeprint",()=>{const s=document.querySelector(".sheet");if(s)s.style.zoom=1});addEventListener("afterprint",fit);generate();
