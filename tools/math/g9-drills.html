<script>
(()=>{"use strict";
const TOPICS=[["ratio3","連比與比例分配"],["parallelratio","平行線截比例線段"],["similar","相似形"],["righttri","直角三角形"],["circle1","圓：扇形、切線與弦心距"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"ratio3",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}
const numHTML=(a,mode,opt={})=>mode==="decimal"?decHTML(a):mode==="fraction"?fracHTML(a,opt):String(a.n).replace("-","−");
function numberFor(mode,level,max=30){if(mode==="integer"){const k=level==="basic"?2:level==="advanced"?10:25;return R(rand(level==="basic"?2:Math.max(2,Math.floor(max*k/5)),max*k))}if(mode==="fraction"){const ds=level==="basic"?[2,3,4,5,6]:[2,3,4,5,6,8,9,10,12,15,20],d=pick(ds);let n=rand(1,(level==="challenge"?3:2)*d-1);while(n%d===0)n=rand(1,3*d-1);return R(n,d)}const p=level==="basic"?1:pick(level==="advanced"?[1,2]:[1,2,3]),s=10**p;let n=rand(1,max*s);while(n%10===0)n=rand(1,max*s);return R(n,s)}
const norm=s=>String(s).replace(/<[^>]*>/g,"").replace(/\s+/g,"").normalize("NFKC");
const okResult=q=>q&&typeof q.expr==="string"&&typeof q.answer==="string"&&q.expr&&!/\b(?:NaN|undefined|Infinity)\b/.test(q.expr+q.answer)&&typeof q.verify==="function"&&q.verify()===true;
const MODE_LABEL={integer:"整數",fraction:"分數",decimal:"小數"};

/* 幾何繪圖共用函式庫（2026-09-24，Claude）。g8 各幾何主題共用，之後 P5 國三重做也沿用。
   原則：圖形依真實角度與比例計算頂點（不會出現「標 30° 卻畫成鈍角」），標示用純文字（SVG 內不放 HTML）。
   顏色只用 #16233A（線）、#C8352B（強調）、#7C879B（輔助線與示意圖字）、#fff。 */
const GEO=(()=>{
 const D2R=Math.PI/180;
 const f=v=>Math.round(v*10)/10;
 // 以三個內角（度）建立三角形：B 在左下、C 在右下，底邊長 base；回傳 {A,B,C}
 const triByAngles=(a,b,base=150)=>{const c=180-a-b,B=[0,0],C=[base,0],AB=base*Math.sin(c*D2R)/Math.sin(a*D2R);return{A:[AB*Math.cos(b*D2R),AB*Math.sin(b*D2R)],B,C}};
 // 由多邊形內角（度，依逆時針）與邊長建立頂點（最後一邊自動閉合，僅供示意）
 const polyByAngles=(angles,len=60)=>{const pts=[[0,0]];let dir=0;for(let i=0;i<angles.length-1;i++){const p=pts[pts.length-1];pts.push([p[0]+len*Math.cos(dir*D2R),p[1]+len*Math.sin(dir*D2R)]);dir+=180-angles[(i+1)%angles.length]}return pts};
 // 四邊形 ABCD（逆時針）：給 ∠A、∠B、∠C 與 AB、BC 長，D 由兩射線交點決定，所以 ∠D 自動等於 360°－其餘三角（精確）
 const quadByAngles=(A,B,C,ab=100,bc=75)=>{const P0=[0,0],P1=[ab,0],d1=(180-B)*D2R,P2=[P1[0]+bc*Math.cos(d1),P1[1]+bc*Math.sin(d1)],d2=d1+(180-C)*D2R,dA=A*D2R;
  // 解 P2＋t(cos d2, sin d2)＝s(cos dA, sin dA)
  const a11=Math.cos(d2),a12=-Math.cos(dA),a21=Math.sin(d2),a22=-Math.sin(dA),det=a11*a22-a12*a21;if(Math.abs(det)<1e-9)return null;const t=(-P2[0]*a22+P2[1]*a12)/det,s2=(a11*-P2[1]+a21*P2[0])/det;if(t<=5||s2<=5)return null;return[P0,P1,P2,[P2[0]+t*Math.cos(d2),P2[1]+t*Math.sin(d2)]]};
 const regular=(n,r=60)=>Array.from({length:n},(_,i)=>{const t=(90+360*i/n)*D2R;return[r*Math.cos(t),r*Math.sin(t)]});
 // 把數學坐標（y 向上）的點放進寬 W、高 H 的框，保留邊界 pad；回傳轉換函式
 const fit=(pts,W,H,pad=22)=>{const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),s=Math.min((W-2*pad)/((x1-x0)||1),(H-2*pad)/((y1-y0)||1)),ox=(W-(x1-x0)*s)/2,oy=(H-(y1-y0)*s)/2;return p=>[f(ox+(p[0]-x0)*s),f(H-oy-(p[1]-y0)*s)]};
 const svg=(W,H,body,note=true)=>`<svg class="fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="示意圖">${note?`<text x="${W-3}" y="${H-3}" font-size="9" fill="#7C879B" text-anchor="end">示意圖</text>`:""}${body}</svg>`;
 const line=(p,q,o={})=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${o.c||"#16233A"}" stroke-width="${o.w||1.5}"${o.dash?` stroke-dasharray="${o.dash}"`:""}/>`;
 const poly=(ps,o={})=>`<polygon points="${ps.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${o.c||"#16233A"}" stroke-width="${o.w||1.5}" stroke-linejoin="round"/>`;
 const text=(p,t,o={})=>`<text x="${p[0]}" y="${p[1]}" font-size="${o.s||11}" fill="${o.c||"#16233A"}" text-anchor="${o.a||"middle"}" font-family="Noto Sans TC,sans-serif"${o.i?' font-style="italic"':""}>${t}</text>`;
 const dot=(p,o={})=>`<circle cx="${p[0]}" cy="${p[1]}" r="${o.r||2.2}" fill="${o.c||"#16233A"}"/>`;
 const unitv=(p,q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]};
 // 頂點標籤：放在由形心往外的方向
 const vlabel=(p,center,t,d=11)=>{const u=unitv(center,p);return text([f(p[0]+u[0]*d),f(p[1]+u[1]*d+4)],t,{i:true})};
 // 角弧與角的標示（螢幕坐標）：頂點 v、兩臂方向點 p、q
 const arc=(v,p,q,label,o={})=>{const r=o.r||16,u=unitv(v,p),w=unitv(v,q),a1=[f(v[0]+u[0]*r),f(v[1]+u[1]*r)],a2=[f(v[0]+w[0]*r),f(v[1]+w[1]*r)],cross=u[0]*w[1]-u[1]*w[0],big=0,sweep=cross>0?1:0;
  const mid=unitv([0,0],[u[0]+w[0],u[1]+w[1]]),lr=r+(o.lr||11),lp=[f(v[0]+mid[0]*lr),f(v[1]+mid[1]*lr+4)];
  return `<path d="M${a1[0]} ${a1[1]} A${r} ${r} 0 ${big} ${sweep} ${a2[0]} ${a2[1]}" fill="none" stroke="${o.c||"#16233A"}" stroke-width="1"/>`+(label?text(lp,label,{s:o.s||10,c:o.c||"#16233A"}):"")};
 const right=(v,p,q,s=8)=>{const u=unitv(v,p),w=unitv(v,q),a=[f(v[0]+u[0]*s),f(v[1]+u[1]*s)],b=[f(v[0]+(u[0]+w[0])*s),f(v[1]+(u[1]+w[1])*s)],c=[f(v[0]+w[0]*s),f(v[1]+w[1]*s)];return `<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]} L${c[0]} ${c[1]}" fill="none" stroke="#16233A" stroke-width="1"/>`};
 // 等長記號：在線段中點畫 n 條短線
 const tick=(p,q,n=1)=>{const m=[(p[0]+q[0])/2,(p[1]+q[1])/2],u=unitv(p,q),nrm=[-u[1],u[0]];let s="";for(let i=0;i<n;i++){const o=(i-(n-1)/2)*4,c=[m[0]+u[0]*o,m[1]+u[1]*o];s+=line([f(c[0]-nrm[0]*5),f(c[1]-nrm[1]*5)],[f(c[0]+nrm[0]*5),f(c[1]+nrm[1]*5)],{w:1.2})}return s};
 // 平行記號：線段中點畫 n 個箭頭
 const arrow=(p,q,n=1)=>{const m=[(p[0]+q[0])/2,(p[1]+q[1])/2],u=unitv(p,q),nrm=[-u[1],u[0]];let s="";for(let i=0;i<n;i++){const c=[m[0]+u[0]*(i*5),m[1]+u[1]*(i*5)];s+=`<path d="M${f(c[0]-u[0]*5+nrm[0]*4)} ${f(c[1]-u[1]*5+nrm[1]*4)} L${f(c[0])} ${f(c[1])} L${f(c[0]-u[0]*5-nrm[0]*4)} ${f(c[1]-u[1]*5-nrm[1]*4)}" fill="none" stroke="#16233A" stroke-width="1.2"/>`}return s};
 const ext=(p,q,len=40)=>{const u=unitv(p,q);return[f(q[0]+u[0]*len),f(q[1]+u[1]*len)]};
 const centroid=ps=>[ps.reduce((s,p)=>s+p[0],0)/ps.length,ps.reduce((s,p)=>s+p[1],0)/ps.length];
 return{triByAngles,polyByAngles,quadByAngles,regular,fit,svg,line,poly,text,dot,vlabel,arc,right,tick,arrow,ext,centroid,unitv,f};
})();

function ratio3Config(){
 /* 國三上 1-1 連比（2026-09-26，Claude）。題型取自百宏國三上一段講義 1-1：連比例式求比值、連比求值、比例分配、求連比（含分數小數、等式型）、連比的應用、倒數比。
    整數模式：連比的項與答案都是整數；分數模式：連比的項可為分數或小數（求連比、連比例式），答案仍化為最簡整數比。
    verify 一律換路徑：設 x＝ar、y＝br、z＝cr 代回原條件；比例分配用「各份相加等於總量」與「各份比等於連比」；求連比用代回兩條原比例式。 */
 const unit=(id,name,tip,modes,gen)=>({id,name,tip,modes,gen});
 const lv=ctx=>ctx.level==="challenge"?2:ctx.level==="advanced"?1:0;
 const S=(v,mode="fraction")=>numHTML(v,v.d===1?"integer":mode,{mixed:false}),pl=v=>v.n+"/"+v.d;
 const g3=(a,b,c)=>gcd(gcd(a,b),c);
 const simp=arr=>{const L=arr.reduce((l,v)=>l*v.d/gcd(l,v.d),1),ints=arr.map(v=>v.n*L/v.d),g=ints.reduce((x,y)=>gcd(x,y));return ints.map(v=>v/g)}; // 有理數連比→最簡整數比
 const ratioStr=arr=>arr.map(v=>typeof v==="number"?String(v):S(v)).join("：");
 const triple=(max=9)=>{let a,b,c;do{a=rand(1,max);b=rand(1,max);c=rand(1,max)}while(g3(a,b,c)!==1||(a===b&&b===c));return[a,b,c]};
 const cf=n=>n===1?"":String(n);
 const lin=(cs,ns)=>{let s="";cs.forEach((c,i)=>{if(!c)return;const m=Math.abs(c),t=(m===1?"":m)+ns[i];s+=c<0?"−"+t:(s?"＋":"")+t});return s||"0"};
 const dotp=(cs,vs)=>cs.reduce((s,c,i)=>s+c*vs[i],0);
 const fracV=(mode,lvl)=>mode==="fraction"?(Math.random()<.5?R(rand(1,9),pick([2,3,4,5])):R(rand(1,9),pick([2,4,5,10]))):R(rand(1,9));

 // ① 連比例式求比值
 const value=unit("value","連比例式求比值","設 x＝ar、y＝br、z＝cr，代入後 r 會約掉。",["integer","fraction"],ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),kind=pick(L===0?["ratio","sumdiv"]:L===1?["ratio","coef","sumdiv"]:["coef","product","equal"]);
  if(kind==="ratio"){const[a,b,c]=triple(),p=[rand(1,3),rand(1,3),rand(1,3)],q=[rand(1,3),rand(1,3),rand(1,3)],num=dotp(p,[a,b,c]),den=dotp(q,[a,b,c]),v=R(num,den);if(num===den)return null;
   return{expr:`設 x：y：z＝${a}：${b}：${c}，求（${lin(p,["x","y","z"])}）：（${lin(q,["x","y","z"])}）的比值。`,answer:S(v),sig:`v:${a}${b}${c}:${p}:${q}`,verify:()=>{const r=rand(2,7),x=a*r,y=b*r,z=c*r;return eq(R(dotp(p,[x,y,z]),dotp(q,[x,y,z])),v)}}}

  if(kind==="coef"){const k=[rand(2,4),rand(2,4),rand(2,4)],[a,b,c]=mode==="fraction"?[R(1),R(1,rand(2,3)),R(1,rand(2,4))]:triple().map(v=>R(v)),xyz=simp([div(a,R(k[0])),div(b,R(k[1])),div(c,R(k[2]))]),v=R(xyz[0]+xyz[1],xyz[2]);
   if(k[0]===k[1]&&k[1]===k[2])return null;return{expr:`設 ${k[0]}x：${k[1]}y：${k[2]}z＝${ratioStr([a,b,c])}，求 x：y：z 與（x＋y）／z 的值。`,answer:`x：y：z＝${ratioStr(xyz)}，（x＋y）／z＝${S(v)}`,sig:`co:${k}:${[a,b,c].map(pl)}`,verify:()=>{const[x,y,z]=xyz;return eq(R(k[0]*x*a.d,a.n),R(k[1]*y*b.d,b.n))&&eq(R(k[1]*y*b.d,b.n),R(k[2]*z*c.d,c.n))&&eq(R(x+y,z),v)}}}
  if(kind==="product"){// pxy＝qyz＝rzx ⇒ x：y：z＝q：r：p 的倒數關係：xy：yz：zx＝1/p：1/q：1/r ⇒ x：y：z＝(zx·xy)…用倒數
   const[p,q,r]=triple(7),xyz=simp([R(q),R(r),R(p)]);// pxy=qyz ⇒ px=qz ⇒ x:z=q:p；qyz=rzx ⇒ qy=rx ⇒ x:y=q:r ⇒ x:y:z=q:r:p
   const w1=[rand(1,3),rand(1,3),rand(1,3)],w2=[rand(1,3),rand(1,3),rand(1,3)],num=dotp(w1,xyz),den=dotp(w2,xyz),v=R(num,den);
   return{expr:`設 xyz≠0，且 ${cf(p)}xy＝${cf(q)}yz＝${cf(r)}zx，求 x：y：z，並求（${lin(w1,["x","y","z"])}）：（${lin(w2,["x","y","z"])}）的比值。`,answer:`x：y：z＝${ratioStr(xyz)}；比值 ${S(v)}`,sig:`pr:${p}${q}${r}:${w1}:${w2}`,verify:()=>{const[x,y,z]=xyz;return p*x*y===q*y*z&&q*y*z===r*z*x&&eq(R(dotp(w1,[x,y,z]),dotp(w2,[x,y,z])),v)}}}
  const[p,q,r]=triple(6),L2=p*q*r/g3(p*q,q*r,r*p),xyz=simp([R(1,p),R(1,q),R(1,r)]),w=[[1,1,0],[0,1,1],[1,0,2]],parts=w.map(c=>dotp(c,xyz)),g=parts.reduce((x,y)=>gcd(x,y)),ans=parts.map(v=>v/g);
  return{expr:`若 ${cf(p)}x＝${cf(q)}y＝${cf(r)}z 且 xyz≠0，求（x＋y）：（y＋z）：（z＋2x）。`,answer:ratioStr(ans),sig:`eq:${p}${q}${r}`,verify:()=>{const[x,y,z]=xyz;return p*x===q*y&&q*y===r*z&&ans.every((v,i)=>v*parts[0]===ans[0]*parts[i])}};
 });

 // ② 連比求值

   return{expr:`已知 a：b：c＝${a}：${b}：${c}，若 a、b、c 的最大公因數與最小公倍數的和是 ${r+l*r}，求 ${"abc"[i]}。`,answer:`${"abc"[i]}＝${[a,b,c][i]*r}`,sig:`gl:${a}${b}${c}:${r}:${i}`,verify:()=>{const x=a*r,y=b*r,z=c*r,g=gcd(gcd(x,y),z),L2=x*y/gcd(x,y),L3=L2*z/gcd(L2,z);return g+L3===r+l*r}}}

 });

 // ③ 比例分配
