  <section class="control-area"><div class="controls">

      <section class="panel"><h2>版面設定</h2><div class="fields"><div class="field" style="flex:1 1 250px"><label for="title">考卷標題</label><input class="title-input" id="title" value="平方根 計算力練習" maxlength="30"></div><div class="field"><label for="version">版本</label><select id="version"><option value="student">學用版</option><option value="teacher">教用版（含解答）</option></select></div><div class="field"><label for="columns">每列</label><select id="columns"><option value="2">2 題</option><option value="3" selected>3 題</option><option value="4">4 題</option></select></div><div class="field"><label for="space">作答空間</label><select id="space"><option value="compact">精簡</option><option value="standard" selected>標準</option><option value="wide">寬裕</option></select></div></div></section>

  <script>
  (()=>{"use strict";
    const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{for(let i=a.length-1;i;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
