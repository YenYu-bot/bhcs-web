<script>
(()=>{"use strict";

const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}

function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}

function numberlineConfig(){
 /* M9 數線與絕對值（2026-09-24，Claude）。數型：整數／分數／小數。

 const lv=ctx=>ctx.level==="challenge"?2:ctx.level==="advanced"?1:0;
 const neg=v=>mul(v,R(-1)),abs=v=>v.n<0?neg(v):v,cmp=(a,b)=>sub(a,b).n;

 const P=(v,mode,ctx)=>{const t=S(v,mode,ctx);return v.n<0?`（${t}）`:t}; // 負數放進算式時加括號
 // 取一個數：整數／分母 2–6 的分數／一位或兩位（.25 .75）小數
 const val=(mode,L,max=8,allowZero=false)=>{let v;if(mode==="integer")v=R(rand(-max,max));else if(mode==="fraction"){const d=pick(L===0?[2,3,4]:[2,3,4,5,6]);let n=rand(-max*d,max*d);while(n%d===0)n=rand(-max*d,max*d);v=R(n,d)}else{const q=pick([10,10,4,2]);let n=rand(-max*q,max*q);while(n%q===0)n=rand(-max*q,max*q);v=R(n,q)}return(!allowZero&&v.n===0)?R(pick([-1,1])):v};
 // ---- 數線 SVG ----
 const svg=(w,h,body)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="數線">${body}</svg>`;
 const tx=(x,y,t,c="#16233A",s=11,a="middle")=>`<text x="${x}" y="${y}" font-size="${s}" fill="${c}" text-anchor="${a}" font-family="Noto Sans TC,sans-serif">${t}</text>`;
 const lineFig=(lo,hi,step,pts,red=false)=>{ // lo、hi 為整數；step 為 R；pts:[{v,label}]
  const W=280,x0=16,x1=W-16,Y=34,span=hi-lo,X=v=>x0+(x1-x0)*((v.n/v.d)-lo)/span;

  const n=Math.round(span/(step.n/step.d));for(let i=0;i<=n;i++){const v=add(R(lo),mul(step,R(i))),x=X(v),major=v.d===1;b+=`<line x1="${x}" y1="${Y-(major?6:3)}" x2="${x}" y2="${Y+(major?6:3)}" stroke="#16233A" stroke-width="${major?1.2:.8}"/>`;if(major)b+=tx(x,Y+19,String(v.n).replace("-","−"))}
  for(const p of pts){const x=X(p.v);b+=`<circle cx="${x}" cy="${Y}" r="3.2" fill="${red?"#C8352B":"#16233A"}"/>`+tx(x,Y-10,p.label,red?"#C8352B":"#16233A",12)}
  return svg(W,60,b)};
 const stepFor=(vals,mode)=>{if(mode==="integer")return R(1);const ds=vals.map(v=>v.d);if(ds.every(d=>d===1||d===2))return R(1,2);if(ds.every(d=>[1,2,4].includes(d)))return R(1,4);if(ds.every(d=>[1,5].includes(d)))return R(1,5);if(ds.every(d=>[1,2,5,10].includes(d)))return R(1,10);const d=ds.find(x=>x>1);return ds.every(x=>x===1||x===d)?R(1,d):null};
 const range=vals=>{const f=vals.map(v=>v.n/v.d);let lo=Math.floor(Math.min(...f))-1,hi=Math.ceil(Math.max(...f))+1;if(lo>0)lo=Math.min(lo,-1);if(hi<0)hi=Math.max(hi,1);return[lo,hi]};
 const unit=(id,name,tip,gen)=>({id,name,tip,modes:["integer","fraction","decimal"],gen});
 const LET=["A","B","C","D"];
 // ① 數線上的點

  const L=lv(ctx),mode=pick(ctx.modes),kind=L===0?pick(["read","plot","between"]):L===1?pick(["read","plot","between"]):pick(["read","plot","shift"]);
  const k=kind==="read"?(L===0?2:3):2,max=L===0?5:L===1?4:3;let vals=[];for(let i=0;i<k;i++){let v;do v=val(mode,L,max);while(vals.some(w=>eq(w,v)));vals.push(v)}
  const step=stepFor(vals,mode);if(!step)return null;const [lo,hi]=range(vals);if((hi-lo)/(step.n/step.d)>28||hi-lo>12)return null;
  if(kind==="read"){const pts=vals.map((v,i)=>({v,label:LET[i]}));return{expr:`${lineFig(lo,hi,step,pts)}寫出數線上各點所表示的數。`,answer:pts.map(p=>`${p.label}＝${S(p.v,mode,ctx)}`).join("；"),sig:`mr:${vals.map(plain).join(",")}`,verify:()=>pts.every(p=>eq(p.v,add(R(lo),mul(step,R(Math.round(((p.v.n/p.v.d)-lo)/(step.n/step.d))))))) }}
  if(kind==="plot"){const pts=vals.map((v,i)=>({v,label:LET[i]}));return{expr:`${lineFig(lo,hi,step,[])}在數線上標出 ${pts.map(p=>`${p.label}（${S(p.v,mode,ctx)}）`).join("、")}。`,answer:lineFig(lo,hi,step,pts,true),sig:`mp:${vals.map(plain).join(",")}`,verify:()=>vals.every(v=>(v.n/v.d)>lo&&(v.n/v.d)<hi)}}
  if(kind==="between"){const a=vals[0],b=vals[1],x=Math.min(a.n/a.d,b.n/b.d),y=Math.max(a.n/a.d,b.n/b.d),ints=[];for(let i=Math.ceil(x);i<=Math.floor(y);i++)if(i>x&&i<y)ints.push(i);let c=0;for(let i=-100;i<=100;i++)if(i>x&&i<y)c++;return{expr:`數線上 ${S(a,mode,ctx)} 與 ${S(b,mode,ctx)} 之間（不含這兩點）有幾個整數？`,answer:`${ints.length} 個${ints.length?`（${ints.join("、").replace(/-/g,"−")}）`:""}`,sig:`mb:${plain(a)}:${plain(b)}`,verify:()=>c===ints.length}}
  // shift：A 點向右／左移動 d 單位後的位置
  const a=vals[0],d=abs(vals[1]),dir=pick(["右","左"]),b=dir==="右"?add(a,d):sub(a,d);return{expr:`數線上 A 點表示 ${S(a,mode,ctx)}，把 A 點向${dir}移動 ${S(d,mode,ctx)} 個單位到 B 點，B 點表示的數是多少？`,answer:S(b,mode,ctx),sig:`ms:${plain(a)}:${plain(d)}:${dir}`,verify:()=>eq(abs(sub(b,a)),d)&&(dir==="右"?cmp(b,a)>0:cmp(b,a)<0)}});
 // ② 比較大小
 const compare=unit("compare","正負數的大小比較","數線上愈右邊的數愈大；兩個負數比較時，絕對值大的反而小。",ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),kind=L===0?pick(["two","negs","zero"]):L===1?pick(["two","negs","mixed"]):pick(["order","negs","between"]);
  const sym=(a,b)=>cmp(a,b)>0?"＞":cmp(a,b)<0?"＜":"＝";
  if(kind==="two"||kind==="negs"||kind==="zero"){let a=val(mode,L,L===0?12:9),b=val(mode,L,L===0?12:9);if(kind==="negs"){a=neg(abs(a));b=neg(abs(b))}if(kind==="zero")b=R(0);if(eq(a,b))return null;return{expr:`在 □ 中填入＞、＜或＝：${S(a,mode,ctx)} □ ${S(b,mode,ctx)}`,answer:`${S(a,mode,ctx)} ${sym(a,b)} ${S(b,mode,ctx)}`,sig:`c:${kind}:${plain(a)}:${plain(b)}`,verify:()=>(sym(a,b)==="＞")===((a.n*b.d)>(b.n*a.d))}}

  return{expr:`將 ${vs.map(v=>S(v,mode,ctx)).join("、")} ${big?"由大到小":"由小到大"}排列。`,answer:(big?[...sorted].reverse():sorted).map(v=>S(v,mode,ctx)).join(big?"＞":"＜"),sig:`co:${vs.map(plain).join(",")}:${big}`,verify:()=>sorted.every((v,i)=>i===0||cmp(v,sorted[i-1])>0)}});
 // ③ 絕對值
 const absval=unit("absval","絕對值","一個數的絕對值就是它在數線上和原點的距離，一定不是負數；−|a| 是先取絕對值再加負號。",ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),kind=L===0?pick(["abs","negabs","opp"]):L===1?pick(["abs","negabs","inner"]):pick(["inner","nested","same"]);

  if(kind==="negabs")return{expr:`−｜${S(a,mode,ctx)}｜＝？`,answer:S(neg(abs(a)),mode,ctx),sig:`na:${plain(a)}`,verify:()=>cmp(neg(abs(a)),R(0))<0};

  if(kind==="nested"){const b=val(mode,L,9),c=val(mode,L,9),inner=sub(b,abs(c)),v=abs(inner);return{expr:`｜${S(b,mode,ctx)}−｜${S(c,mode,ctx)}｜｜＝？`,answer:S(v,mode,ctx),sig:`n:${plain(b)}:${plain(c)}`,verify:()=>eq(v,abs(sub(abs(c),b)))}}

 // ④ 兩點距離

  const a=val(mode,L,L===0?15:10),b=val(mode,L,L===0?15:10);if(eq(a,b))return null;const d=abs(sub(a,b));
  if(kind==="two")return{expr:`數線上 A（${S(a,mode,ctx)}）、B（${S(b,mode,ctx)}）兩點的距離是多少？`,answer:S(d,mode,ctx),sig:`d:${plain(a)}:${plain(b)}`,verify:()=>eq(d,abs(sub(b,a)))};
  if(kind==="origin")return{expr:`數線上 A 點表示 ${S(a,mode,ctx)}，A 點和原點的距離是多少？`,answer:S(abs(a),mode,ctx),sig:`do:${plain(a)}`,verify:()=>eq(abs(a),abs(sub(R(0),a)))};
  if(kind==="fig"){const step=stepFor([a,b],mode);if(!step)return null;const [lo,hi]=range([a,b]);if(hi-lo>12||(hi-lo)/(step.n/step.d)>28)return null;return{expr:`${lineFig(lo,hi,step,[{v:a,label:"A"},{v:b,label:"B"}])}求數線上 A、B 兩點的距離。`,answer:`${S(d,mode,ctx)}（A＝${S(a,mode,ctx)}，B＝${S(b,mode,ctx)}）`,sig:`df:${plain(a)}:${plain(b)}`,verify:()=>eq(d,abs(sub(b,a)))}}
  if(kind==="mid"){const m=div(add(a,b),R(2));return{expr:`數線上 A（${S(a,mode,ctx)}）、B（${S(b,mode,ctx)}），AB 的中點 M 表示什麼數？`,answer:S(m,mode==="integer"&&m.d!==1?"fraction":mode,ctx),sig:`dm:${plain(a)}:${plain(b)}`,verify:()=>eq(abs(sub(m,a)),abs(sub(b,m)))}}

 // ⑤ 已知絕對值求原數
 const absinv=unit("absinv","已知絕對值求原數","｜x｜＝k（k＞0）時 x 有兩個答案：k 與 −k；｜x｜＝0 只有 x＝0；絕對值不可能是負數。",ctx=>{

  if(kind==="plus"){const c=abs(val("integer",0,9)),t=add(k,c);return{expr:`｜x｜＋${S(c,"integer",ctx)}＝${S(t,mode,ctx)}，求 x。`,answer:`x＝${S(k,mode,ctx)} 或 ${S(neg(k),mode,ctx)}`,sig:`p:${plain(c)}:${plain(k)}`,verify:()=>eq(add(abs(neg(k)),c),t)}}

  return{expr:`｜a｜＝${p.n}、｜b｜＝${q.n}，且 a＞b，求 a＋b 所有可能的值。`,answer:uniq.map(s=>{const [n,d]=s.split("/").map(Number);return S(R(n,d),"integer",ctx)}).join("、"),sig:`bo:${p.n}:${q.n}`,verify:()=>{let c=0;for(let a=-20;a<=20;a++)for(let b=-20;b<=20;b++)if(Math.abs(a)===p.n&&Math.abs(b)===q.n&&a>b)c++;return c===res.length}}});
 // ⑥ 滿足絕對值不等式的整數

function updateTotal(){$("total").textContent=`共 ${selectedUnits().reduce((s,u)=>s+u.count,0)} 題`}function markChanged(){$("status").textContent="設定已變更，按「重新出題」套用。"}
function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Set,skipped=[];state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}。`}
function render(){const out=$("output");out.innerHTML="";if(!state.paper||!state.groups.length){out.innerHTML='<div class="empty"><b>尚未產生練習卷</b>請選擇數型與單元後按「重新出題」。</div>';return}const teacher=$("version").value==="teacher",cols=$("columns").value,work={small:"10mm",medium:"16mm",large:"26mm"}[$("space").value],sheet=document.createElement("div");sheet.className=`sheet ${teacher?"teacher":"student"}`;sheet.style.setProperty("--work",work);sheet.innerHTML=`<div class="head"><div class="bhcs-brand"><b>百宏文教機構</b><span>數學計算力練習 · 徹底反覆計算系列</span><i>www.bhcs.com.tw</i></div><h2>${CFG.title} 計算力練習（${{basic:"基礎",advanced:"進階",challenge:"挑戰"}[state.paper.level]}）</h2><span>班級：______　姓名：__________　日期：___／___　作答時間：___分___秒</span></div><p class="tip">${CFG.instruction}</p>`;let no=1;state.groups.forEach(g=>{const sec=document.createElement("section");sec.innerHTML=`<div class="sec">${g.unit.name}</div><p class="tip">${g.unit.tip}</p><div class="grid c${cols}"></div>`;const grid=sec.querySelector(".grid");g.questions.forEach(q=>{const item=document.createElement("div");item.className="prob";item.innerHTML=`<div class="q"><span class="no">(${no++})</span><span class="expr">${q.expr}</span></div><div class="work">原式＝<span class="ans">${q.answer}</span></div>`;grid.appendChild(item)});sheet.appendChild(sec)});out.appendChild(sheet);fit()}
function fit(){if(matchMedia("print").matches)return;const sheet=document.querySelector(".sheet");if(sheet)sheet.style.zoom=Math.min(1,Math.max(.42,(innerWidth-16)/794))}
build();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>applyPreset(b.dataset.level)));document.querySelectorAll("[data-mode],#mixedNumber").forEach(c=>c.addEventListener("change",markChanged));document.querySelectorAll("[data-each]").forEach(b=>b.addEventListener("click",()=>setEach(Number(b.dataset.each))));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.paper&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",render));addEventListener("resize",fit);addEventListener("beforeprint",()=>{const s=document.querySelector(".sheet");if(s)s.style.zoom=1});addEventListener("afterprint",fit);generate();
})();
</script>
</body>
</html>
