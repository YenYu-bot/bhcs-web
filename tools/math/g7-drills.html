<script>
(()=>{"use strict";
const TOPICS=[["signed","正負數四則運算"],["exponent","指數律"],["scinot","科學記號"],["factors","因數與倍數"],["linear","一元一次式與方程式"],["simultaneous","二元一次聯立方程式"],["inequality","一元一次不等式"],["ratio","比例"],["function","函數"],["numberline","數線與絕對值"],["coordinate","直角坐標"],["lineeq","二元一次方程式的圖形"],["statistics","統計圖表與資料分析"]],_tp=new URLSearchParams(location.search).get("topic"),TOPIC_KEY=TOPICS.some(t=>t[0]===_tp)?_tp:"numberline",$=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
const R=(n,d=1)=>{if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||!d)throw Error("無效分數");if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}},add=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>R(a.n*b.n,a.d*b.d),div=(a,b)=>{if(!b.n)throw Error("除數不可為 0");return R(a.n*b.d,a.d*b.n)},eq=(a,b)=>a.n===b.n&&a.d===b.d,cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`,plain=a=>`${a.n}/${a.d}`;
function places(a){let d=a.d,p2=0,p5=0;while(d%2===0){d/=2;p2++}while(d%5===0){d/=5;p5++}return d===1?Math.max(p2,p5):-1}
function decHTML(a,fixed=null){const p=places(a);if(p<0)throw Error("非有限小數");const use=fixed===null?p:Math.max(fixed,p),scale=10**use,n=a.n*(scale/a.d),sign=n<0?"−":"",digits=String(Math.abs(n)).padStart(use+1,"0");if(!use)return sign+digits;let out=`${digits.slice(0,-use)}.${digits.slice(-use)}`;if(fixed===null)out=out.replace(/0+$/,"").replace(/\.$/,"");return sign+out}
function fracHTML(a,{mixed=false,answer=false}={}){const sign=a.n<0?"−":"",n=Math.abs(a.n),w=Math.floor(n/a.d),rem=n%a.d;if(!rem)return sign+w;if(w&&mixed){const m=`<span class="mixed">${sign}${w}${fr(rem,a.d)}</span>`;return answer?`${m}<span class="note-answer">（即 ${sign}${fr(n,a.d)}）</span>`:m}return`${sign}${fr(n,a.d)}`}
const numHTML=(a,mode,opt={})=>mode==="decimal"?decHTML(a):mode==="fraction"?fracHTML(a,opt):String(a.n).replace("-","−");
function numberFor(mode,level,max=30){if(mode==="integer"){const k=level==="basic"?2:level==="advanced"?10:25;return R(rand(level==="basic"?2:Math.max(2,Math.floor(max*k/5)),max*k))}if(mode==="fraction"){const ds=level==="basic"?[2,3,4,5,6]:[2,3,4,5,6,8,9,10,12,15,20],d=pick(ds);let n=rand(1,(level==="challenge"?3:2)*d-1);while(n%d===0)n=rand(1,3*d-1);return R(n,d)}const p=level==="basic"?1:pick(level==="advanced"?[1,2]:[1,2,3]),s=10**p;let n=rand(1,max*s);while(n%10===0)n=rand(1,max*s);return R(n,s)}

const okResult=q=>q&&typeof q.expr==="string"&&typeof q.answer==="string"&&q.expr&&!/\b(?:NaN|undefined|Infinity)\b/.test(q.expr+q.answer)&&typeof q.verify==="function"&&q.verify()===true;

 const val=(mode,L,max=8,allowZero=false)=>{let v;if(mode==="integer")v=R(rand(-max,max));else if(mode==="fraction"){const d=pick(L===0?[2,3,4]:[2,3,4,5,6]);let n=rand(-max*d,max*d);while(n%d===0)n=rand(-max*d,max*d);v=R(n,d)}else{const q=pick([10,10,4,2]);let n=rand(-max*q,max*q);while(n%q===0)n=rand(-max*q,max*q);v=R(n,q)}return(!allowZero&&v.n===0)?R(pick([-1,1])):v};

 const lineFig=(lo,hi,step,pts,red=false)=>{ // lo、hi 為整數；step 為 R；pts:[{v,label}]
  const W=280,x0=16,x1=W-16,Y=34,span=hi-lo,X=v=>x0+(x1-x0)*((v.n/v.d)-lo)/span;

 const range=vals=>{const f=vals.map(v=>v.n/v.d);let lo=Math.floor(Math.min(...f))-1,hi=Math.ceil(Math.max(...f))+1;if(lo>0)lo=Math.min(lo,-1);if(hi<0)hi=Math.max(hi,1);return[lo,hi]};

 // ② 比較大小
 const compare=unit("compare","正負數的大小比較","數線上愈右邊的數愈大；兩個負數比較時，絕對值大的反而小。",ctx=>{
  const L=lv(ctx),mode=pick(ctx.modes),kind=L===0?pick(["two","negs","zero"]):L===1?pick(["two","negs","mixed"]):pick(["order","negs","between"]);

 const absval=unit("absval","絕對值","一個數的絕對值就是它在數線上和原點的距離，一定不是負數；−|a| 是先取絕對值再加負號。",ctx=>{

function rInt(mag){ let v=rnd(1,mag); return v; }

/* 取一個非零數；type: int|frac|dec */
function num(type,kind='add',allowMixed=CTX.mixed){
  const m=MAG[CTX.diff];
  if(type==='int'){ const mag=kind==='mul'?m.mul:kind==='big'?m.big:m.add; return new F(sgn()*rInt(mag)); }
  if(type==='dec'){ const places=kind==='mul'?(CTX.diff===3&&coin(.3)?2:1):(CTX.diff===1?1:rnd(1,2)); const scale=Math.pow(10,places); const mag=kind==='mul'?(CTX.diff===1?5:9):(CTX.diff===1?20:200); let v=rnd(1,mag*scale); if(v%10===0) v+=1; const f=new F(sgn()*v,scale); f.dec=true; return f; }

  const d=pick(dens); let n=rnd(1,d-1); if(gcd(n,d)!==1){ n=1; }
  const ip=allowMixed&&coin(CTX.diff===1?.25:.45)?rnd(1,CTX.diff===3?9:5):0;

}
const T=()=>pick(CTX.types);
/* 一題內的數字類型：整數題全整數；分數題可混一兩個整數；小數題可混整數 */
function typeSet(k,t=T()){ if(t==='int') return Array(k).fill('int'); const arr=Array(k).fill(t); if(k>=3&&coin(.5)) arr[rnd(0,k-1)]='int'; return arr; }

/* ================= 各單元出題 ================= */
const posOf=n=>n; // 佔位
function makeChain(ops,k){ const ts=typeSet(k); const nums=ts.map(t=>N(num(t,ops.includes('*')||ops.includes('/')?'mul':'add'))); let e=nums[0]; for(let i=1;i<k;i++) e=O(ops[(i-1)%ops.length],e,nums[i]); return e; }
/* 整數除法要整除：用「商×除數」反推被除數 */
function intDivChain(k,mixOps){ // k 個數
  const m=MAG[CTX.diff]; let ops=[]; for(let i=1;i<k;i++) ops.push(mixOps?pick(['*','/','/']):'/');
  // 由右往左：先決定每個除數，最後被除數 = 商 × 全部除數 / 乘數…直接用模擬：從一個商開始逆推
  let q=new F(sgn()*rnd(1,m.mul)); const parts=[]; // 逐步：value_i = value_{i-1} op x_i；反推 value_0
  const xs=ops.map(op=>new F(sgn()*rnd(2,m.mul)));
  let v=q; for(let i=ops.length-1;i>=0;i--){ v=ops[i]==='/'?v.mul(xs[i]):v.div(xs[i]); }
  // v 可能非整數（若中間有乘），則重抽
  if(!v.isInt()||Math.abs(v.n)>m.big*4||v.isZero()) return null;
  let e=N(v); ops.forEach((op,i)=>e=O(op,e,N(xs[i]))); return e;
}

function injectPow(e){ // 把某個乘法因數換成 (−k)^2 或 (−k)^3
  const cands=[]; (function walk(n,par,key){ if(n.t==='o'){ walk(n.a,n,'a'); walk(n.b,n,'b'); } else if(n.t==='n'&&par&&par.op!=='/'&&n.v.isInt()&&Math.abs(n.v.n)<=5&&n.v.n!==0) cands.push({par,key}); })(e,null,null);
  if(!cands.length) return e; const c=pick(cands); const base=new F(sgn()*rnd(2,4)); c.par[c.key]=P(N(base),coin()?2:3); return e;
}
function okValue(e,v,t){ if(v.isZero()&&coin(.8)) return false;
  // 檢查每個除法都「乾淨」：整數題要整除；小數題結果要是有限小數
  let ok=true; (function walk(n){ if(!ok||n.t==='n') return; if(n.t==='p'){ walk(n.a); return; } if(n.op==='/'){ const d=ev(n.b); if(d.isZero()) { ok=false; return; } const q=ev(n.a).div(d); if(t==='int'&&!q.isInt()) ok=false; if(t==='dec'&&!q.isDec()) ok=false; } walk(n.a); walk(n.b); })(e);
  if(!ok) return false; if(t==='int'&&Math.abs(v.n)>5000) return false; return true;
}

function ensureNeg(e){ const leaves=[]; (function w(n){ if(n.t==='n') leaves.push(n); else if(n.t==='p') w(n.a); else { w(n.a); w(n.b); } })(e);
  if(leaves.some(l=>l.v.n<0)) return; const cands=leaves.filter(l=>!l.v.isZero()); if(!cands.length) return; const l=pick(cands); const nv=l.v.neg(); nv.dec=l.v.dec; l.v=nv; }
function hasDecType(e){ // 題目裡若出現小數，答案就用小數呈現
  let has=false; (function w(n){ if(n.t==='n'){ if(n.v.dec) has=true; } else if(n.t==='p') w(n.a); else { w(n.a); w(n.b); } })(e); return has;
}

 const sameBase=unit("sameBase","同底數的乘除","aᵐ × aⁿ＝aᵐ⁺ⁿ；aᵐ ÷ aⁿ＝aᵐ⁻ⁿ（m＞n）。",["integer"],ctx=>{

  if(kind==="mixed"){const m=rand(3,9),n=rand(2,6),k=rand(1,m+n-1);return{expr:`${pw(b,m)} × ${pw(b,n)} ÷ ${pw(b,k)}＝`,answer:withVal(b,m+n-k),sig:`x:${b}:${m}:${n}:${k}`,verify:()=>bp(b,m)*bp(b,n)/bp(b,k)===bp(b,m+n-k)}}
  if(kind==="negBase"){const m=rand(2,6),n=rand(2,5),e=m+n,v=(e%2?-1n:1n)*bp(b,e);return{expr:`${pn(negS(b),m)} × ${pn(negS(b),n)}＝`,answer:`${pn(negS(b),e)}＝${v}`,sig:`nb:${b}:${m}:${n}`,verify:()=>Number(v)===Math.pow(-b,m)*Math.pow(-b,n)}}

  if(kind==="fracPow"){const[a,b]=pick([[2,3],[3,4],[3,5],[2,5],[5,6],[4,7]]),n=rand(2,4),v=R(a**n*b**n,a**n*b**n);return{expr:`${pn(fr(a,b),n)} × ${pn(fr(b,a),n)}＝`,answer:"1",sig:`f1:${a}:${b}:${n}`,verify:()=>Math.abs(Math.pow(a/b,n)*Math.pow(b/a,n)-1)<1e-9}}
  if(kind==="mul"){const[a,b]=pick([[2,5],[4,25],[8,125],[2,3],[3,4],[4,5],[5,6],[2,50],[4,2.5]]);if(!Number.isInteger(b))return null;return{expr:`${pw(a,e)} × ${pw(b,e)}＝`,answer:withVal(a*b,e),sig:`m:${a}:${b}:${e}`,verify:()=>bp(a,e)*bp(b,e)===bp(a*b,e)}}

  if(kind==="decimal"){const d=pick([[25,4,100],[125,8,1000],[5,2,10],[2,5,10],[4,25,100],[8,125,1000]]),[a,b]=d,n=rand(2,6);return{expr:`${pw(a,n)} × ${pw(b,n)}＝`,answer:withVal(d[2],n),sig:`dc:${a}:${b}:${n}`,verify:()=>bp(a,n)*bp(b,n)===bp(d[2],n)}}
  if(kind==="frac"){const[a,b]=pick([[2,3],[3,4],[3,5],[2,5],[4,3],[5,2]]),n=rand(2,4),v=R(a**n,b**n);return{expr:`${pw(a,n)} ÷ ${pw(b,n)}＝`,answer:`${pn(fr(a,b),n)}＝${S(v)}`,sig:`fr:${a}:${b}:${n}`,verify:()=>Math.abs(Math.pow(a/b,n)-v.n/v.d)<1e-9}}
  const n=rand(2,5),[a,b,c]=pick([[2,5,3],[4,25,2],[8,125,3],[2,5,7],[5,2,9]]);return{expr:`${pw(a,n)} × ${pw(b,n)} × ${pw(c,n)}＝`,answer:withVal(a*b*c,n),sig:`th:${a}:${b}:${c}:${n}`,verify:()=>bp(a,n)*bp(b,n)*bp(c,n)===bp(a*b*c,n)};

 const powerPower=unit("powerPower","乘方的乘方","(aᵐ)ⁿ＝aᵐⁿ；(ab)ⁿ＝aⁿbⁿ。",["integer"],ctx=>{
  const L=lv(ctx),kind=pick(L===0?["basic","product","withMul"]:L===1?["basic","nested","withMul"]:["nested","withMul","withDiv"]);

  if(kind==="nested"){const m=rand(2,3),n=rand(2,3),k=rand(2,3);return{expr:`〔(${pw(b,m)})${sup(n)}〕${sup(k)}＝`,answer:withVal(b,m*n*k),sig:`nn:${b}:${m}:${n}:${k}`,verify:()=>(bp(b,m)**BigInt(n))**BigInt(k)===bp(b,m*n*k)}}
  if(kind==="withMul"){const m=rand(2,4),n=rand(2,3),k=rand(1,5);return{expr:`(${pw(b,m)})${sup(n)} × ${pw(b,k)}＝`,answer:withVal(b,m*n+k),sig:`wm:${b}:${m}:${n}:${k}`,verify:()=>bp(b,m)**BigInt(n)*bp(b,k)===bp(b,m*n+k)}}
  const m=rand(2,4),n=rand(2,3),k=rand(1,m*n-1);return{expr:`(${pw(b,m)})${sup(n)} ÷ ${pw(b,k)}＝`,answer:withVal(b,m*n-k),sig:`wd:${b}:${m}:${n}:${k}`,verify:()=>bp(b,m)**BigInt(n)/bp(b,k)===bp(b,m*n-k)};
 });

 const mixedOps=unit("mixedOps","混合運算","先把不同的底數化成相同的底數，再用指數律合併。",["integer"],ctx=>{
  const L=lv(ctx),FAM=[[2,[[2,1],[4,2],[8,3]]],[3,[[3,1],[9,2],[27,3]]],[5,[[5,1],[25,2],[125,3]]]],[base,ps]=pick(FAM),P=()=>pick(ps);

  if(kind==="ten"){const n=rand(3,9);return{expr:`${pw(2,n)} × ${pw(5,n)}＝${pw(10,"□")}，求 □。`,answer:`□＝${n}`,sig:`t:${n}`,verify:()=>bp(2,n)*bp(5,n)===bp(10,n)}}

  if(kind==="dm"){const[a,pa]=P(),[b,pb]=P(),[c,pc]=P(),m=rand(3,5),k=rand(1,Math.floor((pa*m-1)/pb)),n=rand(1,3);if(k<1)return null;return{expr:`${pw(a,m)} ÷ ${pw(b,k)} × ${pw(c,n)}＝`,answer:withVal(base,pa*m-pb*k+pc*n),sig:`dm:${a}:${m}:${b}:${k}:${c}:${n}`,verify:()=>bp(a,m)/bp(b,k)*bp(c,n)===bp(base,pa*m-pb*k+pc*n)}}
  if(kind==="mdm"){const[a,pa]=P(),[b,pb]=P(),[c,pc]=P(),[d,pd]=P(),m=rand(2,3),n=rand(2,3),e=pa*m+pb*n,k=rand(1,Math.floor((e-1)/pc)),q=rand(1,2);if(k<1)return null;return{expr:`${pw(a,m)} × ${pw(b,n)} ÷ ${pw(c,k)} × ${pw(d,q)}＝`,answer:withVal(base,e-pc*k+pd*q),sig:`mdm:${a}:${m}:${b}:${n}:${c}:${k}:${d}:${q}`,verify:()=>bp(a,m)*bp(b,n)/bp(c,k)*bp(d,q)===bp(base,e-pc*k+pd*q)}}
  const[a,pa]=P(),[b,pb]=P(),[c,pc]=P(),m=rand(2,4),n=rand(2,3),e=pa*m+pb*n,k=rand(1,Math.floor((e-1)/pc));if(k<1)return null;return{expr:`${pw(a,m)} × ${pw(b,n)} ÷ ${pw(c,k)}＝${pw(base,"□")}，求 □。`,answer:`□＝${e-pc*k}`,sig:`box:${a}:${m}:${b}:${n}:${c}:${k}`,verify:()=>bp(a,m)*bp(b,n)/bp(c,k)===bp(base,e-pc*k)};
 });

 const convert=unit("convert","底數轉換","把 4、8、16 化成 2 的乘方，9、27 化成 3 的乘方，25、125 化成 5 的乘方，再比較指數。",["integer"],ctx=>{
  const L=lv(ctx),kind=pick(L===0?["one","two","div"]:L===1?["two","div","three"]:["three","div","reverse"]);

  if(kind==="one"){const[b,p]=pick(ps),m=rand(2,6);return{expr:`${pw(b,m)}＝${pw(base,"□")}，求 □。`,answer:`□＝${p*m}`,sig:`o:${b}:${m}`,verify:()=>bp(b,m)===bp(base,p*m)}}
  if(kind==="two"){const[b1,p1]=pick(ps),[b2,p2]=pick(ps),m=rand(2,5),n=rand(2,4);return{expr:`${pw(b1,m)} × ${pw(b2,n)}＝${pw(base,"□")}，求 □。`,answer:`□＝${p1*m+p2*n}`,sig:`t:${b1}:${m}:${b2}:${n}`,verify:()=>bp(b1,m)*bp(b2,n)===bp(base,p1*m+p2*n)}}
  if(kind==="div"){const[b1,p1]=pick(ps),m=rand(3,6),n=rand(1,p1*m-1);return{expr:`${pw(b1,m)} ÷ ${pw(base,n)}＝${pw(base,"□")}，求 □。`,answer:`□＝${p1*m-n}`,sig:`d:${b1}:${m}:${n}`,verify:()=>bp(b1,m)/bp(base,n)===bp(base,p1*m-n)}}
  if(kind==="three"){const[b1,p1]=pick(ps),[b2,p2]=pick(ps),m=rand(2,4),n=rand(2,3),k=rand(1,4);return{expr:`${pw(b1,m)} × ${pw(b2,n)} × ${pw(base,k)}＝${pw(base,"□")}，求 □。`,answer:`□＝${p1*m+p2*n+k}`,sig:`h:${b1}:${m}:${b2}:${n}:${k}`,verify:()=>bp(b1,m)*bp(b2,n)*bp(base,k)===bp(base,p1*m+p2*n+k)}}
  const[b,p]=pick(ps),n=p*rand(2,6);return{expr:`${pw(base,n)}＝${pw(b,"□")}，求 □。`,answer:`□＝${n/p}`,sig:`r:${b}:${n}`,verify:()=>bp(base,n)===bp(b,n/p)};
 });

 const unknown=unit("unknown","未知指數","把兩邊化成同底數，指數相等；aᵐ × aˣ＝aⁿ ⇒ x＝n−m。",["integer"],ctx=>{

  const b=pick([2,3]),x=rand(2,5),n=rand(2,3),v=bp(b,x*n);return{expr:`(${pw(b,"x")})${sup(n)}＝${v}，求 x。`,answer:`x＝${x}`,sig:`p:${b}:${x}:${n}`,verify:()=>bp(b,x)**BigInt(n)===v};
 });

 const compare=unit("compare","指數大小比較","化成相同底數比指數，或化成相同指數比底數。",["integer"],ctx=>{
  const L=lv(ctx),kind=pick(L===0?["sameBase","sameExp","two"]:L===1?["sameExp","toBase","two"]:["toBase","two","three"]);
  const order=(items)=>[...items].sort((x,y)=>(y.v>x.v)-(y.v<x.v));
  const fmtOrder=items=>items.map((x,i)=>(i?(x.v===items[i-1].v?" ＝ ":" ＞ "):"")+x.h).join("");
  if(kind==="sameBase"){const b=rand(2,9),es=shuffle([rand(2,4),rand(5,7),rand(8,10)]),items=es.map(e=>({h:pw(b,e),v:bp(b,e)}));return{expr:`由大到小排列：${items.map(x=>x.h).join("、")}`,answer:fmtOrder(order(items)),sig:`sb:${b}:${es}`,verify:()=>{const o=order(items);return o[0].v>=o[1].v&&o[1].v>=o[2].v}}}

/* ---------- 中文數字 ---------- */
const CN='零一二三四五六七八九';
function cnUnit(m,e){ // m×10^e，e≥4，用 萬/億/兆 表示，如 103億7千5百萬、7.5億、五千萬

/* ---------- 各單元 ---------- */
const NOTE='（結果須整理成 a×10<sup>n</sup>，1≦|a|＜10）';
const GEN={
  rep:{name:'表示法',tip:'把數寫成 a×10ⁿ，1≦|a|＜10、n 為整數。比 1 大的數：小數點向左移幾位，n 就是幾；比 1 小的數：小數點向右移幾位，n 就是負幾。若 a 不在範圍內，把 a 的小數點左移 k 位，指數就加 k；右移 k 位，指數就減 k。',
    make(){ const x=rSci(); const kind=pick(D===1?['big','small','dec','form','frac']:D===2?['big','small','dec','form','frac']:['big','small','form','form','frac','mulform']);
      let q,a=`<b>${sci(x)}</b>`; const {ad,n}=norm(x);

        const aShown=decStr(y.m,adN), nShown=y.e+adN; return {q:`${aShown}×${p10(nShown)}＝？`,a:`<b>${sci(y)}</b>`,len:14}; }

  unit:{name:'單位換算',tip:'1 km＝10³ m＝10⁵ cm；1 cm＝10⁻² m；1 mm＝10⁻³ m；1 μm＝10⁻⁶ m；1 nm＝10⁻⁹ m；1 kg＝10³ g；1 mL＝10⁻³ L。1 萬＝10⁴，1 億＝10⁸。換算後結果要整理成科學記號。',
    make(){ const kind=pick(D===1?['cn','unit','unit']:['cn','cnfrac','unit','unit','unitsci']);

        const yi=rnd(1,D===1?9:D===3?999:120); const wan=pick([0,0,rnd(1,9)*1000,rnd(1,9)*100+rnd(1,9)*1000,rnd(1,9999)]); const v=yi*1e8+(D===1?0:wan*1e4); const x=S(v,0);

      if(kind==='cnfrac'){ const d=rnd(1,9), k=rnd(5,D===3?11:9); const num=rnd(1,9); const q=`${cnBig(d,k)}分之${CN[num]}`; // num/(d×10^k)
        const r=div(S(num,0),S(d,k)); if(!r) return this.make(); return {q:q+'＝？',a:`${fr(num,d+'×'+p10(k))}＝<b>${sci(r)}</b>`,len:10}; }

      const U3=[['μm',-6,'m',0],['nm',-9,'m',0],['m',0,'nm',-9],['km',3,'mm',-3],['nm',-9,'μm',-6]];
      const [fu,fe,tu,te]=pick(D===3?[...U,...U3]:U); const x=rSci(SIG(),D===1?rnd(-4,6):EXP());

const T_=()=>pick(TYPES);
function coef(type,opt={}){ // 非零係數
  const m=opt.max||(D===1?6:D===2?9:12);
  if(type==='int') return new F(sgn()*rnd(1,m));
  if(type==='dec'){ if(D>=2&&coin(.3)) return new F(sgn()*pick([5,25,75,15,35,45,125]),100); let v=rnd(1,D===1?19:D===2?39:59); if(v%10===0) v+=1; return new F(sgn()*v,10); }
  const den=pick(D===1?[2,3,4,5]:[2,3,4,5,6,8,9,10]); let num=rnd(1,opt.proper?den-1:den*2); if(num%den===0) num=1; return new F(sgn()*num,den); }
const smallInt=(m=9)=>new F(sgn()*rnd(1,m));
function rLin(type,opt={}){ // ax+b（b 可 0）
  const a=opt.aInt?smallInt(opt.max||9):coef(type,{max:opt.max}); let b=opt.b0?Z:(opt.bInt?smallInt(opt.bmax||12):coef(type,{max:opt.bmax||12}));
  if(opt.noZeroB&&b.isZero()) b=smallInt(9); const c=opt.y?smallInt(9):Z; return lin(a,b,c); }
const xy=()=>D>=2&&coin(.3);

/* ================= 答案格式 ================= */
function ansLin(L,dec){ return `<b>${linStr(L,dec)}</b>`; }
function solveStr(L,dec){ // L = 0
  if(L.a.isZero()) return L.b.isZero()?'<b>x 為任意數（無限多解）</b>':'<b>無解</b>';
  const x=L.b.neg().div(L.a); let h=`<b>${V()}＝${numStr(x)}</b>`; if(!x.isInt()&&dec&&x.isDec()) h+=`（＝${numStr(x,true)}）`; return h; }
/* 設定解 x0 後，調整右式常數使等式成立；回傳 {q, L} */
function eqWith(lhs,rhs,x0,dec){ const L=ev(lhs), R=ev(rhs);
  // 在候選解中挑一個，讓補上去的常數最「乾淨」（整數優先、其次分母小、絕對值小）
  const cands=[]; const t=x0.isInt()?'int':(dec?'dec':'frac');
  if(t==='int'){ for(let v=-12;v<=12;v++) if(v) cands.push(new F(v)); } else if(t==='dec'){ for(const d of [2,4,5,10]) for(let v=-20;v<=20;v++) if(v%d) cands.push(new F(v,d)); } else { for(const d of [2,3,4,5,6]) for(let v=-12;v<=12;v++) if(v%d) cands.push(new F(v,d)); }
  cands.push(x0); const scored=cands.map(x=>{ const c=L.a.mul(x).add(L.b).sub(R.a.mul(x).add(R.b)); let sc=(c.isInt()?0:(dec&&c.isDec()?1:2+c.d))+Math.abs(c.val())/40; return {x,c,sc}; }).sort((p,q)=>p.sc-q.sc);
  const best=scored.slice(0,Math.min(6,scored.length)); const pickd=pick(best); x0=pickd.x; const c=pickd.c; let rhs2=rhs;
  if(!c.isZero()){ if(rhs.t==='N') rhs2=N(rhs.v.add(c)); else if(rhs.t==='L') rhs2=Ln(lin(rhs.L.a,rhs.L.b.add(c),rhs.L.c),rhs.order);
    else if(rhs.t==='S'){ const last=rhs.terms[rhs.terms.length-1]; if(last.n.t==='N'){ rhs2=S(...rhs.terms.slice(0,-1),T(1,N(last.n.v.mul(last.s).add(c)))); } else if(last.n.t==='L'){ rhs2=S(...rhs.terms.slice(0,-1),T(last.s,Ln(lin(last.n.L.a,last.n.L.b.add(c.mul(last.s)),last.n.L.c),last.n.order))); } else rhs2=S(...rhs.terms,T(1,N(c))); }
    else rhs2=S(T(1,rhs),T(1,N(c))); }
  const R2=ev(rhs2); const E=ladd(L,lscale(R2,-1)); return {q:`${render(lhs,dec)}<span style="margin:0 .15em">＝</span>${render(rhs2,dec)}`,E,lhs,rhs:rhs2}; }
function x0For(type){ if(type==='int') return new F(rnz(-9,12)); if(type==='dec') return new F(rnz(-30,30),pick([2,4,5,10])); return new F(rnz(-9,9),pick([2,3,4,5,6])); }

function inequalityConfig(){
 /* 國一 一元一次不等式（2026-09-27，Claude）。由舊的 g7-inequality.html（百宏自製）移植進引擎：有理數、一次式、運算式項目、解集合、解題步驟、數線 SVG 與
    十個單元（基本型、括號型、分數型、小數型、合併形式、畫數線、讀數線、解不等式並圖示、絕對值不等式、綜合練習）照舊，只換成引擎的難度／數型介面。
    需要在數線上作答的題（畫數線、解不等式並圖示、絕對值）題幹下方附一條空白數線；教用版的答案含解的數線。
    verify：對解集合的每個端點與端點兩側的點，直接把 x 代入原不等式兩邊（val 求值＋比較）檢查是否符合開閉區間；無解時抽多個點檢查皆不成立。 */
 const CFGI={lvl:2,types:['int']};
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function lcm(a,b){return a/gcd(a,b)*b}
class F{
  constructor(n,d=1){ if(d<0){n=-n;d=-d} const g=gcd(n,d)||1; this.n=n/g; this.d=d/g }
  static of(x){return x instanceof F?x:new F(x)}
  add(o){o=F.of(o);return new F(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){o=F.of(o);return new F(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){o=F.of(o);return new F(this.n*o.n,this.d*o.d)}
  div(o){o=F.of(o);return new F(this.n*o.d,this.d*o.n)}
  neg(){return new F(-this.n,this.d)}
  abs(){return new F(Math.abs(this.n),this.d)}
  cmp(o){o=F.of(o);return Math.sign(this.n*o.d-o.n*this.d)}
  eq(o){return this.cmp(o)===0}
  get sign(){return Math.sign(this.n)}
  isInt(){return this.d===1}
  isZero(){return this.n===0}
  toNum(){return this.n/this.d}
}
const Z=new F(0), ONE=new F(1);
// 一次式 p x + q
class L{
  constructor(p,q){this.p=F.of(p);this.q=F.of(q)}
  add(o){return new L(this.p.add(o.p),this.q.add(o.q))}
  sub(o){return new L(this.p.sub(o.p),this.q.sub(o.q))}
  scale(k){return new L(this.p.mul(k),this.q.mul(k))}
  at(x){return this.p.mul(x).add(this.q)}
}

// ================= 亂數 =================
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const nz=(a,b)=>{let v;do{v=ri(a,b)}while(v===0);return v};
const sgn=()=>chance(.5)?1:-1;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}

// ================= 顯示 =================
const MINUS='−';
function decStr(f){ // 假設分母整除 1000
  let k=0; while((Math.pow(10,k))%f.d!==0)k++;
  const n=Math.abs(f.n)*Math.pow(10,k)/f.d;
  let s=String(n); while(s.length<=k)s='0'+s;
  s=k?s.slice(0,s.length-k)+'.'+s.slice(s.length-k):s;
  return (f.n<0?MINUS:'')+s;
}
function isDecDen(d){return 1000%d===0}
function frHTML(n,d){return `<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`}
// dec: 允許以小數顯示；abs: 不顯示負號；mixed: 帶分數
function num(f,o={}){
  f=F.of(f);
  const neg=f.n<0&&!o.abs, a=Math.abs(f.n);
  if(f.d===1) return (neg?MINUS:'')+a;
  if(o.dec&&isDecDen(f.d)) return (neg?MINUS:'')+decStr(f.abs());
  if(o.mixed&&a>f.d){const w=Math.floor(a/f.d);return (neg?MINUS:'')+w+frHTML(a-w*f.d,f.d)}
  return (neg?MINUS:'')+frHTML(a,f.d);
}
const RELS={'<':'&lt;','>':'&gt;','le':'≦','ge':'≧'};
const rel=r=>`<span style="margin:0 .2em">${RELS[r]}</span>`;
const flip=r=>({'<':'>','>':'<','le':'ge','ge':'le'})[r];
const X='<var>x</var>';

// 式子 = 項目陣列；項目 {c:F, dec?, body:null|'x'|{br:Expr}|{fr:Expr,den:F}}
const T=(c,body=null,dec=false)=>({c:F.of(c),body,dec});
const brT=(c,inner,dec=false)=>T(c,{br:inner},dec);
const frT=(c,inner,den,dec=false)=>T(c,{fr:inner,den:F.of(den)},dec);
const lin=(a,b,dec=false)=>{const t=[];if(!F.of(a).isZero())t.push(T(a,'x',dec));if(!F.of(b).isZero())t.push(T(b,null,dec));return t.length?t:[T(0)]};

function val(e){ // Expr -> L
  let r=new L(0,0);
  for(const t of e){
    let v;
    if(t.body===null) v=new L(0,1);
    else if(t.body==='x') v=new L(1,0);
    else if(t.body.br) v=val(t.body.br);
    else v=val(t.body.fr).scale(ONE.div(t.body.den));
    r=r.add(v.scale(t.c));
  }
  return r;
}
function renderTerm(t,first){
  const neg=t.c.sign<0, m=t.c.abs(), one=m.eq(1), coef=num(m,{dec:t.dec});
  const sign=first?(neg?MINUS:''):(`<span style="margin:0 .15em">${neg?MINUS:'+'}</span>`);
  let body;
  if(t.body===null) body=coef;
  else if(t.body==='x') body=(one?'':coef)+X;
  else if(t.body.br) body=(one?'':coef)+'('+render(t.body.br)+')';
  else{
    const fr=frHTML(render(t.body.fr),num(t.body.den));
    body=one?fr:coef+'('+fr+')';
  }
  return sign+body;
}
function render(e){
  const ts=e.filter(t=>!t.c.isZero());
  if(!ts.length)return '0';
  return ts.map((t,i)=>renderTerm(t,i===0)).join('');
}
function renderL(l,dec=false){return render(lin(l.p,l.q,dec))}
function hasStruct(e){return e.some(t=>t.body&&t.body!=='x')}
function denLcm(...fs){return fs.reduce((m,f)=>lcm(m,f.d),1)}

// ================= 解集合 =================
// {lo,loOpen,hi,hiOpen} | null(無解) | {union:[setA,setB]}
function fromRel(r,v){
  if(r==='<')return{hi:v,hiOpen:true,lo:null};
  if(r==='le')return{hi:v,hiOpen:false,lo:null};
  if(r==='>')return{lo:v,loOpen:true,hi:null};
  return{lo:v,loOpen:false,hi:null};
}
function inter(a,b){
  if(!a||!b)return null;
  let lo=a.lo,loOpen=a.loOpen,hi=a.hi,hiOpen=a.hiOpen;
  if(b.lo!==null&&b.lo!==undefined){ if(lo===null||lo===undefined||b.lo.cmp(lo)>0||(b.lo.eq(lo)&&b.loOpen)){lo=b.lo;loOpen=b.loOpen} }
  if(b.hi!==null&&b.hi!==undefined){ if(hi===null||hi===undefined||b.hi.cmp(hi)<0||(b.hi.eq(hi)&&b.hiOpen)){hi=b.hi;hiOpen=b.hiOpen} }
  const s={lo:lo??null,loOpen:!!loOpen,hi:hi??null,hiOpen:!!hiOpen};
  if(s.lo&&s.hi){const c=s.lo.cmp(s.hi); if(c>0||(c===0&&(s.loOpen||s.hiOpen)))return null;}
  return s;
}
function setHTML(s,o={}){ // o.rev 反向寫法, o.mixed, o.dec
  if(!s)return '無解';
  if(s.union)return setHTML(s.union[0],o)+' 或 '+setHTML(s.union[1],o);
  const n=v=>num(v,o);
  const lr=s.loOpen?'<':'le', hr=s.hiOpen?'<':'le';
  if(s.lo&&s.hi){
    if(s.lo.eq(s.hi))return X+' = '+n(s.lo);
    return o.rev? n(s.hi)+rel(flip(hr))+X+rel(flip(lr))+n(s.lo) : n(s.lo)+rel(lr)+X+rel(hr)+n(s.hi);
  }
  if(s.lo) return o.rev? n(s.lo)+rel(flip(lr))+X : X+rel(flip(lr))+n(s.lo);
  return o.rev? n(s.hi)+rel(flip(hr))+X : X+rel(hr)+n(s.hi);
}

// ================= 解題步驟 =================
// 解 Lexpr rel Rexpr；回傳 {steps:[html], set, ok}
function solve(Le,Re,r,dec=false){
  const s=[];
  let a=val(Le), b=val(Re);
  if(a.p.eq(b.p))return{ok:false};
  if(hasStruct(Le)||hasStruct(Re)) s.push(renderL(a,dec)+rel(r)+renderL(b,dec));
  const M=denLcm(a.p,a.q,b.p,b.q);
  if(M>1){a=a.scale(M);b=b.scale(M);s.push('同乘以 '+M+'：'+renderL(a)+rel(r)+renderL(b))}
  const A=a.p.sub(b.p), B=b.q.sub(a.q);
  const st=renderL(new L(A,0))+rel(r)+num(B);
  if(s[s.length-1]!==st&&!(a.q.isZero()&&b.p.isZero()&&s.length===0&&false)) s.push(st);
  const r2=A.sign>0?r:flip(r), v=B.div(A);
  const fin=X+rel(r2)+num(v);
  if(s[s.length-1]!==fin)s.push(fin);
  return{ok:true,steps:s,set:fromRel(r2,v)};
}
const join=st=>st.join('，');
const CMP={'<':(a,b)=>a.cmp(b)<0,'>':(a,b)=>a.cmp(b)>0,'le':(a,b)=>a.cmp(b)<=0,'ge':(a,b)=>a.cmp(b)>=0};
const chk=(Le,Re,r)=>{const a=val(Le),b=val(Re);return x=>CMP[r](a.at(x),b.at(x))};

// ================= 數線 SVG =================
function svgNum(f,x,y,o){ // 數線標籤
  f=F.of(f);
  if(f.d===1||(o.dec&&isDecDen(f.d))) return `<text x="${x}" y="${y}" text-anchor="middle" font-size="11">${num(f,o).replace('&','&amp;')}</text>`;
  const neg=f.n<0,a=Math.abs(f.n);let w=0,n=a;

function nlSVG(set,o={}){

  let g=`<line x1="${ax}" x2="${bx}" y1="${y}" y2="${y}" stroke="currentColor" stroke-width="1.2"/><polygon points="${bx},${y-4} ${bx+9},${y} ${bx},${y+4}" fill="currentColor"/>`;

    else{

      const pts=[];parts.forEach(s=>{if(s.lo)pts.push(s.lo);if(s.hi&&!(s.lo&&s.hi.eq(s.lo)))pts.push(s.hi)});
      pts.sort((a,b)=>a.cmp(b));

}

    if(top.v.isInt()&&bot.v.isInt())return null;
    if(top.v.eq(bot.v))return null;
    const show=t=>t.h==='dec'?num(t.v,{dec:true}):t.h==='mixed'?num(t.v,{mixed:true}):num(t.v);
    const html=frHTML(show(top),show(bot),true)+EQ+'？';
    const s=[];

    const a=top.v,b=bot.v; // (a.n/a.d)/(b.n/b.d) = a.n*b.d / (a.d*b.n)
    const numE=a.d===1?`${a.n}`:(b.d===1?`${a.n}`:`${a.n}×${b.d}`);
    const denE=b.d===1?`${a.d===1?'':a.d+'×'}${b.n}`:(a.d===1?`${b.n}`:`${a.d}×${b.n}`);
    const nn=a.n*b.d, dd=a.d*b.n;
    const v=a.div(b);
    if(!(a.d===1&&b.d===1))s.push(frHTML(numE,denE,true));
    if(gcd(nn,dd)>1||numE.includes('×')||denE.includes('×'))s.push(frHTML(nn,dd,true));
    const fin=num(v,{mixed:false}); if(s.length&&s[s.length-1].replace(' big','')===frHTML(v.n,v.d))s.pop(); s.push('<b>'+fin+'</b>');
    const uniq=s.filter((x,i)=>i===0||x!==s[i-1]);
    return{html,ans:uniq.join(EQ),v,_ck:()=>Math.abs(v.n/v.d-(top.v.n/top.v.d)/(bot.v.n/bot.v.d))<1e-9};
  });
}

function genPropX(){

    const st=style(.4);

        const xi=ri(0,3); parts[xi]=[T(1,'x')];
        [A,B,C,D]=parts;

          A=[T(f1)];B=[T(f2.mul(ri(1,3)),'x')];C=[T(p)];D=[T(q)];
          if(chance(.5)){[A,B]=[B,A]}
        }else if(st==='dec'&&chance(.6)){
          A=[T(posNum('dec'),null,true)];B=[T(posNum('dec'),'x',true)];C=[T(p)];D=[T(q)];if(chance(.5))[A,B]=[B,A];
        }
      }else{ // (2x−5):(x+2)=1:2 或 (x+3):4=(2x−5):6
        const x0=ri(-6,9);
        const [p,q]=pickRatioInt(9);
        const e1=lin(nz(-3,3),nz(-9,9)), e2=chance(.5)?lin(nz(-3,3),nz(-9,9)):[T(ri(2,9))];
        // 調整 e2 常數使 x0 為解：val(e1)(x0)*q = val(e2)(x0)*p
        const v1=val(e1).at(x0); const need=v1.mul(q).div(p); const cur=val(e2).at(x0);
        e2[e2.length-1]=T(e2[e2.length-1].c.add(need.sub(cur)));
        if(!e2[e2.length-1].c.isInt())return null;
        A=[brT(1,e1)];B=e2.length===1&&e2[0].body===null?e2:[brT(1,e2)];C=[T(p)];D=[T(q)];
        if(chance(.4)){[A,C]=[C,A];[B,D]=[D,B]}
      }
    }else if(lvl===2){
      const x0=chance(.6)?ri(-8,9):new F(nz(-9,9),pick([2,3,4]));
      const mk=()=>chance(.75)?lin(nz(-4,4),nz(-9,9)):[T(nz(-9,9))];
      const e1=mk(),e2=mk(),e3=mk();
      const [p,q]=pickRatioInt(9);
      const forms=pick([1,2,3]);
      const wrap=e=>e.length===1&&e[0].body===null?e:[brT(1,e)];
      if(forms===1){ // (2x−5):(x+2)=p:q
        A=e1;B=e2;C=[T(p*(chance(.3)?-1:1))];D=[T(q)];
      }else if(forms===2){ // (x+3):p=(2x−5):q
        A=e1;B=[T(p)];C=e2;D=[T(q)];
      }else{ // p:(x−9)=q:2x
        A=[T(p)];B=e1;C=[T(q)];D=e3.length===1?lin(nz(-3,3),0):e3;
      }
      // 調整常數使 x0 為解：A·D = B·C（皆為一次式）→ 這裡直接以 x0 修正 D 的常數（若 D 有常數）或 B
      const fixTarget=D.some(t=>t.body===null)?D:B.some(t=>t.body===null)?B:null;
      if(fixTarget&&chance(.8)){
        const other=fixTarget===D?[A,B,C]:[A,C,D];
        // A*D = B*C；解 fixTarget 的常數 k：若 fixTarget=D → k = (B·C − A·D_noconst)/A (在 x0)
        const at=e=>val(e).at(x0);
        const noC=fixTarget.filter(t=>t.body!==null);
        let k;
        if(fixTarget===D){ if(at(A).isZero())return null; k=at(B).mul(at(C)).sub(at(A).mul(at(noC))).div(at(A)); }
        else{ if(at(C).isZero())return null; k=at(A).mul(at(D)).sub(at(C).mul(at(noC))).div(at(C)); }
        if(!k.isInt()||Math.abs(k.n)>60)return null;
        const idx=fixTarget.findIndex(t=>t.body===null); fixTarget[idx]=T(k);
      }
      A=wrap(A);B=wrap(B);C=wrap(C);D=wrap(D);
    }else{
      const mk=()=>{const s=style(.5);if(s==='frac')return[T(posNum('frac',{mixed:false}).mul(chance(.3)?-1:1),'x'),T(posNum('frac',{mixed:false}).mul(sgn()))];if(s==='dec')return[T(posNum('dec').mul(sgn()),'x',true),T(posNum('dec').mul(sgn()),null,true)];return lin(nz(-9,9),nz(-9,9))};
      A=[brT(1,mk())];B=[brT(1,mk())];
      const [cp,cq]=pickRatioInt(9); if(chance(.5)){C=[T(cp*(chance(.4)?-1:1))];D=[T(cq)]}else{C=[brT(1,mk())];D=[T(cq*(chance(.4)?-1:1))]}
      if(chance(.3))[A,C]=[C,A];
    }
    // 求解：A·D = B·C
    const la=val(A),lb=val(B),lc=val(C),ld=val(D);
    // 兩邊皆一次（乘積可能為二次）：需 la.p*ld.p == lb.p*lc.p 才是一次方程
    const q2=la.p.mul(ld.p).sub(lb.p.mul(lc.p));
    if(!q2.isZero())return null;
    const P=la.p.mul(ld.q).add(la.q.mul(ld.p)).sub(lb.p.mul(lc.q).add(lb.q.mul(lc.p)));
    const Q=lb.q.mul(lc.q).sub(la.q.mul(ld.q));
    if(P.isZero())return null;
    const x0=Q.div(P);
    if(lb.at(x0).isZero()||ld.at(x0).isZero())return null;
    if(Math.abs(x0.n)>200||x0.d>30)return null;
    const html=ratio(render(A),render(B))+EQ+ratio(render(C),render(D));
    const s=[];
    const side=(e1,e2)=>{ // 顯示 e1·e2
      const isC=e=>e.length===1&&e[0].body===null;
      const one=e=>e.length===1&&e[0].body===null&&e[0].c.eq(1);
      if(one(e1))return render(e2); if(one(e2))return render(e1);
      const isBr=e=>e.length===1&&e[0].body&&e[0].body.br&&e[0].c.eq(1);
      const w=e=>isC(e)?num(e[0].c,{paren:true,dec:e[0].dec}):(e.length===1&&e[0].body==='x'&&e[0].c.eq(1)?X:isBr(e)?render(e):'('+render(e)+')');
      if(isC(e1)&&isC(e2))return w(e1)+'×'+w(e2);
      if(isC(e2)&&!isC(e1))return w(e2)+w(e1);
      return w(e1)+w(e2);
    };
    const dec=[A,B,C,D].some(e=>e.some(t=>t.dec));
    s.push('外項乘積＝內項乘積：'+side(A,D)+EQ+side(B,C));
    const lhs=new L(la.p.mul(ld.q).add(la.q.mul(ld.p)),la.q.mul(ld.q)), rhs=new L(lb.p.mul(lc.q).add(lb.q.mul(lc.p)),lb.q.mul(lc.q));
    s.push(renderL(lhs,dec)+EQ+renderL(rhs,dec));
    const M=denLcm(lhs.p,lhs.q,rhs.p,rhs.q);
    let l2=lhs,r2=rhs; if(M>1){l2=lhs.scale(M);r2=rhs.scale(M);s.push('同乘以 '+M+'：'+renderL(l2)+EQ+renderL(r2))}
    const PP=l2.p.sub(r2.p),QQ=r2.q.sub(l2.q);
    const st2=renderL(new L(PP,0))+EQ+num(QQ); if(s[s.length-1]!==st2)s.push(st2);
    s.push('<b>'+X+EQ+num(x0)+'</b>');
    return{html,ans:join(s),v:x0,_ck:()=>la.at(x0).mul(ld.at(x0)).eq(lb.at(x0).mul(lc.at(x0)))&&!lb.at(x0).isZero()&&!ld.at(x0).isZero()};
  });
}

function mergeShared(a,b,c,d){const Lm=lcm(b,c);let r=[a*Lm/b,Lm,d*Lm/c];const g=r.reduce((p,q)=>gcd(p,q),0);return r.map(v=>v/g)}

// ================= 單元 8：連比例式 =================
function genChainProp(){

    const k=chance(.5)?new F(ri(2,6)):new F(ri(1,9),pick([2,3,4,5]));
    const other=base.map(f=>f.mul(k));
    const idxKnown=ri(0,2); // other 中哪一個已知
    const unk=[0,1,2].filter(i=>i!==idxKnown);
    const shown=other.map((f,i)=>i===idxKnown?ratioNum(f):(i===unk[0]?X:Y));
    if(!other[idxKnown].isInt()&&lvl===1)return null;
    const flipSide=chance(.4);
    const L1=ratio(...base.map(f=>ratioNum(f))),L2=ratio(...shown);
    const html=`若 ${flipSide?L2+EQ+L1:L1+EQ+L2}，求 ${X}${EQ}？，${Y}${EQ}？`;
    const s=[];
    const sb=simpRatio(base);
    if(!base.every((f,i)=>f.isInt()&&f.n===sb[i]))s.push(`${L1}${EQ}${ratio(...sb)}`);
    const kn=other[idxKnown];
    for(const [j,name] of [[unk[0],X],[unk[1],Y]]){
      // sb[idxKnown]:sb[j] = kn:name → sb[idxKnown]·name = sb[j]·kn
      const val_=other[j];
      s.push(`${ratio(sb[idxKnown],sb[j])}${EQ}${ratio(ratioNum(kn),name)}，${sb[idxKnown]}${name}${EQ}${sb[j]}×${ratioNum(kn,{paren:true})}${EQ}${num(new F(sb[j]).mul(kn))}，${name}${EQ}<b>${num(val_)}</b>`);
    }
    return{html,ans:join(s),_sum:other[unk[0]].add(other[unk[1]]),_ck:()=>{const fv=f=>f.n/f.d;return [0,1,2].every(i=>Math.abs(fv(other[i])/fv(base[i])-fv(other[idxKnown])/fv(base[idxKnown]))<1e-9)}};
  });
}

 const linearCoeff=mkUnit("linearCoeff","反求一次函數係數","把已知的兩組 x、f(x) 代入，得到 a、b 的聯立方程式。",[

  (m)=>{const a=rnz(m,3),b=rv(m,4),k=rv(m,4),t=eL(a,b,eL(a,b,k));if(mul(a,a).n===0)return null;return one(`設 f(x)＝${L(a,b,m)}。若 f(f(k))＝${sh(t,m)}，求 k。`,k,m,()=>{const g=u=>fv(a)*u+fv(b);return near(g(g(fv(k))),fv(t))})}]);

 return{title:"函數",symbol:"f(x)",subtitle:"一次・二次・常數函數值・綜合運算・分段函數・反求輸入與係數・函數替換・複合・總和・巢狀",instruction:"代入負數時先加括號，並寫出必要的過程。",modes:["integer","fraction","decimal"],mixed:false,answerLabel:"答：",

const CONFIGS={signed:signedConfig,exponent:exponentConfig,scinot:scinotConfig,factors:factorsConfig,linear:linearConfig,simultaneous:simultaneousConfig,inequality:inequalityConfig,ratio:ratioConfig,function:functionConfig,numberline:numberlineConfig,coordinate:coordinateConfig,lineeq:lineeqConfig,statistics:statisticsConfig},CFG=CONFIGS[TOPIC_KEY]();
let state={level:"advanced",groups:[],paper:null,mixed:true};
function safeQuestion(unit,ctx,seen){for(let i=0;i<50;i++){try{const q=unit.gen(ctx);if(!okResult(q))continue;const key=norm(q.sig||q.expr);if(seen.has(key))continue;seen.add(key);return q}catch(e){if(i===49)console.warn("出題失敗",unit.id,e)}}console.warn("超過50次仍無法產生不重複且可驗證的題目",unit.id);return null}
globalThis.__BHCS_TEST__={CFG,R,add,sub,mul,div,eq,safeQuestion,okResult};
if(typeof document==="undefined")return;
function build(){const sel=$("topicSel");TOPICS.forEach(([k,n])=>{const o=document.createElement("option");o.value=k;o.textContent=n;if(k===TOPIC_KEY)o.selected=true;sel.appendChild(o)});sel.addEventListener("change",()=>{location.search="?topic="+sel.value});$("topicTitle").textContent=CFG.title;$("topicLogo").textContent=CFG.symbol||"∑";document.title="百宏文教｜"+CFG.title+" 出題器";const can=document.querySelector('link[rel="canonical"]');if(can)can.href="https://www.bhcs.com.tw/tools/math/g7-drills.html?topic="+TOPIC_KEY;$("subtitle").textContent=CFG.subtitle;$("difficultyNote").textContent=CFG.levels.advanced;const mb=$("modeBoxes");CFG.modes.forEach(m=>{const label=document.createElement("label");label.className="choice";label.innerHTML=`<input type="checkbox" data-mode="${m}" checked>${(CFG.modeLabels||MODE_LABEL)[m]}`;mb.appendChild(label)});if(CFG.mixed){const label=document.createElement("label");label.className="choice";label.innerHTML='<input id="mixedNumber" type="checkbox" checked>可用帶分數';mb.appendChild(label)}const grid=$("unitGrid");CFG.units.forEach(u=>{const box=document.createElement("div");box.className="unit";box.innerHTML=`<input class="unit-check" id="unit-${u.id}" type="checkbox" data-unit="${u.id}"><label for="unit-${u.id}">${u.name}</label><input class="count" type="number" min="1" max="40" value="1" data-count="${u.id}" aria-label="${u.name}題數">`;grid.appendChild(box)});grid.addEventListener("change",e=>{if(e.target.matches(".unit-check"))grid.querySelector(`[data-count='${e.target.dataset.unit}']`).disabled=!e.target.checked;markChanged();updateTotal()});grid.addEventListener("input",e=>{if(e.target.matches(".count")){e.target.value=Math.max(1,Math.min(40,Number(e.target.value)||1));markChanged();updateTotal()}});applyPreset("advanced")}
const selectedModes=()=>[...document.querySelectorAll("[data-mode]:checked")].map(x=>x.dataset.mode),selectedUnits=()=>CFG.units.flatMap(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);return c.checked?[{...u,count:Math.max(1,Math.min(40,Number(n.value)||1))}]:[]});
function applyPreset(level){state.level=level;const p=CFG.presets[level];CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`),v=p[u.id]||0;c.checked=v>0;n.disabled=!c.checked;n.value=v||1});document.querySelectorAll(".level").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===level)));$("difficultyNote").textContent=CFG.levels[level];updateTotal();markChanged()}
function setEach(v){CFG.units.forEach(u=>{const c=document.querySelector(`[data-unit='${u.id}']`),n=document.querySelector(`[data-count='${u.id}']`);c.checked=v>0;n.disabled=!c.checked;if(v)n.value=v});updateTotal();markChanged()}
function updateTotal(){$("total").textContent=`共 ${selectedUnits().reduce((s,u)=>s+u.count,0)} 題`}function markChanged(){$("status").textContent="設定已變更，按「重新出題」套用。"}
function generate(){const modes=selectedModes(),chosen=selectedUnits();if(!modes.length){$("status").textContent="請至少勾選一種數的類型。";return}if(!chosen.length){state.groups=[];state.paper=null;render();$("status").textContent="請至少勾選一個單元。";return}state.mixed=CFG.mixed&&$("mixedNumber")?.checked;const seen=new Set,skipped=[];state.groups=[];for(const unit of chosen){const allowed=modes.filter(m=>unit.modes.includes(m));if(!allowed.length){skipped.push(unit.name);continue}const ctx={level:state.level,modes:allowed,mixed:state.mixed},questions=[];for(let i=0;i<unit.count;i++){const q=safeQuestion(unit,ctx,seen);if(q)questions.push(q)}if(questions.length)state.groups.push({unit,questions})}state.paper={level:state.level,modes:[...modes],total:state.groups.reduce((s,g)=>s+g.questions.length,0)};render();$("status").textContent=`已產生 ${state.paper.total} 題，逐題驗證完成${skipped.length?`；數型不適用而略過：${skipped.join("、")}`:""}。`}
function render(){const out=$("output");out.innerHTML="";if(!state.paper||!state.groups.length){out.innerHTML='<div class="empty"><b>尚未產生練習卷</b>請選擇數型與單元後按「重新出題」。</div>';return}const teacher=$("version").value==="teacher",cols=$("columns").value,work={small:"10mm",medium:"16mm",large:"26mm"}[$("space").value],sheet=document.createElement("div");sheet.className=`sheet ${teacher?"teacher":"student"}`;sheet.style.setProperty("--work",work);sheet.innerHTML=`<div class="head"><div class="bhcs-brand"><b>百宏文教機構</b><span>數學計算力練習 · 徹底反覆計算系列</span><i>www.bhcs.com.tw</i></div><h2>${CFG.title} 計算力練習（${{basic:"基礎",advanced:"進階",challenge:"挑戰"}[state.paper.level]}）</h2><span>班級：______　姓名：__________　日期：___／___　作答時間：___分___秒</span></div><p class="tip">${CFG.instruction}</p>`;let no=1;state.groups.forEach(g=>{const sec=document.createElement("section");sec.innerHTML=`<div class="sec">${g.unit.name}</div><p class="tip">${g.unit.tip}</p><div class="grid c${cols}"></div>`;const grid=sec.querySelector(".grid");g.questions.forEach(q=>{const item=document.createElement("div");item.className="prob";item.innerHTML=`<div class="q"><span class="no">(${no++})</span><span class="expr">${q.expr}</span></div><div class="work">${g.unit.answerLabel??CFG.answerLabel??"原式＝"}<span class="ans">${q.answer}</span></div>`;grid.appendChild(item)});sheet.appendChild(sec)});out.appendChild(sheet);fit()}
function fit(){if(matchMedia("print").matches)return;const sheet=document.querySelector(".sheet");if(sheet)sheet.style.zoom=Math.min(1,Math.max(.42,(innerWidth-16)/794))}
build();document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>applyPreset(b.dataset.level)));document.querySelectorAll("[data-mode],#mixedNumber").forEach(c=>c.addEventListener("change",markChanged));document.querySelectorAll("[data-each]").forEach(b=>b.addEventListener("click",()=>setEach(Number(b.dataset.each))));$("generate").addEventListener("click",generate);$("print").addEventListener("click",()=>state.paper&&print());["version","columns","space"].forEach(id=>$(id).addEventListener("change",render));addEventListener("resize",fit);addEventListener("beforeprint",()=>{const s=document.querySelector(".sheet");if(s)s.style.zoom=1});addEventListener("afterprint",fit);generate();
