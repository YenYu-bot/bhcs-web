<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>百宏文教｜全民英檢 GEPT 初級口說練習</title>
<style>
:root{--ink:#1d2939;--muted:#667085;--line:#e4e7ec;--bg:#f5f7fb;--card:#fff;--brand:#2251cc;--brand2:#edf2ff;--ok:#067647;--bad:#b42318;--warn:#b54708;--radius:18px;--shadow:0 8px 28px rgba(16,24,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",Arial,sans-serif;line-height:1.65}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.head{max-width:1080px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2047a9,#3e76ef);display:grid;place-items:center;color:#fff;font-weight:900}.brand h1{font-size:18px;margin:0}.brand small{display:block;color:var(--muted)}
main{max-width:1080px;margin:24px auto;padding:0 20px 70px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.hero{padding:26px;margin-bottom:16px}.card{padding:22px;margin-bottom:16px}.hero h2,.card h3{margin-top:0}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.side{position:sticky;top:84px}.muted{color:var(--muted)}.center{text-align:center}.tag,.pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3538cd;font-size:13px}.pill.ok{background:#ecfdf3;color:#067647}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;color:var(--ink)}.btn:hover{border-color:#aab6c7}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}.btn.soft{background:var(--brand2);border-color:#c7d7fe;color:#183b8c}.btn:disabled{opacity:.55;cursor:not-allowed}.toolbar,.record-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.notice.good{background:#ecfdf3;border-color:#abefc6;color:#067647}.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:22px;padding:7px 12px;background:#101828;color:#fff;border-radius:10px}.q{padding:16px 0;border-bottom:1px dashed var(--line)}.q:last-child{border-bottom:0}.qnum{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#eef2ff;color:#3538cd;font-weight:800;margin-right:6px}.mask{padding:12px;border:1px dashed #98a2b3;border-radius:11px;color:#667085;text-align:center;background:#fcfcfd}.rec-state{font-size:13px;color:var(--muted)}audio{max-width:100%;height:36px}.transcript{margin-top:8px;font-size:13px;background:#f8fafc;border-radius:8px;padding:7px 9px;color:#475467;min-height:34px}.progress{height:10px;background:#eaecf0;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:#4e6edb;width:0}.big-score{font-size:50px;font-weight:900;color:var(--brand)}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #cfd6e2;border-radius:11px;background:#fff}.spinner{width:22px;height:22px;border:3px solid #d0d5dd;border-top-color:#344054;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#bridge{position:absolute;width:1px;height:1px;overflow:hidden;left:-9999px;top:-9999px}.backlink{color:#3157b7;text-decoration:none;font-weight:600}
@media(max-width:800px){.grid{grid-template-columns:1fr}.side{position:static}.head{align-items:flex-start;flex-direction:column}.hero{padding:20px}.card{padding:18px}.brand h1{font-size:16px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><div class="logo">BH</div><div><h1>百宏文教｜全民英檢 GEPT 初級口說</h1><small>官網 HTTPS 錄音版｜錄音與成績回存老師後台</small></div></div><div id="returnLink"></div></div></header>
<main id="app"><section class="hero center"><div class="spinner" style="margin:auto"></div><p>正在連接口說題庫…</p></section></main>
<div id="bridge" aria-hidden="true"></div>
<script>
const params=new URLSearchParams(location.search);
let student={name:(params.get('name')||'').trim(),className:(params.get('class')||'').trim()};
let setNo=Math.max(1,Math.min(10,Number(params.get('set')||1)));
let apiUrl=(params.get('api')||'').trim();
let returnUrl=(params.get('return')||'').trim();
let data=null,recordings={},transcripts={repeat:[],reading:'',qa:[]},activeRec=null,recognition=null,timerId=null,secondsLeft=10*60;
const pending=new Map();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function validApiUrl(v){try{const u=new URL(v);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/\/macros\/s\//.test(u.pathname)}catch(e){return false}}
function validReturnUrl(v){try{const u=new URL(v);return u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='www.bhcs.com.tw'||u.hostname==='bhcs.com.tw')}catch(e){return false}}
function trustedBridgeOrigin(origin){try{const h=new URL(origin).hostname;return h==='script.google.com'||h==='script.googleusercontent.com'||h.endsWith('.googleusercontent.com')}catch(e){return false}}
function channel(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10)}
function bridgeRequest(src,kind,timeoutMs=30000){return new Promise((resolve,reject)=>{const ch=channel(kind);const iframe=document.createElement('iframe');iframe.name='bridge_'+ch;iframe.src=src+(src.includes('?')?'&':'?')+'channel='+encodeURIComponent(ch)+'&_='+Date.now();iframe.style.display='none';$('#bridge').appendChild(iframe);const timer=setTimeout(()=>{pending.delete(ch);iframe.remove();reject(new Error('連接 Apps Script 逾時，請重新整理後再試。'))},timeoutMs);pending.set(ch,{resolve,reject,kind,iframe,timer});})}
window.addEventListener('message',e=>{if(!trustedBridgeOrigin(e.origin))return;const m=e.data||{};if(!m.channel||!pending.has(m.channel))return;const p=pending.get(m.channel);clearTimeout(p.timer);pending.delete(m.channel);setTimeout(()=>p.iframe.remove(),100);if(m.ok)p.resolve(m);else p.reject(new Error(m.error||'後端處理失敗'));});
function setupReturnLink(){if(validReturnUrl(returnUrl))$('#returnLink').innerHTML='<a class="backlink" href="'+esc(returnUrl)+'">← 返回四科練習平台</a>'}
function entryScreen(msg=''){stopTimer();$('#app').innerHTML=`<section class="hero"><h2>開始口說練習</h2><p>此頁在百宏官網 HTTPS 環境執行，可正常向瀏覽器要求麥克風權限。</p></section><section class="card" style="max-width:650px;margin:auto"><div class="field"><label>學生姓名 *</label><input id="name" value="${esc(student.name)}" maxlength="40"></div><div class="field"><label>班級</label><input id="className" value="${esc(student.className)}" maxlength="40"></div><div class="field"><label>回數</label><select id="set">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${i+1===setNo?'selected':''}>第 ${i+1} 回</option>`).join('')}</select></div>${msg?`<div class="notice">${esc(msg)}</div>`:''}<p class="muted">若你是直接開啟這個頁面，請從「四科練習平台」進入口說，系統才會自動帶入 Apps Script 後端網址。</p><button class="btn primary" onclick="startFromEntry()">載入口說題目</button></section>`}
async function startFromEntry(){student.name=$('#name').value.trim();student.className=$('#className').value.trim();setNo=Number($('#set').value);if(!student.name)return alert('請輸入學生姓名。');if(!validApiUrl(apiUrl))return entryScreen('目前沒有有效的 Apps Script API 網址，請從四科練習平台點入口說。');await loadData()}
async function loadData(){if(!student.name||!validApiUrl(apiUrl)){entryScreen(!validApiUrl(apiUrl)?'尚未取得 Apps Script API 網址。':'');return}$('#app').innerHTML='<section class="hero center"><div class="spinner" style="margin:auto"></div><p>正在載入第 '+setNo+' 回口說題目…</p></section>';try{const r=await bridgeRequest(apiUrl+'?api=speaking-data&set='+setNo,'speaking-data');data=r.data;renderExam();startTimer()}catch(e){entryScreen(e.message)}}
function startTimer(){stopTimer();secondsLeft=10*60;tick();timerId=setInterval(()=>{secondsLeft--;tick();if(secondsLeft<=0){stopTimer();alert('建議作答時間已到，你仍可以完成後再交卷。')}},1000)}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null}
function tick(){const el=$('#timer');if(!el)return;const m=Math.floor(Math.max(0,secondsLeft)/60),s=Math.max(0,secondsLeft)%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function renderExam(){recordings={};transcripts={repeat:[],reading:'',qa:[]};activeRec=null;$('#app').innerHTML=`<section class="hero"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><span class="tag">Speaking</span><h2 style="margin:6px 0 0">${esc(data.title)} ${esc(data.level||'')}</h2><div class="muted">學生：${esc(student.name)}${student.className?'｜'+esc(student.className):''}</div></div><div id="timer" class="timer">10:00</div></div></section><div class="grid"><div><section class="card"><h3>Part 1｜複誦 Repetition</h3><p class="muted">題目不顯示。每題先播放兩次，再錄下你的複誦。</p>${data.repeat.map((_,i)=>speakItem('repeat',i+1,20,false)).join('')}</section><section class="card"><h3>Part 2｜朗讀 Reading Aloud</h3>${data.read_sent.map((q,i)=>`<div class="q"><span class="qnum">${i+1}</span>${esc(q)}</div>`).join('')}<div class="q"><b>Passage</b><p>${esc(data.passage)}</p>${recordControls('reading',1,75)}<div class="transcript" id="tr_reading_1">若瀏覽器支援，語音辨識文字會顯示在這裡。</div></div></section><section class="card"><h3>Part 3｜回答問題 Answering Questions</h3><p class="muted">每題播放兩次。聽完後立即回答，建議 15 秒內完成。</p>${data.qa.map((_,i)=>speakItem('qa',i+1,22,true)).join('')}</section><section class="card center"><button id="submitBtn" class="btn primary" onclick="submitExam()">交卷並上傳錄音</button></section></div><aside><section class="card side"><h3>錄音狀態</h3><div class="progress"><i id="progressBar"></i></div><p id="progressText" class="muted">0 / 13 已錄音</p><button class="btn soft" onclick="micTest()">🎙 測試麥克風</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p>✓ 複誦共 5 題</p><p>✓ 朗讀共 1 段錄音</p><p>✓ 回答問題共 7 題</p><div class="notice">錄音只會在你按「交卷」後上傳到百宏的 Google Drive。語音辨識只用於練習初評；老師仍可在後台聽原始錄音覆核。</div></section></aside></div>`;tick();updateProgress()}
function speakItem(part,n,maxSec,withTimer){return `<div class="q"><div class="mask">第 ${n} 題｜英文題目不顯示</div><div class="record-row"><button class="btn soft" onclick="playPrompt('${part}',${n})">🔊 播放兩次</button>${withTimer?`<button class="btn" onclick="miniTimer(this,15)">⏱ 15 秒</button>`:''}${recordControls(part,n,maxSec)}</div><div class="transcript" id="tr_${part}_${n}">若瀏覽器支援，語音辨識文字會顯示在這裡。</div></div>`}
function recordControls(part,n,maxSec){const key=part+'_'+n;return `<button class="btn" id="rec_${key}" onclick="toggleRecord('${part}',${n},${maxSec})">開始錄音</button><span class="rec-state" id="state_${key}">尚未錄音</span><audio id="audio_${key}" class="hidden" controls></audio>`}
function getPrompt(part,n){if(part==='repeat')return data.repeat[n-1]||'';if(part==='qa')return data.qa[n-1]||'';return ''}
function playPrompt(part,n){const text=getPrompt(part,n);if(!text)return;if(!('speechSynthesis'in window))return alert('此瀏覽器不支援英文語音播放。');speechSynthesis.cancel();let count=0;const go=()=>{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;u.pitch=1;u.onend=()=>{count++;if(count<2)setTimeout(go,450)};speechSynthesis.speak(u)};go()}
function miniTimer(btn,sec){let n=sec,orig=btn.textContent;btn.disabled=true;btn.textContent='⏱ '+n;const t=setInterval(()=>{n--;btn.textContent=n>0?'⏱ '+n:'時間到';if(n<=0){clearInterval(t);setTimeout(()=>{btn.disabled=false;btn.textContent=orig},900)}},1000)}
async function micTest(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());alert('麥克風權限正常，可以開始錄音。')}catch(e){alert('目前無法使用麥克風。請點網址列左側的網站權限，將麥克風改為「允許」，再重新整理。')}}
function preferredMime(){if(!window.MediaRecorder)return '';const types=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];return types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||''}
async function toggleRecord(part,n,maxSec){const key=part+'_'+n,btn=$('#rec_'+key);if(activeRec&&activeRec.key===key){stopRecording();return}if(activeRec)return alert('請先停止目前的錄音。');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[],mime=preferredMime();const opts=mime?{mimeType:mime,audioBitsPerSecond:48000}:{audioBitsPerSecond:48000};let mr;try{mr=new MediaRecorder(stream,opts)}catch(e){mr=new MediaRecorder(stream)}activeRec={key,part,n,mr,stream,chunks,stopTimer:null};mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'});recordings[key]=blob;const audio=$('#audio_'+key);audio.src=URL.createObjectURL(blob);audio.classList.remove('hidden');$('#state_'+key).textContent='已錄音 '+Math.round(blob.size/1024)+' KB';btn.textContent='重新錄音';activeRec=null;stopRecognition();updateProgress()};mr.start(1000);btn.textContent='停止錄音';$('#state_'+key).textContent='錄音中…';startRecognition(part,n);activeRec.stopTimer=setTimeout(stopRecording,maxSec*1000)}catch(e){alert('無法取得麥克風權限。請確認網址為 https://www.bhcs.com.tw，並允許此網站使用麥克風。')}}
function stopRecording(){if(!activeRec)return;if(activeRec.stopTimer)clearTimeout(activeRec.stopTimer);if(activeRec.mr.state==='recording')activeRec.mr.stop()}
function startRecognition(part,n){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;try{recognition=new SR();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;let final='';recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t}setTranscript(part,n,(final+interim).trim())};recognition.onerror=()=>{};recognition.start()}catch(e){recognition=null}}
function stopRecognition(){if(recognition){try{recognition.stop()}catch(e){}recognition=null}}
function setTranscript(part,n,text){if(part==='repeat')transcripts.repeat[n-1]=text;else if(part==='qa')transcripts.qa[n-1]=text;else transcripts.reading=text;const el=$('#tr_'+part+'_'+n);if(el)el.textContent=text||'尚未辨識到文字'}
function updateProgress(){const count=Object.keys(recordings).length;const bar=$('#progressBar'),txt=$('#progressText');if(bar)bar.style.width=(count/13*100)+'%';if(txt)txt.textContent=count+' / 13 已錄音'}
function blobToB64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(blob)})}
async function recordingPayload(){const entries=Object.entries(recordings);const total=entries.reduce((a,[,b])=>a+b.size,0);if(total>18*1024*1024)throw new Error('本次錄音總容量過大，請重新錄較精簡的回答。');const out=[];for(const [key,b] of entries)out.push({label:key,mime:b.type||'audio/webm',data:await blobToB64(b)});return out}
function postSubmission(payload){return new Promise((resolve,reject)=>{const ch=channel('speaking-submit'),iframe=document.createElement('iframe'),form=document.createElement('form');iframe.name='submit_'+ch;iframe.style.display='none';$('#bridge').appendChild(iframe);const timer=setTimeout(()=>{pending.delete(ch);iframe.remove();reject(new Error('交卷逾時。錄音仍保留在此頁，請按「重新交卷」。'))},90000);pending.set(ch,{resolve:(m)=>resolve(m),reject,kind:'speaking-submit',iframe,timer});form.method='POST';form.action=apiUrl;form.target=iframe.name;form.style.display='none';[['api','submit-speaking'],['channel',ch],['payload',JSON.stringify(payload)]].forEach(([n,v])=>{const input=document.createElement('input');input.type='hidden';input.name=n;input.value=v;form.appendChild(input)});document.body.appendChild(form);form.submit();setTimeout(()=>form.remove(),500)})}
async function submitExam(){if(activeRec)return alert('請先停止目前的錄音，再交卷。');const count=Object.keys(recordings).length;if(count<13&&!confirm('目前只完成 '+count+' / 13 個錄音。仍要交卷嗎？'))return;if(!confirm('確定交卷並上傳本次錄音？'))return;const btn=$('#submitBtn');btn.disabled=true;btn.textContent='正在整理錄音…';try{const recs=await recordingPayload();btn.textContent='正在上傳…';const m=await postSubmission({studentName:student.name,className:student.className,setNo:setNo,transcripts:transcripts,recordings:recs});stopTimer();showResult(m.result)}catch(e){btn.disabled=false;btn.textContent='重新交卷';alert('交卷失敗：'+e.message+'\n\n錄音仍保留在此頁，可以直接再按一次「重新交卷」。')}}
function showResult(r){$('#app').innerHTML=`<section class="hero center"><span class="pill ok">已成功交卷</span><h2>${esc(r.title)}</h2>${r.autoScore!==''&&r.autoScore!=null?`<div class="big-score">${esc(r.autoScore)}</div><p>口說系統練習初評 / 100</p>`:'<h3>已送交老師評分</h3>'}<p class="muted">成功上傳 ${esc(r.audioUploaded)} 個錄音檔；老師可在原本後台聽取並覆核。</p>${validReturnUrl(returnUrl)?`<p><a class="btn primary" href="${esc(returnUrl)}">返回四科練習平台</a></p>`:''}</section>`}
setupReturnLink();
if(student.name&&validApiUrl(apiUrl))loadData();else entryScreen(!validApiUrl(apiUrl)?'請從四科練習平台進入口說練習。':'');
</script>
</body>
</html>
