<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>光學與透鏡成像（導引版原型）｜百宏文教</title>

<link rel="canonical" href="https://www.bhcs.com.tw/tools/science/optics-guided.html">
<link rel="icon" href="../../assets/favicon.png">
<link rel="stylesheet" href="../../assets/optics-guided/optics-guided.css">
<link rel="stylesheet" href="../../assets/optics-guided/input.css">
</head>
<body class="optics-guided" data-science-lab="optics-guided">
<a class="og-skip" href="#main">跳到主要內容</a>
<div class="og-wrap">
  <header class="og-header">
    <a class="og-brand" href="../../index.html"><img src="../../assets/logo.png" alt="" width="30" height="30"><span><small>百宏文教 BHCS · 小小研究員虛擬實驗室</small><h1 class="og-h1">光學與透鏡成像</h1></span></a>
  </header>
  <nav class="og-nav" aria-label="研究流程">
    <button type="button" data-step="mission"><span class="og-step" aria-hidden="true">01</span><span>接任務</span></button>
    <button type="button" data-step="bench" aria-current="step"><span class="og-step" aria-hidden="true">02</span><span>動手做</span></button>
    <button type="button" data-step="notebook"><span class="og-step" aria-hidden="true">03</span><span>研究手冊</span></button>
    <button type="button" data-step="challenge"><span class="og-step" aria-hidden="true">04</span><span>挑戰題</span></button>
  </nav>
  <main id="main" class="og-main" data-screen="welcome">
    <section class="og-card og-hero" id="og-welcome" aria-labelledby="og-welcome-title">
      <h2 id="og-welcome-title" tabindex="-1"></h2>
      <p>接下來你會親手移動蠟燭和屏幕，自己找出答案。</p>
    </section>
    <section class="og-coach" id="og-coach" aria-label="余老師提示"><img src="../mini-lab/img/doc-point.png" alt="" width="64" height="70"><div><strong>余老師</strong><div class="og-coach-text" id="og-coach-text" role="status" aria-live="polite"><p class="og-coach-main" id="og-coach-main"></p><p class="og-coach-sub" id="og-coach-sub"></p></div></div></section>
    <section class="og-bench-card" id="og-bench-card" aria-label="虛擬實驗桌"><div class="og-bench" id="og-bench" data-optics-bench></div></section>
    <section class="og-card og-compare" id="og-compare" aria-labelledby="og-compare-title">
      <h2 id="og-compare-title" tabindex="-1">兩次實驗的證據</h2>
      <div class="og-table-wrap"><table class="og-table"><caption class="og-sr">兩次實驗的條件與你找到的結果</caption><thead><tr><th scope="col"><span class="og-sr">項目</span></th><th scope="col">第一次</th><th scope="col">第二次</th></tr></thead><tbody id="og-compare-rows"></tbody></table></div>
      <p class="og-notice" id="og-compare-notice"></p>
      <div id="og-questions"></div>
    </section>
    <section class="og-card og-concept" id="og-concept" aria-labelledby="og-concept-title">
      <h2 id="og-concept-title" tabindex="-1">兩種像</h2>
      <div class="og-concept-cards" id="og-concept-cards"></div>
      <div class="og-formula" id="og-formula"></div>
    </section>
    <section class="og-card og-notebook" id="og-notebook" aria-labelledby="og-notebook-title">
      <h2 id="og-notebook-title" tabindex="-1">我的研究手冊</h2>
      <div class="og-table-wrap"><table class="og-table"><caption class="og-sr">你的兩次實驗證據</caption><thead><tr><th scope="col"><span class="og-sr">項目</span></th><th scope="col">第一次</th><th scope="col">第二次</th></tr></thead><tbody id="og-nb-rows"></tbody></table></div>
      <div id="og-nb-body"></div>
    </section>
    <section class="og-card og-challenge" id="og-challenge" aria-labelledby="og-challenge-title">
      <h2 id="og-challenge-title" tabindex="-1"></h2>
      <p class="og-scenario" id="og-ch-scenario"></p>
      <div id="og-ch-steps"></div>
      <div class="og-note" id="og-ch-note" hidden><label for="og-ch-note-input" id="og-ch-note-label"></label><textarea id="og-ch-note-input" rows="3" maxlength="1000"></textarea></div>
    </section>
    <section class="og-card og-complete" id="og-complete" aria-labelledby="og-complete-title">
      <h2 id="og-complete-title" tabindex="-1">這一站完成了</h2>
      <div id="og-complete-summary"></div>
      <p><a class="og-link-button" href="./optics.html">自由探索／精確數值</a></p>
    </section>
    <p class="og-status" id="og-status"><span class="og-status-icon" id="og-status-icon" aria-hidden="true"></span><span id="og-status-text"></span></p>
    <div class="og-actions"><button type="button" class="og-cta" id="og-cta" hidden></button></div>
    <section class="og-card og-data" aria-label="這次實驗條件">
      <h2>這次實驗條件</h2>
      <dl><dt>焦距</dt><dd id="og-f"></dd><dt>物距</dt><dd id="og-u"></dd></dl>
      <div id="og-records-wrap" hidden><h3 class="og-records-title">已記錄的實驗</h3><ul class="og-records" id="og-records"></ul></div>
      <p class="og-save-note" id="og-save-note"></p>
      <button type="button" class="og-link-action" id="og-restart" hidden>清除我的紀錄並重新開始</button>
      <details class="og-advanced"><summary>進階</summary><p><a href="./optics.html">自由探索／精確數值</a></p></details>
    </section>
  </main>
  <footer class="og-foot"><p>百宏文教｜免費使用・不需登入</p><p>操作紀錄只在本機儲存；匿名使用事件不含研究筆記、作答內容或學生姓名。</p></footer>
</div>
<script src="../../assets/science-events.js" defer></script>
<script type="module" src="../../assets/optics-guided/main.js"></script>
</body>
</html>
