name: Math fix regressions
on: [pull_request]
permissions:
  contents: read
jobs:
  full-p2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts --ignore-scripts
      - run: node scripts/test_math_drills.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-first-fixes-full-results
          path: math-validation-artifacts/
          retention-days: 14
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts --ignore-scripts
      - run: |
          for test in scripts/math-regressions/*.mjs; do
            [ "$(basename "$test")" = helper.mjs ] || node "$test" || exit 1
          done
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --prefix /tmp/math-fix-browser playwright@1.58.2
          /tmp/math-fix-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: node scripts/check_math_fixes_browser.cjs
        env:
          NODE_PATH: /tmp/math-fix-browser/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-fix-browser-review
          path: math-fix-artifacts/
          retention-days: 14
