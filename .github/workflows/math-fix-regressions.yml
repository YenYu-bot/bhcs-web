name: Math fix regressions
on: [pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts --ignore-scripts
      - run: |
          for test in scripts/math-regressions/*.mjs; do
            [ "$(basename "$test")" = helper.mjs ] || node "$test" || exit 1
          done
      - name: Enforce P3 diversity ratchet
        env:
          MATH_DIVERSITY_GATE: '1'
          MATH_DIVERSITY_REPORT: math-validation-artifacts/diversity-current.json
        run: node scripts/test_math_drills.mjs
