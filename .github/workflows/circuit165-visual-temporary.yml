name: Circuit #165 temporary visual review
on:
  pull_request:
    paths:
      - 'assets/circuit-guided/**'
      - 'scripts/check_circuit_guided_view_browser.cjs'
      - 'scripts/check_circuit_guided_flow_browser.cjs'
      - 'scripts/check_circuit_guided_input_browser.cjs'
      - 'scripts/check_circuit_guided_learner_browser.cjs'
      - 'scripts/circuit_guided_test_support.cjs'
      - '.github/workflows/circuit165-visual-temporary.yml'
  workflow_dispatch:
jobs:
  circuit-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts
      - run: |
          npm install --prefix /tmp/bhcs-composition playwright@1.58.2
          /tmp/bhcs-composition/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: Circuit view at mobile and desktop
        env:
          NODE_PATH: /tmp/bhcs-composition/node_modules
        run: node scripts/check_circuit_guided_view_browser.cjs
      - name: Circuit bench mouse keyboard and touch input
        env:
          NODE_PATH: /tmp/bhcs-composition/node_modules
        run: node scripts/check_circuit_guided_input_browser.cjs
      - name: First-time learner builds every stage with real mouse keyboard and touch
        env:
          NODE_PATH: /tmp/bhcs-composition/node_modules
        run: node scripts/check_circuit_guided_learner_browser.cjs
      - name: Full circuit guided learner journey
        env:
          NODE_PATH: /tmp/bhcs-composition/node_modules
        run: node scripts/check_circuit_guided_flow_browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit165-layout-review
          path: |
            circuit-view-artifacts/
            circuit-flow-artifacts/
            circuit-learner-artifacts/
          retention-days: 7
