name: Circuit B3 flow validation TEMP

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/circuit-guided/**'
      - 'tools/science/circuit-guided.html'
      - 'scripts/check_circuit_guided_flow_browser.cjs'
      - 'scripts/circuit_guided_test_support.cjs'
      - '.github/workflows/circuit-b3-flow-temp.yml'

permissions:
  contents: read

jobs:
  circuit-b3-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/bhcs-composition playwright@1.58.2
          /tmp/bhcs-composition/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: Check Circuit B3 full flow in Chromium
        env:
          NODE_PATH: /tmp/bhcs-composition/node_modules
        run: node scripts/check_circuit_guided_flow_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-b3-flow-review
          path: circuit-flow-artifacts/
          retention-days: 14
