name: Researcher lab batch check
on:
  push:
    branches: [codex/researcher-lab-redesign]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts
      - run: node scripts/build_microscope.mjs
      - run: node scripts/build_science.mjs
      - run: npm test --prefix scripts
      - run: node scripts/check_science_integration.cjs
      - run: node scripts/test_researcher_batch1.cjs
      - run: node scripts/test_researcher_batch2.cjs
      - name: Commit generated researcher pages
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/science/index.html tools/science/optics.html tools/science/wave-sound.html tools/science/energy.html tools/science/pressure-fluid.html tools/science/solubility.html
          if git diff --cached --quiet; then
            echo "Generated pages already up to date."
          else
            git commit -m "build: regenerate researcher batch two pages"
            git push
          fi
