name: Researcher lab batch check
on:
  push:
    branches: [main, codex/researcher-lab-redesign]
  pull_request:
    branches: [main, codex/researcher-composition-verified]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts
      - run: node scripts/build_microscope.mjs
      - run: node scripts/build_science.mjs
      - run: node scripts/build_site.mjs
      - run: git diff --exit-code
      - run: npm test --prefix scripts
      - run: node scripts/check_science_integration.cjs
      - run: node scripts/test_researcher_batch1.cjs
      - run: node scripts/test_researcher_batch2.cjs
      - run: node scripts/test_researcher_batch3.cjs
      - run: node scripts/test_researcher_batch4.cjs
      - run: node scripts/test_researcher_batch5.cjs
      - name: Install Chromium for composition review
        run: |
          npm install --prefix /tmp/bhcs-composition playwright@1.58.2
          /tmp/bhcs-composition/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: Check public site pages and contact flows
        env:
          NODE_PATH: /tmp/bhcs-composition/node_modules
        run: node scripts/check_site_browser.cjs
      - name: Check all welcome layouts and capture review images
        env:
          NODE_PATH: /tmp/bhcs-composition/node_modules
        run: node scripts/check_researcher_composition.cjs
      - name: Check real microscope pointer input and navigation
        env:
          NODE_PATH: /tmp/bhcs-composition/node_modules
        run: node scripts/check_researcher_browser.cjs
      - name: Check all station operations, records, and challenges
        env:
          NODE_PATH: /tmp/bhcs-composition/node_modules
        run: node scripts/check_researcher_operations.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: researcher-composition-review
          path: composition-artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: researcher-operation-review
          path: operation-artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-site-review
          path: site-artifacts/
          retention-days: 14
