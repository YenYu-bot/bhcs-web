name: Researcher lab batch check
on:
  push:
    branches: [codex/researcher-lab-redesign]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts
      - run: node scripts/build_microscope.mjs
      - run: node scripts/build_science.mjs
      - run: npm test --prefix scripts
      - run: node scripts/check_science_integration.cjs
      - run: node scripts/test_researcher_batch1.cjs
      - run: node scripts/test_researcher_batch2.cjs
      - run: node scripts/test_researcher_batch3.cjs
      - run: node scripts/test_researcher_batch4.cjs
      - run: node scripts/test_researcher_batch5.cjs
      - name: Upload researcher preview
        uses: actions/upload-artifact@v4
        with:
          name: researcher-preview
          path: |
            tools
            assets
          retention-days: 1
      - name: Commit generated researcher pages
        if: github.actor != 'github-actions[bot]'
        run: |
          REMOTE_SHA="$(git ls-remote origin refs/heads/codex/researcher-lab-redesign | cut -f1)"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "A newer source commit exists; skip generated-page push from this older run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/science/index.html tools/science/optics.html tools/science/wave-sound.html tools/science/energy.html tools/science/pressure-fluid.html tools/science/solubility.html tools/science/electromagnetism.html tools/science/moon-eclipse.html tools/science/seasons.html tools/science/plant-exchange.html tools/science/ecosystem.html tools/genetics-simulation-lab.html tools/force-motion-lab.html tools/circuit-lab.html tools/particle-reaction-lab.html tools/heat-phase-lab.html tools/plate-earthquake-lab.html tools/buoyancy-density-lab.html tools/acid-base-indicator-lab.html tools/photosynthesis-factor-lab.html
          if git diff --cached --quiet; then
            echo "Generated pages already up to date."
          else
            git commit -m "build: regenerate researcher pages"
            git push
          fi
