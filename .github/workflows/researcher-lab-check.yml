name: Researcher lab batch check
on:
  push:
    branches: [codex/researcher-lab-redesign]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix scripts
      - run: node scripts/build_microscope.mjs
      - run: npm test --prefix scripts
      - run: node scripts/check_science_integration.cjs
      - run: node scripts/test_researcher_batch1.cjs
